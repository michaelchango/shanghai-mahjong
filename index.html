}
function mlmStart(){
  MLM.tiles = mlmGen();
  MLM.slot = []; MLM.pending = []; MLM.picks = [];
  MLM.used = { out:false, undo:false, shuf:false };
  MLM.lock = false; MLM.over = false; MLM.justShuf = false;
  $('mlmMenu').classList.add('hide');
  $('mlmResult').classList.add('hide');
  mlmLayout(); mlmLayout();   // 量两次：第一次定 --su 后布局会变，第二次收敛，避免开局后尺寸漂移
  mlmRender();
}
/* 固定版式库（参考羊了个羊）：以 (cr,cc) 为中心、e 为半宽（1..4）生成格点，
   出界格裁掉。rect 矩形 / circle 椭圆 / diamond 菱形 / ring 回字环 /
   cross 十字 / corners 四角块 */
function mlmPatternCells(name, e, cr, cc){
  const cells = [];
  const push = (r, c) => { if (r >= 0 && r <= 8 && c >= 0 && c <= 8) cells.push([r, c]); };
  if (name === 'rect'){
    for (let dr = -e; dr <= e; dr++) for (let dc = -e; dc <= e; dc++) push(cr + dr, cc + dc);
  } else if (name === 'circle'){
    for (let dr = -e; dr <= e; dr++) for (let dc = -e; dc <= e; dc++)
      if (dr * dr + dc * dc * 0.72 <= (e + 0.4) * (e + 0.4)) push(cr + dr, cc + dc);
  } else if (name === 'diamond'){
    for (let dr = -e; dr <= e; dr++) for (let dc = -e; dc <= e; dc++)
      if (Math.abs(dr) + Math.abs(dc) <= e) push(cr + dr, cc + dc);
  } else if (name === 'ring'){
    for (let dr = -e; dr <= e; dr++) for (let dc = -e; dc <= e; dc++)
      if (Math.max(Math.abs(dr), Math.abs(dc)) === e) push(cr + dr, cc + dc);
  } else if (name === 'cross'){
    for (let dr = -e; dr <= e; dr++) for (let dc = -e; dc <= e; dc++)
      if ((Math.abs(dr) <= 1 && Math.abs(dc) <= e) ||
          (Math.abs(dc) <= 1 && Math.abs(dr) <= e)) push(cr + dr, cc + dc);
  } else if (name === 'corners'){
    const b = e >= 4 ? 3 : 2, m = 2 * e - b, hb = b >> 1;
    for (const rc of [[0, 0], [0, m], [m, 0], [m, m], [e - hb, e - hb]])
      for (let dr = 0; dr < b; dr++)
        for (let dc = 0; dc < b; dc++) push(cr - e + rc[0] + dr, cc - e + rc[1] + dc);
  }
  return cells;
}
/* 生成堆叠（参考羊了个羊真实结构「大平铺底座 + 多塔并行」）：
   ① 底座 4 层：全版式大铺 + 随机抽空——下层有露出来可直接点的牌，
      上下层可以穿插着消，不再是「上层把下层全密封」；
   ② 四角四塔并行堆叠：层间恒差半张（上层骑在下层 4 张交点上，错落叠放），
      配额不均 → 逐塔封顶，局面逐渐收窄到最后一塔，难度渐增；
   ③ ΔL≤2 禁完全重合（挖开一张原地又冒一张的观感根因），ΔL≥3 深堆允许；
      同层牌互不叠压。
   ④ 发面三元组交错：每层混多种面、同种三组分居相邻层带（见发面段注释）。
   牌型 27 种（万/筒/条）× 9 = 243 张。 */
function mlmGen(){
  const T = []; let id = 0, L = 0;
  /* 占位表：位置 → 该位置现有牌的层号。ΔL≤2 禁止完全重合——
     「挖开一张、原地又冒一张」的观感就来自隔层精确堆叠，一并禁掉；
     ΔL≥3 的深堆允许（挖到那时周边早清空，不会看成重叠） */
  const occ = new Map();
  const keyOf = (x, y) => Math.round(x * 2) + '_' + Math.round(y * 2);
  const overlap = (a, b) => Math.abs(a[0] - b[0]) < 1 && Math.abs(a[1] - b[1]) < 1;
  const layerPosAll = {};                      // 每层已放位置：同层互不叠压（含跨塔）
  /* 在以 (cr,cc) 为中心、半宽 e 的版式上放 want 张（off 为该层半张错位），
     clip 为可选象限裁剪（塔与塔互不越界、互不压牌），skipP 为随机抽空比例
     （版式留出空洞：下层有露出来可直接点的牌，牌面疏落有致），返回实放数 */
  const place = (cr, cc, e, name, want, off, lay, g, clip, skipP) => {
    let cells = mlmPatternCells(name, e, cr, cc).filter(rc =>
      !clip || (rc[0] >= clip[0] && rc[0] <= clip[1] && rc[1] >= clip[2] && rc[1] <= clip[3]));
    mlmShuffle(cells);
    if (skipP && cells.length > want + 6){
      const kept = cells.filter(() => Math.random() >= skipP);
      if (kept.length >= want) cells = kept;   // 有富余才抽空，保证放满 want
    }
    const lp = layerPosAll[lay] || (layerPosAll[lay] = []);
    let placed = 0;
    for (let i = 0; i < cells.length && placed < want; i++){
      const c0 = cells[i][1], r0 = cells[i][0];
      /* 优先原位；若与任何已放牌完全重合，试 ±半格微调（仍不出界、不与同层牌叠压） */
      const tries = [[0, 0], [0.5, 0], [-0.5, 0], [0, 0.5], [0, -0.5]];
      for (const d of tries){
        const c = c0 + d[0], r = r0 + d[1];
        if (c < -0.5 || c > 8.5 || r < -0.5 || r > 8.5) continue;   // 场地扩容 ±半张（缓解全局半格位容量）
        if (clip && (c < clip[2] || c > clip[3] || r < clip[0] || r > clip[1])) continue;
        const p = [c + off, r + off];
        const prevL = occ.get(keyOf(p[0], p[1]));
        if (prevL !== undefined && L - prevL <= 2) continue; // ΔL≤2 完全重合 → 换位
        let clash = false;
        for (const q of lp) if (overlap(p, q)){ clash = true; break; }
        if (clash) continue;                                 // 保持同层互不叠压
        occ.set(keyOf(p[0], p[1]), L);
        lp.push(p);
        T.push({ id: id++, L: lay, g: g, r: r, c: c, ox: off, oy: off, face: 0, removed: false, hide: false });
        placed++;
        break;
      }
    }
    return placed;
  };
  /* 阶段一：底座 4 层，全版式大铺（带随机抽空：上层抽得多，下层有露出可点的牌） */
  const BASE_PAT = ['rect', 'circle', 'diamond', 'corners', 'ring'];
  for (let b = 0; b < 4; b++, L++)
    place(4, 4, 4, BASE_PAT[mlmRi(BASE_PAT.length)], 27, (L % 2) * 0.5, L, 0, null, b < 2 ? 0.08 : 0.16);
  /* 阶段二：四角四塔并行，各自锁在 4×4 专属象限（中缝第 4/5 行列留空），
     塔间永不互压 → 每塔可独立挖穿；配额 36/36/36/27（每塔 3~4 种面），先后封顶、局面收窄 */
  const QUADS = [
    { cr: 2, cc: 2, clip: [0, 3, 0, 3] },
    { cr: 2, cc: 6, clip: [0, 3, 5, 8] },
    { cr: 6, cc: 2, clip: [5, 8, 0, 3] },
    { cr: 6, cc: 6, clip: [5, 8, 5, 8] }
  ];
  let remain = MLM_TOTAL - T.length;
  const quotas = mlmShuffle([36, 36, 36, 27]);
  quotas[0] += remain - quotas.reduce((a, b) => a + b, 0);
  const piles = mlmShuffle(QUADS.slice()).map((q, i) =>
    ({ cr: q.cr, cc: q.cc, left: quotas[i], half: 2, esc: 0, clip: q.clip }));
  const TOWER2 = ['rect', 'circle', 'diamond', 'ring', 'cross'];
  const TOWER1 = ['diamond', 'ring', 'cross', 'circle'];
  while (piles.some(p => p.left > 0) && L < 40){
    L++;
    const off = (L % 2) * 0.5;
    piles.forEach((p, i) => {
      if (p.left <= 0) return;
      if (p.left <= 10) p.half = 1;                         // 塔顶收窄成 3×3 小版式
      const eff = Math.max(p.half, p.esc);
      const k = Math.min(p.left, p.left > 30 ? 5 : p.left > 16 ? 4 : 3);
      const got = place(p.cr, p.cc, eff,
        eff >= 2 ? TOWER2[mlmRi(TOWER2.length)] : TOWER1[mlmRi(TOWER1.length)],
        k, off, L, 1 + i, p.clip, 0.10);
      if (got === 0) p.esc = Math.min(4, eff + 1);          // 卡死 → 扩版式兜底（仍在象限内），保证塔恰好收尾
      p.left -= got;
    });
  }
  /* 兜底：极小概率塔位耗尽导致缺张，用全版式把剩余张数补齐（保证恰好 243 张） */
  while (T.length < MLM_TOTAL && L < 60){
    L++;
    if (!place(4, 4, 4, 'rect', MLM_TOTAL - T.length, (L % 2) * 0.5, L, 0)) break;
  }
  /* 牌面分配 v2（三元组交错，破「整层铺同种」）：每种面 9 张切成 3 个三元组，
     仍整区发放（同种不跨区，保可解性），但区内三元组按「目标间隔」交错排布——
     底座同种相邻组隔 4 槽（跨 1~2 层）、塔内隔 2 槽：每一层都混 4~8 种面，
     看到一张同种，搭档常要跨层找，必须用牌槽垫牌，不能再整层连锁白捡。 */
  {
    const faces = mlmShuffle([...Array(27).keys()]);
    let fp = 0;
    for (let g = 0; g <= 4; g++){
      const arr = T.filter(t => t.g === g).sort((a, b) => a.L - b.L);
      if (arr.length % 9 !== 0){
        /* 兜底区（非 9 整除，罕见）：整块连发 */
        let left = arr.length;
        for (let t = 0; left > 0; t++){
          const f = faces[fp++], take = Math.min(9, left);
          for (let k = 0; k < take; k++) arr[arr.length - left + k].face = f;
          left -= take;
        }
        continue;
      }
      const n = arr.length / 9;                        // 本区面种数
      const S = g === 0 ? 5 : 2;                       // 同种面相邻三元组的目标间隔（槽数）；
                                                       // 底座 5 槽保证同种必跨层（层=9 槽）
      const rk = [];
      for (let i = 0; i < n; i++) rk.push(faces[fp++]);
      const lastAt = new Array(n).fill(-99);
      const leftK = new Array(n).fill(3);
      for (let t = 0; t < 3 * n; t++){
        let best = -1, bestScore = -1e9;
        for (let k = 0; k < n; k++){
          if (!leftK[k]) continue;
          if (3 * n - 1 - t < (leftK[k] - 1) * S) continue;   // 剩余槽位不够按间隔收尾 → 缓放
          const gap = t - lastAt[k];
          if (lastAt[k] >= 0 && gap < S) continue;            // 间隔未到
          const due = lastAt[k] < 0 ? 0 : gap - S;            // 越欠账越优先
          const score = -due + Math.random() * 0.5;           // 并列随机，避免呆板
          if (score > bestScore){ bestScore = score; best = k; }
        }
        if (best < 0)
          for (let k = 0; k < n; k++)
            if (leftK[k] && (best < 0 || leftK[k] > leftK[best])) best = k;
        const f = rk[best], b3 = t * 3;
        arr[b3].face = f; arr[b3 + 1].face = f; arr[b3 + 2].face = f;
        leftK[best]--; lastAt[best] = t;
      }
    }
  }
  /* 牌堆外接框中心（按整堆算一次、固定不变）：渲染时把整堆平移到面板正中，
     上下左右留白严格对称，不会沉底/顶格 */
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  for (const t of T){
    const x = t.c + t.ox, y = t.r + t.oy;
    minX = Math.min(minX, x); maxX = Math.max(maxX, x);
    minY = Math.min(minY, y); maxY = Math.max(maxY, y);
  }
  MLM.CX = (minX + maxX) / 2; MLM.CY = (minY + maxY) / 2;
  return T;
}
/* 牌渲染坐标：整堆按外接框中心（MLM.CX/CY，生成时算好）平移到面板正中，
   上下左右留白严格对称，不会沉底/顶格 */
function mlmXY(t, LU){
  return { x: (t.c + t.ox - MLM.CX) * LU.TW + LU.bw / 2 - LU.TW / 2,
    y: (t.r + t.oy - MLM.CY) * LU.TH + LU.bh / 2 - LU.TH / 2 };
}
/* 可点 = 没有任何更高层的牌与它有面积重叠（错位判据：两轴位移都 < 1 张） */
function mlmIsFree(t){
  for (const u of MLM.tiles){
    if (u === t || u.removed || u.L <= t.L) continue;
    if (Math.abs(t.c + t.ox - u.c - u.ox) < 1 && Math.abs(t.r + t.oy - u.r - u.oy) < 1) return false;
  }
  return true;
}
function mlmCountFace(f){ let n = 0; for (const e of MLM.slot) if (e.face === f) n++; return n; }
/* 牌槽插入：同牌自动靠拢（插到最右一个同牌右侧），返回插入下标 */
function mlmInsert(e){
  let at = -1;
  for (let i = MLM.slot.length - 1; i >= 0; i--){ if (MLM.slot[i].face === e.face){ at = i; break; } }
  e.pop = true;
  if (at >= 0) MLM.slot.splice(at + 1, 0, e); else MLM.slot.push(e);
  return at + 1;
}
/* ---------- 过渡动画：飞行牌克隆 ---------- */
function mlmZoom(){
  const z = parseFloat(getComputedStyle($('pcz')).zoom);
  return (z > 0 && !isNaN(z)) ? z : 1;    // 整页 zoom 缩放下，视觉坐标 ÷ zoom = 布局坐标
}
function mlmPosRel(el){                   // 元素相对 #mlm 的布局坐标
  const m = $('mlm').getBoundingClientRect(), r = el.getBoundingClientRect(), z = mlmZoom();
  return { x: (r.left - m.left) / z, y: (r.top - m.top) / z, w: r.width / z, h: r.height / z };
}
function mlmFly(from, to, face, ms, done){
  const c = document.createElement('div');
  c.className = 'tile mlmFlyT';
  c.style.cssText = 'left:' + from.x + 'px;top:' + from.y + 'px;width:' + from.w + 'px;height:' + from.h + 'px';
  c.innerHTML = faceSVG(face);
  $('mlm').appendChild(c);
  void c.offsetWidth;                     // 强制回流，保证过渡从起点出发
  c.style.transform = 'translate(' + (to.x - from.x) + 'px,' + (to.y - from.y) + 'px) scale(' + (to.w / from.w) + ')';
  setTimeout(() => { c.remove(); if (done) done(); }, (ms || 280) + 30);
}
function mlmPick(id){
  if (MLM.lock || MLM.over) return;
  const t = MLM.tiles[id];
  if (!t || t.removed || !mlmIsFree(t)) return;
  const fromEl = $('mlmBoard').querySelector('.mlmT[data-id="' + id + '"]');
  const fromRect = fromEl ? mlmPosRel(fromEl) : null;
  t.removed = true;
  MLM.picks.push(id);
  const entry = { id: id, face: t.face };
  const idx = mlmInsert(entry);
  const willClear = mlmCountFace(t.face) >= 3;
  if (!willClear && MLM.slot.length >= 8){ mlmRender(); mlmFail('牌槽已满（8 张），挑战失败'); return; }
  if (!willClear && fromRect){
    /* 未凑满 3：真牌先藏住，克隆牌飞进牌槽后落位（凑满 3 直接走消除动画） */
    entry.hide = true;
    mlmRender();
    const cell = $('mlmSlot').children[idx];
    if (cell) mlmFly(fromRect, mlmPosRel(cell), t.face, 280, () => { entry.hide = false; mlmRender(); });
    else entry.hide = false;
  } else {
    mlmRender();
    if (willClear) mlmEliminate(t.face);
  }
}
/* 同牌满 3 消除：三张错落上浮消散；「移出」暂存的牌不自动回槽，等玩家手动点击入槽 */
function mlmEliminate(face){
  MLM.lock = true;
  let n = 0;
  for (const e of MLM.slot){ if (e.face === face && n < 3){ e.gone = true; e.goneDelay = n * 80; n++; } }
  mlmRender();
  setTimeout(() => {
    let k = 0;
    MLM.slot = MLM.slot.filter(e => { if (e.face === face && k < 3){ k++; return false; } return true; });
    MLM.lock = false;
    mlmRender();
    mlmSettle();
  }, 520);
}
/* 暂存区（移出的牌）手动点击入槽：同样走飞行动画，凑满 3 照样消除；
   槽满时点入会直接判负（和点场上牌同一规则） */
function mlmPickPending(i){
  if (MLM.lock || MLM.over) return;
  const e = MLM.pending[i];
  if (!e) return;
  const fromEl = $('mlmPending').children[i];
  const fromRect = fromEl ? mlmPosRel(fromEl) : null;
  MLM.pending.splice(i, 1);
  const idx = mlmInsert(e);
  const willClear = mlmCountFace(e.face) >= 3;
  if (!willClear && MLM.slot.length >= 8){ mlmRender(); mlmFail('牌槽已满（8 张），挑战失败'); return; }
  if (!willClear && fromRect){
    e.hide = true;
    mlmRender();
    const cell = $('mlmSlot').children[idx];
    if (cell) mlmFly(fromRect, mlmPosRel(cell), e.face, 280, () => { e.hide = false; mlmRender(); });
    else { e.hide = false; mlmRender(); }
  } else {
    mlmRender();
    if (willClear) mlmEliminate(e.face);
  }
}
/* 每次状态变化后判定终局 */
function mlmSettle(){
  if (MLM.over) return;
  if (MLM.tiles.some(t => !t.removed)) return;
  if (!MLM.slot.length && !MLM.pending.length){
    MLM.over = true;
    mlmResult(true, '');
  } else {
    mlmFail('场上已无牌，牌槽剩 ' + (MLM.slot.length + MLM.pending.length) + ' 张无法消除');
  }
}
function mlmFail(msg){
  MLM.over = true;
  mlmRender();
  setTimeout(() => mlmResult(false, msg), 400);
}
function mlmResult(win, msg){
  const R = $('mlmResult');
  const left = MLM.tiles.filter(t => !t.removed).length +
               MLM.slot.length + MLM.pending.length;
  R.innerHTML = '<div class="mlmPanel">' +
    '<div class="mlmResT' + (win ? '' : ' lose') + '">' + (win ? '🎉 通关！' : '挑战失败') + '</div>' +
    '<div class="mlmResD">' + (win ? '场上 243 张牌全部消除，太强了！' : msg + ' · 还剩 ' + left + ' 张') + '</div>' +
    '<button class="hBtn pri" id="mlmAgain">重新开始</button>' +
    '<button class="hBtn" id="mlmBackHome">返回首页</button></div>';
  R.classList.remove('hide');
  $('mlmAgain').onclick = mlmStart;
  $('mlmBackHome').onclick = mlmExit;
}
/* ---------- 三个道具（每局各一次） ---------- */
function mlmUseOut(){
  if (MLM.lock || MLM.over || MLM.used.out) return;
  if (MLM.slot.length < 3){ toast('牌槽不足 3 张，不能移出', 'red'); return; }
  MLM.used.out = true;
  const fromRects = [];
  for (let i = 0; i < 3; i++){
    const cell = $('mlmSlot').children[i];
    fromRects.push(cell && cell.firstChild ? mlmPosRel(cell.firstChild) : null);
  }
  const three = MLM.slot.splice(0, 3);
  three.forEach(e => { e.hide = true; MLM.pending.push(e); });
  mlmRender();
  /* 起终点坐标全部先取好（数字），错落起飞；中途任何重渲染都不影响飞行落点 */
  const pendEls = Array.from($('mlmPending').children);
  const toRects = pendEls.map(el => mlmPosRel(el));
  let flying = 0;
  const landed = () => { if (--flying === 0) mlmRender(); };
  three.forEach((e, i) => {
    if (fromRects[i] && toRects[i]){
      flying++;
      setTimeout(() => mlmFly(fromRects[i], toRects[i], e.face, 280, () => {
        e.hide = false; landed();
      }), i * 90);
    }
  });
  if (!flying) mlmRender();
}
function mlmUseUndo(){
  if (MLM.lock || MLM.over || MLM.used.undo) return;
  let id = -1;
  while (MLM.picks.length){
    const x = MLM.picks.pop();
    if (MLM.slot.some(e => e.id === x)){ id = x; break; }
  }
  if (id < 0){ toast('没有可撤回的操作', 'red'); return; }
  MLM.used.undo = true;
  const i = MLM.slot.findIndex(e => e.id === id);
  const cellEl = $('mlmSlot').children[i];
  const fromRect = (cellEl && cellEl.firstChild) ? mlmPosRel(cellEl.firstChild) : null;
  MLM.slot.splice(i, 1);
  const t = MLM.tiles[id];
  t.removed = false;
  t.hide = true;
  mlmRender();
  if (fromRect){
    const LU = MLM.LU, bp = mlmPosRel($('mlmBoard'));
    const xy = mlmXY(t, LU);
    const toRect = { x: bp.x + xy.x, y: bp.y + xy.y, w: LU.TW, h: LU.TH };
    mlmFly(fromRect, toRect, t.face, 300, () => { t.hide = false; mlmRender(); });
  } else { t.hide = false; mlmRender(); }
}
function mlmUseShuf(){
  if (MLM.lock || MLM.over || MLM.used.shuf) return;
  const live = MLM.tiles.filter(t => !t.removed);
  const faces = mlmShuffle(live.map(t => t.face));
  live.forEach((t, i) => { t.face = faces[i]; t.shufDelay = (i % 34) * 16; });
  MLM.used.shuf = true;
  MLM.justShuf = true;
  MLM.lock = true;
  mlmRender();
  setTimeout(() => { MLM.justShuf = false; MLM.lock = false; mlmRender(); }, 750);
}
/* ---------- 布局（只在开局 / 窗口变化时计算并缓存；点击渲染一律复用，
   杜绝「边玩边重测容器 → 牌宽微调 → 容器高度又变」的反馈抖动） ---------- */
function mlmLayout(){
  const wrap = $('mlmBoardWrap');
  const W = wrap.clientWidth - 12, H = wrap.clientHeight - 12;   // 面板四周留白（含牌影余量）
  /* 牌堆实际占 9.5×9.5 张（9×9 网格 + 半张错位）；除数 9.9/13.0 比 9.5/12.54 大，
     多出的就是四周安全边——牌和 box-shadow 都不会贴到面板边被裁 */
  const U = Math.max(15, Math.min(W / 10.4, H / 13.6, 46));       // 牌宽 px（上限防大屏过大；场地扩到 ±半张后牌堆最宽 9.5 张）
  const TW = U, TH = U * 1.32, su = Math.round(U * 0.92);
  MLM.LU = { U: U, TW: TW, TH: TH, su: su, bw: Math.ceil(9.55 * TW), bh: Math.ceil(9.55 * TH) };
  $('mlm').style.setProperty('--su', su + 'px');
  const B = $('mlmBoard');
  B.style.width = MLM.LU.bw + 'px';
  B.style.height = MLM.LU.bh + 'px';
}
/* ---------- 渲染 ---------- */
function mlmRender(){
  if (!MLM.LU) mlmLayout();
  const LU = MLM.LU;
  const liveN = MLM.tiles.filter(t => !t.removed).length;
  $('mlmLeft').textContent = '剩余 ' + liveN + ' 张';
  let h = '';
  for (const t of MLM.tiles){
    if (t.removed) continue;
    const xy = mlmXY(t, LU);
    const cls = 'tile mlmT' + (mlmIsFree(t) ? '' : ' covered') + (MLM.justShuf ? ' mlmSh' : '');
    h += '<div class="' + cls + '" data-id="' + t.id +
      '" style="--tw:' + LU.TW.toFixed(1) + 'px;--th:' + LU.TH.toFixed(1) + 'px;left:' + xy.x.toFixed(1) +
      'px;top:' + xy.y.toFixed(1) + 'px;z-index:' + (t.L * 10) +
      (t.hide ? ';visibility:hidden' : '') +
      (MLM.justShuf ? ';animation-delay:' + (t.shufDelay || 0) + 'ms' : '') +
      '">' + faceSVG(t.face) + '</div>';
  }
  $('mlmBoard').innerHTML = h;
  let sh = '';
  for (let i = 0; i < 8; i++){
    const e = MLM.slot[i];
    sh += '<div class="mlmSlotCell">' + (e ?
      '<div class="tile' + (e.gone ? ' gone' : e.pop && !e.hide ? ' pop' : '') +
      '" style="--tw:100%;--th:100%' +
      (e.hide ? ';visibility:hidden' : '') +
      (e.goneDelay ? ';animation-delay:' + e.goneDelay + 'ms' : '') +
      '">' + faceSVG(e.face) + '</div>' : '') + '</div>';
  }
  $('mlmSlot').innerHTML = sh;
  let ph = '';
  for (const e of MLM.pending){
    ph += '<div class="tile" style="--tw:calc(var(--su,26px)*0.66);--th:calc(var(--su,26px)*0.87)' +
      (e.hide ? ';visibility:hidden' : '') + '">' + faceSVG(e.face) + '</div>';
  }
  $('mlmPending').innerHTML = ph;
  for (const e of MLM.slot){ e.pop = false; e.gone = false; e.goneDelay = 0; }
  $('mlmOut').classList.toggle('off', MLM.used.out);
  $('mlmUndo').classList.toggle('off', MLM.used.undo);
  $('mlmShuf').classList.toggle('off', MLM.used.shuf);
}
/* ---------- 绑定（脚本在 body 末尾，DOM 已就绪） ---------- */
$('hBtnMlm').onclick = mlmOpen;
$('mlmGear').onclick = () => $('mlmMenu').classList.toggle('hide');
$('mlmResume').onclick = () => $('mlmMenu').classList.add('hide');
$('mlmRestart').onclick = mlmStart;
$('mlmHome').onclick = mlmExit;
$('mlmOut').onclick = mlmUseOut;
$('mlmUndo').onclick = mlmUseUndo;
$('mlmShuf').onclick = mlmUseShuf;
$('mlmBoard').addEventListener('click', e => {
  const el = e.target.closest('.mlmT');
  if (el) mlmPick(+el.dataset.id);
});
/* 暂存区（移出的牌）点击入槽 */
$('mlmPending').addEventListener('click', e => {
  const el = e.target.closest('.tile');
  if (!el) return;
  const kids = Array.from($('mlmPending').children);
  mlmPickPending(kids.indexOf(el));
});
window.addEventListener('resize', () => {
  if (!$('mlm').classList.contains('hide')){ mlmLayout(); mlmRender(); }
});
</script>
</body>
