/* ---------------- 台面主题：尽早应用（v1.2.48） ----------------
   脚本位于 body 之后，DOM 到这里已解析好；越早把 data-felt 写上去，
   配合 CSS 的「未应用前不绘制内容」，首屏就不会先闪一下默认绿色。
   数据源仍是下面的 FELT / applyFelt，这里只是把时机提前。 */
const FELT_BG = { green:'#072a1f', blue:'#072437', red:'#320c11', brown:'#2a1d11' };  // 与 :root --felt4 对应（theme-color 同步）
(function feltEarly(){
  try{
    if (typeof document === 'undefined') return;      // 服务端引擎 / 单测 eval 下跳过
    const r = document.documentElement;
    let saved = {};                                    // 读不到（隐私模式/受限环境）就用默认绿
    try{ saved = JSON.parse(localStorage.getItem('sjm_felt') || '{}') || {}; }catch(e){}
    const color = FELT_BG[saved.color] ? saved.color : 'green';
    r.dataset.felt = color;
    r.dataset.print = saved.print || 'none';           // 无论如何都写，保证 CSS 守卫一定解除（不会白屏）
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.content = FELT_BG[color];
  }catch(e){}
})();

/* ---------------- 基础工具 ---------------- */
const RANK_CH = ['一','二','三','四','五','六','七','八','九'];
const SUIT_CH = ['萬','筒','條'];
const WIND_CH = ['東','南','西','北'];
const HONOR_CH = ['東','南','西','北','中','發','白'];
const SEASON  = ['春','夏','秋','冬','梅','蘭','竹','菊'];
const TILECNT = 34;      // counts 数组长度
const PLAYCNT = 34;      // 参与组牌的牌种数（0..33；敲麻下 31-33 不上墙，循环空转无影响）

const isFlower = t => t >= 100;
const isSeason = t => t >= 100 && t <= 107;
const isWind   = t => t >= 27 && t <= 30;
const isHonor  = t => t >= 27;
const suitOf   = t => t < 9 ? 0 : t < 18 ? 1 : t < 27 ? 2 : 3;
const rankOf   = t => t < 27 ? (t % 9) + 1 : t - 26;

function flowerChar(t){
  if (t <= 107) return SEASON[t - 100];
  if (t <= 111) return '中';
  if (t <= 115) return '發';
  return '白';
}
function tileName(t){
  if (isFlower(t)) return flowerChar(t);
  if (isHonor(t)) return HONOR_CH[t - 27];
  return RANK_CH[t % 9] + SUIT_CH[suitOf(t)];
}
function toCounts(tiles){
  const c = new Array(TILECNT).fill(0);
  for (const t of tiles) c[t]++;
  return c;
}
function countsToTiles(c){
  const a = [];
  for (let i = 0; i < TILECNT; i++) for (let k = 0; k < c[i]; k++) a.push(i);
  return a;
}
const sortTiles = a => a.slice().sort((x, y) => x - y);
function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = (Math.random() * (i + 1)) | 0;
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------------- 胡牌判定 ---------------- */
// 判断 counts（手牌，不含副露）能否组成 need 个面子 + 1 个将
function isWinShape(counts, need){
  for (let p = 0; p < PLAYCNT; p++){
    if (counts[p] >= 2){
      counts[p] -= 2;
      const ok = formSets(counts, need);
      counts[p] += 2;
      if (ok) return true;
    }
  }
  return false;
}
function formSets(counts, n){
  if (n === 0){
    for (let i = 0; i < TILECNT; i++) if (counts[i]) return false;
    return true;
  }
  let i = 0;
  while (i < TILECNT && counts[i] === 0) i++;
  if (i === TILECNT) return false;
  if (counts[i] >= 3){
    counts[i] -= 3;
    const ok = formSets(counts, n - 1);
    counts[i] += 3;
    if (ok) return true;
  }
  if (i < 27 && (i % 9) <= 6 && counts[i + 1] > 0 && counts[i + 2] > 0){
    counts[i]--; counts[i + 1]--; counts[i + 2]--;
    const ok = formSets(counts, n - 1);
    counts[i]++; counts[i + 1]++; counts[i + 2]++;
    if (ok) return true;
  }
  return false;
}
// 全刻子（碰碰胡）形态
function isPungShape(counts, need){
  for (let p = 0; p < PLAYCNT; p++){
    if (counts[p] >= 2){
      counts[p] -= 2;
      const ok = formPungs(counts, need);
      counts[p] += 2;
      if (ok) return true;
    }
  }
  return false;
}
function formPungs(counts, n){
  if (n === 0){
    for (let i = 0; i < TILECNT; i++) if (counts[i]) return false;
    return true;
  }
  let i = 0;
  while (i < TILECNT && counts[i] === 0) i++;
  if (i === TILECNT) return false;
  if (counts[i] >= 3){
    counts[i] -= 3;
    const ok = formPungs(counts, n - 1);
    counts[i] += 3;
    if (ok) return true;
  }
  return false;
}
function isSevenPairs(counts){
  // 允许 4 张相同算两个对子（风一色「乱风向」依赖此规则：東東東東 南南南南 西西西西 北北）
  let pairs = 0, tot = 0;
  for (let i = 0; i < TILECNT; i++){
    tot += counts[i];
    if (counts[i] === 0) continue;
    if (counts[i] !== 2 && counts[i] !== 4) return false;
    pairs += counts[i] >> 1;
  }
  return tot === 14 && pairs === 7;
}

/* ---------------- 番型评估 ----------------
   返回 null 表示"不满足胡牌牌型（不能胡）"
   handCounts: 含胡张的手牌 counts（14 张等价）
   melds: 副露数组
-------------------------------------------*/
/* v1.2.36：牌型算分口径
   - 普通牌型（兜底档）：底 = 底设置 + 花数；番 = 兜底番（仅敲麻）+ 牌型番 + 附加番
     · 敲麻：垃圾胡 0 / 碰碰胡 1 / 混一色 1 / 混碰 1 / 七小对 1，另有 1 番兜底
     · 清混碰：无兜底，碰碰胡 / 混一色 / 混碰 / 七小对 各 1 番
   - 勒子牌型：底固定 10 花（勒子自带，不再叠底设置与花牌）；番 = 勒子数 + 附加番
     · 1 勒子 = 10 花 × 1 番，所以 N 勒子 = 10 花 × N 番 */
const LEZI_DI = 10;        // 1 勒子 = 10 花
const DUI_FAN = 1;         // 敲麻兜底番
const LEZI_TBL = { '清一色': 2, '清碰': 4, '风一色': 4, '风碰': 8 };      // 敲麻：勒子数
const LEZI_TBL_QHP = { '清一色': 1, '清碰': 2, '风一色': 2, '风碰': 4 };  // 清混碰：勒子数
// v1.2.37：无花果 / 大吊车 也改成勒子牌型——敲麻 2 勒子、清混碰 1 勒子。
// 它们与上面的「色牌型」互不取代，勒子数**相加**（例：敲麻 清一色 + 无花果 = 2 + 2 = 4 勒子）。
// 注意：无花果 / 大吊车 对任何手牌都可能成立，所以不再进 LEZI_TBL 查表，而是单独算。
function leziOf(type){
  if (!type) return 0;
  return (CFG.lajiHu ? LEZI_TBL : LEZI_TBL_QHP)[type] || 0;
}
// 无花果 / 大吊车 的勒子数（按玩法：敲麻 2 / 清混碰 1）
function specialLezi(){
  return CFG.lajiHu ? 2 : 1;
}
// 无花果：花数为 0（花牌、字牌明碰/暗刻、明杠/暗杠都算花）——v1.2.12 起杠算花
// v1.2.52：判定带最终手牌——手牌里的风/字暗刻也破无花果（与点炮判定 wuGuoHuaAt 同口径，
//   修复「有风刻/字刻点炮可胡、自摸却被记无花果勒子」的自相矛盾）
function isWuGuoHua(p){ return calcFlowers(p, toCounts(p.hand || [])) === 0; }
// 大吊车：四副露全在手外（单钓将）
function isDaDiaoChe(p){ return (p.melds || []).length === 4; }
// v1.2.40：吃 / 碰 进的是哪张，本次出牌就不能立刻打出同一张（两种玩法通用）。
//   必须等到下次出手（过一圈，或再吃/碰别人重新拿到出牌权）。
// v1.2.48：禁打范围 —— 以「吃进的那张牌 X」为锚，**只有连成 4 张连片时**，同花色中与它相隔 3 张的牌
//   （X-3 / X+3）也不能立刻打出。
//   例：吃进 6 条 → 手里的 3 条、9 条本次都不能打；与 6 相邻的 5 条 / 7 条不受限。
//   由来：吃 X 时 X 可能与你手里的两张连成 X-2..X 或 X..X+2 的一整片，这片的最外端是
//   X-2 或 X+2，再往外一张就是 X-3 / X+3；紧接着打这条线的边张，等于把连片牌喂给下家。
// v1.2.47g：「吃管吃、碰管碰」——**碰**是刻子、不成连片，只禁刚碰进的那一张（v1.2.40 行为）。
//   牵连仅对「吃」生效，两者互不串。
//   唯一例外：吃/碰 之后已经形成「大吊车」（4 副露单钓），以上限制全部解除。
//   p.noDiscard 记刚吃/碰进的那张（出牌后清空），p.noDiscardKind 记「吃」/「碰」用于提示。
//   禁打集合每次由「那张牌 + 它所在副露的两端 ±1」现算，不额外存状态。
function banTilesOf(p){
  const t = (p && p.noDiscard != null) ? p.noDiscard : null;
  if (t == null || t < 0) return [];
  if (isDaDiaoChe(p)) return [];                         // 大吊车例外
  const hand = p.hand || [];
  const ban = [];
  const push = (x) => { if (ban.indexOf(x) < 0) ban.push(x); };
  push(t);                                               // 原规则：同一张
  // v1.2.48：只有「吃」才牵连；且**必须真的连成 4 张连片**才禁 X±3。
  //   前提 = 中间那两张（X+1/X+2 或 X-2/X-1）在你手上或这副顺子里。
  //   例：吃 4 万 + 手里 5、6（+这副顺子）= 4-5-6 成片 → 7 万禁打；
  //       吃 4 万 + 手里只有 3、5（顺子 3-4-5，够不到 7）→ 7 万照常可打。
  //   不跨花色；字牌（27-33）无此概念。
  if (p.noDiscardKind === 'chow' && t < 27){
    const suit = Math.floor(t / 9);
    const own = hand.slice();
    const cm = (p.melds || []).find ? (p.melds || []).find(m => m.type === 'chow' && m.tile === t) : null;
    if (cm) for (const x of (cm.tiles || [])) own.push(x);
    const held = (x) => own.indexOf(x) >= 0;
    for (const d of [-3, 3]){
      const n = t + d;
      if (n < 0 || n >= 27 || Math.floor(n / 9) !== suit) continue;
      const mid1 = t + (d > 0 ? 1 : -2), mid2 = t + (d > 0 ? 2 : -1);
      if (held(mid1) && held(mid2)) push(n);          // 连片成立才牵连
    }
  }
  const real = ban.filter(x => hand.indexOf(x) >= 0);    // 只保留手里真有的
  if (!real.length) return [];
  if (real.length >= hand.length) return [];             // 会把手牌全禁 → 放开，避免无牌可打
  return real;
}
function banKindName(p){ return (p && p.noDiscardKind === 'pung') ? '碰' : '吃'; }
function evaluateShape(handCounts, melds, opts){
  const need = 4 - melds.length;
  const stdWin = isWinShape(handCounts, need);
  const seven  = melds.length === 0 && isSevenPairs(handCounts);
  if (!stdWin && !seven) return null;

  const all = countsToTiles(handCounts);
  for (const m of melds) for (const t of m.tiles) all.push(t);

  let numSuits = new Set(), hasWind = false, hasNum = false;
  for (const t of all){
    if (t >= 27 && t < 34) hasWind = true;   // v1.2.17：27-30 风牌 + 31-33 中发白都算字牌
    else if (t < 27){ hasNum = true; numSuits.add(suitOf(t)); }
  }
  // 碰碰胡：无吃牌 + 手牌可全刻子分解（七对子不算碰碰胡）
  const noChow = melds.every(m => m.type !== 'chow');
  const pungWin = !seven && noChow && isPungShape(handCounts, need);

  let type = null, base = 0;
  // v1.2.36：番表改为「兜底档 + 勒子档」——
  //   兜底档牌型只记牌型番（敲麻另加 1 番兜底，清混碰不加）；
  //   清一色/清碰/风一色/风碰 改为勒子牌型（base 记 0，勒子数由 leziOf 按玩法取）。
  // v1.2.35：七对形态与标准形分开判——只能靠七对成胡的牌（stdWin=false）不再落到
  //   「清一色/混一色」分支（那些分支是标准形的分类），关掉「七小对算胡牌」后这类牌直接不能胡；
  //   全字牌的乱风向（风一色）是传统敲麻牌型，不受该设置影响。
  if (!stdWin){
    if (!hasNum && hasWind){
      type = '风一色';                 // 乱风向（七对子形态）
    } else if (CFG.sevenPairs){
      type = '七小对'; base = 1;       // 非传统敲麻牌型，默认关闭，可在设置里开启
    } else {
      return null;                     // 关了七小对 → 该形态不能胡
    }
  } else if (!hasNum && hasWind){
    // 全字牌的标准形必然全是刻子 → 风碰
    type = '风碰';
  } else if (numSuits.size === 1 && !hasWind){
    type = pungWin ? '清碰' : '清一色';
  } else if (numSuits.size === 1 && hasWind){
    type = pungWin ? '混碰' : '混一色';
    base = 1;                          // 混一色 / 混碰 均为 1 番
  } else if (pungWin){
    type = '碰碰胡'; base = 1;
  } else if (CFG.lajiHu){
    type = '垃圾胡'; base = 0;      // 垃圾胡（推倒胡/平胡）：0 番，靠兜底 1 番起步
  } else {
    return null;   // 不允许的牌型
  }
  const lezi = leziOf(type);
  if (lezi) base = 0;                 // 勒子牌型不计牌型番（番由勒子数决定）

  // 花数
  const f = opts.flowerCount || 0;
  return { type, base, lezi: lezi, total: base, flowers: f };
}

/* 花数计算（底花） */
function calcFlowers(p, handCounts){
  let f = (p.flowers || []).length;         // 每张花牌 1 花
  for (const m of (p.melds || [])){
    if (m.type === 'kong'){
      f += isWind(m.tile) ? (m.concealed ? 3 : 2) : (m.concealed ? 2 : 1);
    } else if (m.type === 'pung' && isHonor(m.tile)){
      // v1.2.52：字牌明碰算花——风牌本就算；清混碰下中发白刻子也算（破无花果）。
      // 敲麻里中发白是花牌上墙（不会成碰/刻），此分支天然只对清混碰生效。
      f += 1;
    }
  }
  // 手牌中的字牌暗刻：风牌各组 1 花；清混碰下中发白暗刻同样算花（v1.2.52）
  //（敲麻中发白上墙为花牌，手牌不会出现 31-33，循环多算两位无副作用）
  if (handCounts){
    for (let t = 27; t <= 33; t++) if (handCounts[t] >= 3) f += 1;
  }
  return f;
}

/* 附加番 */
// v1.2.36：无花果判定——把 tile 纳入手牌后仍然一张花都没有（花牌、字牌明碰/暗刻、明杠/暗杠都算花；
//           v1.2.52 起清混碰下中发白刻子同样算花）。无花果的牌只能自摸：不能点炮胡、不能抢杠胡。
function wuGuoHuaAt(p, tile){
  const c = toCounts(p.hand || []);
  if (tile !== undefined && tile !== null) c[tile]++;
  return calcFlowers(p, c) === 0;
}
function extraFan(p, ctx){
  const add = [];
  // v1.2.37：无花果 / 大吊车 已改为「勒子牌型」（敲麻 2 勒 / 清混碰 1 勒），
  //   不再作为 +1 附加番出现在这里——见 specialLezi() / leziTotal()。
  if (p.menqing) add.push(['门清', 1]);
  if (ctx.kongDraw) add.push(['杠上开花', 1]);
  if (ctx.haidi) add.push(['海底捞月', 1]);
  if (ctx.robKong) add.push(['抢杠', 1]);
  if (ctx.tianhu) add.push(['天胡', 8]);
  if (ctx.dihu) add.push(['地胡', 8]);
  return add;
}
// v1.2.37：本手牌的全部勒子数 = 色牌型勒子（清一色/清碰/风一色/风碰）+ 无花果勒子 + 大吊车勒子。
// 三者可同时成立且**相加**（用户确认：勒子数相加）。返回 { total, parts } 便于结算面板展示明细。
function leziTotal(p, ev){
  const parts = [];
  const t = leziOf(ev && ev.type);
  if (t) parts.push([(ev && ev.type) || '色牌型', t]);
  if (p && isWuGuoHua(p)) parts.push(['无花果', specialLezi()]);
  if (p && isDaDiaoChe(p)) parts.push(['大吊车', specialLezi()]);
  const total = parts.reduce((s, x) => s + x[1], 0);
  return { total, parts };
}

/* ---------------- 向听数 ---------------- */
// 标准型向听（含副露）
function shantenStd(counts, fixedMelds){
  let best = 8 - 2 * fixedMelds;
  const cc = counts.slice();
  const dfs = (idx, melds, partials, pair) => {
    if (idx >= TILECNT){
      const m = melds + fixedMelds;
      let p = partials;
      const blocks = m + p + (pair ? 1 : 0);
      if (blocks > 5) p = Math.max(0, 5 - m - (pair ? 1 : 0));
      let s = 8 - 2 * m - p - (pair ? 1 : 0);
      if (blocks === 5 && !pair && m < 4) s += 1;   // 满块无将修正
      if (s < best) best = s;
      return;
    }
    if (cc[idx] === 0){ dfs(idx + 1, melds, partials, pair); return; }
    // 刻子
    if (cc[idx] >= 3){ cc[idx] -= 3; dfs(idx, melds + 1, partials, pair); cc[idx] += 3; }
    // 顺子
    if (idx < 27 && (idx % 9) <= 6 && cc[idx + 1] > 0 && cc[idx + 2] > 0){
      cc[idx]--; cc[idx + 1]--; cc[idx + 2]--;
      dfs(idx, melds + 1, partials, pair);
      cc[idx]++; cc[idx + 1]++; cc[idx + 2]++;
    }
    // 对子（作将 或 作搭子）
    if (cc[idx] >= 2){
      cc[idx] -= 2;
      if (!pair) dfs(idx, melds, partials, true);
      dfs(idx, melds, partials + 1, pair);
      cc[idx] += 2;
    }
    // 两面 / 嵌张
    if (idx < 27 && (idx % 9) <= 7 && cc[idx + 1] > 0){
      cc[idx]--; cc[idx + 1]--; dfs(idx, melds, partials + 1, pair); cc[idx]++; cc[idx + 1]++;
    }
    if (idx < 27 && (idx % 9) <= 6 && cc[idx + 2] > 0){
      cc[idx]--; cc[idx + 2]--; dfs(idx, melds, partials + 1, pair); cc[idx]++; cc[idx + 2]++;
    }
    // 孤张丢弃
    cc[idx]--; dfs(idx, melds, partials, pair); cc[idx]++;
  };
  dfs(0, 0, 0, false);
  return best;
}
// 碰碰胡向听
function shantenPung(counts, fixedMelds){
  let t = fixedMelds, p = 0;
  for (let i = 0; i < PLAYCNT; i++){
    if (counts[i] >= 3) t++;
    else if (counts[i] === 2) p++;
  }
  let s = 8 - 2 * t - Math.min(p, Math.max(0, 5 - t));
  if (t >= 4 && p === 0) s = 0;      // 大吊车单钓
  return Math.max(-1, s);
}
// 混一色 / 清一色 向听：目标花色 suit（0-2），allowWind 是否允许风牌
function shantenColor(counts, fixedMelds, suit, allowWind){
  const sub = new Array(TILECNT).fill(0);
  let out = 0;
  for (let i = 0; i < PLAYCNT; i++){
    if (!counts[i]) continue;
    const s = suitOf(i);
    if (s === suit) sub[i] += counts[i];
    else if (allowWind && i >= 27 && i < 34) sub[i] += counts[i];
    else out += counts[i];
  }
  // v1.2.16：废牌不再「每张 1 向听」全额累加。
  // 打掉一张废牌、摸进一张有效牌，这两件事在同一次进张里同时发生——
  // 换牌本身也在推进搭子，旧算法把 out 全额相加属于重复计数，
  // 混一色能算出 10~14，远超向听理论上限 8（4 面子 + 1 将）。
  // 结果它与「完全不计废牌」的碰碰胡向听不同量纲，AI 跨类型比较时永远选碰碰胡，
  // 清混碰玩法实际退化成只剩碰碰胡，谁也做不出混一色/清一色。
  // v1.2.18：废牌权重半价再降到 1/3——出掉 3 张废牌约只需 1 张「纯损失」（其余
  // 两张换回的牌同时就在推进搭子）。v1.2.16 的半价把散牌混一色仍算到封顶 8，
  // 与碰碰胡 6~7 相比毫无竞争力，机器人依然「无脑碰碰胡」；
  // 降到 1/3 后「一门已 7~9 张」的牌型才真正流向混一色/清一色。并封顶到理论上限 8。
  return Math.min(8, shantenStd(sub, fixedMelds) + Math.ceil(out / 3));
}
// 风一色向听（全风牌）
function shantenWindOnly(counts, fixedMelds){
  const sub = new Array(TILECNT).fill(0);
  let out = 0;
  for (let i = 0; i < PLAYCNT; i++){
    if (!counts[i]) continue;
    if (i >= 27 && i < 34) sub[i] += counts[i];   // 全字牌（风+中发白）
    else out += counts[i];
  }
  const std = shantenStd(sub, fixedMelds);
  // 七对子路线：k 种字牌成对的进度（27-30 风牌 + 31-33 中发白，共 7 种——全字七对刚好凑齐）
  let pairs = 0, kinds = 0;
  for (let i = 27; i <= 33; i++){ if (sub[i] >= 2) pairs++; if (sub[i] > 0) kinds++; }
  const seven = 6 - pairs - Math.max(0, Math.min(4, kinds) - pairs);
  // v1.2.16：与 shantenColor 同一套废牌折算（半价 + 封顶 8），保证各牌型向听同量纲
  return Math.min(8, Math.min(std, seven) + Math.ceil(out / 3));
}

const TYPES = ['pung', 'mix0', 'mix1', 'mix2', 'pure0', 'pure1', 'pure2', 'wind', 'std'];
function evalAll(counts, fixedMelds){
  const r = {
    pung:  shantenPung(counts, fixedMelds),
    mix0:  shantenColor(counts, fixedMelds, 0, true),
    mix1:  shantenColor(counts, fixedMelds, 1, true),
    mix2:  shantenColor(counts, fixedMelds, 2, true),
    pure0: shantenColor(counts, fixedMelds, 0, false),
    pure1: shantenColor(counts, fixedMelds, 1, false),
    pure2: shantenColor(counts, fixedMelds, 2, false),
    wind:  shantenWindOnly(counts, fixedMelds),
    std:   shantenStd(counts, fixedMelds)   // 垃圾胡（平胡）向听：普通顺子型
  };
  let best = Infinity, bt = 'pung';
  for (const k of TYPES){
    if (k === 'std' && !CFG.lajiHu) continue;   // 关掉垃圾胡就不往平胡方向算
    const v = r[k] + (k === 'pung' ? 0.2 : 0);   // 同分时略偏好碰碰胡以外（更容易达成）
    if (v < best){ best = v; bt = k; }
  }
  r.best = r[bt]; r.bestType = bt;
  return r;
}

/* v1.3.8：清混碰锁门感知的向听评估——吃过某门后即锁死该花色，
   但引擎的 evalAll 仍无差别对所有花色算向听，于是「留其他花色凑别的混/清一色」
   会被当成好牌（正是 AI 打条留筒的根因）。这里只保留与本门兼容的牌型：
   本门混一色 / 本门清一色 / 风一色（字牌做将或刻）；其余花色一律视为死牌。
   返回与 evalAll 同形状的对象，仅把 best / bestType 收敛到锁内最优，
   其余字段保留，方便 aiChooseDiscard 的 target 偏置逻辑照常工作。 */
function evalAllLocked(counts, fixedMelds, ls){
  const e = evalAll(counts, fixedMelds);
  let best = Infinity, bt = 'mix' + ls;
  for (const k of ['mix' + ls, 'pure' + ls, 'wind']){
    if (e[k] < best){ best = e[k]; bt = k; }
  }
  e.best = best; e.bestType = bt;
  return e;
}
function typeLabel(t){
  return { pung:'碰碰胡', mix0:'混一色(萬)', mix1:'混一色(筒)', mix2:'混一色(條)',
           pure0:'清一色(萬)', pure1:'清一色(筒)', pure2:'清一色(條)', wind:'风一色',
           std:'垃圾胡(平胡)' }[t] || t;
}
function typeBaseFan(t){
  // v1.2.36：只记「兜底档」牌型番（敲麻另加 1 番兜底）；清一色/风一色已改勒子牌型（由 leziOf 处理）
  return { pung: 1, mix0: 1, mix1: 1, mix2: 1, pure0: 0, pure1: 0, pure2: 0, wind: 0, std: 0 }[t] || 0;
}
// v1.2.36：牌型强弱（排序/比较用）——勒子牌型按勒子数，普通牌型按牌型番
function shapeValue(ev){ return (ev && (ev.lezi || ev.base)) || 0; }
// v1.2.37：预览口径——已知胡牌评估 ev 时返回 {di, fan}。
// 口径必须与结算 scoreOf() 完全一致（番 = 兜底 + 勒子数/牌型番 + 附加番），否则顶部「番/得分」与
// 结算面板对不上。附加番由 extraFan() 统一算，勒子总数走 leziTotal()（含无花果 / 大吊车）。
function diFanOf(ev, flowers, addFan, p){
  const lezi = p ? leziTotal(p, ev).total : (ev.lezi || 0);
  if (lezi) return { di: LEZI_DI, fan: lezi + addFan };                 // 勒子牌型：底 10 花
  return { di: CFG.base + (flowers || 0), fan: (CFG.lajiHu ? DUI_FAN : 0) + (ev.base || 0) + addFan };
}
// v1.2.37：只看得到「牌型名」（没有完整 ev）时的粗估。勒子数同样含无花果 / 大吊车。
function typeDiFan(t, flowers, addFan, p){
  const name = typeLabel(t).replace(/\(.*\)$/, '');
  let lz = leziOf(name);
  if (p){
    if (isWuGuoHua(p)) lz += specialLezi();
    if (isDaDiaoChe(p)) lz += specialLezi();
  }
  if (lz) return { di: LEZI_DI, fan: lz + addFan };
  return { di: CFG.base + (flowers || 0), fan: (CFG.lajiHu ? DUI_FAN : 0) + typeBaseFan(t) + addFan };
}
// v1.2.37 顶部 HUD 口径修正（与结算 scoreOf 同源）——
//   1) 原来「番」显示的是「底 × 番」的乘积（听口比较值被直接当成番存回去），故对不上；
//   2) 无花果判定用 calcFlowers(p, hc)（含手牌风刻）而结算用 calcFlowers(p, null)，差 1 番；
//   3) 未听牌时用 bestType 粗估，清一色会被估成别的档。
// 现在统一：花数一律 calcFlowers(p, null)、附加番一律 extraFan()、牌型番取真实 ev。

/* ========================================================================
   游戏状态
   ======================================================================== */
const SEAT_WIND = ['東','南','西','北'];
const HUANG_FAN_MAX = 3;     // 荒番最多累积 3 级（×8），避免连荒时分数指数爆炸
const BOT_NAMES = ['阿芳','阿明','阿强'];       // seat1(下家) seat2(对家) seat3(上家)

const CFG = {
  base: 2,        // 底（花）
  unit: 1,        // 每花分值
  lezi: 8,        // 封顶勒子数（1 勒 = 10 花）
  allowChow: true,
  sevenPairs: false,   // 七小对算胡牌牌型（非传统敲麻，可选）
  lajiHu: true,        // 垃圾胡（推倒胡/平胡）：非传统敲麻，开着才认普通顺子牌型
  autoKnock: false,
  autoHu: false,       // v1.2.15 自动胡牌：开=能胡就自动胡（含敲定后点炮「有和必和」）；关=自摸/点炮都出「胡/过」按钮自己决定
  cd: 0,               // v1.2.27 出牌倒计时（秒）：15/30，0=无（v1.2.41 起默认「无」）；联机房规则（房主设定），且开局时真人 ≥2 才生效；1 真人对机器人不限时
  speed: 1.8,     // 机器人出牌节奏（1.8 = 快）。v1.3.2 起不再让玩家选，本地机器人统一走快
  // v1.3.1：机器人按座位分别设置 —— 下标 = 座位号（单机里 1/2/3 = 下家/对家/上家）
  aiSeats: [true, true, true, true],   // 这个座位要不要交给大模型决策（false = 该座位走本地逻辑）
  spd: [1.8, 1.8, 1.8, 1.8]            // v1.3.2：不用大模型的座位一律「快」（由 spdOf(p) 读；真人座位无意义）
};
let SETDRAFT = null;   // 等待页房主编辑规则时的暂存草稿；null 表示未在草稿态
function loadCfg(){
  try{ const s = JSON.parse(localStorage.getItem('sjm_cfg') || '{}'); Object.assign(CFG, s); }catch(e){}
}
function saveCfg(){ try{ localStorage.setItem('sjm_cfg', JSON.stringify(CFG)); }catch(e){} }

const G = {
  players: [], wall: [], wpos: 0, wtail: 145,
  dealer: 0, turn: 0, handNo: 1, roundNo: 1,
  huangfan: 0, kaibao: false,
  lastDiscard: null, lastFrom: -1, lastDiscardEl: null,
  running: false, logs: [], totalHands: 16,
  finished: false,        // 本局已结算、等待「下一局」
  reveal: false,          // v1.2.48：有人胡牌 → 亮出四家手牌（流局不亮）
  result: null,           // 本局结算面板 { html, dealer }
  history: []             // 历史牌局结算记录（新一轮才清空）
};

function mkPlayer(idx, name, isBot){
  return {
    idx, name, isBot,
    hand: [], flowers: [], melds: [], discards: [], pendingFlowers: [],
    knocked: false, knockWaits: [], menqing: true,
    drawn: null, target: null, missHu: new Set(),
    score: 0, drawnCount: 0, noPromptSig: '', tianDi: false,
    settleFan: null, settleDi: null
  };
}
function initGame(){
  G.players = [mkPlayer(0, '你', false), mkPlayer(1, BOT_NAMES[0], true),
               mkPlayer(2, BOT_NAMES[1], true), mkPlayer(3, BOT_NAMES[2], true)];
  G.handNo = 1; G.roundNo = 1; G.dealer = 0; G.huangfan = 0;
  G.history = []; G.finished = false; G.reveal = false; G.result = null;
}

/* ---------------- 牌墙 ---------------- */
function buildWall(){
  const w = [];
  for (let t = 0; t <= 30; t++) for (let k = 0; k < 4; k++) w.push(t);
  for (let f = 100; f <= 107; f++) w.push(f);
  // v1.2.17：中发白按玩法决定上墙形态——
  //  敲麻（lajiHu 开）：108-119，算花，起手/摸到即补走；
  //  清混碰（lajiHu 关）：31-33，算牌不算花，可碰、可成刻/将，风一色「全字」含它。
  //  两种玩法墙都是 144 张，总数不变。
  if (CFG.lajiHu){
    for (let k = 0; k < 4; k++){ w.push(108 + k); w.push(112 + k); w.push(116 + k); }
  } else {
    for (let k = 0; k < 4; k++){ w.push(31); w.push(32); w.push(33); }
  }
  return shuffle(w);
}
function drawFront(){
  if (G.wpos > G.wtail) return null;
  return G.wall[G.wpos++];
}
function drawTail(){
  if (G.wtail < G.wpos) return null;
  return G.wall[G.wtail--];
}
function wallLeft(){ return Math.max(0, G.wtail - G.wpos + 1); }
function seenCount(t){
  let n = 0;
  for (const p of G.players){
    for (const d of p.discards) if (d === t) n++;
    for (const m of p.melds) for (const x of m.tiles) if (x === t) n++;
  }
  return n;
}

/* ========================================================================
   动作判定
   ======================================================================== */
// 手牌（counts）加上 tile 后能否成胡牌型，返回评估结果
function tryWin(counts, p){
  const need = 4 - p.melds.length;
  const seven = p.melds.length === 0 && isSevenPairs(counts);
  if (!isWinShape(counts, need) && !seven) return null;
  // v1.3.8：清混碰锁门（吃过某门数牌）后，本局只能以该门+字牌（混/清一色）或全字牌（风一色）胡；
  // 手牌里含其他花色数牌即非法。此前 tryWin 不拦这条，理论上锁门玩家能「跨门胡」，与锁门语义自相矛盾。
  if (!CFG.lajiHu){
    const ls = (typeof lockedSuitOf === 'function') ? lockedSuitOf(p) : null;
    if (ls !== null && ls >= 0){
      for (let t = 0; t < 27; t++){
        if (counts[t] > 0 && suitOf(t) !== ls) return null;
      }
    }
  }
  const hc2 = counts.slice();
  const flowers = calcFlowers(p, hc2);
  return evaluateShape(hc2, p.melds, { flowerCount: flowers });
}
// 当前手牌是否已听牌（返回听牌列表）
function getWaits(p){ return getWaitsHand(p.hand, p.melds); }
function canKnock(p){
  if (p.knocked) return false;
  if (p.hand.length % 3 !== 1) return false;
  return aliveWaits(getWaits(p), p).length > 0;   // v1.3.4：听的牌全现完（剩 0 张）不算可敲
}

// 对打出的牌可以做什么
function claimOptions(p, tile, from, isNext){
  const opts = [];
  const hc = toCounts(p.hand);
  if (hc[tile] < 4){
    hc[tile]++;
    const ev = tryWin(hc, p);
    hc[tile]--;
    const blocked = p.missHu.has(tile);
    // v1.2.36：无花果（含胡张后仍一张花都没有）只能自摸——不能胡别人的牌（点炮/抢杠都不是它的和法）
    const wuGuoHua = wuGuoHuaAt(p, tile);
    // v1.2.20：清混碰免敲——不需要敲定，能胡就有胡资格（敲麻仍要求已敲/天胡）
    if (ev && !wuGuoHua && (p.knocked || p.tianDi || !CFG.lajiHu) && !blocked){
      opts.push({ k: 'hu', tile, ev });
    }
  }
  if (!p.knocked){
    if (hc[tile] >= 3) opts.push({ k: 'kong', tile });
    if (hc[tile] >= 2) opts.push({ k: 'pung', tile });
    if (isNext && CFG.allowChow && tile < 27){
      const r = tile % 9;
      const combos = [];
      if (r >= 2 && hc[tile - 2] && hc[tile - 1]) combos.push([tile - 2, tile - 1]);
      if (r >= 1 && r <= 7 && hc[tile - 1] && hc[tile + 1]) combos.push([tile - 1, tile + 1]);
      if (r <= 6 && hc[tile + 1] && hc[tile + 2]) combos.push([tile + 1, tile + 2]);
      for (const c of combos) opts.push({ k: 'chow', tile, combo: c });
    }
  }
  // v1.2.19+21：清混碰按「副露方向约束」过滤吃/碰/杠选项——胡(hu)不受影响
  // （牌型合法与否由 tryWin 判）。敲麻玩法有平胡兜底，不锁门。
  //  吃过 → 只本门+字；碰/杠过数牌（一门或多门）→ 彻底不再吃（v1.2.22：碰过就无吃按钮）
  if (!CFG.lajiHu && !p.knocked){
    const d = directionOf(p);
    if (!d.free){
      const kept = [];
      const ts = suitOf(tile);
      for (const o of opts){
        if (o.k === 'hu'){ kept.push(o); continue; }
        // v1.2.22：只要碰/杠过数牌（single 或 pung），吃选项一律不给；
        // 碰/杠照常（清混碰是靠碰做一色/碰碰胡的玩法）
        if (d.pung || d.single !== undefined){ if (o.k !== 'chow') kept.push(o); continue; }
        if (d.lock !== undefined){ if (ts === d.lock || ts === 3) kept.push(o); continue; }
      }
      return kept;
    }
  }
  return opts;
}
// 摸到牌后可暗杠 / 加杠
// v1.2.12：扫描整副手牌的可杠组合（暗杠 4 张 / 加杠 已碰+手里第 4 张），
// 不依赖「刚摸的牌」——手牌里早已攒齐第 4 张、轮到出牌时同样要问
function selfKongOptions(p){
  const out = [];
  const hc = toCounts(p.hand);
  const done = new Set();
  for (const t of p.hand){
    if (done.has(t)) continue;
    done.add(t);
    if (hc[t] === 4) out.push({ k: 'ankan', tile: t });
    for (const m of p.melds){
      if (m.type === 'pung' && m.tile === t){ out.push({ k: 'chakan', tile: t, meld: m }); break; }
    }
  }
  // v1.2.19：清混碰下「吃过即锁门」——已有吃牌(chow)副露时本局方向锁死为该花色，
  // 其他花色的暗杠/加杠都不能再做（会锁死牌型），只留本门与字牌（风/中发白）的杠
  if (!CFG.lajiHu){
    const ls = lockedSuitOf(p);
    if (ls !== null && ls >= 0) return out.filter(o => {
      const s = suitOf(o.tile);
      return s === ls || s === 3;
    });
  }
  return out;
}
// v1.2.19：清混碰「吃过即锁门」判定——玩家副露里有吃牌(chow)就返回它锁定的花色。
//  0/1/2 = 锁本门（只能再收本门 + 字牌，做本门混/清一色）；
//  -1 = 副露里出现两种花色的吃牌（防御：正常流程已被 claimOptions 拦住）；
//  null = 没吃过（碰碰胡 / 未定方向仍开放）。敲麻玩法有平胡兜底，不锁门。
function lockedSuitOf(p){
  if (CFG.lajiHu) return null;
  let ls = null;
  for (const m of p.melds){
    if (m.type !== 'chow') continue;
    const s = suitOf(m.tile);
    if (ls === null) ls = s;
    else if (ls !== s) ls = -1;
  }
  return ls;
}
// v1.2.21：副露方向约束（吃/碰/杠与做牌目标都必须与之相容）。
//  敲麻（lajiHu 开）有平胡兜底 → 恒自由。
//  { lock: 0/1/2 }  副露里有吃牌(chow) → 本局锁死该花色（只能本门+字，v1.2.19 语义）
//  { pung: true }   碰/杠出两门以上数牌刻 → 只能碰/杠（吃任何顺子都会死牌）
//  { single: 0/1/2 } 只碰/杠过一门数牌刻（可有字刻）→ v1.2.22：同样彻底不再吃；
//                    碰/杠照常开放（憋本门碰一色 / 跨门继续碰成碰碰胡都行）
//  { free: true }   没副露或只有字刻 → 方向未定，吃任意门都行（吃后转 lock）
function directionOf(p){
  if (CFG.lajiHu) return { free: true };
  let chowS = null;
  const numSuits = new Set();
  for (const m of p.melds){
    const t = m.tile;
    if (m.type === 'chow'){
      const s = suitOf(t);
      if (chowS === null) chowS = s; else if (chowS !== s) chowS = -1;
      continue;
    }
    if (t < 27) numSuits.add(suitOf(t));     // 数牌刻/杠
  }
  if (chowS !== null) return chowS >= 0 ? { lock: chowS } : { pung: true };
  if (numSuits.size >= 2) return { pung: true };
  if (numSuits.size === 1) return { single: [...numSuits][0] };
  return { free: true };
}
function removeTiles(arr, tiles){
  for (const t of tiles){
    const i = arr.indexOf(t);
    if (i >= 0) arr.splice(i, 1);
  }
}

/* ========================================================================
   AI
   ======================================================================== */
function aiTargetOf(p){
  const e = evalAll(toCounts(p.hand), p.melds.length);
  // v1.2.21：清混碰下做牌目标必须与已有副露相容——已经碰了萬刻就不能把方向换成
  // 筒混一色（先碰九萬再吃筒顺的死牌就是这么来的）。directionOf 给出约束后，
  // 冲突的 mix/pure/wind 门直接跳过，pung 只在没吃过顺子时才允许。
  const dir = CFG.lajiHu ? null : directionOf(p);
  const suitOK = s => !dir || dir.free || dir.single === s ||
    (dir.lock !== undefined && s === dir.lock);
  // 开着垃圾胡时，如果普通顺子型明显更近，就往平胡方向打
  if (CFG.lajiHu && e.std <= e.pung &&
      e.std <= Math.min(e.mix0, e.mix1, e.mix2)) return 'std';
  // v1.2.18：碰碰胡不再 +0.2 站台——两个牌型向听咬得越紧，越该让「成型更容易」的
  // 混/清一色（能吃顺子）上场，否则散牌起手机器人永远无脑做碰碰胡
  // v1.2.21：已吃过顺子(chow)时碰碰胡已不可能，pung 出局，只走本门一色路线
  let best = 'pung', bv = e.pung + 0.1;
  if (dir && dir.lock !== undefined) bv = 99;
  // v1.2.16：清混碰玩法下把「清一色 / 风一色」也纳入主攻方向——
  // 旧版只在「碰碰胡 + 混一色」里选，机器人永远做不出清一色，只会乱吃
  if (!CFG.lajiHu){
    for (let s = 0; s < 3; s++){
      if (!suitOK(s)) continue;   // v1.2.21：方向约束外的门不参与竞争
      // v1.2.18：本门不足 2 张就不参与混/清一色竞争——向听公式允许风牌混入，
      // 全风手牌对任意「混一色(本门)」也算出低向听（其实没有本门数牌可做），
      // 不设门槛的话风牌多时 mix* 会错误地抢走风一色/碰碰胡的目标
      let suitN = 0;
      for (const t of p.hand) if (t < 27 && suitOf(t) === s) suitN++;
      if (suitN < 2) continue;
      const mix = e['mix' + s], pure = e['pure' + s];
      // 清一色只在「与混一同向听」时押（3 番 > 1 番）；纯差 1 步时仍走混一色——
      // 旧版 pure-mix<=1 就押清一色太贪，混一色出线机会被挤掉
      const takePure = (pure <= mix);
      const v = takePure ? pure : mix;
      // v1.2.16：向听封顶 8 表示「这个牌型基本没戏」，此时别去抢碰碰胡——
      // 否则起手一门不占优时也会硬押混/清一色，花色锁一开就白白错过碰牌机会
      // v1.2.18：v<=bv（平手倾斜混/清一色）——两者同向听时混一色能吃顺子更容易成，
      // 不该让碰碰胡默认赢走平手
      if (v < 8 && v <= bv){ bv = v; best = (takePure ? 'pure' : 'mix') + s; }
    }
    // 风一色与混/清一色同向听时押风一色（4 番 > 1 番）。
    // v1.2.18：向听公式对字牌偏乐观（字种少、台面竞争激烈），加「字牌 ≥6」现实门槛——
    // 手上没几张字也押风一色会把整局打废；够 6 张字时（已有刻/对基础）同向听押 4 番值得
    // v1.2.21：已有数牌副露的方向不做风一色（方向已定/字不够）——只有自由方向且字够多才押
    let windN = 0;
    for (const t of p.hand) if (t >= 27) windN++;
    if ((!dir || dir.free) && windN >= 6 && e.wind < 8 && e.wind <= bv){ bv = e.wind; best = 'wind'; }
    return best;
  }
  for (const k of ['mix0', 'mix1', 'mix2']){
    const s = +k.slice(3);
    let suitN = 0;
    for (const t of p.hand) if (t < 27 && suitOf(t) === s) suitN++;
    if (suitN < 2) continue;
    if (e[k] < bv){ bv = e[k]; best = k; }
  }
  return best;
}
/* v1.2.16：把 AI 的目标翻译成「只吃/碰哪些牌」的花色约束。
   旧版只有 target 以 mix 开头才约束花色，target 是碰碰胡时什么花色都吃，
   结果就是「明明打着清混碰，机器人还在吃另外两门」。 */
function aiPlan(p){
  const t = p.target || 'pung';
  if (t === 'wind')        return { suit: 3, allowWind: true,  pung: false };   // 风一色：只留风牌
  if (t.startsWith('mix')) return { suit: +t.slice(3), allowWind: true,  pung: false };  // 混一色：本门 + 风
  if (t.startsWith('pure'))return { suit: +t.slice(4), allowWind: false, pung: false };  // 清一色：只本门
  return { suit: null, allowWind: true, pung: true };                          // 碰碰胡：不限花色，但不吃顺子
}
function tileFitsPlan(t, plan){
  if (plan.pung) return true;                 // 碰碰胡：任意牌都能碰/杠
  const s = suitOf(t);
  if (plan.suit === 3) return s === 3;        // 风一色：只要风牌
  return s === plan.suit || (plan.allowWind && s === 3);
}
function dangerScore(t, p){
  let seen = 0;
  for (const q of G.players) if (q !== p) for (const d of q.discards) if (d === t) seen++;
  let d = Math.max(0, 2 - seen);
  const threat = G.players.some(q => q !== p && (q.knocked || q.melds.length >= 2));
  if (threat) d *= 2;
  if (t >= 27) d = Math.max(0, d - 1);
  return d;
}
// v1.2.40：ban = 本次出牌不能打的牌（刚吃/碰进的那张；大吊车时为空）
// v1.2.47f：改为数组 —— 除同一张外，还含与那副露相连的牌（也兼容传单值）
function aiChooseDiscard(p, ban){
  const hc = toCounts(p.hand);
  const bans = (ban == null) ? [] : (Array.isArray(ban) ? ban : [ban]);
  const uniq = [...new Set(p.hand)].filter(t => bans.indexOf(t) < 0);
  if (!uniq.length) return p.hand[p.hand.length - 1];
  // v1.3.8：清混碰锁门时刷新做牌目标，确保 target 落在锁内牌型，偏置才生效；
  // 同时算出锁门花色 ls，向听评估改用 evalAllLocked（只认本门+字），
  // 否则「留其他花色凑别的混/清一色」会被当成好牌 → 打条留筒。
  if (!CFG.lajiHu && !p.knocked) p.target = aiTargetOf(p);
  const ls = (!CFG.lajiHu && typeof lockedSuitOf === 'function') ? lockedSuitOf(p) : null;
  let best = null;
  const t0 = Date.now();
  for (const t of uniq){
    hc[t]--;
    const ev = (ls !== null && ls >= 0) ? evalAllLocked(hc, p.melds.length, ls) : evalAll(hc, p.melds.length);
    let sc = ev.best;
    if (p.target && ev[p.target] !== undefined && ev[p.target] <= ev.best + 1) sc = Math.min(sc, ev[p.target] - 0.35);
    let uke = 0;
    if (ev.best <= 2 && Date.now() - t0 < 900){
      for (let a = 0; a < PLAYCNT; a++){
        if (hc[a] >= 4) continue;
        hc[a]++;
        const e2 = evalAll(hc, p.melds.length);
        hc[a]--;
        if (e2.best < ev.best) uke += Math.max(0, 4 - seenCount(a));
      }
    }
    // v1.3.4：打出去就听牌的话，看听口在台面上还剩几张（听死牌 = 剩 0 张 = 胡不了）。
    //   听死时把向听退回 1，等同「没听」，让别的打法（能听且听口有货）胜出 —— 即「剩 0 张不听，继续组牌」。
    //   ⚠️ 只有「形状上算得出听口、但听口全被现完」才是听死；算不出听口（张数不合法等）= 另一回事，不改判。
    let wl = 0;
    if (sc === 0){
      const w0 = getWaitsHand(countsToTiles(hc), p.melds);
      wl = aliveLeft(aliveWaits(w0, p), p);
      if (w0.length && wl <= 0) sc = 1;
    }
    hc[t]++;
    // 中张价值（保留 3-7 更容易成型）
    const r = t < 27 ? (t % 9) + 1 : 5;
    const center = t < 27 ? (4 - Math.abs(r - 5)) * 0.6 : 0;
    let val = -sc * 1000 + wl * 42 + uke * 14 - dangerScore(t, p) * 9 + center;
    // v1.3.8：清混碰锁门时，同等向听下优先打掉非锁定花色数牌、留住锁定花色+字牌，
    // 否则「打条留筒」式平手错排仍会出现（首候选可能落在锁定花色上，模型随之打条）。
    if (ls !== null && ls >= 0){
      const su = suitOf(t);
      if (su === ls || su === 3) val -= 8;   // 锁定花色 / 字牌：尽量留，别打
      else val += 8;                          // 其他数牌：尽快打掉
    }
    if (!best || val > best.val) best = { t, val, sh: sc };
  }
  return best ? best.t : p.hand[p.hand.length - 1];
}
function aiClaim(p, tile, from, opts, isNext){
  const hu = opts.find(o => o.k === 'hu');
  if (hu) return hu;                                   // 敲麻：有和必和
  if (p.knocked) return null;
  // v1.2.18：每张牌打过来都重估一次做牌方向——开局只定一次 target 的老逻辑，
  // 会让机器人「边打边判断」失灵：碰出本门副露后明明混一色更近也不切换，或
  // 目标碰碰胡就整局无脑碰任何花色。实时刷新后花色锁、碰牌收益都跟最新局势走。
  p.target = aiTargetOf(p);
  // 清混碰：按做牌目标锁花色（敲麻有平胡兜底，吃碰自由度更高，沿用旧逻辑）
  const plan = CFG.lajiHu ? null : aiPlan(p);
  const hc = toCounts(p.hand);
  // v1.2.16：清混碰按「目标牌型」的向听算收益——旧版拿全类型最佳向听说事，
  // 结果明明在往混一色做，碰本门牌却因为「对最佳向听无改善」而一律不动
  const keyOf = e => (plan && p.target && e[p.target] !== undefined) ? e[p.target] : e.best;
  const cur = keyOf(evalAll(hc, p.melds.length));
  let bestPick = null, bestGain = 0.35;                // 需要明显收益才动牌
  for (const o of opts){
    if (plan){
      if (o.k === 'chow' && plan.pung) continue;       // 碰碰胡不吃顺子（顺子无益还占副露位）
      if (!tileFitsPlan(tile, plan)) continue;         // 花色不符：不碰/不吃/不杠
    }
    let gain = 0;
    if (o.k === 'pung'){
      removeTiles(p.hand, [tile, tile]);
      // v1.2.18：碰后必须弃一张——模拟「碰 + 最优弃牌」后的真实向听。
      // 旧版只算碰完两张的向听，孤对一碰向听-2 看着大赚；但若碰完被迫拆好搭子
      // 才是真亏，这正是「无脑碰」的来源。弃牌模拟让收益回归真实。
      let bk = 99;
      const uq = [...new Set(p.hand)];
      const t0 = Date.now();
      for (const dt of uq){
        p.hand.splice(p.hand.indexOf(dt), 1);
        const e = evalAll(toCounts(p.hand), p.melds.length + 1);
        p.hand.push(dt);
        if (e[bestT(p, e, plan)] < bk) bk = e[bestT(p, e, plan)];
        if (Date.now() - t0 > 200) break;              // 限时：极端手牌降级为「碰完不算弃牌」
      }
      if (bk === 99) bk = keyOf(evalAll(toCounts(p.hand), p.melds.length + 1));
      gain = cur - bk;
      if (p.target === 'pung') gain += 0.3;            // v1.2.18：0.6→0.3，明显改善才碰
      p.hand.push(tile, tile);
    } else if (o.k === 'kong'){
      removeTiles(p.hand, [tile, tile, tile]);
      const e = evalAll(toCounts(p.hand), p.melds.length + 1);
      gain = cur - keyOf(e) + 0.3;
      p.hand.push(tile, tile, tile);
    } else if (o.k === 'chow'){
      if (p.target && p.target.startsWith('mix') && suitOf(tile) !== +p.target.slice(3)) continue;
      removeTiles(p.hand, o.combo);
      const e = evalAll(toCounts(p.hand), p.melds.length + 1);
      gain = cur - keyOf(e) - 0.4;                     // 吃牌略保守（破门清）
      p.hand.push(...o.combo);
    }
    if (gain > bestGain){ bestGain = gain; bestPick = o; }
  }
  return bestPick;
}
// v1.2.18：pung 弃牌模拟里用的「该走哪个牌型」——取当前目标；目标缺失时退到最佳向听
function bestT(p, e, plan){
  if (plan && p.target && e[p.target] !== undefined) return p.target;
  return 'best';
}

/* ========================================================================
   玩家交互（Promise 化）
   ======================================================================== */
let PEND = null;
function ask(kind, payload){
  return new Promise(res => { PEND = { kind, payload, res }; render(); });
}
function resolvePend(v){
  if (!PEND) return;
  const r = PEND.res, kind = PEND.kind; PEND = null;
  renderActs();
  // 联机：动作上报给服务端（它才是裁判）；单机：本地解开 Promise 继续主循环
  if (NET.active){
    stopCd();
    NET.pend = null;
    netSend({ t:'act', kind, value: netSanitize(kind, v) });
    return;
  }
  r(v);
}
/* ========================================================================
   AI 大脑注入点（v1.3.0）：机器人决策可交给「宿主注入的大模型」
   ------------------------------------------------------------------------
   设计要点（为什么长这样）：
   1. 本地启发式 aiChooseDiscard / aiClaim 一个字不改，继续当「本地大脑」。
      它们同时是仿真（simulate.js）与单测的确定性基准，绝不能改成 async。
   2. 这里新增的 decideDiscard / decideClaim 是 async 包装：
        先同步算出本地答案（0ms 就有了）→ 并发去问大模型 →
        预算内拿到「合法」答案就用模型的，否则用本地答案。
      于是：模型超时 / 报错 / 答非法 / 未配置 → 一律退回本地，玩家零感知。
   3. 合法性由**这里**兜底（白名单二次校验），大模型永远无法破坏规则：
        · 出牌必须在手牌里、且不在本回合禁打(bans)里；
        · 碰/吃/杠必须在 opts 里真实存在；
        · 胡、敲定后的摸打属于规则硬约束，根本不问模型。
   4. 视野纪律：aiView 只输出「这个机器人自己看得见的信息」，
      绝不包含他人手牌与牌墙顺序 —— 否则 AI 就是作弊。
   ======================================================================== */
let AI_BRAIN = null;          // 宿主注入：{ ask(payload) -> Promise<{discard|action, reason}> }
let AI_TIER = 'local';        // 'local' | 'fast' | 'strong'
let AI_BRAIN_ERR = '';        // 最近一次失败原因（设置面板显示「已降级」用）
let AI_HITS = 0, AI_MISS = 0; // 命中 / 回退计数（诊断用）

function setAiBrain(brain, tier){
  AI_BRAIN = (brain && typeof brain.ask === 'function') ? brain : null;
  AI_TIER = (tier === 'fast' || tier === 'strong') ? tier : (AI_BRAIN ? 'fast' : 'local');
  AI_BRAIN_ERR = ''; AI_HITS = 0; AI_MISS = 0;
}
function aiBrainOn(){ return !!(AI_BRAIN && AI_TIER !== 'local'); }

/* v1.3.1 按座位分别设置（单机三家机器人各管各的；联机由房主设定，服务端同一份引擎读同一套键）

     spdOf(p)   ：这个座位机器人的出牌节奏（v1.3.2 起恒为「快」1.8；脏值/缺省都兜到 CFG.speed） */
function aiSeatOn(i){

/* 思考预算：得容得下模型一次真实往返（实测 hy3 约 1.1~1.6s），
   否则「模型永远来不及 → 每手都回退本地 → 玩家以为 AI 没生效」。
   ⚠️ 与「机器人速度」档位**无关**：那个档位调的是本地逻辑的出牌节奏，
   走大模型时它在设置里是隐藏的，让预算跟着它变只会造成静默劣化
   （例如速度设成「快」→ 预算被砍 25% → 每手都超时回退）。
   强档另有一套提示词（候选内定夺），给更宽的预算让它把候选表读完。 */
function aiBudget(){
  return (AI_TIER === 'strong') ? 3600 : 2200;
}
/* 牌名 ⇄ 编码：只让模型认牌名，编码表由程序翻译（模型极易搞错数字编码）。
   归一化要能容错 —— 模型常写「5筒 / 5p / 东 / 发 / 白板」，引擎内部是「五筒 / 東 / 發 / 白」，
   多认几种写法，才不会因为写法差异白白丢掉一次好决策。 */
const NUM_CN = ['一','二','三','四','五','六','七','八','九'];
const SUIT_ALIAS = { m: '萬', M: '萬', p: '筒', P: '筒', s: '條', S: '條' };
function normTileName(name){
  let x = String(name).trim().replace(/\s+/g, '');
  x = x.replace(/[１-９]/g, d => NUM_CN['１２３４５６７８９'.indexOf(d)]);
  x = x.replace(/[1-9]/g, d => NUM_CN[+d - 1]);
  x = x.replace(/万/g, '萬').replace(/条|索/g, '條').replace(/东/g, '東')
       .replace(/发/g, '發').replace(/风/g, '風');
  x = x.replace(/^([一二三四五六七八九])([mMpPsS])$/, (m, n, s) => n + SUIT_ALIAS[s]);
  if (x === '白板') x = '白';
  if (x === '红中' || x === '紅中') x = '中';
  if (x === '發財' || x === '發财') x = '發';
  if (/^[東南西北]風?$/.test(x)) x = x[0];
  return x;
}
let TILE_BY_NAME = null;
function tileFromName(name){
  if (name == null) return null;
  if (!TILE_BY_NAME){
    TILE_BY_NAME = {};
    for (let t = 0; t < PLAYCNT; t++) TILE_BY_NAME[tileName(t)] = t;
  }
  const k = normTileName(name);
  return TILE_BY_NAME[k] != null ? TILE_BY_NAME[k] : null;
}
/* 强档候选：本地引擎先把每张可打牌的后果算出来，按「向听优先，再看进张与危险度」排序，
   只把前 K 张交给模型定夺。模型的任务是**在几张合理牌之间取舍**，不是自己重新算牌理。
   v1.3.4：补上进张数（ukeire），与 aiChooseDiscard 打分逐项同口径 ——
     ① 「听死牌退回一向听」之后，光看向听+危险度无法区分「假装听（打出去听死）」与
        真的一向听，候选首张会与本地启发式分叉（护栏测试 m59 就是抓这个的）；
     ② 同时保证候选首张 == 本地答案，模型整条不可用时行为不漂移。 */
function aiRankDiscards(p, bans, k){
  const kk = k || 4;
  const bansA = (bans == null) ? [] : (Array.isArray(bans) ? bans : [bans]);
  const uniq = [...new Set(p.hand || [])].filter(t => bansA.indexOf(t) < 0 && !isFlower(t));
  if (!uniq.length) return [];
  const hc = toCounts(p.hand);
  // v1.3.8：清混碰锁门时刷新 target 并改用锁门感知的向听评估，否则喂给模型的
  // 候选本身就会「留其他花色」，模型再聪明也只能在错误候选里挑。
  if (!CFG.lajiHu && !p.knocked) p.target = aiTargetOf(p);
  const ls = (!CFG.lajiHu && typeof lockedSuitOf === 'function') ? lockedSuitOf(p) : null;
  const rows = [];
  const t0 = Date.now();
  for (const t of uniq){
    hc[t]--;
    const ev = (ls !== null && ls >= 0) ? evalAllLocked(hc, (p.melds || []).length, ls) : evalAll(hc, (p.melds || []).length);
    let sc = ev.best;
    if (p.target && ev[p.target] !== undefined && ev[p.target] <= ev.best + 1) sc = Math.min(sc, ev[p.target] - 0.35);
    let uke = 0;
    if (ev.best <= 2 && Date.now() - t0 < 900){
      for (let a = 0; a < PLAYCNT; a++){
        if (hc[a] >= 4) continue;
        hc[a]++;
        const e2 = evalAll(hc, p.melds.length);
        hc[a]--;
        if (e2.best < ev.best) uke += Math.max(0, 4 - seenCount(a));
      }
    }
    // v1.3.4：打出去即听牌 → 顺带算出听口的可见剩余张数，交给模型一起权衡；
    //   听死牌（剩 0 张）按「没听」处理，免得模型在候选里挑一个根本胡不了的听。
    //   ⚠️ 只有「算得出听口、但全被现完」才算听死（算不出听口是另一回事）
    let left = null;
    if (sc === 0){
      const w0 = getWaitsHand(countsToTiles(hc), p.melds);
      left = aliveLeft(aliveWaits(w0, p), p);
      if (w0.length && left <= 0){ left = 0; sc = 1; }
    }
    hc[t]++;
    const r = t < 27 ? (t % 9) + 1 : 5;
    const center = t < 27 ? (4 - Math.abs(r - 5)) * 0.6 : 0;   // 中张比边张有价值
    const danger = dangerScore(t, p);
    let val = -sc * 1000 + (left || 0) * 42 + uke * 14 - danger * 9 + center;
    // v1.3.8：锁门时同等向听下偏置——打非锁定花色、留锁定花色+字牌（与 aiChooseDiscard 同口径）
    if (ls !== null && ls >= 0){
      const su = suitOf(t);
      if (su === ls || su === 3) val -= 8; else val += 8;
    }
    rows.push({ t, sh: Math.round(sc * 100) / 100, danger, left, val });
  }
  rows.sort((a, b) => b.val - a.val);
  return rows.slice(0, kk);
}
/* 预算竞速：超时 / 异常一律 resolve(null)，绝不把失败的 Promise 抛给主循环 */
function aiRace(pr, ms){
  return new Promise(resolve => {
    let done = false;
    const finish = v => { if (!done){ done = true; resolve(v); } };
    let timer = null;
    if (typeof setTimeout === 'function') timer = setTimeout(() => finish(null), ms);
    Promise.resolve(pr).then(
      v => { if (timer) clearTimeout(timer); finish(v); },
      () => { if (timer) clearTimeout(timer); finish(null); }
    );
  });
}
/* 该 AI 视角的牌局快照 —— 只含公开信息 + 自己的手牌 */
function aiView(p, kind, extra){
  const names = arr => (arr || []).map(tileName);
  const hand = sortTiles(p.hand || []).filter(t => !isFlower(t));
  const melds = (p.melds || []).map(m => ({ type: m.type, tiles: names(m.tiles), concealed: !!m.concealed }));
  const table = [];
  for (let i = 0; i < G.players.length; i++){
    const q = G.players[i];
    table.push({
      discards: names(q.discards),
      melds: (q.melds || []).map(m => ({ type: m.type, tile: tileName(m.tile) }))
    });
  }
  let shanten = null;
  try { shanten = evalAll(toCounts(p.hand), (p.melds || []).length).best; } catch (e){}
  /* v1.3.4：把「影响选牌但模型原本看不到」的规则状态一并给出去 —— 七小对是否算胡、
     清混碰锁门的花色、自己是不是 0 花（无花果只能自摸）、当前这手牌的底/番，都是自己视角的公开信息，不算偷看。 */
  const lockS = (typeof lockedSuitOf === 'function') ? lockedSuitOf(p) : null;
  let cur = null;
  try { const df = playerDiFan(p); cur = { di: df.di, fan: df.fan, tenpai: !!df.tenpai }; } catch (e){}
  const v = {
    mode: CFG.lajiHu ? '敲麻' : '清混碰',
    seat: p.idx, dealer: G.dealer, handNo: G.handNo || 1,
    hand: names(hand), melds, flowers: names(p.flowers),
    knocked: !!p.knocked, shanten, plan: p.target || null,
    sevenPairs: !!CFG.sevenPairs,
    lock: (lockS == null || lockS < 0) ? null : SUIT_CH[lockS],
    wuGuoHua: (typeof isWuGuoHua === 'function') ? !!isWuGuoHua(p) : false,
    cur,
    wallLeft: (typeof wallLeft === 'function' ? wallLeft() : null),
    lastDiscard: (G.lastDiscard == null ? null : tileName(G.lastDiscard)),
    lastFrom: (G.lastFrom == null ? null : G.lastFrom),
    table
  };
  if (kind === 'discard'){
    const bans = (extra && extra.bans) || [];
    v.legal = names(hand.filter(t => bans.indexOf(t) < 0));
    v.banned = names(bans);
    // 强档：把引擎算好的候选一并交给模型（模型只在这几张里定夺）
    const cand = (extra && extra.cand) || null;
    if (cand && cand.length){
      // v1.3.4：带上 left —— 打掉这张后若听牌，听口在台面上还剩几张（听死牌为 0，已按没听处理）
      v.candidates = cand.map(c => {
        const o = { tile: tileName(c.t), shanten: c.sh, danger: c.danger };
        if (c.left != null) o.left = c.left;
        return o;
      });
    }
  } else {
    v.claimTile = tileName(extra.tile);
    v.claimFrom = extra.from;
    v.isNext = !!extra.isNext;
    v.options = (extra.opts || []).map(o => o.k);
  }
  return v;
}
/* 出牌决策：本地答案先算好，模型只在「预算内 + 答案合法」时才接管。
   交给模型的除了牌面，还有「怎么选」：
     · 强档（默认、也是 UI 唯一暴露的一档）：引擎先按向听/危险度排出 top-4 候选，
       模型只在这几张里定夺 —— 算牌交给确定性引擎（不会算错牌理），
       模型专管「读牌河、判谁在做牌」这类取舍。
   fast 分支保留给本地仿真与单测做对照，UI 不再暴露。 */
async function decideDiscard(p, bans){
  const local = aiChooseDiscard(p, bans);
  // 敲定后规则要求摸打，不问模型；这个座位被设成「不用AI」也不问（直接走本地逻辑）
  if (!aiBrainOn() || !aiSeatOn(p.idx) || p.knocked) return local;
  let cand = null, allowed = null;
  if (AI_TIER === 'strong'){
    try { cand = aiRankDiscards(p, bans, 4); } catch (e){ cand = null; }
    if (!cand || !cand.length) cand = null;
    else {
      allowed = cand.map(c => c.t);
      if (allowed.indexOf(local) < 0) allowed.push(local);   // 本地最优一定留在允许集里，避免模型被迫选次优
    }
  }
  let r = null;
  try { r = await aiRace(AI_BRAIN.ask({ kind: 'discard', tier: AI_TIER, view: aiView(p, 'discard', { bans, cand }) }), aiBudget()); }
  catch (e){ r = null; }
  const t = (r && r.discard != null) ? tileFromName(r.discard) : null;
  const bad = (t == null) || (p.hand || []).indexOf(t) < 0 || (bans || []).indexOf(t) >= 0
              || (allowed !== null && allowed.indexOf(t) < 0);
  if (bad){
    AI_MISS++;
    if (!r) AI_BRAIN_ERR = 'timeout';
    else if (r.error) AI_BRAIN_ERR = r.error;
    return local;
  }
  AI_HITS++;
  p.aiWhy = String(r.reason || '').slice(0, 40);    // 留作「机器人思考气泡」的数据（P3）
  return t;
}
/* 吃牌可能有多种组合（同一张牌左右不同的搭子），按向听最优选一组打出去 */
function pickChowOption(p, tile, cand){
  if (!cand || !cand.length) return null;
  if (cand.length === 1) return cand[0];
  const hc0 = toCounts(p.hand);
  let best = null;
  for (const o of cand){
    const hc = hc0.slice();
    let ok = true;
    for (const t of (o.combo || [])){ if (!hc[t]){ ok = false; break; } hc[t]--; }
    if (!ok) continue;
    const ev = evalAll(hc, (p.melds || []).length + 1);
    const k = (p.target && ev[p.target] !== undefined) ? ev[p.target] : ev.best;
    if (!best || k < best.k) best = { o, k };
  }
  return best ? best.o : cand[0];
}
/* 碰/吃/杠决策：胡与敲定不进模型；模型选的选项必须真实存在于 opts */
async function decideClaim(p, tile, from, opts, isNext){
  const local = aiClaim(p, tile, from, opts, isNext);
  if (!aiBrainOn() || !aiSeatOn(p.idx)) return local;   // 该座位不用 AI → 本地逻辑
  if ((opts || []).some(o => o.k === 'hu')) return local;   // 有和必和：规则，不商量
  if (p.knocked) return local;
  let r = null;
  try { r = await aiRace(AI_BRAIN.ask({ kind: 'claim', tier: AI_TIER, view: aiView(p, 'claim', { tile, from, opts, isNext }) }), aiBudget()); }
  catch (e){ r = null; }
  if (!r || r.action == null){
    AI_MISS++;
    if (r && r.error) AI_BRAIN_ERR = r.error;
    return local;
  }
  const a = String(r.action).trim();
  if (a === '过' || a === 'pass'){
    AI_HITS++; p.aiWhy = String(r.reason || '').slice(0, 40);
    return null;                                  // 过 = 碰吃都不要（与真人点「过」同义）
  }
  const KINDS = { '碰': 'pung', '杠': 'kong', '吃': 'chow' };
  const want = KINDS[a];
  const cand = want ? (opts || []).filter(o => o.k === want) : [];
  if (!cand.length){ AI_MISS++; return local; }
  AI_HITS++; p.aiWhy = String(r.reason || '').slice(0, 40);
  return want === 'chow' ? pickChowOption(p, tile, cand) : cand[0];
}

const FACE = {};
/* v1.3.16：clip-path 全局 defs —— 修复白板（及一切用 clipPath 的牌面）图案整体消失。
   每张牌的 SVG 自带 <defs><clipPath id="xxx_a">，而 url(#id) 按「文档中第一个同 id」解析；
   一旦某个隐藏（display:none）容器里的牌面成为第一个实例（起手/记录/结算等隐藏面板），
   当前 Chrome 拒绝从 display:none 子树解析 clip-path → 全页该牌面只剩白底（实测白板必现）。
   对策：启动时把 STD_FACES 里所有 defs 去重后注入一个「可见的全局 defs SVG」，插到 body
   第一个子节点 —— 保证第一个（生效的）实例永远可见；各牌面内自带的重复 defs 留着无害。 */
(() => {
  try {
    if (typeof document === 'undefined' || typeof STD_FACES === 'undefined') return;
    const install = () => {
      try {
        const seen = new Set(); let blob = '';
        for (const k in STD_FACES){
          const re = /<defs>([\s\S]*?)<\/defs>/g; let m;
          while ((m = re.exec(STD_FACES[k][1]))){
            const idm = m[1].match(/id="([^"]+)"/);
            if (!idm || seen.has(idm[1])) continue;
            seen.add(idm[1]); blob += m[1];
          }
        }
        if (!blob || document.getElementById('__global_defs')) return;
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('width', '0'); svg.setAttribute('height', '0');
        svg.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden';
        svg.id = '__global_defs';
        svg.innerHTML = '<defs>' + blob + '</defs>';
        document.body.insertBefore(svg, document.body.firstChild);
      } catch (e){}
    };
    if (document.body) install();
    else document.addEventListener('DOMContentLoaded', install);
  } catch (e){}
})();
function faceKey(t){
  if (t >= 116) return 'haku';
  if (t >= 112) return 'hatsu';
  if (t >= 108) return 'chun';
  if (t >= 100) return 'f' + (t - 100);
  if (t === 31) return 'chun';       // 清混碰：中发白按普通牌编码（31-33）
  if (t === 32) return 'hatsu';
  if (t === 33) return 'haku';
  if (t >= 27) return 'w' + (t - 27);
  return 't' + t;
}
function faceSVG(t){
  const hit = FACE[t];
  if (hit !== undefined) return hit;
  const f = STD_FACES[faceKey(t)];
  const svg = '<svg viewBox="' + f[0] + '" preserveAspectRatio="xMidYMid meet">' + f[1] + '</svg>';
  FACE[t] = svg;
  return svg;
}
function tileEl(t, cls){
  const d = document.createElement('div');
  d.className = 'tile ' + (cls || '');
  if (t === null || t === undefined){ d.classList.add('back'); return d; }
  if (isFlower(t)) d.classList.add('fl');
  d.innerHTML = faceSVG(t);
  return d;
}
function meldEl(m, small){
  const box = document.createElement('div');
  box.className = 'meld' + (m.type === 'kong' && m.concealed ? ' concealedKong' : '');
  for (const t of m.tiles){
    const e = tileEl(t, (small ? 'xs' : '') + (m.type === 'kong' && m.concealed ? ' concealed' : ''));
    box.appendChild(e);
  }
  return box;
}
function logMsg(s){
  G.logs.push(s);
  if (G.logs.length > 200) G.logs.shift();
  const box = $('log');
  box.innerHTML = '';
  // v1.2.3：默认显示 3 条，空间不够自动减少为 2 / 1 条，绝不溢出
  let n = Math.min(3, G.logs.length);
  const total = G.logs.length;
  while (n > 1){
    box.innerHTML = '';
    for (let i = total - 1; i >= total - n; i--){
      const d = document.createElement('div');
      d.textContent = G.logs[i];
      box.appendChild(d);
    }
    if (box.scrollHeight <= box.clientHeight + 1) break;
    n--;
  }
}
// 本局每一手的完整记录
function openHandLog(){
  const list = G.logs || [];
  const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const body = list.length
    ? '<div class="lglist">' + list.map((s, i) =>
        '<div class="lgrow"><span class="lgi">' + (i + 1) + '</span><span>' + esc(s) + '</span></div>').join('') + '</div>'
    : '<p class="dimc">本局还没有出牌记录。</p>';
  openSheet('<h2><span>本局记录</span><span class="sp"></span>' +
    '<span class="hcnt">第 ' + G.handNo + ' 局 · ' + list.length + ' 手</span>' +
    '<button class="close" onclick="closeSheet()">×</button></h2>' +
    body +
    '<div class="btns"><button class="pri" onclick="closeSheet()">关闭</button></div>');
}
function toast(text, cls, seat){
  // 带座位的提示（吃/碰/杠/敲）：落在当事人自己的牌河区；seatToast 定义在联机模块后（客户端专属）
  if (seat != null && typeof seatToast === 'function'){ seatToast(seat, text); return; }
  const box = $('toast');
  const d = document.createElement('div');
  d.className = 'tst ' + (cls || '');
  d.textContent = text;
  box.appendChild(d);
  setTimeout(() => d.remove(), 2100);   // 与 pop 动画时长一致：停留约 2 秒再消失
}

let SEL = null;   // 玩家选中的手牌（牌 ID，逻辑用）
let SELIDX = null; // 选中位置（区分手里相同的牌）
// v1.2.40：点了刚吃/碰进、本次不能打出的牌 → 提示为什么打不了
// v1.2.47f：禁打可能有多张（同一张 + 相连牌），取禁打清单的小工具
function banListOf(payload){
  if (!payload) return [];
  if (Array.isArray(payload.bans)) return payload.bans;
  return (payload.ban != null && payload.ban >= 0) ? [payload.ban] : [];
}
function banToast(payload){
  const kind = (payload && payload.banKind) || '吃/碰';
  const list = banListOf(payload);
  const t = payload ? payload.ban : -1;
  const near = list.filter(x => x !== t);
  const main = t >= 0 ? tileName(t) : '这张';
  toast('刚' + kind + '进的 ' + main +
    (near.length ? ' 及连片的 ' + near.map(tileName).join('、') : '') + ' 不能立刻打出', 'red');
}
function renderHand(){
  const p = G.players[0];
  const box = $('hand');

    e.onclick = () => {

      if (canPick && SELIDX === k){ SEL = null; SELIDX = null; resolvePend(t); }
      else { SEL = t; SELIDX = k; renderHand(); renderRiver(); renderMe(); renderSeats(); }

    const e = tileEl(drawn, (canPick && !dBanned ? '' : 'locked') + ' hl' + (dBanned ? ' ban' : ''));
    if (SELIDX === 'd' && !dBanned) e.classList.add('sel');

    e.onclick = () => {

      else { SEL = drawn; SELIDX = 'd'; renderHand(); renderRiver(); renderMe(); renderSeats(); }
    };

}

// 花 + 吃碰杠 统一渲染：vert=竖排（东西家），rev=东家（列序翻转）
function renderFx(box, p, vert, rev){

  if (p.flowers.length && p.melds.length){

    m.tiles.forEach((t, ti) => {
      const e = addTile(t, 'un' + (m.type === 'kong' && m.concealed ? ' concealed' : ''), mel);
      // v1.2.18：点手牌算牌时，自己吃碰杠区（副露）里同牌也高亮——

/* ---------- HUD：底 / 番 / 得分 ---------- */
// melds 必须真实传入（副露参与番型判定：清碰/混碰/风碰 都依赖它）
function getWaitsHand(hand, melds){
  melds = melds || [];
  const meldCount = melds.length;
  const hc = toCounts(hand);
  const need = 4 - meldCount;
  if (hand.length % 3 !== 1) return [];
  const out = [];
  for (let t = 0; t < PLAYCNT; t++){
    if (hc[t] >= 4) continue;
    hc[t]++;
    let ok = false;
    if (meldCount === 0 && isSevenPairs(hc)) ok = true;
    else if (isWinShape(hc, need)) ok = true;
    if (ok){
      const ev = evaluateShape(hc, melds, { flowerCount: 0 });
      if (ev) out.push({ t, ev });
    }
    hc[t]--;
  }
  return out;
}
// 任一玩家当前的「底 / 番」：底 = 起底 + 花；番 = 听牌取最佳听口番，否则取当前牌型番
// v1.2.52：花数一律 calcFlowers(p, hc)——含手牌风/字暗刻，与结算 tryWin 的 ev.flowers 同口径
function playerDiFan(p){
  const hc = toCounts(p.hand || []);
  const di = CFG.base + calcFlowers(p, hc);
  if (p.settleFan != null) return { di: p.settleDi != null ? p.settleDi : di, fan: p.settleFan, tenpai: true };
  if (!p.hand || !p.hand.length) return { di, fan: null, tenpai: false };
  const addFan = extraFan(p, {}).reduce((s, x) => s + x[1], 0);
  let fan = null, di2 = null, tenpai = false;
  if (p.hand && p.hand.length % 3 === 1 && G.running){
    const w = aliveWaits(getWaitsHand(p.hand, p.melds), p);   // v1.3.4：听死牌不算听（与敲定/顶部同口径）
    if (w.length){
      tenpai = true;
      let best = null, bv = -1;
      for (const x of w){
        const r = diFanOf(x.ev, calcFlowers(p, hc), addFan, p);
        const v = r.di * r.fan;                 // 用「底 × 番」比较，勒子牌型的底不同也能比
        if (v > bv){ bv = v; best = r; }
      }
      fan = best.fan; di2 = best.di;
    }
  }
  if (fan === null){
    const cur = evaluateShape(hc, p.melds, { flowerCount: calcFlowers(p, hc) });
    const r = cur ? diFanOf(cur, calcFlowers(p, hc), addFan, p) : typeDiFan(evalAll(hc, p.melds.length).bestType, calcFlowers(p, hc), addFan, p);
    fan = r.fan; di2 = r.di;
  }
  return { di: di2 != null ? di2 : di, fan, tenpai };
}
function analyzeMe(){
  const p = G.players[0];
  const hc = toCounts(p.hand);
  // v1.2.52：花数与结算/点炮判定同口径（calcFlowers(p, hc)，含手牌风/字暗刻）；附加番 extraFan 统一给
  const flowers = calcFlowers(p, hc);
  const di = CFG.base + flowers;
  const add = extraFan(p, {});
  const addFan = add.reduce((s, x) => s + x[1], 0);

  const out = { di, flowers, add, addFan, waits: [], fan: null, shanten: null, target: null, best: null };

  let waits = [];
  if (p.hand.length % 3 === 1){
    waits = aliveWaits(getWaitsHand(p.hand, p.melds), p);   // v1.3.4：听死牌不算听
  } else if (p.hand.length % 3 === 2){
    // 刚摸牌（14 张）：模拟打一张，优先找"打了就听牌"，否则找向听最小的打法
    const uniq = [...new Set(p.hand)];
    let bs = null;
    for (const t of uniq){
      const h = p.hand.slice();
      const i = h.indexOf(t); if (i >= 0) h.splice(i, 1);
      const w = aliveWaits(getWaitsHand(h, p.melds), p);    // v1.3.4：听死的听口先滤掉
      const e2 = evalAll(toCounts(h), p.melds.length);
      const cand = { t, w, ev: e2, live: w.length > 0, left: aliveLeft(w, p) };
      if (!bs){ bs = cand; continue; }
      // v1.3.4 取舍顺序：① 打完能听 > 不能听；② 都能听 → 听口剩余张数多者优（最直观的胡牌概率）；
      //                ③ 剩余一样 → 听口种类多者优；④ 都不能听 → 向听小者优
      if (cand.live !== bs.live){ if (cand.live) bs = cand; continue; }
      if (cand.live){
        if (cand.left !== bs.left){ if (cand.left > bs.left) bs = cand; continue; }
        if (cand.w.length !== bs.w.length){ if (cand.w.length > bs.w.length) bs = cand; continue; }
      }
      if (cand.ev.best < bs.ev.best) bs = cand;
    }
    if (bs){
      waits = bs.w;
      if (waits.length) out.discardToTenpai = bs.t;
      else { out.shanten = bs.ev.best; out.target = bs.ev.bestType; }
    }
  }
  if (waits.length){
    // v1.2.37：听口比较用「底 × 番」，但存进 out 的必须是真番与真底（原来把乘积当番存了）
    let bw = null, bv = -1, bdi = di;
    for (const w of waits){
      const r = diFanOf(w.ev, flowers, addFan, p);
      const v = r.di * r.fan;               // 勒子牌型的底不同，用「底 × 番」选最优听口
      if (v > bv){ bv = v; bw = w; bdi = r.di; }
    }
    out.waits = waits; out.best = bw; out.di = bdi;
    out.fan = diFanOf(bw.ev, flowers, addFan, p).fan;
  } else {
    const ev = evalAll(hc, p.melds.length);
    out.shanten = ev.best; out.target = ev.bestType;
    // v1.2.37：未听牌时也按「当前手牌的真实牌型」算，不再用 bestType 粗估
    // （bestType 只看向听方向，可能把清一色算成清碰/清一色之外的档，导致番对不上）
    const cur = evaluateShape(hc, p.melds, { flowerCount: flowers });
    const r = cur ? diFanOf(cur, flowers, addFan, p) : typeDiFan(ev.bestType, flowers, addFan, p);
    out.fan = r.fan; out.di = r.di;
  }
  // v1.2.37：顶部「可得（分）」直接给出来，renderHUD 不再自己乘（与结算 scoreOf 同源）
  const mult = (G.kaibao ? 2 : 1) * Math.pow(2, G.huangfan || 0);
  out.score = out.fan == null ? null
    : Math.min(out.di * Math.max(1, out.fan) * CFG.unit * mult, capValue());
  return out;
}
// 听牌提示里的「台面剩余张数」：4 减去自己手牌、三家牌河、吃碰杠副露里已出现的同牌数。
// 不算其他三家手牌（台面下，看不见）。
// v1.3.4：泛化成「任意座位视角」的 leftFor —— 人类看到的数字与 AI 判断听口价值的数字同源同口径。
//   决策期也用 p.hand（打牌前）：打出去的那张会进牌河，与「还在手里」等效，
//   所以 4 - 手牌 - 牌河 - 副露 在打出前后完全一致，不必模拟打完后的手牌。
function leftFor(t, p){
  let n = 4;
  if (p && p.hand) n -= p.hand.filter(x => x === t).length;
  for (let i = 0; i < 4; i++){
    const q = G.players[i];
    if (!q) continue;
    if (q.discards) n -= q.discards.filter(x => x === t).length;
    for (const m of (q.melds || [])){
      const ts = (m.tiles && m.tiles.length) ? m.tiles : [m.tile];
      n -= ts.filter(x => x === t).length;
    }
  }
  return Math.max(0, n);
}
function visibleLeft(t){ return leftFor(t, G.players[0]); }
/* v1.3.4：听口有效性 —— 听的牌在台面上已经现完（剩 0 张）就是「听死」：这辈子摸不到、别人也打不出，
   等于没听。aliveWaits 把听死的听口滤掉；aliveLeft 是有效听口的「剩余张数之和」，
   多个听法之间比它 —— 张数越多越容易胡。 */
function aliveWaits(waits, p){
  return (waits || []).filter(w => leftFor(w.t, p) > 0);
}
function aliveLeft(waits, p){
  let n = 0;
  for (const w of (waits || [])) n += leftFor(w.t, p);
  return n;
}
// 当前手牌可敲听的打法：模拟每张牌，返回能进入听牌的 {discard, waits, left} 列表
function potentialKnocks(p, all){
  // v1.3.9：all=true 时不做「听死」过滤——专供「打的牌能成听、但听的牌台面已现完」的提示用，
  //   否则这种情况整行不显示，玩家只看到空白，会误以为程序没算出听口。
  if (p.knocked || p.isBot || p.hand.length % 3 !== 2) return [];
  const out = [];
  const uniq = [...new Set(p.hand)];
  for (const t of uniq){
    const h = p.hand.slice();
    const i = h.indexOf(t); if (i < 0) continue;
    h.splice(i, 1);
    const raw = getWaitsHand(h, p.melds);
    const waits = all ? raw : aliveWaits(raw, p);   // v1.3.4：听死的听口不算听
    if (waits.length) out.push({ discard: t, waits, left: aliveLeft(waits, p), dead: aliveLeft(waits, p) === 0 });
  }
  // v1.3.4：优先「听口剩余张数多」的打法（最容易胡），再看听口种类数与牌型大小
  out.sort((a, b) => b.left - a.left || b.waits.length - a.waits.length ||
    Math.max(...b.waits.map(w => shapeValue(w.ev))) - Math.max(...a.waits.map(w => shapeValue(w.ev))));
  return out;
}
function capValue(){
  return CFG.lezi * 10 * CFG.unit * (G.kaibao ? 2 : 1) * Math.pow(2, G.huangfan);
}
// v1.2.40：顶部四栏是否该显示数字。
// deal() 会先把起手花摘到 pendingFlowers，等轮到本人首次出牌时才补回来（上海敲麻规则）。
// 这期间手牌张数不足（摘走几张花就少几张），算出来的底/番/得分没有意义 —— 牌不齐就显示「—」。
// v1.2.41：发完牌、还没轮到我第一手时也显示「—」。
//   判据只用联机也同步得到的字段：discards（出过牌）与 G.turn（现在轮到我）；
//   drawnCount 在联机投影里恒为 0，不能用。
function hudReady(){
  const p = G.players && G.players[0];
  if (!p) return false;
  if (!p.hand || !p.hand.length) return false;                    // 还没发牌
  if (p.pendingFlowers && p.pendingFlowers.length) return false;  // 起手花待补，牌不齐
  if (!G.finished && !(p.discards && p.discards.length) && G.turn !== 0) return false;
  return true;
}
// v1.2.43：顶部四栏「为什么是这个数」——点一下就地展开本手牌的口径明细。
//   与 analyzeMe / scoreOf 同源推导，把 底 和 番 的每个组成部分列出来
//   （尤其是「沾勒子 → 底固定 10 花」这条最容易看不懂的规则）。
function hudBreakdown(){
  const p = G.players[0];
  const a = analyzeMe();
  const flowers = a.flowers || 0;
  let typeName = '', lzParts = null, ev = null;
  if (a.best && a.best.ev){                       // 已听牌：按最佳听口
    ev = a.best.ev; typeName = ev.type; lzParts = leziTotal(p, ev).parts;
  } else {
    const cur = evaluateShape(toCounts(p.hand), p.melds, { flowerCount: flowers });
    if (cur){ ev = cur; typeName = cur.type; lzParts = leziTotal(p, cur).parts; }
    else { lzParts = leziTotal(p, {}).parts; }    // 还没成型：只可能有无花果 / 大吊车
  }
  const lz = lzParts.reduce((s, x) => s + x[1], 0);
  const rows = [];
  rows.push('<div class="li"><span class="n">玩法</span><span class="v">' + (CFG.lajiHu ? '敲麻' : '清混碰') + '</span></div>');
  rows.push('<div class="li"><span class="n">花数（' + (CFG.lajiHu ? '季花 + 中发白 + 风刻/杠 + 杠' : '季花 + 风刻/杠 + 杠') + '）</span><span class="v">' + flowers + '</span></div>');
  if (lz){
    rows.push('<div class="li"><span class="n">沾勒子 → 底固定 10 花</span><span class="v">10 花</span></div>');
    for (const x of lzParts) rows.push('<div class="li"><span class="n">　勒子 · ' + x[0] + '</span><span class="v">' + x[1] + ' 勒</span></div>');
    rows.push('<div class="li"><span class="n">番 = 勒子合计</span><span class="v">' + lz + '</span></div>');
  } else {
    rows.push('<div class="li"><span class="n">没沾勒子 → 底 = 底设置 ' + CFG.base + ' + 花 ' + flowers + '</span><span class="v">' + (CFG.base + flowers) + ' 花</span></div>');
    if (CFG.lajiHu) rows.push('<div class="li"><span class="n">兜底（仅敲麻）</span><span class="v">1</span></div>');
    if (typeName) rows.push('<div class="li"><span class="n">牌型 · ' + typeName + '</span><span class="v">' + (ev ? ev.base : 0) + ' 番</span></div>');
    else rows.push('<div class="li"><span class="n">牌型</span><span class="v">还没成型</span></div>');
  }
  for (const x of (a.add || [])) rows.push('<div class="li"><span class="n">附加番 · ' + x[0] + '</span><span class="v">+' + x[1] + '</span></div>');
  const mult = (G.kaibao ? 2 : 1) * Math.pow(2, G.huangfan || 0);
  rows.push('<div class="li tot"><span class="n">合计</span><span class="v">底 ' + a.di + ' × 番 ' + a.fan + '</span></div>');
  rows.push('<div class="li"><span class="n">' + a.di + ' × ' + Math.max(1, a.fan) + ' × 每花 ' + CFG.unit +
            (mult > 1 ? ' × 倍数 ' + mult : '') + '</span><span class="v">' + (a.di * Math.max(1, a.fan) * CFG.unit * mult) + '</span></div>');
  if (a.score != null) rows.push('<div class="li tot"><span class="n">可得（含封顶）</span><span class="v">' + a.score + ' 分</span></div>');
  return '<div class="fanbreak">' + rows.join('') + '</div>';
}

/* ---------- 听牌状态（顶部标签 + 底部听牌行共用同一判定，v1.3.10） ----------
   判定**按各自玩法**，两模式并不相同、也不硬凑：
     · 清混碰（免敲，CFG.lajiHu===false）：没有「敲定」这个动作 → 「听牌」= 当前手牌
       形状可听（getWaits，含听死）。
     · 敲麻（CFG.lajiHu===true）：必须敲定才算听（p.knocked + p.knockWaits）；未敲时
       即使牌型已经是听牌形状也不算听（因为不能胡，与顶部「未敲 · 不能胡」同口径）。
   统一的是「文案与语义表达」（都可听 / 听牌中），不是判定依据。
   另：「是否轮到我出牌」用 PEND.kind==='discard' 判断，不用手牌张数 % 3——碰/杠后
   张数会变、联机投影在起手花暂存期也会偏短，用张数当开关会漏显示。
   返回：{ phase:'discard'|'wait', listening, waits:[{t}], knockable, knocks:[{discard,waits}] } */
function tingState(){
  const p = G.players && G.players[0];
  if (!p || !G.running || G.finished) return null;
  const myDiscard = !!(PEND && PEND.kind === 'discard' && !p.isBot && !NET.autoKnock);
  if (p.knocked){
    const w = (p.knockWaits || []).map(t => ({ t }));
    return { phase: 'wait', listening: w.length > 0, waits: w, knockable: false, knocks: [] };
  }
  if (myDiscard){
    // 出牌态：所有「打 X 就能听」的听口。优先活听口，一个活听都没有才回退到含听死。
    const knLive = potentialKnocks(p);
    const knAll = knLive.length ? knLive : potentialKnocks(p, true);
    const seen = [], list = [];
    for (const k of knAll) for (const w of k.waits) if (seen.indexOf(w.t) < 0){ seen.push(w.t); list.push(w.t); }
    list.sort((a, b) => a - b);
    return { phase: 'discard', listening: false, waits: list.map(t => ({ t })),
             knockable: list.length > 0, knocks: knLive };
  }
  if (!CFG.lajiHu){
    // 清混碰免敲（等牌态）：形状可听就报，含听死
    const w = getWaits(p) || [];
    return { phase: 'wait', listening: w.length > 0, waits: w, knockable: false, knocks: [] };
  }
  return { phase: 'wait', listening: false, waits: [], knockable: false, knocks: [] };
}
/* ---------- 底部听牌行（唯一渲染点） ----------
   出牌态 → 「可听 X(n)」；等牌态 → 「听牌中 → X(n)」；n=0（听死）也显示并标红。 */
function renderTingLine(){
  const tl = $('tingLine');
  const st = tingState();
  const wrap = t => {
    const n = visibleLeft(t);
    return '<span class="w' + (n ? '' : ' dead') + '">' + tileName(t) + '(' + n + (n ? '' : '·已绝') + ')</span>';
  };
  let html = '';
  if (st && st.listening) html = '听牌中 → ' + st.waits.map(w => wrap(w.t)).join(' ');
  else if (st && st.phase === 'discard' && st.knockable) html = '可听 ' + st.waits.map(w => wrap(w.t)).join(' ');
  tl.innerHTML = html;
  tl.className = html ? 'tingline show' : 'tingline';
}
function renderHUD(){
  const p = G.players[0];
  const a = analyzeMe();
  const ready = hudReady();
  $('mDi').textContent = ready ? a.di : '—';
  $('mCap').textContent = ready ? capText(capValue()) : '—';
  $('myWind').textContent = SEAT_WIND[(0 - G.dealer + 4) % 4];
  const kt = $('knockTag');
  // v1.3.10：顶部标签与底部听牌行共用 tingState()——同一判定、同一措辞，不再各算一套，
  //   也就不会出现「顶部说未听牌/听死、底部说可听/听牌中」自相矛盾。
  //   清混碰（免敲）：出牌态「可听 X(n)」／等牌态「听牌中 · X(n)」／否则「未听牌」；
  //   敲麻：已敲「已敲 · 听 X」／未敲但可敲听「可敲听 · 打X 听Y」／否则「未敲 · 不能胡」。
  const st = tingState();
  const allDead = !!(st && st.waits.length && st.waits.every(w => leftFor(w.t, p) <= 0));
  const tagTxt = st ? st.waits.map(w => tileName(w.t) + '(' + visibleLeft(w.t) + ')').join(' / ') : '';
  if (CFG.lajiHu){
    if (p.knocked){ kt.textContent = '已敲 · 听 ' + p.knockWaits.map(tileName).join('/'); kt.className = 'knockTag'; }
    else if (st && st.knocks.length){
      kt.textContent = '可敲听 · 打' + tileName(st.knocks[0].discard) + ' 听 ' + st.knocks[0].waits.map(w => tileName(w.t)).join('/');
      kt.className = 'knockTag';
    } else { kt.textContent = '未敲 · 不能胡'; kt.className = 'knockTag off'; }
  } else if (st && st.listening){
    kt.textContent = '听牌中 · ' + tagTxt;
    kt.className = allDead ? 'knockTag off' : 'knockTag';
  } else if (st && st.knockable){
    kt.textContent = '可听 · ' + tagTxt;
    kt.className = allDead ? 'knockTag off' : 'knockTag';
  } else {
    kt.textContent = '未听牌';
    kt.className = 'knockTag off';
  }

  // v1.3.10：底部听牌行改由 renderTingLine() 统一渲染（定义见本文件）——
  //   出牌态「可听 X(n)」／等牌态「听牌中 → X(n)」，n=0 也显示；敲麻与清混碰同文案同口径。
  //   原先散在 renderHUD / renderActs 两处、以「手牌张数 % 3」当开关，碰/杠后或联机投影下
  //   会漏显示，现收敛为一处、按回合状态判断。
  renderTingLine();
  // v1.2.11：顶部「番 / 单份」实时计算，不再锁在已敲分支——
  // 听牌取最佳听口番，未听取当前牌型番（analyzeMe 两个分支都给出真番）
  // v1.2.37：得分同样走 hudScore()（与结算 scoreOf 同源），不再自己写一遍乘法
  $('mFan').textContent = ready ? a.fan : '—';
  $('mScore').textContent = (!ready || a.score == null) ? '—' : a.score;
}

// 左右两家的牌背：按可用高度均分，保证 13 张完整显示不被裁

/* 操作按钮自适应：按钮少则撑宽、多则均分；字多时缩小字号兜底，绝不换行 */
function fitActs(){

if (typeof window !== 'undefined' && typeof window.addEventListener === 'function'){   // 引擎沙箱内 window 只有局部 stub，无 addEventListener

function fitBacks(){
  for (let pass = 0; pass < 2; pass++){
    for (const i of [1, 3]){
      const bk = $('bk' + i), n = bk.children.length;
      if (!n) continue;
      const tile = bk.children[0].firstChild;       // 牌的实际高度即 --th
      const th = (tile && tile.offsetHeight) || 33; // 上下 padding 各 th/2，合计 th
      // v1.2.28：可用高度改量座位容器（原来量牌背自身内容高度，会越压越扁、永远重叠）
      // v1.2.29：槽位目标 18 → 14px——用户反馈左右家手牌展开后「分的有点开」，
      // 改成与对家同密度：对家 24px 牌 margin -3px（中心距 21 = 87.5%），
      // xs 牌旋转视觉高 16 × 0.875 = 14px，紧拢略叠；空间不够仍按比例压缩（下限 4）
      const seat = bk.parentNode;
      const avail = (seat && seat.clientHeight ? seat.clientHeight : bk.clientHeight) - th - 3;
      if (avail <= 8) continue;
      const h = Math.max(4, Math.min(14, Math.floor(avail / n)));
      for (const s of bk.children) s.style.height = h + 'px';
    }
  }
}
/* v1.2.29：花/吃碰杠排超长自动缩小——量容器可用宽高，按比例压 --fxs（下限 0.5）。
   每次 render 先复位 1 再测（SEL 高亮等重渲染路径结果稳定）；
   .fx 的 overflow 已改 visible（高亮框不被裁），溢出防护完全靠这里。
   压缩因子是「相对当前档位」的乘法下调（单调收敛）——
   若用绝对比值，内容快放下时比值≈1 会把 scale 又弹回去、来回振荡 */
function fitFx(box){
  if (!box || !box.children.length) return;
  box.style.setProperty('--fxs', 1);
  if (box.scrollWidth - box.clientWidth <= 1 && box.scrollHeight - box.clientHeight <= 1) return;
  let cur = 1;
  for (let k = 0; k < 3; k++){
    const r = Math.max(0.5, Math.min(
      box.clientWidth / Math.max(box.scrollWidth, 1),
      box.clientHeight / Math.max(box.scrollHeight, 1)) - 0.02);
    cur = Math.max(0.5, Math.floor(cur * r * 100) / 100);
    box.style.setProperty('--fxs', cur);
    if (box.scrollWidth - box.clientWidth <= 1 && box.scrollHeight - box.clientHeight <= 1) break;
  }
}
/* v1.2.13：左右牌河（rvE/rvW）高度自适应——按 rowmid2 可用高度算行数，
   页面高 → 行数多（上限 RV_ROWS_MAX），页面矮 → 行数少（下限 RV_ROWS_MIN），
   保证不与上下（南北家）牌河重叠；槽高 17px + 1px gap */
const RV_ROWS_MIN = 10, RV_ROWS_MAX = 17;
/* v1.2.28：牌河容量目标——单家一局最多要摆下的弃牌数（含吃碰后多打的长局），取 30 留裕量。
   容量 = 行数 × 排数：两排装不下（PC 布局高度被压低、行数变少时）就自动加宽到三排。
   三排宽度 = 槽宽 21 × 3 + 列间隙 1 × 2 + 左右边框 2 = 67px */
const RV_NEED = 30;
/* v1.2.32：牌河尺寸常量——与 .river / .rvslot 的 CSS 一一对应，算宽度时直接用，
   保证「容器宽 = 整数张牌 + 整数个间隙 + 内边距 + 边框」，码满一排不留零头空白 */
const RV_GAP = 1;      // .river 的 gap
const RV_PAD = 2;      // 上下牌河 .river 的 padding（左右牌河 .rv 是 1px 0，左右内边距为 0）
const RV_BD = 1;       // .river 的 border
const RV_SLOT_W = 21, RV_SLOT_H = 15;   // 左右牌河槽位 .rvslot
const RV_TILE_W = 16, RV_TILE_H = 22;   // 上下牌河牌 .tile.xs（开局无牌可量时的兜底）
/* 整数张 → 容器外框宽：n 张牌 + (n-1) 个间隙 + 左右内边距 + 左右边框 */
function riverW(n, tileW){
  return n * tileW + (n - 1) * RV_GAP + 2 * RV_PAD + 2 * RV_BD;
}
function fitRivers(){
  const row = document.querySelector('.rowmid2');
  if (!row) return;
  // v1.2.25：行高常量必须与 .rvslot 的槽位高度保持一致（槽位 15px + 1px 间隙 = 16），
  // 否则算出的行数放不下实际槽位，牌河底部会被 overflow 裁掉
  // v1.2.32：行数与容器高度用同一个公式（内容高 = rows×槽高 + (rows-1)×间隙），
  // 容器高 = 内容高 + 上下内边距(1×2) + 上下边框(1×2)（全局 box-sizing:border-box）。
  // 旧写法少算这 4px，导致每行实际少放一张、牌河底部空出约 12px
  const avail = row.clientHeight;
  const rows = Math.max(RV_ROWS_MIN, Math.min(RV_ROWS_MAX, Math.floor((avail - 3) / (RV_SLOT_H + RV_GAP))));
  // v1.2.28：按当前行数（=左右家视角的牌河长度）与槽位尺寸推算两排是否放得下，放不下自动变三排；
  // v1.2.30：三排只在宽屏（PC）启用——手机/窄窗口恒两排（屏幕窄，三排既放不下也不好看）
  const narrow = document.documentElement.clientWidth < 700;
  const cols = (narrow || rows * 2 >= RV_NEED) ? 2 : 3;
  // v1.2.32：左右牌河宽 = 列数 × 槽宽 + 列间隙 + 左右边框（.rv 左右内边距为 0）
  const wpx = cols * RV_SLOT_W + (cols - 1) * RV_GAP + 2 * RV_BD;
  for (const id of ['rvE', 'rvW']){
    const el = $(id);
    if (!el) continue;
    el.style.height = (rows * (RV_SLOT_H + RV_GAP) - RV_GAP + 4) + 'px';   // +4 = 上下 padding 2 + 边框 2
    el.style.width = wpx + 'px';
    el.style.flexBasis = wpx + 'px';
  }
  // v1.2.32：上下牌河（rvN/rvS）宽度 = 每排整数张，不再按「内缘对齐」拉伸出一段空白
  //   每排张数 = min(容量需求 ceil(RV_NEED/行数), 可用宽能放下的最大整数张 nmax)
  //   宽屏：容量需求 15 张 → 宽度锁 260 居中；窄屏：触到 nmax → 取满宽，仍不留零头
  //   （v1.2.30 的「四家围成方形」在宽屏让位于「宽度与牌精确匹配」，居中留白由 margin auto 消化）
  const W = row.clientWidth;
  // 牌尺寸：优先量真实牌（布局像素，不受 --pz/zoom 缩放影响——v1.3.15 实测 zoom 下
  // offsetWidth/clientWidth 仍返回未缩放布局像素，与 transform:scale 同义），开局无牌时用常量兜底
  const probe = document.querySelector('#rvS .tile') || document.querySelector('#rvN .tile');
  const tw = probe ? probe.offsetWidth : RV_TILE_W;
  const th = probe ? probe.offsetHeight : RV_TILE_H;
  for (const id of ['rvN', 'rvS']){
    const el = $(id);
    if (!el) continue;
    const inner = el.clientHeight - 2 * RV_PAD - 2 * RV_BD;
    const lines = Math.max(1, Math.floor((inner + RV_GAP) / (th + RV_GAP)));
    const nmax = Math.max(6, Math.floor((W - 2 * RV_PAD - 2 * RV_BD + RV_GAP) / (tw + RV_GAP)));
    const n = Math.min(Math.ceil(RV_NEED / lines), nmax);
    const rhW = riverW(n, tw);
    el.style.width = rhW + 'px';
    el.style.marginLeft = 'auto';
    el.style.marginRight = 'auto';
  }
}
/* v1.2.14：手牌记录模块窗口级自适应——按 core 可用高度算行数（0~3）并固定高度。
   同一窗口下行数恒定（log 条数多少不挤占，多余行空间留在模块内），
   窗口矮时压缩为 2/1 行、甚至只显示「全部手牌记录」按钮（0 行）
   v1.2.15：core 内固定占用改为动态测量（骰子行 + 桌心圆 + 记录按钮 + 间距/内边距），
   布局改动后无需手工维护估算常数 */
function fitLog(){
  /* v1.2.46：记录区在下段（.coreBot）内按可用高度算行数。三段等分后直接量下段高度即可，
     不再手工估算 core 内「骰子行 + 圆 + 按钮」的固定占用常数（那套常数也随圆居中失效） */
  const bot = document.querySelector('.coreBot');

  const more = document.querySelector('.logmore');

}

// 打出 k.discard 并敲听：单机本地预标已敲；联机标记 autoKnock（服务端下一问自动敲定）
function knockPickResolve(k){
  const p = G.players[0];
  const h = p.hand.slice();
  const idx = h.indexOf(k.discard);
  if (idx >= 0){
    h.splice(idx, 1);
    const ws = aliveWaits(getWaitsHand(h, p.melds), p);   // v1.3.4：听死牌不敲（与 knockCheck 同口径）
    if (ws.length && !NET.active){
      p.knocked = true; p.knockWaits = ws.map(w => w.t); p.noPromptSig = '';
      // v1.2.47j：这条路径（手点「敲听」按钮直接敲定）以前漏发了语音事件，
      // 导致「我自己听牌没喊」——它不进 knockCheck/doKnock，必须在这里补。
      emitSfx('knock', p.idx);
    } else if (ws.length && NET.active){
      NET.autoKnock = true;
    }
  }
  SEL = null; SELIDX = null;
  resolvePend(k.discard);
}
