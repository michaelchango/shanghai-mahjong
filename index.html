/* ========================================================================
   主流程
   ======================================================================== */
function deal(){
  for (const p of G.players) p.pendingFlowers = [];
  for (let k = 0; k < 13; k++)
    for (let i = 0; i < 4; i++) G.players[(G.dealer + i) % 4].hand.push(drawFront());
  G.players[G.dealer].hand.push(drawFront());
  // 起手花不立即补：暂存到 pendingFlowers，轮到本人首次出牌时再补（上海敲麻规则）
  for (const p of G.players){
    let ix;
    while ((ix = p.hand.findIndex(isFlower)) >= 0){
      p.pendingFlowers.push(p.hand.splice(ix, 1)[0]);
    }
  }
  for (const p of G.players) p.hand = sortTiles(p.hand);
}
// 起手补花：轮到本人首次出牌时，先把暂存的起手花统一补完，再出牌
// v1.2.10：补花从牌尾摸上来的牌可能又是花（花牌集中在牌尾），必须循环换到手里无花
async function supplyPendingFlowers(p){
  if (!p.pendingFlowers || !p.pendingFlowers.length) return false;
  let guard = 0;
  while (guard++ < 400){
    let fl = p.pendingFlowers.shift();
    if (fl === undefined){
      const ix = p.hand.findIndex(isFlower);   // 补上来的花同样要补掉
      if (ix < 0) break;
      fl = p.hand.splice(ix, 1)[0];
    }
    p.flowers.push(fl);
    logMsg(p.name + ' 补花 ' + flowerChar(fl));
    const t = drawTail();
    if (t !== null && t !== undefined) p.hand.push(t);
  }
  p.pendingFlowers = [];
  p.hand = sortTiles(p.hand);
  render();
  await waitBot(p);
  if (p.flowers.filter(isSeason).length >= 8){
    await finish({ type: 'bahua', idx: p.idx });
    G.abort = true;
  }
  return true;
}
async function knockCheck(p){
  // v1.2.20：清混碰免敲——没有「敲定」步骤，能胡的牌直接胡（点炮/自摸），不弹敲听
  if (!CFG.lajiHu) return;
  if (p.knocked || p.hand.length % 3 !== 1) return;
  // v1.3.4：听的牌全在台面现完（剩 0 张）= 听死，敲了也胡不了、还会锁死不能吃碰杠 —— 不敲，继续组牌
  const waits = aliveWaits(getWaitsHand(p.hand, p.melds), p);
  if (!waits.length) return;
  if (p.isBot){
    p.knocked = true;
    p.knockWaits = waits.map(w => w.t);
    emitSfx('knock', p.idx);          // v1.2.47b：敲听喊「我听牌了！」
    toast(p.name + ' 敲！', 'gold', p.idx);
    logMsg(p.name + ' 敲了');
    render();
    await sleep(420 / spdOf(p));
    return;
  }
  const sig = waits.map(w => w.t).join(',');
  if (CFG.autoKnock){ doKnock(waits, p.idx); return; }   // v1.2.15：带上座位——联机开「自动敲」时敲对当前玩家，不再错敲座位 0
  if (p.noPromptSig === sig) return;
  const r = await ask('knock', { waits });
  if (G.abort) return;
  if (r === 'knock') doKnock(waits);
  else { p.noPromptSig = sig; logMsg(p.name + ' 选择不敲'); }
}
function doKnock(waits){
  const p = G.players[0];
  p.knocked = true;
  p.knockWaits = waits.map(w => w.t);
  p.noPromptSig = '';
  emitSfx('knock', p.idx);            // v1.2.47b：敲听喊「我听牌了！」
  toast('敲！已锁定听牌', 'gold', 0);
  logMsg('你敲了');
  render();
}
/* v1.2.47 语音/音效出口：客户端 = 直接播放；服务端 headless 覆盖 sfx() → 广播给各家。
   typeof 守卫保证单测 eval（sfx 未定义）与「语音包未接」两种情况都安全。 */
function emitSfx(kind, seat, tile){ if (typeof sfx === 'function') sfx(kind, seat, tile); }
async function discardTurn(p, drawn, kongDraw){
  await supplyPendingFlowers(p);
  if (G.abort) return null;
  // v1.2.40：吃/碰 进的那张，本次出牌不能立刻打出来（大吊车除外）
  // v1.2.47f：数组 —— 同一张 + 与那副露相连的牌都不能打
  const bans = banTilesOf(p);
  // v1.2.12：未敲真人，轮到出牌时手牌可杠（暗杠/加杠）就得问；
  // 摸牌后已问过（p.kongAsked=true）则不重复；选杠 → 返回 {kong}，由 runHand 走补牌
  // v1.2.34（回归 v1.2.12 规则）：一轮只能做一个动作——
  //   既可以碰又可以加杠时，选了碰就只出牌，不再问加杠。
  //   加杠仍只在自己摸牌后问（与 v1.2.12 一致），碰分支不传任何额外参数。
  if (!p.knocked && !p.isBot && !p.kongAsked && !kongDraw){
    const ko = selfKongOptions(p);
    if (ko.length){
      const r = await ask('selfkong', { options: ko, tile: ko[0].tile, source: 'preDiscard' }, p.idx);
      if (G.abort) return null;
      if (r && (r.k === 'ankan' || r.k === 'chakan')){
        await applySelfKong(p, r);
        if (G.finished) return null;      // 抢杠胡已结算
        return { kong: true };
      }
      p.kongAsked = true;                 // 本轮不杠，下一轮（下次摸牌）再问
    }
  }
  let d;
  if (p.knocked){
    // v1.2.41：敲定后「摸到什么打什么」——以刚摸到的那张为准（参数优先，状态兜底），
    // 且必须真的还在手里、也必须是牌不是花。
    // 之前只信参数 drawn：一旦某条路径（补花顺序 / 杠后补牌 / 状态残留）给出的 drawn
    // 不是本手刚摸的那张，就会把手里的一张牌打出去 —— 这里改成先校验再用。
    const want = (drawn !== null && drawn !== undefined) ? drawn : p.drawn;
    if (want !== null && want !== undefined && !isFlower(want) && (p.hand || []).indexOf(want) >= 0) d = want;
    else d = await decideDiscard(p, bans);
    await sleep(560 / spdOf(p));
  } else if (p.isBot){
    // v1.2.18：摸牌后出牌前重估做牌方向——「边打边判断」：碰/吃改变牌型进度后，
    // 该转混一色/清一色/碰碰胡都在这里实时切换，而不是开局定死一路走到黑
    p.target = aiTargetOf(p);
    // v1.3.0：模型往返（约 1~1.6s）与机器人原有的「思考」间隔**并发**，不等串行 ——
    // 否则每手会变成「模型 1.4s + 间隔 0.6s」，三个机器人一起拖整局节奏。
    const pend = decideDiscard(p, bans);
    await waitBot(p);
    d = await pend;
  } else {
    SEL = null; SELIDX = null;
    renderHand();
    // v1.2.48：ban 传「刚吃/碰进的那张」（提示文案要用它），bans 传本次真正禁打的牌（供高亮/AI）
    const eaten = (p.noDiscard != null && p.noDiscard >= 0) ? p.noDiscard : null;
    d = await ask('discard', bans.length ? { ban: (eaten != null ? eaten : bans[0]), bans: bans, banKind: banKindName(p) } : null);
    if (G.abort) return null;          // 中途退出/返回首页：不再打这一张
  }
  // v1.2.40：兜底（老客户端 / 异常路径下仍打了禁牌）→ 改打手里另一张，
  // 保证「吃碰禁打（含相连牌）」在服务端权威执行，不会被绕过
  if (bans.length && bans.indexOf(d) >= 0){
    const alt = (p.hand || []).find(x => bans.indexOf(x) < 0);
    if (alt !== null && alt !== undefined) d = alt;
  }
  // v1.2.41：最后一道保险 —— 无论如何都不能打出一张「手里根本没有的牌」
  if ((p.hand || []).indexOf(d) < 0){
    if (p.hand && p.hand.length) d = p.hand[0];
    else return null;                       // 手里没牌可打（异常），交给上层流局处理
  }
  p.noDiscard = null; p.noDiscardKind = null;   // 出完这张，限制解除
  const i = p.hand.indexOf(d);
  if (i >= 0) p.hand.splice(i, 1);
  p.hand = sortTiles(p.hand);
  p.discards.push(d);
  p.drawn = null;
  p.missHu.clear();
  G.lastDiscard = d; G.lastFrom = p.idx;
  emitSfx('discard', p.idx, d);
  logMsg(p.name + ' 打 ' + tileName(d));
  render();
  await knockCheck(p);
  return d;
}
async function applySelfKong(p, o){
  if (o.k === 'ankan'){
    removeTiles(p.hand, [o.tile, o.tile, o.tile, o.tile]);
    p.melds.push({ type: 'kong', tiles: [o.tile, o.tile, o.tile, o.tile], tile: o.tile, concealed: true, from: -1 });
    emitSfx('gang', p.idx, o.tile);
    logMsg(p.name + ' 暗杠 ' + tileName(o.tile));
  } else {
    // v1.2.12 抢杠：加杠前先查其他家是否和这张牌——有人听则抢杠胡，被抢者（加杠方）付 3 倍
    // v1.2.20：清混碰免敲下改为实时听判断（敲麻仍用敲定锁定的 knockWaits）
    const robbers = [];
    for (let j = 0; j < 4; j++){
      if (j === p.idx) continue;
      const q = G.players[j];
      // v1.2.36：无花果只能自摸 —— 抢杠也算胡别人的牌，同样不给
      if (wuGuoHuaAt(q, o.tile)) continue;
      if (q.knocked && q.knockWaits.includes(o.tile)) robbers.push(j);
      else if (!CFG.lajiHu && !q.knocked && getWaitsHand(q.hand, q.melds).some(w => w.t === o.tile)) robbers.push(j);
    }
    if (robbers.length){
      const wins = [];
      for (const idx of robbers){
        const q = G.players[idx];
        const hc = toCounts(q.hand);
        hc[o.tile]++;
        wins.push({ idx, ev: tryWin(hc, q), tile: o.tile, robKong: true, diaoche: q.melds.length === 4 });
      }
      logMsg(p.name + ' 加杠 ' + tileName(o.tile) + ' 被抢杠！');
      toast('抢杠！', 'big');
      await finish({ type: 'dianpao', wins, from: p.idx });
      return;
    }
    removeTiles(p.hand, [o.tile]);
    // 服务端经网络传输后 o.meld 对象引用会丢失，按 tile 重新定位「碰」的那组副露
    const meld = o.meld || p.melds.find(m => m.type === 'pung' && m.tile === o.tile);
    meld.type = 'kong';
    meld.tiles.push(o.tile);
    emitSfx('gang', p.idx, o.tile);
    logMsg(p.name + ' 加杠 ' + tileName(o.tile));
  }
  p.drawn = null;
  toast(p.name + ' 杠！', 'gold', p.idx);
  render();
  await sleep(420 / spdOf(p));
}
async function collectClaims(tile, from){
  // v1.2.25：首巡别家还握着起手花（起手花在各自首次出牌时才补），上家给的可吃碰杠仍走"先补花再出牌"
  // ——先给 i=1（其 上家 = from）预补花，让判定基于补完花的完整手牌
  // v1.2.26：下家/对家打出可碰牌时改为「先碰再摸，补花延后到抛后摸牌时」
  // ——i=2/i=3 不再预补，吃碰杠判定走"先牌后花"（player 的 discardTurn 仍会 supplyPendingFlowers）
  {
    const pp = G.players[(from + 1) % 4];
    if (pp.pendingFlowers && pp.pendingFlowers.length) await supplyPendingFlowers(pp);
  }
  if (G.abort) return null;   // 补花可能触发八花齐结算
  // 分轮询问：胡 > 杠=碰 > 吃。先问所有能胡的人，没人胡再问杠/碰，没人碰再问下家吃。
  // 第1轮：胡（最高优先）
  const huers = [];
  for (let i = 1; i < 4; i++){
    const idx = (from + i) % 4;
    const p = G.players[idx];
    const opts = claimOptions(p, tile, from, i === 1);
    const huOpt = opts.find(o => o.k === 'hu');
    if (!huOpt) continue;
    const pick = await pickClaim(p, idx, tile, from, [huOpt], i === 1);
    if (pick && pick.k === 'hu') huers.push(idx);
  }
  if (huers.length) return { type: 'hu', players: huers };
  // 对家/上家的杠/碰询问（原第2轮后半段，抽出复用）
  const askRestKP = async () => {
    const kp = [];
    for (let i = 2; i < 4; i++){
      const idx = (from + i) % 4;
      const p = G.players[idx];
      const opts = claimOptions(p, tile, from, false).filter(o => o.k === 'kong' || o.k === 'pung');
      if (!opts.length) continue;
      const pick = await pickClaim(p, idx, tile, from, opts, false);
      if (pick && pick.k !== 'pass') kp.push({ idx, pick });
    }
    if (kp.length){
      const pri = { kong: 3, pung: 2 };
      kp.sort((a, b) => pri[b.pick.k] - pri[a.pick.k]);
      return { type: kp[0].pick.k, idx: kp[0].idx, opt: kp[0].pick };
    }
    return null;
  };
  // v1.2.52：下家（唯一能吃的座位）若杠/碰/吃同时可行（真人），一次性把 杠/碰/吃 全部亮出——
  // 这是同一家人自己的决定，不必拆成「先问碰、过了再问吃」两轮。
  //   选杠/碰 → 与原第2轮一致直接生效（下家本就最先被问，无需再问对家/上家）；
  //   选吃   → 仍先问对家/上家有没有杠/碰（吃优先级低于别家碰杠，被碰则吃作废）；
  //   过     → 杠/碰/吃都不要，继续问对家/上家的杠/碰。
  const ni = (from + 1) % 4;
  const np = G.players[ni];
  const nAll = claimOptions(np, tile, from, true);
  if (!np.isBot && nAll.some(o => o.k === 'kong' || o.k === 'pung') && nAll.some(o => o.k === 'chow')){
    const pick = await pickClaim(np, ni, tile, from, nAll, true);
    if (pick && pick.k === 'chow'){
      return (await askRestKP()) || { type: 'chow', idx: ni, opt: pick };
    }
    if (pick && pick.k !== 'pass') return { type: pick.k, idx: ni, opt: pick };
    return askRestKP();       // 过 = 杠/碰/吃都不要
  }
  // 第2轮：杠 / 碰（同级，一起问；杠优先于碰）
  const kp = [];
  for (let i = 1; i < 4; i++){
    const idx = (from + i) % 4;
    const p = G.players[idx];
    const opts = claimOptions(p, tile, from, i === 1).filter(o => o.k === 'kong' || o.k === 'pung');
    if (!opts.length) continue;
    const pick = await pickClaim(p, idx, tile, from, opts, i === 1);
    if (pick && pick.k !== 'pass') kp.push({ idx, pick });
  }
  if (kp.length){
    const pri = { kong: 3, pung: 2 };
    kp.sort((a, b) => pri[b.pick.k] - pri[a.pick.k]);
    return { type: kp[0].pick.k, idx: kp[0].idx, opt: kp[0].pick };
  }
  // 第3轮：吃（只有下家能吃）
  const nOpts = nAll.filter(o => o.k === 'chow');
  if (nOpts.length){
    const pick = await pickClaim(np, ni, tile, from, nOpts, true);
    if (pick && pick.k === 'chow') return { type: 'chow', idx: ni, opt: pick };
  }
  return null;
}
/* 单次 claim 决策：bot 走 AI；敲定默认有和必和/有杠必杠（可被「自动胡牌=关」改为逐次询问）；真人走 ask 并记漏胡 */
async function pickClaim(p, idx, tile, from, opts, isNext){
  if (p.isBot){
    const pick = await decideClaim(p, tile, from, opts, isNext);
    if (pick) await sleep(160 / spdOf(p));
    return pick;
  }
  const hu = opts.find(o => o.k === 'hu');
  // v1.2.15 「自动胡牌」开：能胡就自动胡（含敲定后的有和必和），不再逐次询问
  if (hu && CFG.autoHu){ render(); return hu; }
  if (p.knocked){
    // v1.2.15 「自动胡牌」关：敲定后点炮不再默认自动胡，出「胡/过」按钮自己决定
    // （敲定者不能吃碰杠，opts 里只可能有 hu；过=漏胡，动牌前不能再胡同一张）
    if (hu){
      render();
      const pick = await ask('claim', { opts: [hu], tile, from }, idx);
      if (!pick || pick.k === 'pass') p.missHu.add(tile);
      return pick || null;
    }
    const pick = opts.find(o => o.k === 'kong') || null;
    if (pick) render();
    return pick;
  }
  render();
  const pick = await ask('claim', { opts, tile, from }, idx);
  if (!pick || pick.k === 'pass'){ if (opts.some(o => o.k === 'hu')) p.missHu.add(tile); }
  return pick;
}

async function runHand(){
  G.running = true;
  G.finished = false; G.reveal = false; G.result = null;
  G.wall = buildWall(); G.wpos = 0; G.wtail = G.wall.length - 1;
  for (const p of G.players){
    p.hand = []; p.flowers = []; p.melds = []; p.discards = [];
    p.knocked = false; p.knockWaits = []; p.menqing = true; p.drawn = null;
    p.missHu = new Set(); p.drawnCount = 0; p.noPromptSig = ''; p.target = null;
    p.settleFan = null; p.settleDi = null;
    p.noDiscard = null; p.noDiscardKind = null;   // v1.2.40：吃/碰禁打同张（每局重置）
  }
  G.lastDiscard = null; G.lastFrom = -1; G.logs = [];

  const d1 = 1 + ((Math.random() * 6) | 0), d2 = 1 + ((Math.random() * 6) | 0);
  G.dice = [d1, d2];
  // 开宝：豹子（两骰同点）或 1·4 点 → 本局得分与封顶 ×2
  if (d1 === d2){ G.kaibao = true; G.kaibaoType = 'baozi'; }
  else if ((d1 === 1 && d2 === 4) || (d1 === 4 && d2 === 1)){ G.kaibao = true; G.kaibaoType = 'yaoSi'; }
  else { G.kaibao = false; G.kaibaoType = null; }
  deal();
  for (const p of G.players) if (p.isBot) p.target = aiTargetOf(p);
  G.turn = G.dealer;
  render();
  const kbTxt = G.kaibao ? (G.kaibaoType === 'baozi' ? ' · 豹子开宝 ×2' : ' · 开宝 1·4 ×2') : '';
  logMsg('骰子 ' + d1 + ' ' + d2 + kbTxt);
  if (G.kaibao) toast(G.kaibaoType === 'baozi' ? '豹子开宝！本局 ×2' : '开宝 1·4！本局 ×2', 'gold');

  // 起手花已暂存到 pendingFlowers，八花齐改在「首次出牌补花」后判定（见 supplyPendingFlowers）
  // 天胡
  const dp = G.players[G.dealer];
  const ev0 = tryWin(toCounts(dp.hand), dp);
  if (ev0){
    await finish({ type: 'zimo', idx: G.dealer, ev: ev0, ctx: { tianhu: true }, tile: dp.hand[dp.hand.length - 1] });
    return;
  }

  let cur = G.dealer;
  let mode = 'first';        // 庄家起手 14 张，先出牌不摸牌
  let incoming = null, from = -1;
  let pendingKong = false;
  let result = null;

  while (!result && G.running){
    if (mode === 'first'){
      const p = G.players[cur];
      G.turn = cur;
      render();
      incoming = await discardTurn(p, null, false);
      if (G.abort) return;
      if (incoming && incoming.kong){ pendingKong = true; mode = 'draw'; continue; }
      from = cur;
      mode = 'claim';
    } else if (mode === 'draw'){
      if (wallLeft() <= 0){ result = { type: 'liuju' }; break; }
      const p = G.players[cur];
      const t = pendingKong ? drawTail() : drawFront();
      if (t === null || t === undefined){ result = { type: 'liuju' }; break; }
      p.drawnCount++;
      if (isFlower(t)){
        p.flowers.push(t);
        logMsg(p.name + ' 补花 ' + flowerChar(t));
        if (p.flowers.filter(isSeason).length >= 8){ result = { type: 'bahua', idx: cur }; break; }
        render();
        await waitBot(p);
        continue;
      }
      p.drawn = t; p.hand.push(t);
      p.kongAsked = false;               // v1.2.12：每轮摸牌重置「可杠已问过」
      G.turn = cur;
      render();
      await waitBot(p);

      const hc = toCounts(p.hand);
      const ev = tryWin(hc, p);
      const dihu = (cur !== G.dealer) && p.drawnCount === 1 && p.menqing;
      // v1.2.20：清混碰免敲——自摸能胡直接给胡（敲麻仍要求已敲定，地胡免敲）
      if (ev && (p.knocked || dihu || !CFG.lajiHu)){
        const zctx = { kongDraw: pendingKong, haidi: wallLeft() === 0, diaoche: p.melds.length === 4, dihu, tianhu: false };
        // 机器人 / 「自动胡牌」开：能胡就自动胡
        if (p.isBot || CFG.autoHu){
          result = { type: 'zimo', idx: cur, ev, tile: t, ctx: zctx };
          break;
        }
        // 真人：摸到能胡的牌不自动胡，显示「胡 / 过」，点了才胡
        const r = await ask('zimo', { ev, tile: t }, cur);
        if (G.abort) return;
        if (r === 'hu'){
          result = { type: 'zimo', idx: cur, ev, tile: t, ctx: zctx };
          break;
        }
        // 点「过」：弃胡，继续出牌
      }
      // 摸牌后暗杠 / 加杠（selfKongOptions 扫描全手牌）
      const ko = selfKongOptions(p);
      if (ko.length){
        if (p.isBot || p.knocked){
          // 机器人 / 敲定后（有杠必杠）：自动杠；抢杠胡则本局已结算
          await applySelfKong(p, ko[0]);
          if (G.finished) return;
          pendingKong = true;
          continue;
        }
        // 真人未敲：显示「暗杠 / 加杠 / 过」
        const r = await ask('selfkong', { options: ko, tile: t, source: 'draw' }, cur);
        if (G.abort) return;
        if (r && (r.k === 'ankan' || r.k === 'chakan')){
          await applySelfKong(p, r);
          if (G.finished) return;          // 抢杠胡已结算
          pendingKong = true;
          continue;
        }
        // 点「过」：本轮不再问（discardTurn 跳过），继续出牌
        p.kongAsked = true;
      }
      const d = await discardTurn(p, t, pendingKong);
      if (G.abort) return;
      if (d && d.kong){ pendingKong = true; continue; }   // v1.2.12：出牌前选择杠 → 补牌
      pendingKong = false;
      incoming = d; from = cur;
      mode = 'claim';
    } else {
      const c = await collectClaims(incoming, from);
      if (G.abort) return;
      if (!c){ cur = (from + 1) % 4; mode = 'draw'; continue; }
      if (c.type === 'hu'){
        const wins = [];
        for (const idx of c.players){
          const p = G.players[idx];
          const hc = toCounts(p.hand);
          hc[incoming]++;
          const ev = tryWin(hc, p);
          wins.push({ idx, ev, tile: incoming, robKong: false, diaoche: p.melds.length === 4 });
        }
        result = { type: 'dianpao', wins, from };
        break;
      }
      const p = G.players[c.idx];
      const tile = incoming;
      // 从弃牌堆取回
      const fp = G.players[from];
      if (fp.discards.length) fp.discards.pop();
      p.menqing = false;
      p.missHu.clear();
      if (c.type === 'pung'){
        removeTiles(p.hand, [tile, tile]);
        p.melds.push({ type: 'pung', tiles: [tile, tile, tile], tile, concealed: false, from });
        emitSfx('peng', p.idx, tile);
        logMsg(p.name + ' 碰 ' + tileName(tile));
        G.turn = p.idx;   // 碰牌后轮到碰的人出牌，罗盘指针同步指向他
        toast(p.name + ' 碰！', 'gold', p.idx);   // 带座位：服务端广播后客户端定位到对应牌河
        render(); await waitBot(p);
        // v1.2.34：一轮一个动作，碰完直接出牌，不再问加杠
        p.kongAsked = true;                     // 本轮已确定动作（碰），出牌前不再问任何杠
        // v1.2.40：碰进哪张，本次出牌就不能打哪张（大吊车除外）
        p.noDiscard = tile; p.noDiscardKind = 'pung';
        incoming = await discardTurn(p, null, false);
        if (G.abort) return;
        if (incoming && incoming.kong){ pendingKong = true; mode = 'draw'; continue; }
        from = p.idx; mode = 'claim';
      } else if (c.type === 'kong'){
        removeTiles(p.hand, [tile, tile, tile]);
        p.melds.push({ type: 'kong', tiles: [tile, tile, tile, tile], tile, concealed: false, from });
        emitSfx('gang', p.idx, tile);
        logMsg(p.name + ' 明杠 ' + tileName(tile));
        G.turn = p.idx;   // 杠后指针指向杠的人
        toast(p.name + ' 杠！', 'gold', p.idx);
        render(); await sleep(420 / spdOf(p));
        cur = p.idx; pendingKong = true; mode = 'draw';
      } else if (c.type === 'chow'){
        removeTiles(p.hand, c.opt.combo);
        const tl = c.opt.combo.concat([tile]).sort((a, b) => a - b);
        p.melds.push({ type: 'chow', tiles: tl, tile, concealed: false, from });
        emitSfx('chow', p.idx, tile);
        logMsg(p.name + ' 吃 ' + tl.map(tileName).join(''));
        G.turn = p.idx;   // 吃牌后轮到吃的人出牌，罗盘指针同步指向他
        toast(p.name + ' 吃！', 'gold', p.idx);
        render(); await waitBot(p);
        // v1.2.40：吃进哪张，本次出牌就不能打哪张（大吊车除外）
        p.noDiscard = tile; p.noDiscardKind = 'chow';
        incoming = await discardTurn(p, null, false);
        if (G.abort) return;
        if (incoming && incoming.kong){ pendingKong = true; mode = 'draw'; continue; }
        from = p.idx; mode = 'claim';
      }
    }
  }
  if (G.abort) return;                 // 被中止的这一局不进结算（否则会冒出「流局」弹窗）
  await finish(result || { type: 'liuju' });
}

/* ========================================================================
   结算
   ======================================================================== */
// v1.2.36：统一算分——勒子牌型（底固定 10 花、番 = 勒子数 + 附加番）；
// 普通牌型（底 = 底设置 + 花数、番 = 兜底番（仅敲麻）+ 牌型番 + 附加番）。
// 开宝 / 荒番仍是外部倍数，只作用于理论分与封顶。
// v1.2.37：无花果 / 大吊车 也改成勒子牌型，勒子数与色牌型**相加**（见 leziTotal）。
// v1.2.38（统一口径）：基础公式 =（底 + 花）×（兜底 + 番 + 附加番）× 额外倍数。
//   牌型有且只有一个（9 种：垃圾胡/碰碰胡/混一色/混碰/七小对 走「番」；清一色/清碰/风一色/风碰 走「勒子」）；
//   附加番可有可无、可多个（无花果/大吊车 记 2 勒（敲麻）/1 勒（清混碰），其余直接加番）。
//   「沾勒子」= 牌型勒子 > 0 或 无花果/大吊车 成立 ⇒ 底一律拉满 LEZI_DI(10)，
//   其余（勒子数 + 附加番）全部加进番乘区 —— 即下面 if(lezi) 分支。
function scoreOf(ev, ctx, p, mult){
  const add = extraFan(p, ctx || {});
  // v1.2.37：勒子总数 = 色牌型勒子 + 无花果勒子 + 大吊车勒子（相加）
  const lz = leziTotal(p, ev);
  const lezi = lz.total;
  let di, fan;
  if (lezi){
    di = LEZI_DI;                       // 勒子自带 10 花（不再叠底设置与花牌）
    fan = lezi;
  } else {
    di = CFG.base + (ev.flowers || 0);
    fan = (CFG.lajiHu ? DUI_FAN : 0) + (ev.base || 0);
  }
  for (const x of add) fan += x[1];
  const raw = di * Math.max(1, fan) * CFG.unit * mult;
  const cap = CFG.lezi * 10 * CFG.unit * mult;
  return { di, fan, add, lezi, leziParts: lz.parts, raw, cap, per: Math.min(raw, cap) };
}
function fanBreakdownHtml(ev, add, sc, extraNote){
  const rows = [];
  if (sc.lezi){
    rows.push('<div class="li"><span class="n">勒子（' + sc.lezi + ' 勒子 = 10 花 × ' + sc.lezi + ' 番）</span><span class="v">' + sc.di + ' 花</span></div>');
    // v1.2.37：逐项列出勒子来源（色牌型 / 无花果 / 大吊车 可相加）
    if (sc.leziParts && sc.leziParts.length){
      for (const x of sc.leziParts) rows.push('<div class="li"><span class="n">' + x[0] + '</span><span class="v">' + x[1] + ' 勒子</span></div>');
    } else {
      rows.push('<div class="li"><span class="n">' + ev.type + '</span><span class="v">' + sc.lezi + ' 番</span></div>');
    }
  } else {
    rows.push('<div class="li"><span class="n">底（底 ' + CFG.base + ' + 花 ' + (sc.di - CFG.base) + '）</span><span class="v">' + sc.di + ' 花</span></div>');
    if (CFG.lajiHu) rows.push('<div class="li"><span class="n">兜底</span><span class="v">+1</span></div>');
    rows.push('<div class="li"><span class="n">' + ev.type + '</span><span class="v">+' + ev.base + ' 番</span></div>');
  }
  for (const x of add) rows.push('<div class="li"><span class="n">' + x[0] + '</span><span class="v">+' + x[1] + '</span></div>');
  rows.push('<div class="li tot"><span class="n">合计</span><span class="v">' + sc.fan + ' 番</span></div>');
  rows.push('<div class="li"><span class="n">' + sc.di + ' × ' + sc.fan + (extraNote ? ' ' + extraNote : '') + '</span><span class="v">' + sc.raw + '</span></div>');
  if (sc.raw > sc.cap) rows.push('<div class="li"><span class="n">超过封顶，按勒子计</span><span class="v">' + capText(sc.cap) + '</span></div>');
  rows.push('<div class="li tot"><span class="n">每家支付</span><span class="v">' + sc.per + ' 分</span></div>');
  return '<div class="fanbreak">' + rows.join('') + '</div>';
}
// 封顶显示：选「不封（99 勒）」时直接写「不封顶」，不显示 990 这类具体数字（容易引起歧义）
function capText(v){ return CFG.lezi >= 99 ? '不封顶' : v; }
// 收口：记录本局结算面板 + 写入历史
function finishHand(html, dealer, rec){
  G.finished = true;
  // v1.2.48：有人胡牌 → 本局结束后亮出其余三家手牌（流局不亮）
  G.reveal = !(rec && rec.kind === '流局');
  G.result = { html, dealer };
  rec.no = G.handNo;
  rec.scores = G.players.map(p => p.score);
  rec.html = html;                 // 历史回看用（不含「下一局」按钮）
  G.history.push(rec);
  renderSeats();
  openSheet(settleHtml(html, dealer));
  renderActs();
}
// 结算面板 + 「下一局」按钮（单机/联机共用，按钮 html 不进历史记录）
function settleHtml(html, dealer){
  // 联机：结算面板按钮为「回到首页 + 准备下一局」（四家都准备后服务端自动开局）
  if (NET.active){
    const readyMe = NET.readySeats.includes(NET.mySeat);
    return html + '<div class="btns"><button onclick="backHome()">回到首页</button>' +
      '<button class="pri" onclick="netReady(' + (readyMe ? 'false' : 'true') + ')">' +
      (readyMe ? '取消准备' : '准备下一局') + '</button></div>';
  }
  return html + '<div class="btns"><button class="pri" onclick="nextHand(' +
    (Number(dealer) || 0) + ')">下一局</button></div>';
}
// 联机：点「准备下一局 / 取消准备」→ 关结算弹窗并上报服务端
function netReady(v){ closeSheet(); netSend({ t:'act', kind:'ready', value: v }); }
// 底部「查看结算」：恢复本局结算面板
function showResult(){
  // 联机：结算面板由服务端下发的 html 恢复
  if (NET.active){
    if (NET.lastSettle) openSheet(settleHtml(NET.lastSettle.html, NET.lastSettle.dealer));
    return;
  }
  if (!G.result) return;
  openSheet(settleHtml(G.result.html, G.result.dealer));
}
// ---------------- 包三口（v1.2.11） ----------------
// 口数：a 从 b 处吃/碰的次数（明杠不算；暗杠 from=-1 天然排除）
function chengbaoKou(a, b){
  let n = 0;
  for (const m of a.melds)
    if (!m.concealed && m.from === b && (m.type === 'chow' || m.type === 'pung')) n++;
  return n;
}
// 与 idx 互为「承包」关系的对家（任一方对另一方吃三口或碰三口）；无则返回 -1
function chengbaoPartner(idx){
  const p = G.players[idx];
  if (!p) return -1;
  for (let j = 0; j < 4; j++){
    if (j === idx) continue;
    // chengbaoKou 的第二个参数是座位号（m.from 存的是座位号）
    if (chengbaoKou(p, j) >= 3 || chengbaoKou(G.players[j], idx) >= 3) return j;
  }
  return -1;
}
async function finish(res){
  G.running = false;
  PEND = null; SEL = null; SELIDX = null;
  for (const p of G.players){ p.settleFan = null; p.settleDi = null; }
  renderActs(); renderHand(); renderSeats();
  await sleep(300);

  const mult = (G.kaibao ? 2 : 1) * Math.pow(2, G.huangfan);
  const extraNote = (G.kaibao ? '×2(' + (G.kaibaoType === 'baozi' ? '豹子' : '开宝1·4') + ')' : '') + (G.huangfan ? '×' + Math.pow(2, G.huangfan) + '(荒番)' : '');

  /* ---- 流局 ---- */
  if (res.type === 'liuju'){
    G.huangfan = Math.min(HUANG_FAN_MAX, G.huangfan + 1);
    logMsg('荒庄流局 · 荒番 ×' + Math.pow(2, G.huangfan));
    const html0 = '<h2><span>流局</span><span class="sp"></span><button class="close" onclick="closeSheet()">×</button></h2>' +
      '<div class="result"><div class="winner">荒庄</div><div class="sub">下一局荒番 ×' +
      Math.pow(2, G.huangfan) + '（封顶同步翻倍）</div></div>' +
      scoreTable([0, 0, 0, 0]);
    finishHand(html0, G.dealer, { kind: '流局', winners: [], note: '荒庄 · 下一局荒番 ×' + Math.pow(2, G.huangfan), delta: [0, 0, 0, 0] });
    // v1.2.25：荒番变化后立即刷新右上角标签与顶部「单份」，否则结算面板遮着时看到的仍是旧倍数
    renderTop();
    return;
  }

  /* ---- 八花齐 ---- */
  if (res.type === 'bahua'){
    const p = G.players[res.idx];
    const ev = { type: '八花齐', base: 4, flowers: calcFlowers(p, null), lezi: 0 };
    const sc = scoreOf(ev, {}, p, mult);
    p.settleFan = sc.fan; p.settleDi = sc.di;
    for (let i = 0; i < 4; i++) if (i !== res.idx){ p.score += sc.per; G.players[i].score -= sc.per; }
    const d = [0, 0, 0, 0];
    for (let i = 0; i < 4; i++) d[i] = i === res.idx ? sc.per * 3 : -sc.per;
    logMsg(p.name + ' 八花齐！');
    toast('八花齐！', 'big');
    const html1 = '<h2><span>结算</span><span class="sp"></span><button class="close" onclick="closeSheet()">×</button></h2>' +
      '<div class="result"><div class="winner">' + p.name + ' 八花齐</div>' +
      '<div class="sub">自摸 · 三家各付 ' + sc.per + ' 分</div></div>' +
      fanBreakdownHtml(ev, sc.add, sc, extraNote) + revealBlock() + scoreTable(d);
    finishHand(html1, res.idx, { kind: '八花齐', winners: [res.idx], note: ev.type + ' · ' + sc.fan + ' 番 · 每家 ' + sc.per + ' 分', delta: d });
    if (G.huangfan) G.huangfan = 0;
    // v1.2.35：荒番一旦被用掉（本局已按倍数结算），下一局整体清零；
    // v1.2.25：立即刷新右上角标签与顶部「单份」（否则下一局开局前一直显示旧倍数）
    renderTop();
    return;
  }

  /* ---- 自摸 ---- */
  if (res.type === 'zimo'){
    const p = G.players[res.idx];
    const sc = scoreOf(res.ev, res.ctx, p, mult);
    p.settleFan = sc.fan; p.settleDi = sc.di;
    // v1.2.11 包三口：胡家与承包对家互为承包 → 承包方替三家付钱并自加 2 份罚金，共付 5 份，另两家免付
    const cb = chengbaoPartner(res.idx);
    const d = [0, 0, 0, 0];
    if (cb >= 0){
      const q = G.players[cb];
      q.score -= sc.per * 5; p.score += sc.per * 5;
      d[cb] = -sc.per * 5; d[res.idx] = sc.per * 5;
    } else {
      for (let i = 0; i < 4; i++){
        if (i === res.idx) { p.score += sc.per * 3; d[i] = sc.per * 3; }
        else { G.players[i].score -= sc.per; d[i] = -sc.per; }
      }
    }
    emitSfx('zimo', p.idx);
    logMsg(p.name + ' 自摸！');
    toast((p.isBot ? p.name + ' 自摸' : '自摸！'), 'big');
    const baoSub = cb >= 0 ? '<div class="sub">包三口 · ' + G.players[cb].name + ' 替三家支付并加罚 2 份，共付 ' + (sc.per * 5) + ' 分</div>' : '';
    const tiles = sortTiles(p.hand);
    const html2 = '<h2><span>结算</span><span class="sp"></span><button class="close" onclick="closeSheet()">×</button></h2>' +
      '<div class="result"><div class="winner">' + p.name + ' 自摸 · ' + res.ev.type + '</div>' +
      (cb >= 0 ? baoSub : '<div class="sub">胡 ' + tileName(res.tile) + ' · 三家各付 ' + sc.per + ' 分</div>') +
      '</div>' +
      tilesRow(tiles, res.tile) + flowersRow(p) + meldsRow(p) +
      fanBreakdownHtml(res.ev, sc.add, sc, extraNote) + revealBlock() + scoreTable(d);
    finishHand(html2, res.idx, { kind: '自摸', winners: [res.idx],
      note: res.ev.type + ' · ' + sc.fan + ' 番' + (cb >= 0 ? ' · 包三口(' + G.players[cb].name + '付5份)' : '') + ' · ' + (cb >= 0 ? '收 ' + sc.per * 5 : '每家 ' + sc.per) + ' 分',
      delta: d });
    if (G.huangfan) G.huangfan = 0;
    // v1.2.35：荒番一旦被用掉（本局已按倍数结算），下一局整体清零；
    // v1.2.25：立即刷新右上角标签与顶部「单份」（否则下一局开局前一直显示旧倍数）
    renderTop();
    return;
  }

  /* ---- 点炮（含一炮多响） ---- */
  const d = [0, 0, 0, 0];
  let blocks = '', winNames = [], winFans = [];
  let firstWinner = res.wins[0].idx;
  // v1.2.11：只有一家胡牌 → 胡牌者坐庄；多家胡牌（一炮多响）→ 点炮者坐庄
  const nextDealer = res.wins.length > 1 ? res.from : res.wins[0].idx;
  for (const w of res.wins){
    const p = G.players[w.idx];
    // v1.2.36：抢杠的 +1 番补上（以前点炮路径漏传 robKong，导致抢杠番从未生效）
    const sc = scoreOf(w.ev, { diaoche: w.diaoche, robKong: !!w.robKong }, p, mult);
    p.settleFan = sc.fan; p.settleDi = sc.di;
    // v1.2.11 包三口：点炮者与胡家互为承包 → 点炮者加罚 2 份，共付 3 份；其他家点炮正常结算
    // v1.2.12 抢杠：被抢者（加杠方）付 3 倍
    const bao = chengbaoPartner(w.idx) === res.from;
    const pay = (bao || w.robKong) ? sc.per * 3 : sc.per;
    p.score += pay; G.players[res.from].score -= pay;
    d[w.idx] += pay; d[res.from] -= pay;
    winNames.push(p.name);
    winFans.push(sc.fan);
    blocks += '<div class="result"><div class="winner">' + p.name + ' 胡 · ' + w.ev.type + '</div>' +
      '<div class="sub">' + G.players[res.from].name + (w.robKong ? ' 加杠被抢 · 付 3 倍 ' + (sc.per * 3) + ' 分' : ' 点炮 ' + tileName(w.tile) +
      (bao ? ' · 包三口，付 3 份 ' + (sc.per * 3) + ' 分' : '，付 ' + sc.per + ' 分')) + '</div></div>' +
      tilesRow(sortTiles(p.hand), w.tile) + flowersRow(p) + meldsRow(p) +
      fanBreakdownHtml(w.ev, sc.add, sc, extraNote);
  }
  emitSfx('hu', firstWinner);
  logMsg(winNames.join('、') + ' 胡 ' + G.players[res.from].name + ' 点炮');
  toast(winNames.length > 1 ? '一炮多响！' : (G.players[firstWinner].isBot ? G.players[firstWinner].name + ' 胡了' : '胡了！'), 'big');
  const note = res.wins.map((w, k) => winNames[k] + ' ' + w.ev.type + ' ' + winFans[k] + '番').join('；');
  finishHand('<h2><span>结算</span><span class="sp"></span><button class="close" onclick="closeSheet()">×</button></h2>' +
    blocks + revealBlock() + scoreTable(d), nextDealer,
    { kind: winNames.length > 1 ? '一炮多响' : '点炮', winners: res.wins.map(w => w.idx), from: res.from, note: note,       delta: d });
  if (G.huangfan) G.huangfan = 0;
  // v1.2.35：荒番一旦被用掉（本局已按倍数结算），下一局整体清零；
  // v1.2.25：立即刷新右上角标签与顶部「单份」（否则下一局开局前一直显示旧倍数）
  renderTop();
}
// v1.2.48：胡牌后亮出四家手牌（结算面板里直接看，不必先关掉弹窗）
function revealBlock(){
  const HD = ['本局四家手牌'];
  let h = '<div class="rlvbox"><div class="rlvhd">' + HD[0] + '</div>';
  for (let i = 0; i < 4; i++){
    const p = G.players[i];
    if (!p) continue;
    h += '<div class="rlvrow"><span class="rlvnm">' + p.name + '</span>' +
      tilesRow(sortTiles(p.hand.slice()), null) + '</div>';
  }
  return h + '</div>';
}
function tilesRow(tiles, winTile){
  return '<div class="tlist">' + tiles.map(t => {
    let extra = '';
    if (t === winTile) extra = ' last';
    return tileHTML(t, 'sm' + extra);
  }).join('') + '</div>';
}
function flowersRow(p){
  if (!p.flowers.length) return '';
  return '<div class="tlist">' + p.flowers.map(t => tileHTML(t, 'sm')).join('') + '</div>';
}
function meldsRow(p){
  if (!p.melds.length) return '';
  let h = '<div class="tlist">';
  for (const m of p.melds) for (const t of m.tiles) h += tileHTML(t, 'sm');
  return h + '</div>';
}
function tileHTML(t, cls){
  const fl = isFlower(t) ? ' fl' : '';
  return '<div class="tile' + fl + ' ' + cls + '">' + faceSVG(t) + '</div>';
}
function scoreTable(deltas){
  let h = '<table class="scoreTbl"><tr><th>玩家</th>';
  for (const p of G.players) h += '<th>' + p.name + '</th>';
  h += '</tr><tr><td>本局</td>';
  for (let i = 0; i < 4; i++){
    const v = deltas[i];
    h += '<td class="' + (v > 0 ? 'pos' : v < 0 ? 'neg' : '') + '">' + (v > 0 ? '+' + v : v) + '</td>';
  }
  h += '</tr><tr><td>累计</td>';
  for (const p of G.players) h += '<td>' + p.score + '</td>';
  return h + '</tr></table>';
}

   历史记录

  const r = (NET.active ? NET.history : G.history)[k];
  if (!r || !r.html) return;
  openSheet(r.html.replace('<h2><span>结算</span>', '<h2><span>第 ' + r.no + ' 局 · 结算</span>')
                  .replace('<h2><span>流局</span>', '<h2><span>第 ' + r.no + ' 局 · 流局</span>') +

}

/* v1.2.45：弹窗统一「头尾固定、中间滚动」。
   约定（所有弹窗都按这套 HTML 写，无需各自处理）：
     头 = <h2>标题 + 关闭叉</h2>，以及紧随其后的 .dimc 提示行（如有）
     尾 = 从**最后一个** .btns 起、直到末尾（按钮后面可能还跟着一句脚注 .dimc，
          例如「历史记录」就是 `…<div class="btns">…</div><p class="dimc">记录按轮累计…</p>`）
     中间其余内容 → 自动包进 .sBody 滚动区
   这样加 .sheetFlex 后：头尾永远可见，只有中间滚，按钮再也不用先滚到底。
   这里做的是 DOM 结构重排，所以 16 个 openSheet 调用点一行都不用改。 */
function sheetLayout(host){
  const kids = Array.prototype.slice.call(host.children);
  if (!kids.length) return;
  const has = (el, cls) => !!(el && el.classList && el.classList.contains(cls));
  // 头：<h2> 本身
  let i = (kids[0] && kids[0].tagName === 'H2') ? 1 : 0;
  // 头：紧随标题的提示行（最多连续两行，避免把正文误当提示）
  let hg = 0;
  while (i + hg < kids.length && hg < 2 && has(kids[i + hg], 'dimc')) hg++;
  i += hg;
  // 尾：最后一个 .btns 起（含其后所有节点）
  let fi = -1;
  for (let k = kids.length - 1; k >= i; k--) if (has(kids[k], 'btns')){ fi = k; break; }
  const end = (fi >= 0) ? fi - 1 : kids.length - 1;
  const body = kids.slice(i, end + 1);
  const box = document.createElement('div');
  box.className = 'sBody';
  if (body.length){
    host.insertBefore(box, body[0]);
    for (const n of body) box.appendChild(n);
  } else {
    host.insertBefore(box, kids[i] || null);   // 无中间内容也占位，保持结构统一
  }
  host.classList.add('sheetFlex');
}
/* v1.3.3：kind 标记当前开的是哪个弹窗（设置面板 = 'set'）。
   刷 AI 实测结果时靠它判断「该不该原地重绘」—— 否则探测一回来，
   会把玩家正在看的规则 / 本局记录弹窗顶成设置面板。 */
let SHEET_KIND = '';
function openSheet(html, kind){
  const host = $('sheet');
  host.className = 'sheet';            // 复位（上一次可能是别的形态）
  host.innerHTML = html;
  sheetLayout(host);
  SHEET_KIND = kind || '';
  $('mask').classList.remove('hide');
}
function closeSheet(){ SHEET_KIND = ''; $('mask').classList.add('hide'); renderActs(); }
/* 弹窗是否开着：显隐状态挂在 #mask 的 .hide 上，不在 #sheet 上（v1.3.3 修） */
function sheetOpen(){ try{ const m = $('mask'); return !!m && !m.classList.contains('hide'); }catch(e){ return false; } }

function nextHand(dealer){

  if (NET.active){

  }

  G.roundNo++;

/* ---------- 机器人 AI 与出牌节奏（v1.3.2：按座位分别设置，本地机器人统一「快」）----------
   三个机器人各自决定「用不用大模型」；没用大模型的按**快**节奏出牌（v1.3.2 起不再让玩家选速度）。
   策略固定为「引擎先按向听/危险度排出候选 → 模型在候选里定夺」——
   算牌交给不会算错的确定性引擎，读牌与取舍才交给模型。
   答案的合法性校验与超时兜底都在引擎里做，所以怎么切都坏不了牌局。

   设置落在哪（两边最终都落到引擎里的 CFG.aiSeats / CFG.spd，引擎按座位读）：
     · 单机：本机 localStorage 'sjm_ai'（下标 = 本地视角座位 1/2/3 = 下家/对家/上家）；
     · 联机：房间规则的一部分（cfg.aiSeats / cfg.spd，下标 = 真实座位号）——
       联机机器人跑在服务端，所以「哪台用 AI」必须由房主写进房间规则、服务端才认。 */
const BOT_SPEED = 1.8;            // 机器人出牌节奏：统一「快」（引擎侧仍按座位读 CFG.spd，只是值恒为它）
let AI_CFG = { seats: [true, true, true, true] };   // 下标 = 座位（0 位是自己，无意义）
let AI_SRV = { checked: false, enabled: false, reason: '', down: false, models: null, probe: null,
               probeErr: '', serverTier: 'off', probing: false, probeAt: 0, limited: false,
               lastTryAt: 0 };
function loadAi(){
  try{
    const s = JSON.parse(localStorage.getItem('sjm_ai') || '{}');
    // 兼容 v1.3.0 及更早的存档（{on:bool} / {tier:'local'|'fast'|'strong'}）：三个座位取同一个值
    // v1.3.2 起速度不再可选，老存档里的 spd 直接忽略（一律走快）
    const all = (typeof s.on === 'boolean') ? s.on : (typeof s.tier === 'string' ? (s.tier !== 'local') : true);
    for (let i = 1; i < 4; i++)
      AI_CFG.seats[i] = (Array.isArray(s.seats) && typeof s.seats[i] === 'boolean') ? s.seats[i] : all;
  }catch(e){}
}
function saveAi(){ try{ localStorage.setItem('sjm_ai', JSON.stringify({ seats: AI_CFG.seats })); }catch(e){} }
/* 本机有几个机器人交给大模型 / 现用规则里还有没有座位要模型出手（都读引擎那份 CFG） */
function aiSeatsCount(){ let n = 0; for (let i = 1; i < 4; i++) if (AI_CFG.seats[i]) n++; return n; }
function aiCfgAnyOn(){
  const a = CFG.aiSeats || [];
  for (let i = 1; i < 4; i++) if (a[i] !== false) return true;
  return false;
}
/* 单机三个机器人的设置 → 写进引擎读的 CFG（联机时 CFG 由房间规则直接给，不走这里） */
function applyAiCfg(){
  if (!Array.isArray(CFG.aiSeats)) CFG.aiSeats = [true, true, true, true];
  if (!Array.isArray(CFG.spd)) CFG.spd = [BOT_SPEED, BOT_SPEED, BOT_SPEED, BOT_SPEED];
  for (let i = 1; i < 4; i++){ CFG.aiSeats[i] = !!AI_CFG.seats[i]; CFG.spd[i] = BOT_SPEED; }
  applyAiTier();
}
/* 档位翻译成引擎注入点：服务端不可用 / 一台机器人都不走大模型 → 干脆不注入（零网络、零开销）。
   「到底哪几个座位用 AI」由引擎按座位判（aiSeatOn），所以这里只要有一台用就注入。 */
function applyAiTier(){
  if (!AI_SRV.enabled || !aiCfgAnyOn()){ setAiBrain(null, 'local'); return; }
  setAiBrain({ ask: aiAskServer }, 'strong');
}
function aiAskServer(payload){
  return fetch('/api/ai/decide', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(r => (r && r.ok) ? r.json() : Promise.reject(new Error('http ' + (r && r.status))));
}
/* AI 连接状态文案：模型名 + 实测耗时 / 失败原因，一句话说清「通没通、多少毫秒」。
   注意 probeBusy() 自带看门狗（探测超时就自动放行），所以这里不会永远停在「正在实测」。
   重测期间若已有上一次的成功结论，也一并带出来，别让毫秒数凭空消失。 */
function aiConnText(){
  if (!AI_SRV.checked) return '正在检查服务端…（首次打开可能要多等几秒）';
  const pr = AI_SRV.probe;
  const last = (pr && pr.ok) ? '（上次 ' + pr.ms + 'ms）' : '';
  if (!AI_SRV.enabled){
    if (AI_SRV.down) return '服务端' + (AI_SRV.reason || '不可达') +
      '，机器人先按本地逻辑出牌' + (AI_RETRY_TIMER ? '（稍后自动重试）' : '');
    return '服务端未配置大模型，已自动回退本地逻辑：' + (AI_SRV.reason || '原因未知');
  }
  const model = (AI_SRV.models && AI_SRV.models.strong) || '大模型';
  if (probeBusy()) return '已连接 ' + model + '　⏳ 正在实测调用…' + last;
  if (!pr) return '已连接 ' + model + (AI_SRV.limited
    ? '　⏳ 测速冷却中，' + (AI_RETRY_TIMER ? '冷却结束自动重测' : '点右上「测试连接」重试')
    : '　（还没实测过，点右上「测试连接」）');
  if (pr.ok) return '已连接 ' + model + '　✅ 实测调用成功 ' + pr.ms + 'ms' + (pr.cached ? '（沿用刚测的结论）' : '');
  return '已连接 ' + model + '　❌ 实测失败：' + String(pr.detail || '未知').slice(0, 60);
}
/* 联机：本桌几台机器人走大模型、几台走本地（机器人的位子 = 空位） */
function aiRoomStat(){
  const R = SETDRAFT || CFG, a = R.aiSeats || [];
  let ai = 0, local = 0;
  for (let r = 1; r < 4; r++){
    const seat = (BOTUI.base + r) % 4;
    if (NET.players && NET.players[seat]) continue;
    if (a[seat] !== false) ai++; else local++;
  }
  return { ai: ai, local: local };
}
/* 面板渲染期的上下文：点开关时靠它判断该写哪份设置（单机写本机存档 / 联机写房间草稿） */
const BOTUI = { inRoom: false, base: 0 };
/* 机器人分组：每台一行「用AI / 不用AI」，紧跟一行跟着这个选择的设置 ——
   用 AI → 显示 AI 连接状态（含实测毫秒）；不用 → 一行本地节奏说明（固定「快」）。
   联机时只列空位（真人坐的位子不是机器人），并按「下家/对家/上家 + 真实座位号」标清是哪一家。 */
function botAiRows(inRoom, ro){

/* 探服务端能力：没部署 / 没配环境变量 → 静默保持本地逻辑。
   force=true 时让服务端真打一次模型（?probe=1）拿「通没通、多少毫秒」。

   v1.3.2 加固（之前会出现「结果不显示、一直停在测试中」）：
     ① 请求带超时（AbortController）—— 服务端冷启动/网关抽风不会把界面吊死；
     ② probing 复位放在链尾的兜底里，任何分支（含 applyAiTier 抛错）都会复位；
     ③ 看门狗 probeBusy()：探测时间超过 PROBE_STUCK_MS 自动放行，界面永远不会卡住；
     ④ 没拿到毫秒就自动重试（最多 3 次）—— 刷新页面撞上服务端 20 秒 probe 冷却时，
        冷却一过自动补一次，玩家不用自己反复点。 */
const PROBE_TIMEOUT_MS = 20000;   // 单次请求超时（Render 免费层冷启动可能要十几秒）
const PROBE_STUCK_MS   = 30000;   // 看门狗：超过它还没结论就当作超时，放行界面
const PROBE_CD_MS      = 22000;   // 服务端 probe 冷却 20 秒，留 2 秒余量再重试
let AI_AUTOTESTED = false;        // 每页自动实测一次
let AI_RETRY_TIMER = null;        // 冷却/超时后的自动重试定时器
let AI_RETRY_N = 0;               // 自动重试预算（最多 3 次，防止刷服务端额度）
/* AI 实测结果回来了 → 玩家若正开着设置面板，就原地重绘（毫秒数当场出现）。
   ⚠️ 两个判断缺一不可：① 弹窗确实开着（看 #mask 的 .hide，不是 #sheet 的 .on）；
   ② 开的确实是设置面板（SHEET_KIND）—— 否则会把玩家的规则 / 记录弹窗顶掉。 */
function refreshSet(){
  try{
    if (typeof document === 'undefined') return;
    if (!sheetOpen() || SHEET_KIND !== 'set') return;
    if (typeof openSet !== 'function') return;
    openSet();
  }catch(e){}
}
/* 是否正在实测。带看门狗：探测卡住太久 → 自动判定超时并放行（否则界面永远停在「测试中」）。
   渲染函数里调用它是有意的 —— 面板每重绘一次，卡死的状态就会被清理掉。 */
function probeBusy(){
  if (!AI_SRV.probing) return false;
  if (AI_SRV.probeAt && Date.now() - AI_SRV.probeAt > PROBE_STUCK_MS){
    AI_SRV.probing = false; AI_SRV.probeAt = 0;
    AI_SRV.probeErr = '响应超时（' + Math.round(PROBE_STUCK_MS / 1000) + ' 秒）';
    return false;
  }
  return true;
}
/* 还没拿到毫秒就隔一会儿再试一次（最多 3 次）—— 把「冷却中被挡回」变成「等一会儿自动出结果」 */
function scheduleProbeRetry(delay){
  if (typeof setTimeout !== 'function') return;
  if (AI_RETRY_TIMER || AI_RETRY_N >= 3) return;
  AI_RETRY_N++;
  AI_RETRY_TIMER = setTimeout(() => {
    AI_RETRY_TIMER = null;
    if (typeof document === 'undefined') return;
    probeAi(true);
  }, delay);
}
/* 定时兜底看门狗：不信赖「某次渲染顺手清理」—— 探测卡到点就自己放行并重绘面板 */
let AI_STUCK_TIMER = null;
function armProbeWatchdog(){
  if (typeof setTimeout !== 'function') return;
  if (AI_STUCK_TIMER){ clearTimeout(AI_STUCK_TIMER); AI_STUCK_TIMER = null; }
  AI_STUCK_TIMER = setTimeout(() => {
    AI_STUCK_TIMER = null;
    if (!AI_SRV.probing) return;
    AI_SRV.probing = false; AI_SRV.probeAt = 0;
    AI_SRV.probeErr = '响应超时（' + Math.round(PROBE_STUCK_MS / 1000) + ' 秒）';
    refreshSet();
  }, PROBE_STUCK_MS);
}
/* 打开设置面板时补测一把（v1.3.3）：还没拿到成功结论、也没在测 → 自动来一次。
   这样「打开设置就能看到多少毫秒」，不必玩家自己点「测试连接」。
   5 秒间隔上限防止每次重绘都发请求；被服务端 20 秒冷却挡回时走自动重试。 */
function maybeAutoTest(){
  try{
    if (typeof document === 'undefined') return;
    if (typeof location === 'undefined') return;
    // 本地文件直接打开（没有服务端）：不必探测，也别把状态改成「不可用」
    if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
    if (!AI_SRV.enabled || !aiCfgAnyOn()) return;
    if (probeBusy()) return;                                   // 正在测，别重复发
    if (AI_SRV.probe && AI_SRV.probe.ok) return;               // 已经有成功结论
    if (AI_SRV.lastTryAt && Date.now() - AI_SRV.lastTryAt < 5000) return;
    AI_RETRY_N = 0;
    probeAi(true);
  }catch(e){}
}
/* 「测试连接」：立刻再实测一次。旧结论保留着（重测时状态行先显示「正在实测调用…（上次 1338ms）」），
   这样万一是被 20 秒冷却挡回，界面上至少还有上一次的真实耗时，而不是空白。 */
function testAi(){
  AI_AUTOTESTED = true;
  AI_RETRY_N = 0;                                    // 玩家手动测 → 重试预算重置
  if (probeBusy()){ openSet(); return; }              // 已经在测了，别重复发请求
  probeAi(true);

}
function probeAi(force){
  if (typeof document === 'undefined') return;      // 服务端引擎（headless）不执行
  if (typeof fetch !== 'function') return;
  if (location.protocol !== 'http:' && location.protocol !== 'https:'){
    AI_SRV.checked = true; AI_SRV.enabled = false; AI_SRV.down = false;
    AI_SRV.reason = '以本地文件打开，没有服务端';
    applyAiTier(); return;
  }
  if (probeBusy()) return;                           // 一次只飞一个探测
  AI_SRV.probing = !!force;
  AI_SRV.probeAt = Date.now();
  AI_SRV.lastTryAt = Date.now();
  AI_SRV.probeErr = '';
  if (force) AI_SRV.limited = false;
  armProbeWatchdog();                                // 定时兜底：卡住也能自己放行 + 重绘
  let ctl = null, timer = null;
  try {
    if (typeof AbortController === 'function'){
      ctl = new AbortController();
      timer = setTimeout(() => { try{ ctl.abort(); }catch(e){} }, PROBE_TIMEOUT_MS);
    }
  }catch(e){ ctl = null; timer = null; }
  const opt = { headers: { Accept: 'application/json' }, cache: 'no-store' };
  if (ctl) opt.signal = ctl.signal;
  fetch('/api/ai/status' + (force ? '?probe=1&t=' : '?t=') + Date.now(), opt)
    .then(r => ((r && r.ok) ? r.json() : null))
    .then(j => {
      if (timer) clearTimeout(timer);
      AI_SRV.checked = true;
      AI_SRV.enabled = !!(j && j.enabled);
      AI_SRV.down = !j;
      AI_SRV.reason = j ? ((j && j.reason) || '') : '返回了无法解析的内容';
      AI_SRV.models = (j && j.models) || null;
      AI_SRV.serverTier = (j && j.serverTier) || 'off';
      if (j && j.probe){
        // probe 被服务端 20 秒冷却挡下不是故障（刷新页面 / 连点「测试连接」都会遇到）：
        // 保留上一次的成功结论；连旧结论都没有时就当作「还没实测」，别让玩家看到一个假的「❌ 实测失败」。
        const limited = /限流/.test(String((j.probe && j.probe.detail) || ''));
        AI_SRV.limited = limited;
        if (!limited) AI_SRV.probe = j.probe;
        else if (!(AI_SRV.probe && AI_SRV.probe.ok)) AI_SRV.probe = null;
      }
    })
    .catch(e => {
      if (timer) clearTimeout(timer);
      const aborted = !!(ctl && ctl.signal && ctl.signal.aborted);
      AI_SRV.checked = true; AI_SRV.enabled = false; AI_SRV.down = true;
      AI_SRV.reason = aborted ? ('响应超时（' + Math.round(PROBE_TIMEOUT_MS / 1000) + ' 秒）') : '不可达';
      AI_SRV.probeErr = AI_SRV.reason;
    })
    .then(() => {
      // 兜底：无论走哪条分支都复位，绝不让界面停在「测试中」
      AI_SRV.probing = false; AI_SRV.probeAt = 0;
      if (AI_STUCK_TIMER){ clearTimeout(AI_STUCK_TIMER); AI_STUCK_TIMER = null; }
      try { applyAiTier(); }catch(e){}
      if (!force && AI_SRV.enabled && aiCfgAnyOn() && !AI_AUTOTESTED){
        // 服务端说可用就自动补一次真调用（每页只做一次）：把「多少毫秒」写进状态行
        AI_AUTOTESTED = true;
        probeAi(true);
      } else if (AI_SRV.enabled && !(AI_SRV.probe && AI_SRV.probe.ok)){
        scheduleProbeRetry(AI_SRV.limited ? PROBE_CD_MS : 5000);
      }
      refreshSet();
    });
}

/* ========================================================================
   多人联机（NET）
   架构：服务器权威。服务端跑规则引擎，客户端只渲染投影 + 上报动作。
   投影（view）经 applyView 座位重映射后直接物化进全局 G：
   「我」永远是本地 seat 0（南），1=下家 2=对家 3=上家 —— 渲染层零改动。
   ======================================================================== */

/* ---------------- v1.2.26 PC 自适应整体放大（客户端专属，不进引擎） ----------------
   按窗口大小算等比放大倍率写入 CSS 变量 --pz：z = min(窗高/680, 窗宽/640, 2)，低于 1 归 1。
   手机端宽高都小于设计基准 → 恒为 1，渲染与旧版完全一致；PC 上整体放大（最大 2 倍）。
   transform 缩放不改变任何布局计算值，fitRivers / fitLog / fitBacks / seatToast 零适配。 */
(function(){
  if (typeof window === 'undefined' || typeof document === 'undefined') return;   // 服务端 / 单测沙箱无 window，直接跳过
  function zf(){
    const w = window.innerWidth, h = window.innerHeight;
    let z = Math.min(h / 680, w / 640, 2);
    z = Math.max(1, Math.round(z * 100) / 100);
    document.documentElement.style.setProperty('--pz', z);
  }
  zf();
  if (typeof window.addEventListener === 'function') window.addEventListener('resize', zf);
})();

/* 吃/碰/杠/敲：提示落在**当事人自己的牌河区域**正中，一眼就知道是谁干的。
   用 fixed 定位而不是塞进 .river 里 —— .river 有 overflow:hidden，宽高又只有 48~52px，
   直接塞进去会被裁掉。改为量出牌河中心点，浮窗贴上去。
   放在 NET 模块（引擎抽取切分点 CUT 之后），保证这是客户端专属代码，不进服务端引擎。 */
const RIVER_OF = ['rvS', 'rvE', 'rvN', 'rvW'];   // 座位 0=南(我) 1=东 2=北 3=西
function seatToast(seat, text){
  const d = document.createElement('div');
  d.className = 'seatTst';
  d.textContent = text;
  document.body.appendChild(d);
  const host = $(RIVER_OF[seat] || RIVER_OF[0]);
  if (host){
    const r = host.getBoundingClientRect();
    d.style.left = Math.round(r.left + r.width / 2 - d.offsetWidth / 2) + 'px';
    d.style.top = Math.round(r.top + r.height / 2 - d.offsetHeight / 2) + 'px';
  } else {
    d.style.left = '50%'; d.style.top = '38%'; d.style.transform = 'translate(-50%,-50%)';
  }
  setTimeout(() => d.remove(), 2000);
}
const NET = {
  active: false,       // 是否处于联机对局
  ws: null,
  mySeat: -1,          // 真实座位（0-3）
  token: '',           // 重连凭证
  roomNo: '',
  isHost: false,
  players: [],         // 房间座位快照（房间等待页用）
  history: [],         // 本桌历史牌局（rec 含结算 html，供回看）
  lastSettle: null,    // 当前局结算 { html, dealer }
  pend: null,          // 待回应的服务端询问 { kind, payload, deadline }
  timer: null,         // 倒计时
  hb: null,            // 心跳
  tableOn: false,      // 牌桌是否已进入
  lastView: null,
  reconnecting: false, // 重连流程进行中
  reconnectTries: 0,   // 重连退避计数
  lastPingAt: 0,       // v1.2.49 最近一次发出心跳的时刻
  hbMiss: 0,           // v1.2.49 连续几次心跳没收到任何服务端消息（看门狗用）
  lastMsgAt: 0,        // 最近一次收到服务端消息的时间（探活用）
  askLeft: 0,          // 服务端下发的决策剩余毫秒（全局倒计时唯一数据源）
  askAt: 0,            // 收到 askLeft 的本地时刻
  autoKnock: false,    // 点「敲听」打牌后置真：服务端再问「敲不敲」时自动确认，免二次点
  kicked: false,       // 本页座位被别处顶替：不再自动重连，避免两个页面互相抢座位
  readySeats: []       // 局间「准备下一局」：已准备的真实座位列表（服务端下发）
};
/* v1.2.49：心跳 + 看门狗。服务端收到 {t:'ping'} 会回 {t:'pong'}，
   任何服务端消息都会刷新 NET.lastMsgAt。连续 2 个心跳周期（约 50s）毫无消息 = 连接已死，
   主动断开重连 —— 否则前台静默断线时玩家会一直盯着一张永不更新的牌桌。 */
function netStartHb(){
  clearInterval(NET.hb);
  NET.lastPingAt = 0; NET.hbMiss = 0;
  NET.hb = setInterval(() => {
    if (NET.lastMsgAt < NET.lastPingAt) NET.hbMiss++; else NET.hbMiss = 0;
    NET.lastPingAt = Date.now();
    netSend({ t:'ping' });
    if (NET.hbMiss >= 2){
      NET.hbMiss = 0;
      try{ if (NET.ws){ NET.ws.onclose = null; NET.ws.onerror = null; NET.ws.close(); } }catch(e){}
      NET.ws = null;
      netTryReconnect();
    }
  }, 25000);
}
function netSend(o){
  try{ if (NET.ws && NET.ws.readyState === 1){ NET.ws.send(JSON.stringify(o)); return true; } }catch(e){}
  return false;
}
function netServerDefault(){
  return (/^https?:$/.test(location.protocol) && location.hostname) ? location.host : '';
}
/* 动作上报前的客户端清理（服务端还会做权威校验） */
function netSanitize(kind, v){
  if (kind === 'discard') return (typeof v === 'number') ? v : null;
  if (kind === 'knock')   return v === 'knock' ? 'knock' : 'pass';
  if (kind === 'next')    return (typeof v === 'number') ? v : 0;
  if (kind === 'zimo')    return v === 'hu' ? 'hu' : 'pass';
  if (kind === 'selfkong'){
    if (v && (v.k === 'ankan' || v.k === 'chakan')) return { k: v.k, tile: v.tile };
    return null;
  }
  if (kind === 'claim'){
    if (!v || v.k === 'pass') return null;
    const o = { k: v.k, tile: v.tile };
    if (v.combo) o.combo = v.combo.slice();
    return o;
  }
  return null;
}
// 统一构造 ws 地址：HTTPS 页面禁止明文 ws（mixed content），自动升级为 wss
function wsUrl(s){
  const t = String(s || '').trim();
  if (/^wss?:\/\//.test(t)) return t;
  return ((location.protocol === 'https:') ? 'wss://' : 'ws://') + t;
}
function netConnect(server, onOk){
  const s = (server || netServerDefault()).trim();
  if (!s){ lobErr('请填写服务器地址（由房主提供，形如 123.45.67.89:8080）'); return; }
  const url = wsUrl(s);
  let opened = false;
  try{ NET.ws = new WebSocket(url); }catch(e){ lobErr('地址无效'); return; }
  NET.ws.onopen = () => { opened = true; lobErr('已连接服务器', true); if (onOk) onOk(); };
  NET.ws.onerror = () => { if (!opened) lobErr('连不上服务器，请检查地址与网络'); };
  NET.ws.onclose = () => {
    clearInterval(NET.hb);
    if (NET.kicked) return;                             // 被别处顶替：不重连
    if (NET.active || NET.tableOn) netTryReconnect();   // 对局中断线：退避重连
    else if (opened) lobErr('连接已断开');
  };
  NET.ws.onmessage = e => {
    let m = null;
    try{ m = JSON.parse(e.data); }catch(err){ return; }
    netHandle(m);
  };
  netStartHb();
}
/* 断线退避重连：v1.2.49 放宽到 20 次≈2 分钟 —— Render 免费层冷启动要约 1 分钟，
   原来 8 次≈35s 经常在服务器活过来前就放弃，玩家只能停在最后渲染的牌桌上（「看到最新状态然后卡住」） */
function netTryReconnect(){
  if (!NET.active && !NET.tableOn) return;   // 已离开对局，不重连
  if (NET.reconnecting) return;              // 已在重连流程
  if (NET.reconnectTries >= 20){
    NET.reconnectTries = 0;
    toast('重连失败，请回到首页后重新进入房间', 'red');
    return;
  }
  NET.reconnectTries++;
  const delay = Math.min(1000 + 500 * NET.reconnectTries, 8000);
  toast('与服务器断开，正在重连(' + NET.reconnectTries + ')…', 'red');
  setTimeout(() => {
    if (!NET.active && !NET.tableOn) return;
    NET.reconnecting = true;
    netReconnect();
  }, delay);
}
/* 立即重连（回前台 / 用户主动操作时） */
function netKickReconnect(){
  if (!NET.active && !NET.tableOn) return;
  if (NET.ws && (NET.ws.readyState === 0 || NET.ws.readyState === 1)) return; // 已在连/已连
  NET.reconnecting = false; NET.reconnectTries = 0;
  netReconnect();
}
function netReconnect(){
  const s = ($('lServer').value || netServerDefault()).trim();
  if (!s || !NET.roomNo){ NET.reconnecting = false; return; }
  const url = wsUrl(s);
  try{ NET.ws = new WebSocket(url); }catch(e){ NET.reconnecting = false; netTryReconnect(); return; }
  NET.ws.onopen = () => {
    netSend({ t:'reconnect', roomNo: NET.roomNo, token: NET.token });
    netStartHb();
  };
  NET.ws.onclose = () => {
    clearInterval(NET.hb);
    // v1.2.15：被别处顶替（kicked）后不再重连，否则会把新页面又挤下去，两边轮流假死
    if (NET.kicked) return;
    // 重连的连接又挂了（含服务端拒绝后 close）：继续退避，除非已被 err 分支终止
    if (NET.active || NET.tableOn){ NET.reconnecting = false; netTryReconnect(); }
  };
  NET.ws.onerror = () => {};
  NET.ws.onmessage = e => { let m = null; try{ m = JSON.parse(e.data); }catch(err){ return; } netHandle(m); };
}
// v1.2.12：结算记录入历史（按局号去重，防断线重连补发双份）
function netPushSettleRec(rec){
  if (!rec) return;
  if (!NET.history.some(r => r.no === rec.no)) NET.history.push(rec);
}

/* v1.2.47b：改用 Web Audio 预解码播放。
   旧法用 HTMLAudioElement：① 首次播放要现解码 -> 第一张牌总缺开头一个字；
   ② 严格串行（前一条播完才播下一条）-> 出牌一快语音就永远追不上。
   现在：预解码成 AudioBuffer 常驻内存 + 最多 2 条并发 + 队列只留最新。 */
const _voBuf = {};        // 'm:5' -> AudioBuffer（解码结果缓存）
const _voPend = {};       // 解码中的 Promise（防重复解码）
let _voWarmed = false;
function voiceBuffer(gender, key){
  const k = gender + ':' + key;
  if (_voBuf[k]) return Promise.resolve(_voBuf[k]);
  if (_voPend[k]) return _voPend[k];
  const b64 = (VOICE_BANK[gender] || {})[key];
  if (!b64) return Promise.resolve(null);
  const ac = audioCtx(); if (!ac) return Promise.resolve(null);
  const bin = atob(b64), n = bin.length, u8 = new Uint8Array(n);
  for (let i = 0; i < n; i++) u8[i] = bin.charCodeAt(i);
  const pr = ac.decodeAudioData(u8.buffer.slice(0))
    .then(buf => { _voBuf[k] = buf; return buf; })
    .catch(() => null);
  _voPend[k] = pr;
  return pr;
}
/* 预热：把两套音色的全部语音解码进内存。AudioContext 未解锁也能解码，
   所以页面一打开就预热，第一条语音也能立刻发声、不缺头。 */
function warmVoice(){
  if (_voWarmed) return; _voWarmed = true;
  const keys = [];
  for (const g of ['m', 'f']) for (const k in (VOICE_BANK[g] || {})) keys.push([g, k]);
  const total = keys.length;
  let i = 0, finished = 0;
  const CONC = 8;                     // v1.2.47c：并行解码（原来串行，开局时常没热完）
  (function step(){
    let n = 0;
    while (i < total && n < CONC){
      const it = keys[i++]; n++;
      voiceBuffer(it[0], it[1]).then(function(){
        finished++;
        if (finished >= total && _ac && _ac.state === 'running') primeAudio();
      }, function(){});
    }
    if (i < total) setTimeout(step, 0);
  })();
}
/* 播放：最多 2 条并发；队列积压时丢最旧的，保证「报的总是当前这张」 */
const _vMaxCon = 2;
let _vq = [], _vplaying = 0;
function _vpush(gender, key, delay){
  _vq.push([gender, key, delay || 0]);
  while (_vq.length > _vMaxCon) _vq.shift();
  _vpump();
}
/* v1.2.47d：「听牌 / 胡 / 自摸」是最该被听见的三个时刻，单独放大音量，
   否则报牌声密集时会把它盖住。放大倍率受峰值限制（不削波）。 */
const VOICE_VOL = { ting: 1.6, hu: 1.6, zimo: 1.6 };
const _voPeak = {};
function voicePeak(k, buf){
  if (_voPeak[k] != null) return _voPeak[k];
  let m = 0;
  try{
    const ch = buf.getChannelData(0);
    for (let i = 0; i < ch.length; i += 4){ const v = Math.abs(ch[i]); if (v > m) m = v; }
  }catch(e){ m = 0; }
  _voPeak[k] = m || 1;
  return _voPeak[k];
}
function _vpump(){
  while (_vplaying < _vMaxCon && _vq.length){
    const it = _vq.shift(), gender = it[0], key = it[1], delay = it[2] || 0;
    _vplaying++;
    let settled = false;
    const done = () => { if (settled) return; settled = true; _vplaying--; _vpump(); };
    voiceBuffer(gender, key).then(buf => {
      if (!buf){ done(); return; }
      const ac = audioCtx(); if (!ac){ done(); return; }
      const fire = () => {
        try{
          const src = ac.createBufferSource(); src.buffer = buf;
          // 音量：普通语音 1.0；听牌/胡/自摸 放大（上限受峰值约束，防止削波失真）
          const want = VOICE_VOL[key] || 1;
          const vol = want > 1 ? Math.max(1, Math.min(want, 0.99 / voicePeak(key, buf))) : want;
          const gn = ac.createGain(); gn.gain.value = vol;
          src.connect(gn); gn.connect(_voiceBus || ac.destination);   // 语音独立音轨
          src.onended = done;
          src.start(ac.currentTime + delay);             // 错开敲击，避免开头被掩蔽
        }catch(e){ done(); }
      };
      // 音频还没解锁时先等 resume 完成，否则第一帧会被设备吞掉
      if (ac.state === 'suspended' && ac.resume) ac.resume().then(fire).catch(fire);
      else fire();
    });
  }
}
/* 敲台声（Web Audio 合成：噪声脉冲 + 带通 + 极快衰减） */
let _ac = null, _clackBus = null, _voiceBus = null;
function audioCtx(){
  try{
    if (!_ac){
      _ac = new (window.AudioContext || window.webkitAudioContext)();
      // v1.2.47c：两条独立音轨 —— 敲台声走 _clackBus、报牌语音走 _voiceBus，
      // 各走各的增益，敲击不再被报牌声「抢」掉。
      _clackBus = _ac.createGain(); _clackBus.gain.value = 1.0; _clackBus.connect(_ac.destination);
      _voiceBus = _ac.createGain(); _voiceBus.gain.value = 1.0; _voiceBus.connect(_ac.destination);
    }
    if (_ac.state === 'suspended' && _ac.resume) _ac.resume();
  }catch(e){ _ac = null; }
  return _ac;
}
/* v1.2.47c：硬件「热身」—— 播放一帧静音。设备首次出声时前几十毫秒会被吞掉，
   这正是「第一张牌开头没说全」的元凶；先空播一下，后面每条语音都完整。 */
function primeAudio(){
  const ac = audioCtx(); if (!ac) return;
  try{
    const b = ac.createBuffer(1, 1, ac.sampleRate);
    const s1 = ac.createBufferSource(); s1.buffer = b;
    s1.connect(_clackBus || ac.destination); s1.start(0);
    const b2 = ac.createBuffer(1, 1, ac.sampleRate);
    const s2 = ac.createBufferSource(); s2.buffer = b2;
    s2.connect(_voiceBus || ac.destination); s2.start(0);
  }catch(e){}
}
function playClack(){
  const ac = audioCtx(); if (!ac || !_clackBus) return;
  const t0 = ac.currentTime + 0.004;
  // ① 高频「啪」：噪声爆发 -> 高通+低通（宽频带比原来的窄带通更「实在」，更接近拍牌）
  const len = Math.max(1, Math.floor(ac.sampleRate * 0.14));
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++){ const e = 1 - i / len; d[i] = (Math.random() * 2 - 1) * e * e; }
  const src = ac.createBufferSource(); src.buffer = buf;
  const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 650;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 6800;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.85, t0);                      // v1.2.47i：再调小（用户反馈仍偏响）
  g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.13);
  src.connect(hp); hp.connect(lp); lp.connect(g); g.connect(_clackBus);
  src.start(t0);
  // ② 低频「咚」两层：拍在桌面上的实体闷响（手机小喇叭也能听出来）
  const thumps = [[215, 95, 0.65, 0.10], [110, 58, 0.55, 0.14]];   // v1.2.47i：低频同步收敛
  for (let k = 0; k < thumps.length; k++){
    const f1 = thumps[k][0], f2 = thumps[k][1], amp = thumps[k][2], dur = thumps[k][3];
    const o = ac.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(f1, t0);
    o.frequency.exponentialRampToValueAtTime(f2, t0 + dur * 0.8);
    const og = ac.createGain();
    og.gain.setValueAtTime(amp, t0);
    og.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(og); og.connect(_clackBus);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
}
/* 座位 → 音色：单机按本机配置；联机按房间广播的 players[].gender（即「他选的」） */
function seatGender(seat){
  if (typeof NET !== 'undefined' && NET.active){
    const pl = NET.players && NET.players[seat];
    const g = pl && pl.gender;
    return (g === 'm' || g === 'f') ? g : null;
  }
  if (seat === 0) return VOICE_CFG.on ? VOICE_CFG.me : null;
  if (!VOICE_CFG.on) return null;
  return VOICE_CFG.bots[(seat - 1) % 3] || null;
}
/* 播放一条声音事件 */
function playSfx(kind, seat, tile){
  if (typeof VOICE_CFG === 'undefined') return;
  if (!(typeof NET !== 'undefined' && NET.active) && !VOICE_CFG.on) return;   // 单机总开关（默认关）
  if (kind === 'discard') playClack();
  const g = seatGender(seat);
  if (!g) return;
  const key = kind === 'discard' ? String(tile)
    : kind === 'chow' ? 'chi' : kind === 'peng' ? 'peng' : kind === 'gang' ? 'gang'
    : kind === 'knock' ? 'ting' : kind === 'hu' ? 'hu' : kind === 'zimo' ? 'zimo' : null;
  if (!key) return;
  // v1.2.47d：听牌是高潮时刻 —— 清掉还没起播的旧报牌，保证它被清楚听见
  if (kind === 'knock' && _vq.length) _vq.length = 0;
  _vpush(g, key, kind === 'discard' ? 0.07 : 0);   // v1.2.47c：出牌先让敲击声落地，语音延后 70ms
}
/* 引擎出口（emitSfx → sfx）：单机直接播；联机时引擎跑在服务端，客户端改走 ws 'sfx' 消息 */
function sfx(kind, seat, tile){ playSfx(kind, seat, tile); }
/* 移动端自动播放策略：首次手势解锁 AudioContext（Node 单测 eval 时无 document，需守卫） */
if (typeof document !== 'undefined'){
  // 首次手势：解锁音频 + 热身硬件通道 + 开始解码全部语音
  document.addEventListener('pointerdown', function(){ audioCtx(); primeAudio(); warmVoice(); }, { once: true, passive: true });
  // 解码本身不需要用户手势，页面稍稳就开始（原来等 900ms，开局时往往还没热完）
  setTimeout(function(){ warmVoice(); primeAudio(); }, 250);
}
/* 联机：把我的音色同步给服务端（进房后 / 改设置时） */
function netVoiceSync(){
  if (typeof NET === 'undefined') return;
  if (NET.ws && NET.ws.readyState === 1) netSend({ t: 'voice', gender: VOICE_CFG.net || 'f' });
}
function netHandle(m){
  NET.lastMsgAt = Date.now();
  switch (m.t){
    case 'welcome':
      NET.mySeat = m.seat; NET.token = m.token; NET.roomNo = m.roomNo; NET.isHost = !!m.isHost;
      // 重连中不清 reconnecting：服务端会紧接着补发 view / settle（见 resumeSeat），
      // 由第一个业务帧清除，确保补发的 settle 走「不自动弹窗、只恢复数据」分支
      if (!NET.tableOn){ NET.reconnecting = false; NET.reconnectTries = 0; }
      netVoiceSync();          // v1.2.47 进房/重连后立刻告知服务端我的音色
      break;
    case 'roomNo':
      NET.roomNo = m.roomNo; $('rNoTxt').textContent = m.roomNo;
      showRoom();                       // 建房/加入成功 → 切到房间等待页
      break;
    case 'room':
      NET.players = m.players;
      // 本桌规则以服务端为准（房主改完会广播给所有人）
      if (m.cfg) Object.assign(CFG, m.cfg), NET.cfg = m.cfg;
      // 房主可能已换人（原房主退出 / 全员退出后重进），以服务端名单为准
      // 服务端 players 是按座位号的数组（空座位为 null），直接索引取自己
      if (NET.mySeat >= 0){
        const me = m.players[NET.mySeat];
        if (me) NET.isHost = !!me.host;
      }
      // 牌局进行中也会收到 room（有人掉线时广播），此时不能打断牌桌
      if (!NET.tableOn) showRoom();
      renderRoom();
      break;
    case 'start':
      NET.tableOn = false; NET.lastSettle = null; NET.history = [];
      netSetClock(0);
      break;
    case 'view':
      NET.lastView = m.view;
      if (!NET.tableOn){ NET.tableOn = true; NET.active = true; $('home').classList.add('hide'); }
      // 重连成功：首个业务帧到达，重连流程结束
      if (NET.reconnecting){ NET.reconnecting = false; NET.reconnectTries = 0; }
      applyView(m.view);
      break;
    case 'ask':
      netAsk(m);
      break;
    case 'settle':
      NET.lastSettle = { html: m.html, dealer: m.dealer };
      // v1.2.12：去重（按局号），防断线重连时服务端补发 settle 造成同一局记录双份
      netPushSettleRec(m.rec);
      stopCd();
      netSetClock(0);
      PEND = null;
      NET.pend = null;
      // 结算帧投影（含亮牌）先落地，再补「下一局」入口
      if (m.view) applyView(m.view);
      G.finished = true;
      G.running = false;
      G.result = { dealer: m.dealer };
      // v1.2.5：断线重连后服务端会补发 settle 以同步 lastSettle，但不需要再次自动弹窗
      if (!NET.reconnecting) openSheet(settleHtml(m.html, m.dealer));
      else { NET.reconnecting = false; NET.reconnectTries = 0; }
      renderActs();
      break;
    case 'sfx':
      // v1.2.47 语音/音效：座位是服务端真实座位，先重映射到本地视角
      playSfx(m.kind, remap(m.seat), m.tile);
      break;
    case 'toast':
      // 带座位（吃/碰/杠/敲）→ 定位到对应牌河；服务端下的是真实座位，先重映射到本地视角
      if (m.seat != null) seatToast(remap(m.seat), m.text);
      else toast(m.text, m.cls);
      break;
    case 'err':
      if (NET.reconnecting){
        // 重连被服务端拒绝（房间解散 / 凭证无效）：停止重试，回首页并说明原因
        NET.reconnecting = false; NET.reconnectTries = 0;
        NET.teardown();
        $('home').classList.remove('hide');
        showHomePick();
        lobErr(m.msg);
        return;
      }
      if (NET.tableOn) toast(m.msg, 'red');
      else lobErr(m.msg);
      break;
    case 'ended':
      NET.tableOn = false; NET.pend = null; stopCd(); netSetClock(0);
      PEND = null; NET.lastSettle = null;
      toast('本局已结束，回到房间等待页', 'gold');
      $('home').classList.remove('hide');
      showRoom();
      break;
    case 'bye':
      NET.teardown();
      $('home').classList.remove('hide');
      showHomePick();
      if (m.msg) lobErr(m.msg);        // 被房主移出 / 房间关闭等原因
      break;
    case 'kicked':
      // v1.2.15：同一个座位在别处被重新进入（另一个页面/设备）。
      // 本页必须彻底退出且不再重连——否则两个页面轮流抢座位，两边都收不全询问，牌桌看着像卡死。
      NET.kicked = true;
      NET.reconnecting = false; NET.reconnectTries = 0;
      NET.teardown();
      $('home').classList.remove('hide');
      showHomePick();
      lobErr(m.msg || '这个座位已在别处进入，本页已退出');
      break;
  }
}
/* 服务端轮到你做决定 */
function netAsk(m){
  NET.pend = { kind: m.kind, payload: m.payload, deadline: m.deadline || 0 };
  // 倒计时以服务端下发的「相对剩余毫秒」为准（不换算绝对时刻，避免各端时钟偏差）
  netSetClock(typeof m.askLeft === 'number' ? m.askLeft : Math.max(0, (m.deadline || 0) - Date.now()));
  SEL = null; SELIDX = null;
  PEND = { kind: m.kind, payload: m.payload, res: null, seat: 0 };  // 伪 PEND：复用 renderActs 的按钮逻辑
  scheduleNetRender();
  startCd();
  // 刚点过「敲听」打牌 → 服务端紧接着问「敲不敲」：直接确认，免掉第二次点击
  if (m.kind === 'knock' && NET.autoKnock){
    NET.autoKnock = false;
    resolvePend('knock');
    return;
  }
  // 其它询问（出牌/吃碰杠）到了，说明上一轮没走「敲听」路径，清掉残留标志
  if (m.kind !== 'knock') NET.autoKnock = false;
}
/* ---------- 全局倒计时（服务端权威，四家同一个数） ----------
   数据源只有一处：服务端下发的剩余毫秒 askLeft + 本地收到时刻。
   中途退出、断线重连都不会单独记一份自己的状态，看到的和大家一致。 */
function netSetClock(left){
  NET.askLeft = Math.max(0, left || 0);
  NET.askAt = Date.now();
}
function netLeftSec(){
  if (!NET.active || !NET.askLeft) return 0;
  const l = NET.askLeft - (Date.now() - NET.askAt);
  return l > 0 ? Math.ceil(l / 1000) : 0;
}
/* 圆心倒计时（v1.2.15）：纯数字、黄色高亮，无其他文字；无决策或单机（机器人局）显示留空。
   数据源唯一：联机 = 服务端下发的剩余毫秒（netLeftSec），四家同一个数。
   v1.2.27：出牌倒计时只在「联机且 ≥2 个真人」的房间由服务端执行；1 真人（单机/带机器人）不限时，
   服务端下发 askLeft=0 → 圆心自然留空，客户端不需要单独的单机倒计时。 */
function renderTurnClock(){
  const el = $('cdTxt');
  if (!el) return;
  const s = NET.active ? netLeftSec() : 0;
  // v1.2.16：没人在决策时直接留空（旧版显示「——」占位，桌心看着多余）
  el.textContent = s > 0 ? String(s) : '';
  el.className = 'cd' + (s > 0 && s <= 3 ? ' warn' : '');
}
function stopCd(){ if (NET.timer){ clearInterval(NET.timer); NET.timer = null; } }
/* 局间「准备下一局」：四家牌河各自盖「准备」字样（谁准备了谁亮，全部可见） */
function renderReady(){
  if (!NET.active) return;
  const settled = G.finished;
  const readySeats = NET.readySeats || [];
  for (let i = 0; i < 4; i++){
    const host = $(RIVER_OF[i]);
    if (!host) continue;
    let badge = host.querySelector('.readyBadge');
    const seat = (i + NET.mySeat + 4) % 4;   // 本地牌河 i → 真实座位
    const show = settled && readySeats.indexOf(seat) >= 0;
    if (show){
      if (!badge){
        badge = document.createElement('div');
        badge.className = 'readyBadge';
        badge.textContent = '准备';
        host.appendChild(badge);
      }
    } else if (badge) badge.remove();
  }
}
function startCd(){
  stopCd();
  if (!NET.active) return;
  NET.timer = setInterval(() => renderTurnClock(), 500);
  renderTurnClock();
}
NET.teardown = function(){
  netSend({ t:'leave' });
  clearInterval(NET.hb); clearInterval(NET.timer);
  // 主动断开前摘掉回调，避免触发 netConnect.onclose 里的「连接已断开」误报
  try{ if (NET.ws){ NET.ws.onclose = null; NET.ws.onerror = null; NET.ws.close(); } }catch(e){}
  NET.ws = null; NET.active = false; NET.tableOn = false;
  NET.mySeat = -1; NET.token = ''; NET.roomNo = ''; NET.isHost = false;
  NET.players = []; NET.lastSettle = null; NET.pend = null; NET.lastView = null;
  NET.reconnecting = false; NET.reconnectTries = 0;
  netSetClock(0);
  loadCfg();          // 退出联机：恢复本机自己存的单机规则（联机时被房间规则覆盖过）
  applyAiCfg();       // 机器人设置同理，也恢复成本机这一份
  stopCd();
};

/* ---------- 投影 → 本地 G（座位重映射） ---------- */
function remap(seat){ return NET.active ? (seat - NET.mySeat + 4) % 4 : seat; }

/* 网络帧合并渲染：把同一帧内到达的多条 view/ask 合并成「每动画帧最多一次」整页渲染。
   原因：服务器常在同一批次先发 view 再发 ask，原逻辑各调一次 render() → 连续两整页重建，
   在整页缩放（v1.3.14 前 #pcz 用 transform:scale，现为 zoom）下等于连续两次整层重栅格化，
   联机时表现为「卡卡」。 */
let _netRaf = 0;
function scheduleNetRender(){
  if (_netRaf) return;
  _netRaf = 1;
  const run = () => { _netRaf = 0; renderLog(); render(); };
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(run);
  else setTimeout(run, 0);
}

function applyView(V){
  if (V.cfg) Object.assign(CFG, V.cfg);   // 本桌规则由服务端下发，客户端只跟着显示
  const t = V.table;
  NET.mySeat = V.mySeat;
  if (V.ready) NET.readySeats = V.ready;  // 局间「准备下一局」状态
  // 倒计时跟着投影一起刷新：不管是不是轮到我，四家看到的是同一个数
  netSetClock(V.askLeft);
  G.running = t.phase === 'playing';
  // 结算后服务端可能补发一帧「空闲投影」（phase=idle、finished=false，来自 finish 早期 render）。
  // 它会把「已结算」短暂降级成「未结算」，导致底部「准备下一局/查看结算」按钮瞬间消失。
  // 真正的新局 phase 一定是 playing，这里只拦截非 playing 的降级。
  const prevFinished = G.finished;
  G.finished = !!t.finished;
  G.reveal = !!t.reveal;                // v1.2.48：本局胡牌后亮牌
  if (!t.finished && t.phase !== 'playing' && prevFinished && NET.lastSettle && NET.tableOn){
    G.finished = true;
  }
  G.result = NET.lastSettle ? { dealer: NET.lastSettle.dealer } : null;
  G.handNo = t.handNo; G.roundNo = t.roundNo !== undefined ? t.roundNo : G.handNo;
  G.huangfan = t.huangfan; G.kaibao = !!t.kaibao; G.kaibaoType = t.kaibaoType;
  G.dice = t.dice;
  G.turn = remap(t.turn); G.dealer = remap(t.dealer);
  G.lastDiscard = t.lastDiscard;
  G.lastFrom = (t.lastFrom < 0) ? -1 : remap(t.lastFrom);
  G.logs = V.logs.slice();
  // 牌墙：只给剩余张数 —— 用 wpos/wtail 还原 wallLeft() 的返回值
  G.wall = []; G.wpos = 0; G.wtail = Math.max(0, t.wallLeft - 1);
  const local = new Array(4);
  for (const pv of V.players) local[remap(pv.seat)] = pv;
  G.players = local.map((pv, li) => ({
    idx: li,
    name: pv.name,
    isBot: !!pv.isBot,
    online: pv.online !== false,
    hand: (pv.hand != null) ? pv.hand.slice() : new Array(pv.handCount).fill(-1),
    flowers: pv.flowers.slice(),
    melds: pv.melds.map(m => ({
      type: m.type, tiles: m.tiles.slice(), tile: m.tile,
      concealed: !!m.concealed, from: (m.from < 0 ? -1 : remap(m.from))
    })),
    discards: pv.discards.slice(),
    knocked: !!pv.knocked,
    // v1.2.15：自己的敲定听牌由服务端随投影下发（此前恒为空 → 联机时顶部「已敲·听」
    // 与底部「听牌中 →」都显示不出听的牌）；别家的听牌不下发（私密信息）
    knockWaits: (pv.knockWaits || []).slice(),
    menqing: !!pv.menqing,
    drawn: (pv.drawn != null) ? pv.drawn : null,
    score: pv.score,
    drawnCount: 0, target: null,
    missHu: new Set(pv.missHu || []),
    noPromptSig: '', tianDi: false,
    settleFan: null, settleDi: null
  }));
  scheduleNetRender();
  // 倒计时要自己走：投影只在局面变化时下发，中间的每一秒靠本地 tick 递减
  if (NET.active && !NET.timer) startCd();
}
/* 牌河下方的三手记录（引擎里由 logMsg 直接画，联机时由投影驱动） */
function renderLog(){
  const box = $('log');
  if (!box) return;
  const L = G.logs || [];
  if (box._n === L.length) return;        // 记录只增不减，长度没变就跳过整段重建
  box._n = L.length;
  box.innerHTML = '';
  for (let i = L.length - 1; i >= Math.max(0, L.length - 3); i--){
    const d = document.createElement('div');
    d.textContent = L[i];
    box.appendChild(d);
  }
}

/* v1.2.4：等待页 = 简易牌桌
   四边按「本地视角」排布：南(下)=我、东(右)=下家、北(上)=对家、西(左)=上家
   与进牌局后的方位完全一致——点哪个空位，就是坐到牌桌的那一侧 */
const POS_OF_REL = ['rSeatS', 'rSeatE', 'rSeatN', 'rSeatW'];   // 视角位 0我 / 1右家 / 2对家 / 3左家
const REL_LABEL = ['我', '右家', '对家', '左家'];
/* v1.2.43：等待页牌桌按**可用高度**自适应。
   手机浏览器有地址栏/工具栏时可用高度常只有 560~640px，而牌桌以外内容约 385~430px。
   固定尺寸的牌桌会把「房间号」和「退出房间」顶出屏幕（#home 是 fixed + overflow:hidden，直接截断，
   必须手动全屏才看得见）。这里从「宽屏上限」开始逐步收窄，直到内容不再溢出。
   极矮屏（<520px）即使收到下限也放不下时，由 #homeRoom 自身的滚动兜底，保证两头都够得着。 */
const ROOM_BOARD_MIN = 150;
function fitRoomBoard(){
  const box = $('homeRoom'), board = $('rBoard');
  if (!box || !board || box.classList.contains('hide')) return;
  const vh = window.innerHeight || 0;
  if (!vh) return;
  let w = Math.min(280, Math.round(window.innerWidth * 0.9));
  board.style.width = w + 'px';
  let guard = 0;
  while (box.scrollHeight > box.clientHeight + 1 && w > ROOM_BOARD_MIN && guard++ < 60){
    w -= 6;
    board.style.width = w + 'px';
  }
}
// 窗口尺寸变化 / 手机横竖屏切换后重算（顶层副作用，Node 单测沙箱里没有 window，必须守卫）
if (typeof window !== 'undefined' && window.addEventListener){
  window.addEventListener('resize', () => { try{ fitRoomBoard(); }catch(e){} });
  window.addEventListener('orientationchange', () => { setTimeout(() => { try{ fitRoomBoard(); }catch(e){} }, 260); });
}
function renderRoom(){
  const box = $('rBoard');
  if (!box) return;
  let waitCnt = 0;
  const seats = NET.players;
  const base = NET.mySeat >= 0 ? NET.mySeat : 0;     // 我的真实座位
  box.querySelectorAll('.rSeatSlot').forEach(el => {
    el.classList.remove('taken', 'me', 'empty', 'readyok');
  });
  for (let r = 0; r < 4; r++){
    const seat = (base + r) % 4;                     // 视角位 → 真实座位号
    const slotEl = box.querySelector('.' + POS_OF_REL[r]);
    if (!slotEl) continue;
    const s = seats[seat];
    const isMe = (r === 0);
    slotEl.classList.remove('taken','me','empty');
    slotEl.onclick = null;
    slotEl.dataset.seat = seat;                      // DOM 上的座位号跟着视角刷新
    if (s){
      let st = '';
      if (s.host) st += '<span class="st host">房主</span>';
      if (!s.online) st += '<span class="st off">掉线</span>';
      else if (s.ready) st += '<span class="st ready">已准备</span>';
      if (!s.host && !s.ready) waitCnt++;            // 统计「除房主外还没准备的人」——含自己（自己没准备也要准备）；房主不需要准备
      slotEl.innerHTML =
        '<div class="rSeatPos">' + REL_LABEL[r] + '</div>' +
        '<div class="rSeatName">' + escName(s.name) + '</div>' +
        '<div class="rSeatTags">' + st + '</div>' +
        (NET.isHost && !isMe ? '<button class="rSeatKick" onclick="event.stopPropagation();netKick(' + seat + ')">移出</button>' : '');
      slotEl.classList.add('taken');
      if (isMe) slotEl.classList.add('me');
      if (s.ready && s.online) slotEl.classList.add('readyok');   // v1.2.41：已准备高亮
    } else {
      slotEl.classList.add('empty');
      // 空位：点击换过去（牌局中 / 已有人 / 自己原位 都会被拦下）
      slotEl.innerHTML = '<div class="rSeatPos">空位</div><div class="rSeatName" style="color:var(--dim2)">点我换过来</div>';
      slotEl.onclick = () => netMoveSeat(seat);
    }
  }
  // 中央圆：方位也按视角走（下方永远是我），顺/逆时针顺序与牌局中的罗盘一致
  const dialWind = { s: base, e: (base + 1) % 4, n: (base + 2) % 4, w: (base + 3) % 4 };
  for (const k in dialWind){
    const el = box.querySelector('.rDw.' + k);
    if (el) el.textContent = SEAT_WIND[dialWind[k]];   // 开局前按「座位 0 = 东」推算
  }
  const st = $('rStatus');
  // v1.2.4：人数提示 bug 修复——房主与非房主走同一套算法，服务端每次广播 room 都重算，
  // 所以任何一个人点/取消准备，四家看到的「X 位真人入座 / Y 位未准备」都会一起变。
  const total = seats.filter(s => s).length;
  if (waitCnt > 0) st.textContent = total + ' 位真人入座，还有 ' + waitCnt + ' 位未准备';
  else if (total >= 2) st.textContent = total + ' 位真人入座，全员就绪！';
  else st.textContent = total + ' 位真人已入座，空位开局时自动补机器人';
  // 房主：不显示准备按钮；其他已加入的真人全部准备后才能开始
  const othersReady = NET.players.every((s, i) => !s || i === NET.mySeat || s.ready);
  // 开始按钮对房主常驻，未就绪时置灰（不隐藏），避免按钮忽有忽无导致页面跳动
  $('rStart').classList.toggle('hide', !NET.isHost);
  $('rStart').disabled = !othersReady;
  $('rClose').classList.toggle('hide', !NET.isHost);
  $('rReady').classList.toggle('hide', !!NET.isHost);   // 房主不需要准备
  // 规则设置：等待页所有人可见（房主可改，非房主查看）；牌局中走右上角设置按钮
  const cfgEl = $('rCfg');
  if (cfgEl){
    cfgEl.classList.toggle('hide', !!NET.tableOn);
    cfgEl.textContent = NET.isHost ? '游戏设置' : '查看设置';
  }
  const me = NET.players[NET.mySeat];
  $('rReady').textContent = (me && me.ready) ? '取消准备' : '准备';
  fitRoomBoard(); requestAnimationFrame(fitRoomBoard);   // v1.2.43：内容填完后按可用高度定牌桌大小（rAF 兜底）
}

   表现为回到页面后牌局卡死、按钮无反应。方案：回前台立即发 ping，
   3 秒内没收到任何服务端消息就强制断开并重连；连接已断则立即重连。 */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (!NET.active && !NET.tableOn) return;
  if (NET.ws && NET.ws.readyState === 1){
    const before = NET.lastMsgAt;
    netSend({ t:'ping' });
    setTimeout(() => {
      if (!NET.active && !NET.tableOn) return;   // 已离开
      if (NET.lastMsgAt > before) return;        // 有回应，连接正常
      try{ if (NET.ws){ NET.ws.onclose = null; NET.ws.onerror = null; NET.ws.close(); } }catch(e){}
      netKickReconnect();
    }, 3000);
    return;
  }
  netKickReconnect();   // 已断 / 正在连
});

/* ========================================================================
   麻了个麻 —— 堆叠消除小游戏（v1.4.1）
   玩法（参考羊了个羊第二关，无热身关）：全屏堆叠麻将牌，只有没被上层
   压住的牌可点；点入底部牌槽（同牌自动靠拢），同牌满 3 自动消除；
   牌槽共 8 格，满且未消除即失败；场上牌全部消除即胜利。
   牌型：万 9 + 筒 9 + 条 9 = 27 种 × 9 张 = 243 张。
   堆叠：底层版式大、逐层收窄（羊了个羊式金字塔），层间恒差半张错落骑放，
   全局占位表保证任何两张牌都不会完全重合。
   道具：移出 / 撤回 / 打乱重排，每局各一次。
   ======================================================================== */
const MLM = { tiles:[], slot:[], pending:[], picks:[], used:{}, lock:false, over:false,
  LU:null, justShuf:false };
const MLM_TOTAL = 243;
const MLM_GRID = 9;            // 场地网格：9×9 个牌位（三层错位模式轮换）
function mlmRi(n){ return Math.floor(Math.random() * n); }
function mlmShuffle(a){
  for (let i = a.length - 1; i > 0; i--){ const j = mlmRi(i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

}
