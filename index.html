      '<span class="v">' + Math.max(0, r.sh) + ' 步</span></div>').join('') + '</div>' +
    '<div class="btns"><button class="pri" onclick="closeSheet()">知道了</button></div>');
}

/* ========================================================================
   主流程
   ======================================================================== */
function deal(){
  for (const p of G.players) p.pendingFlowers = [];
  for (let k = 0; k < 13; k++)
    for (let i = 0; i < 4; i++) G.players[(G.dealer + i) % 4].hand.push(drawFront());
  G.players[G.dealer].hand.push(drawFront());
  // 起手花不立即补：暂存到 pendingFlowers，轮到本人首次出牌时再补（上海敲麻规则）
  for (const p of G.players){
    let ix;
    while ((ix = p.hand.findIndex(isFlower)) >= 0){
      p.pendingFlowers.push(p.hand.splice(ix, 1)[0]);
    }
  }
  for (const p of G.players) p.hand = sortTiles(p.hand);
}
// 起手补花：轮到本人首次出牌时，先把暂存的起手花统一补完，再出牌
// v1.2.10：补花从牌尾摸上来的牌可能又是花（花牌集中在牌尾），必须循环换到手里无花
async function supplyPendingFlowers(p){
  if (!p.pendingFlowers || !p.pendingFlowers.length) return false;
  let guard = 0;
  while (guard++ < 400){
    let fl = p.pendingFlowers.shift();
    if (fl === undefined){
      const ix = p.hand.findIndex(isFlower);   // 补上来的花同样要补掉
      if (ix < 0) break;
      fl = p.hand.splice(ix, 1)[0];
    }
    p.flowers.push(fl);
    logMsg(p.name + ' 补花 ' + flowerChar(fl));
    const t = drawTail();
    if (t !== null && t !== undefined) p.hand.push(t);
  }
  p.pendingFlowers = [];
  p.hand = sortTiles(p.hand);
  render();
  await waitBot();
  if (p.flowers.filter(isSeason).length >= 8){
    await finish({ type: 'bahua', idx: p.idx });
    G.abort = true;
  }
  return true;
}
async function knockCheck(p){
  // v1.2.20：清混碰免敲——没有「敲定」步骤，能胡的牌直接胡（点炮/自摸），不弹敲听
  if (!CFG.lajiHu) return;
  if (p.knocked || p.hand.length % 3 !== 1) return;
  const waits = getWaitsHand(p.hand, p.melds);
  if (!waits.length) return;
  if (p.isBot){
    p.knocked = true;
    p.knockWaits = waits.map(w => w.t);
    toast(p.name + ' 敲！', 'gold', p.idx);
    logMsg(p.name + ' 敲了');
    render();
    await sleep(420 / CFG.speed);
    return;
  }
  const sig = waits.map(w => w.t).join(',');
  if (CFG.autoKnock){ doKnock(waits, p.idx); return; }   // v1.2.15：带上座位——联机开「自动敲」时敲对当前玩家，不再错敲座位 0
  if (p.noPromptSig === sig) return;
  const r = await ask('knock', { waits });
  if (G.abort) return;
  if (r === 'knock') doKnock(waits);
  else { p.noPromptSig = sig; logMsg(p.name + ' 选择不敲'); }
}
function doKnock(waits){
  const p = G.players[0];
  p.knocked = true;
  p.knockWaits = waits.map(w => w.t);
  p.noPromptSig = '';
  toast('敲！已锁定听牌', 'gold', 0);
  logMsg('你敲了');
  render();
}
async function discardTurn(p, drawn, kongDraw){
  await supplyPendingFlowers(p);
  if (G.abort) return null;
  // v1.2.12：未敲真人，轮到出牌时手牌可杠（暗杠/加杠）就得问；
  // 摸牌后已问过（p.kongAsked=true）则不重复；选杠 → 返回 {kong}，由 runHand 走补牌
  if (!p.knocked && !p.isBot && !p.kongAsked && !kongDraw){
    const ko = selfKongOptions(p);
    if (ko.length){
      const r = await ask('selfkong', { options: ko, tile: ko[0].tile, source: 'preDiscard' }, p.idx);
      if (G.abort) return null;
      if (r && (r.k === 'ankan' || r.k === 'chakan')){
        await applySelfKong(p, r);
        if (G.finished) return null;      // 抢杠胡已结算
        return { kong: true };
      }
      p.kongAsked = true;                 // 本轮不杠，下一轮（下次摸牌）再问
    }
  }
  let d;
  if (p.knocked){
    if (drawn !== null && drawn !== undefined) d = drawn;
    else d = aiChooseDiscard(p);
    await sleep(560 / CFG.speed);
  } else if (p.isBot){
    // v1.2.18：摸牌后出牌前重估做牌方向——「边打边判断」：碰/吃改变牌型进度后，
    // 该转混一色/清一色/碰碰胡都在这里实时切换，而不是开局定死一路走到黑
    p.target = aiTargetOf(p);
    d = aiChooseDiscard(p);
    await waitBot();
  } else {
    SEL = null; SELIDX = null;
    renderHand();
    d = await ask('discard');
    if (G.abort) return null;          // 中途退出/返回首页：不再打这一张
  }
  const i = p.hand.indexOf(d);
  if (i >= 0) p.hand.splice(i, 1);
  p.hand = sortTiles(p.hand);
  p.discards.push(d);
  p.drawn = null;
  p.missHu.clear();
  G.lastDiscard = d; G.lastFrom = p.idx;
  logMsg(p.name + ' 打 ' + tileName(d));
  render();
  await knockCheck(p);
  return d;
}
async function applySelfKong(p, o){
  if (o.k === 'ankan'){
    removeTiles(p.hand, [o.tile, o.tile, o.tile, o.tile]);
    p.melds.push({ type: 'kong', tiles: [o.tile, o.tile, o.tile, o.tile], tile: o.tile, concealed: true, from: -1 });
    logMsg(p.name + ' 暗杠 ' + tileName(o.tile));
  } else {
    // v1.2.12 抢杠：加杠前先查其他家是否和这张牌——有人听则抢杠胡，被抢者（加杠方）付 3 倍
    // v1.2.20：清混碰免敲下改为实时听判断（敲麻仍用敲定锁定的 knockWaits）
    const robbers = [];
    for (let j = 0; j < 4; j++){
      if (j === p.idx) continue;
      const q = G.players[j];
      if (q.knocked && q.knockWaits.includes(o.tile)) robbers.push(j);
      else if (!CFG.lajiHu && !q.knocked && getWaitsHand(q.hand, q.melds).some(w => w.t === o.tile)) robbers.push(j);
    }
    if (robbers.length){
      const wins = [];
      for (const idx of robbers){
        const q = G.players[idx];
        const hc = toCounts(q.hand);
        hc[o.tile]++;
        wins.push({ idx, ev: tryWin(hc, q), tile: o.tile, robKong: true, diaoche: q.melds.length === 4 });
      }
      logMsg(p.name + ' 加杠 ' + tileName(o.tile) + ' 被抢杠！');
      toast('抢杠！', 'big');
      await finish({ type: 'dianpao', wins, from: p.idx });
      return;
    }
    removeTiles(p.hand, [o.tile]);
    // 服务端经网络传输后 o.meld 对象引用会丢失，按 tile 重新定位「碰」的那组副露
    const meld = o.meld || p.melds.find(m => m.type === 'pung' && m.tile === o.tile);
    meld.type = 'kong';
    meld.tiles.push(o.tile);
    logMsg(p.name + ' 加杠 ' + tileName(o.tile));
  }
  p.drawn = null;
  toast(p.name + ' 杠！', 'gold', p.idx);
  render();
  await sleep(420 / CFG.speed);
}
async function collectClaims(tile, from){
  // v1.2.25：首巡别家还握着起手花（起手花在各自首次出牌时才补），上家给的可吃碰杠仍走"先补花再出牌"
  // ——先给 i=1（其 上家 = from）预补花，让判定基于补完花的完整手牌
  // v1.2.26：下家/对家打出可碰牌时改为「先碰再摸，补花延后到抛后摸牌时」
  // ——i=2/i=3 不再预补，吃碰杠判定走"先牌后花"（player 的 discardTurn 仍会 supplyPendingFlowers）
  {
    const pp = G.players[(from + 1) % 4];
    if (pp.pendingFlowers && pp.pendingFlowers.length) await supplyPendingFlowers(pp);
  }
  if (G.abort) return null;   // 补花可能触发八花齐结算
  // 分轮询问：胡 > 杠=碰 > 吃。先问所有能胡的人，没人胡再问杠/碰，没人碰再问下家吃。
  // 第1轮：胡（最高优先）
  const huers = [];
  for (let i = 1; i < 4; i++){
    const idx = (from + i) % 4;
    const p = G.players[idx];
    const opts = claimOptions(p, tile, from, i === 1);
    const huOpt = opts.find(o => o.k === 'hu');
    if (!huOpt) continue;
    const pick = await pickClaim(p, idx, tile, from, [huOpt], i === 1);
    if (pick && pick.k === 'hu') huers.push(idx);
  }
  if (huers.length) return { type: 'hu', players: huers };
  // 第2轮：杠 / 碰（同级，一起问；杠优先于碰）
  const kp = [];
  for (let i = 1; i < 4; i++){
    const idx = (from + i) % 4;
    const p = G.players[idx];
    const opts = claimOptions(p, tile, from, i === 1).filter(o => o.k === 'kong' || o.k === 'pung');
    if (!opts.length) continue;
    const pick = await pickClaim(p, idx, tile, from, opts, i === 1);
    if (pick && pick.k !== 'pass') kp.push({ idx, pick });
  }
  if (kp.length){
    const pri = { kong: 3, pung: 2 };
    kp.sort((a, b) => pri[b.pick.k] - pri[a.pick.k]);
    return { type: kp[0].pick.k, idx: kp[0].idx, opt: kp[0].pick };
  }
  // 第3轮：吃（只有下家能吃）
  const ni = (from + 1) % 4;
  const np = G.players[ni];
  const nOpts = claimOptions(np, tile, from, true).filter(o => o.k === 'chow');
  if (nOpts.length){
    const pick = await pickClaim(np, ni, tile, from, nOpts, true);
    if (pick && pick.k === 'chow') return { type: 'chow', idx: ni, opt: pick };
  }
  return null;
}
/* 单次 claim 决策：bot 走 AI；敲定默认有和必和/有杠必杠（可被「自动胡牌=关」改为逐次询问）；真人走 ask 并记漏胡 */
async function pickClaim(p, idx, tile, from, opts, isNext){
  if (p.isBot){
    const pick = aiClaim(p, tile, from, opts, isNext);
    if (pick) await sleep(160 / CFG.speed);
    return pick;
  }
  const hu = opts.find(o => o.k === 'hu');
  // v1.2.15 「自动胡牌」开：能胡就自动胡（含敲定后的有和必和），不再逐次询问
  if (hu && CFG.autoHu){ render(); return hu; }
  if (p.knocked){
    // v1.2.15 「自动胡牌」关：敲定后点炮不再默认自动胡，出「胡/过」按钮自己决定
    // （敲定者不能吃碰杠，opts 里只可能有 hu；过=漏胡，动牌前不能再胡同一张）
    if (hu){
      render();
      const pick = await ask('claim', { opts: [hu], tile, from }, idx);
      if (!pick || pick.k === 'pass') p.missHu.add(tile);
      return pick || null;
    }
    const pick = opts.find(o => o.k === 'kong') || null;
    if (pick) render();
    return pick;
  }
  render();
  const pick = await ask('claim', { opts, tile, from }, idx);
  if (!pick || pick.k === 'pass'){ if (opts.some(o => o.k === 'hu')) p.missHu.add(tile); }
  return pick;
}

async function runHand(){
  G.running = true;
  G.finished = false; G.result = null;
  G.wall = buildWall(); G.wpos = 0; G.wtail = G.wall.length - 1;
  for (const p of G.players){
    p.hand = []; p.flowers = []; p.melds = []; p.discards = [];
    p.knocked = false; p.knockWaits = []; p.menqing = true; p.drawn = null;
    p.missHu = new Set(); p.drawnCount = 0; p.noPromptSig = ''; p.target = null;
    p.settleFan = null; p.settleDi = null;
  }
  G.lastDiscard = null; G.lastFrom = -1; G.logs = [];

  const d1 = 1 + ((Math.random() * 6) | 0), d2 = 1 + ((Math.random() * 6) | 0);
  G.dice = [d1, d2];
  // 开宝：豹子（两骰同点）或 1·4 点 → 本局得分与封顶 ×2
  if (d1 === d2){ G.kaibao = true; G.kaibaoType = 'baozi'; }
  else if ((d1 === 1 && d2 === 4) || (d1 === 4 && d2 === 1)){ G.kaibao = true; G.kaibaoType = 'yaoSi'; }
  else { G.kaibao = false; G.kaibaoType = null; }
  deal();
  for (const p of G.players) if (p.isBot) p.target = aiTargetOf(p);
  G.turn = G.dealer;
  render();
  const kbTxt = G.kaibao ? (G.kaibaoType === 'baozi' ? ' · 豹子开宝 ×2' : ' · 开宝 1·4 ×2') : '';
  logMsg('骰子 ' + d1 + ' ' + d2 + kbTxt);
  if (G.kaibao) toast(G.kaibaoType === 'baozi' ? '豹子开宝！本局 ×2' : '开宝 1·4！本局 ×2', 'gold');

  // 起手花已暂存到 pendingFlowers，八花齐改在「首次出牌补花」后判定（见 supplyPendingFlowers）
  // 天胡
  const dp = G.players[G.dealer];
  const ev0 = tryWin(toCounts(dp.hand), dp);
  if (ev0){
    await finish({ type: 'zimo', idx: G.dealer, ev: ev0, ctx: { tianhu: true }, tile: dp.hand[dp.hand.length - 1] });
    return;
  }

  let cur = G.dealer;
  let mode = 'first';        // 庄家起手 14 张，先出牌不摸牌
  let incoming = null, from = -1;
  let pendingKong = false;
  let result = null;

  while (!result && G.running){
    if (mode === 'first'){
      const p = G.players[cur];
      G.turn = cur;
      render();
      incoming = await discardTurn(p, null, false);
      if (G.abort) return;
      if (incoming && incoming.kong){ pendingKong = true; mode = 'draw'; continue; }
      from = cur;
      mode = 'claim';
    } else if (mode === 'draw'){
      if (wallLeft() <= 0){ result = { type: 'liuju' }; break; }
      const p = G.players[cur];
      const t = pendingKong ? drawTail() : drawFront();
      if (t === null || t === undefined){ result = { type: 'liuju' }; break; }
      p.drawnCount++;
      if (isFlower(t)){
        p.flowers.push(t);
        logMsg(p.name + ' 补花 ' + flowerChar(t));
        if (p.flowers.filter(isSeason).length >= 8){ result = { type: 'bahua', idx: cur }; break; }
        render();
        await waitBot();
        continue;
      }
      p.drawn = t; p.hand.push(t);
      p.kongAsked = false;               // v1.2.12：每轮摸牌重置「可杠已问过」
      G.turn = cur;
      render();
      await waitBot();

      const hc = toCounts(p.hand);
      const ev = tryWin(hc, p);
      const dihu = (cur !== G.dealer) && p.drawnCount === 1 && p.menqing;
      // v1.2.20：清混碰免敲——自摸能胡直接给胡（敲麻仍要求已敲定，地胡免敲）
      if (ev && (p.knocked || dihu || !CFG.lajiHu)){
        const zctx = { kongDraw: pendingKong, haidi: wallLeft() === 0, diaoche: p.melds.length === 4, dihu, tianhu: false };
        // 机器人 / 「自动胡牌」开：能胡就自动胡
        if (p.isBot || CFG.autoHu){
          result = { type: 'zimo', idx: cur, ev, tile: t, ctx: zctx };
          break;
        }
        // 真人：摸到能胡的牌不自动胡，显示「胡 / 过」，点了才胡
        const r = await ask('zimo', { ev, tile: t }, cur);
        if (G.abort) return;
        if (r === 'hu'){
          result = { type: 'zimo', idx: cur, ev, tile: t, ctx: zctx };
          break;
        }
        // 点「过」：弃胡，继续出牌
      }
      // 摸牌后暗杠 / 加杠（selfKongOptions 扫描全手牌）
      const ko = selfKongOptions(p);
      if (ko.length){
        if (p.isBot || p.knocked){
          // 机器人 / 敲定后（有杠必杠）：自动杠；抢杠胡则本局已结算
          await applySelfKong(p, ko[0]);
          if (G.finished) return;
          pendingKong = true;
          continue;
        }
        // 真人未敲：显示「暗杠 / 加杠 / 过」
        const r = await ask('selfkong', { options: ko, tile: t, source: 'draw' }, cur);
        if (G.abort) return;
        if (r && (r.k === 'ankan' || r.k === 'chakan')){
          await applySelfKong(p, r);
          if (G.finished) return;          // 抢杠胡已结算
          pendingKong = true;
          continue;
        }
        // 点「过」：本轮不再问（discardTurn 跳过），继续出牌
        p.kongAsked = true;
      }
      const d = await discardTurn(p, t, pendingKong);
      if (G.abort) return;
      if (d && d.kong){ pendingKong = true; continue; }   // v1.2.12：出牌前选择杠 → 补牌
      pendingKong = false;
      incoming = d; from = cur;
      mode = 'claim';
    } else {
      const c = await collectClaims(incoming, from);
      if (G.abort) return;
      if (!c){ cur = (from + 1) % 4; mode = 'draw'; continue; }
      if (c.type === 'hu'){
        const wins = [];
        for (const idx of c.players){
          const p = G.players[idx];
          const hc = toCounts(p.hand);
          hc[incoming]++;
          const ev = tryWin(hc, p);
          wins.push({ idx, ev, tile: incoming, robKong: false, diaoche: p.melds.length === 4 });
        }
        result = { type: 'dianpao', wins, from };
        break;
      }
      const p = G.players[c.idx];
      const tile = incoming;
      // 从弃牌堆取回
      const fp = G.players[from];
      if (fp.discards.length) fp.discards.pop();
      p.menqing = false;
      p.missHu.clear();
      if (c.type === 'pung'){
        removeTiles(p.hand, [tile, tile]);
        p.melds.push({ type: 'pung', tiles: [tile, tile, tile], tile, concealed: false, from });
        logMsg(p.name + ' 碰 ' + tileName(tile));
        G.turn = p.idx;   // 碰牌后轮到碰的人出牌，罗盘指针同步指向他
        toast(p.name + ' 碰！', 'gold', p.idx);   // 带座位：服务端广播后客户端定位到对应牌河
        render(); await waitBot();
        incoming = await discardTurn(p, null, false);
        if (G.abort) return;
        if (incoming && incoming.kong){ pendingKong = true; mode = 'draw'; continue; }
        from = p.idx; mode = 'claim';
      } else if (c.type === 'kong'){
        removeTiles(p.hand, [tile, tile, tile]);
        p.melds.push({ type: 'kong', tiles: [tile, tile, tile, tile], tile, concealed: false, from });
        logMsg(p.name + ' 明杠 ' + tileName(tile));
        G.turn = p.idx;   // 杠后指针指向杠的人
        toast(p.name + ' 杠！', 'gold', p.idx);
        render(); await sleep(420 / CFG.speed);
        cur = p.idx; pendingKong = true; mode = 'draw';
      } else if (c.type === 'chow'){
        removeTiles(p.hand, c.opt.combo);
        const tl = c.opt.combo.concat([tile]).sort((a, b) => a - b);
        p.melds.push({ type: 'chow', tiles: tl, tile, concealed: false, from });
        logMsg(p.name + ' 吃 ' + tl.map(tileName).join(''));
        G.turn = p.idx;   // 吃牌后轮到吃的人出牌，罗盘指针同步指向他
        toast(p.name + ' 吃！', 'gold', p.idx);
        render(); await waitBot();
        incoming = await discardTurn(p, null, false);
        if (G.abort) return;
        if (incoming && incoming.kong){ pendingKong = true; mode = 'draw'; continue; }
        from = p.idx; mode = 'claim';
      }
    }
  }
  if (G.abort) return;                 // 被中止的这一局不进结算（否则会冒出「流局」弹窗）
  await finish(result || { type: 'liuju' });
}

/* ========================================================================
   结算
   ======================================================================== */
function scoreOf(ev, ctx, p, mult){
  const di = CFG.base + (ev.flowers || 0);
  const fan = ev.total || 0;
  // v1.2.23：线性番——N 番 = 底 × N（不再 2^N）；0 番（垃圾胡）兜底按 ×1
  const raw = di * Math.max(1, fan) * CFG.unit * mult;
  const cap = CFG.lezi * 10 * CFG.unit * mult;
  return { di, fan, raw, cap, per: Math.min(raw, cap) };
}
function fanBreakdownHtml(ev, add, sc, extraNote){
  const rows = [];
  rows.push('<div class="li"><span class="n">底（底 ' + CFG.base + ' + 花 ' + (sc.di - CFG.base) + '）</span><span class="v">' + sc.di + ' 花</span></div>');
  rows.push('<div class="li"><span class="n">' + ev.type + '</span><span class="v">' + ev.base + ' 番</span></div>');
  for (const x of add) rows.push('<div class="li"><span class="n">' + x[0] + '</span><span class="v">+' + x[1] + '</span></div>');
  rows.push('<div class="li tot"><span class="n">合计</span><span class="v">' + sc.fan + ' 番</span></div>');
  rows.push('<div class="li"><span class="n">' + sc.di + ' × ' + Math.max(1, sc.fan) + (extraNote ? ' ' + extraNote : '') + '</span><span class="v">' + sc.raw + '</span></div>');
  if (sc.raw > sc.cap) rows.push('<div class="li"><span class="n">超过封顶，按勒子计</span><span class="v">' + sc.cap + '</span></div>');
  rows.push('<div class="li tot"><span class="n">每家支付</span><span class="v">' + sc.per + ' 分</span></div>');
  return '<div class="fanbreak">' + rows.join('') + '</div>';
}
const WIND_NAME = ['东风', '南风', '西风', '北风'];
// 收口：记录本局结算面板 + 写入历史
function finishHand(html, dealer, rec){
  G.finished = true;
  G.result = { html, dealer };
  rec.no = G.handNo; rec.wind = WIND_NAME[G.roundWind];
  rec.scores = G.players.map(p => p.score);
  rec.html = html;                 // 历史回看用（不含「下一局」按钮）
  G.history.push(rec);
  renderSeats();
  openSheet(settleHtml(html, dealer));
  renderActs();
}
// 结算面板 + 「下一局」按钮（单机/联机共用，按钮 html 不进历史记录）
function settleHtml(html, dealer){
  // 联机：结算面板按钮为「回到首页 + 准备下一局」（四家都准备后服务端自动开局）
  if (NET.active){
    const readyMe = NET.readySeats.includes(NET.mySeat);
    return html + '<div class="btns"><button onclick="backHome()">回到首页</button>' +
      '<button class="pri" onclick="netReady(' + (readyMe ? 'false' : 'true') + ')">' +
      (readyMe ? '取消准备' : '准备下一局') + '</button></div>';
  }
  return html + '<div class="btns"><button class="pri" onclick="nextHand(' +
    (Number(dealer) || 0) + ')">下一局</button></div>';
}
// 联机：点「准备下一局 / 取消准备」→ 关结算弹窗并上报服务端
function netReady(v){ closeSheet(); netSend({ t:'act', kind:'ready', value: v }); }
// 底部「查看结算」：恢复本局结算面板
function showResult(){
  // 联机：结算面板由服务端下发的 html 恢复
  if (NET.active){
    if (NET.lastSettle) openSheet(settleHtml(NET.lastSettle.html, NET.lastSettle.dealer));
    return;
  }
  if (!G.result) return;
  openSheet(settleHtml(G.result.html, G.result.dealer));
}
// ---------------- 包三口（v1.2.11） ----------------
// 口数：a 从 b 处吃/碰的次数（明杠不算；暗杠 from=-1 天然排除）
function chengbaoKou(a, b){
  let n = 0;
  for (const m of a.melds)
    if (!m.concealed && m.from === b && (m.type === 'chow' || m.type === 'pung')) n++;
  return n;
}
// 与 idx 互为「承包」关系的对家（任一方对另一方吃三口或碰三口）；无则返回 -1
function chengbaoPartner(idx){
  const p = G.players[idx];
  if (!p) return -1;
  for (let j = 0; j < 4; j++){
    if (j === idx) continue;
    // chengbaoKou 的第二个参数是座位号（m.from 存的是座位号）
    if (chengbaoKou(p, j) >= 3 || chengbaoKou(G.players[j], idx) >= 3) return j;
  }
  return -1;
}
async function finish(res){
  G.running = false;
  PEND = null; SEL = null; SELIDX = null;
  for (const p of G.players){ p.settleFan = null; p.settleDi = null; }
  renderActs(); renderHand(); renderSeats();
  await sleep(300);

  const mult = (G.kaibao ? 2 : 1) * Math.pow(2, G.huangfan);
  const extraNote = (G.kaibao ? '×2(' + (G.kaibaoType === 'baozi' ? '豹子' : '开宝1·4') + ')' : '') + (G.huangfan ? '×' + Math.pow(2, G.huangfan) + '(荒番)' : '');

  /* ---- 流局 ---- */
  if (res.type === 'liuju'){
    G.huangfan = Math.min(HUANG_FAN_MAX, G.huangfan + 1);
    logMsg('荒庄流局 · 荒番 ×' + Math.pow(2, G.huangfan));
    const html0 = '<h2><span>流局</span><span class="sp"></span><button class="close" onclick="closeSheet()">×</button></h2>' +
      '<div class="result"><div class="winner">荒庄</div><div class="sub">下一局荒番 ×' +
      Math.pow(2, G.huangfan) + '（封顶同步翻倍）</div></div>' +
      scoreTable([0, 0, 0, 0]);
    finishHand(html0, G.dealer, { kind: '流局', winners: [], note: '荒庄 · 下一局荒番 ×' + Math.pow(2, G.huangfan), delta: [0, 0, 0, 0] });
    // v1.2.25：荒番变化后立即刷新右上角标签与顶部「单份」，否则结算面板遮着时看到的仍是旧倍数
    renderTop();
    return;
  }

  /* ---- 八花齐 ---- */
  if (res.type === 'bahua'){
    const p = G.players[res.idx];
    const ev = { type: '八花齐', base: 4, flowers: calcFlowers(p, null) };
    const add = extraFan(p, {});
    ev.total = ev.base + add.reduce((s, x) => s + x[1], 0);
    const sc = scoreOf(ev, {}, p, mult);
    p.settleFan = ev.total; p.settleDi = sc.di;
    for (let i = 0; i < 4; i++) if (i !== res.idx){ p.score += sc.per; G.players[i].score -= sc.per; }
    const d = [0, 0, 0, 0];
    for (let i = 0; i < 4; i++) d[i] = i === res.idx ? sc.per * 3 : -sc.per;
    logMsg(p.name + ' 八花齐！');
    toast('八花齐！', 'big');
    const html1 = '<h2><span>结算</span><span class="sp"></span><button class="close" onclick="closeSheet()">×</button></h2>' +
      '<div class="result"><div class="winner">' + p.name + ' 八花齐</div>' +
      '<div class="sub">自摸 · 三家各付 ' + sc.per + ' 分</div></div>' +
      fanBreakdownHtml(ev, add, sc, extraNote) + scoreTable(d);
    finishHand(html1, res.idx, { kind: '八花齐', winners: [res.idx], note: ev.type + ' · ' + ev.total + ' 番 · 每家 ' + sc.per + ' 分', delta: d });
    if (G.huangfan) G.huangfan--;
    // v1.2.25：荒番递减后立即刷新右上角标签与顶部「单份」（否则下一局开局前一直显示旧倍数）
    renderTop();
    return;
  }

  /* ---- 自摸 ---- */
  if (res.type === 'zimo'){
    const p = G.players[res.idx];
    const add = extraFan(p, res.ctx || {});
    res.ev.total = res.ev.base + add.reduce((s, x) => s + x[1], 0);
    const sc = scoreOf(res.ev, res.ctx, p, mult);
    p.settleFan = res.ev.total; p.settleDi = sc.di;
    // v1.2.11 包三口：胡家与承包对家互为承包 → 承包方替三家付钱并自加 2 份罚金，共付 5 份，另两家免付
    const cb = chengbaoPartner(res.idx);
    const d = [0, 0, 0, 0];
    if (cb >= 0){
      const q = G.players[cb];
      q.score -= sc.per * 5; p.score += sc.per * 5;
      d[cb] = -sc.per * 5; d[res.idx] = sc.per * 5;
    } else {
      for (let i = 0; i < 4; i++){
        if (i === res.idx) { p.score += sc.per * 3; d[i] = sc.per * 3; }
        else { G.players[i].score -= sc.per; d[i] = -sc.per; }
      }
    }
    logMsg(p.name + ' 自摸！');
    toast((p.isBot ? p.name + ' 自摸' : '自摸！'), 'big');
    const baoSub = cb >= 0 ? '<div class="sub">包三口 · ' + G.players[cb].name + ' 替三家支付并加罚 2 份，共付 ' + (sc.per * 5) + ' 分</div>' : '';
    const tiles = sortTiles(p.hand);
    const html2 = '<h2><span>结算</span><span class="sp"></span><button class="close" onclick="closeSheet()">×</button></h2>' +
      '<div class="result"><div class="winner">' + p.name + ' 自摸 · ' + res.ev.type + '</div>' +
      (cb >= 0 ? baoSub : '<div class="sub">胡 ' + tileName(res.tile) + ' · 三家各付 ' + sc.per + ' 分</div>') +
      '</div>' +
      tilesRow(tiles, res.tile) + flowersRow(p) + meldsRow(p) +
      fanBreakdownHtml(res.ev, add, sc, extraNote) + scoreTable(d);
    finishHand(html2, res.idx, { kind: '自摸', winners: [res.idx],
      note: res.ev.type + ' · ' + res.ev.total + ' 番' + (cb >= 0 ? ' · 包三口(' + G.players[cb].name + '付5份)' : '') + ' · ' + (cb >= 0 ? '收 ' + sc.per * 5 : '每家 ' + sc.per) + ' 分',
      delta: d });
    if (G.huangfan) G.huangfan--;
    // v1.2.25：荒番递减后立即刷新右上角标签与顶部「单份」（否则下一局开局前一直显示旧倍数）
    renderTop();
    return;
  }

  /* ---- 点炮（含一炮多响） ---- */
  const d = [0, 0, 0, 0];
  let blocks = '', winNames = [];
  let firstWinner = res.wins[0].idx;
  // v1.2.11：只有一家胡牌 → 胡牌者坐庄；多家胡牌（一炮多响）→ 点炮者坐庄
  const nextDealer = res.wins.length > 1 ? res.from : res.wins[0].idx;
  for (const w of res.wins){
    const p = G.players[w.idx];
    const add = extraFan(p, { diaoche: w.diaoche });
    w.ev.total = w.ev.base + add.reduce((s, x) => s + x[1], 0);
    const sc = scoreOf(w.ev, {}, p, mult);
    p.settleFan = w.ev.total; p.settleDi = sc.di;
    // v1.2.11 包三口：点炮者与胡家互为承包 → 点炮者加罚 2 份，共付 3 份；其他家点炮正常结算
    // v1.2.12 抢杠：被抢者（加杠方）付 3 倍
    const bao = chengbaoPartner(w.idx) === res.from;
    const pay = (bao || w.robKong) ? sc.per * 3 : sc.per;
    p.score += pay; G.players[res.from].score -= pay;
    d[w.idx] += pay; d[res.from] -= pay;
    winNames.push(p.name);
    blocks += '<div class="result"><div class="winner">' + p.name + ' 胡 · ' + w.ev.type + '</div>' +
      '<div class="sub">' + G.players[res.from].name + (w.robKong ? ' 加杠被抢 · 付 3 倍 ' + (sc.per * 3) + ' 分' : ' 点炮 ' + tileName(w.tile) +
      (bao ? ' · 包三口，付 3 份 ' + (sc.per * 3) + ' 分' : '，付 ' + sc.per + ' 分')) + '</div></div>' +
      tilesRow(sortTiles(p.hand), w.tile) + flowersRow(p) + meldsRow(p) +
      fanBreakdownHtml(w.ev, add, sc, extraNote);
  }
  logMsg(winNames.join('、') + ' 胡 ' + G.players[res.from].name + ' 点炮');
  toast(winNames.length > 1 ? '一炮多响！' : (G.players[firstWinner].isBot ? G.players[firstWinner].name + ' 胡了' : '胡了！'), 'big');
  const note = winNames.map((n, k) => n + ' ' + res.wins[k].ev.type + ' ' + res.wins[k].ev.total + '番').join('；');
  finishHand('<h2><span>结算</span><span class="sp"></span><button class="close" onclick="closeSheet()">×</button></h2>' +
    blocks + scoreTable(d), nextDealer,
    { kind: winNames.length > 1 ? '一炮多响' : '点炮', winners: res.wins.map(w => w.idx), from: res.from, note: note,       delta: d });
  if (G.huangfan) G.huangfan--;
  // v1.2.25：荒番递减后立即刷新右上角标签与顶部「单份」（否则下一局开局前一直显示旧倍数）
  renderTop();
}
function tilesRow(tiles, winTile){
  return '<div class="tlist">' + tiles.map(t => {
    let extra = '';
    if (t === winTile) extra = ' last';
    return tileHTML(t, 'sm' + extra);
  }).join('') + '</div>';
}
function flowersRow(p){
  if (!p.flowers.length) return '';
  return '<div class="tlist">' + p.flowers.map(t => tileHTML(t, 'sm')).join('') + '</div>';
}
function meldsRow(p){
  if (!p.melds.length) return '';
  let h = '<div class="tlist">';
  for (const m of p.melds) for (const t of m.tiles) h += tileHTML(t, 'sm');
  return h + '</div>';
}
function tileHTML(t, cls){
  const fl = isFlower(t) ? ' fl' : '';
  return '<div class="tile' + fl + ' ' + cls + '">' + faceSVG(t) + '</div>';
}
function scoreTable(deltas){
  let h = '<table class="scoreTbl"><tr><th>玩家</th>';
  for (const p of G.players) h += '<th>' + p.name + '</th>';
  h += '</tr><tr><td>本局</td>';
  for (let i = 0; i < 4; i++){
    const v = deltas[i];
    h += '<td class="' + (v > 0 ? 'pos' : v < 0 ? 'neg' : '') + '">' + (v > 0 ? '+' + v : v) + '</td>';
  }
  h += '</tr><tr><td>累计</td>';
  for (const p of G.players) h += '<td>' + p.score + '</td>';
  return h + '</tr></table>';
}

/* ========================================================================
   历史记录
   ======================================================================== */
function viewHist(k){
  const r = (NET.active ? NET.history : G.history)[k];
  if (!r || !r.html) return;
  openSheet(r.html.replace('<h2><span>结算</span>', '<h2><span>' + r.wind + ' 第 ' + r.no + ' 局 · 结算</span>')
                  .replace('<h2><span>流局</span>', '<h2><span>' + r.wind + ' 第 ' + r.no + ' 局 · 流局</span>') +
    '<div class="btns"><button onclick="openHistory()">返回记录</button></div>');
}
function openHistory(){
  // 联机：历史来自服务端结算广播；单机：本地 G.history
  const H = NET.active ? NET.history : G.history;
  const mySeat = NET.active ? NET.mySeat : 0;
  let body = '';
  if (!H.length){
    body = '<p class="dimc">还没有已结算的牌局。<br>打完一局后，记录会自动出现在这里。</p>';
  } else {
    body += '<table class="scoreTbl"><tr>';
    for (const p of G.players) body += '<th>' + escName(p.name) + '</th>';
    body += '</tr><tr>';
    for (const p of G.players){
      const v = p.score;
      body += '<td class="' + (v > 0 ? 'pos' : v < 0 ? 'neg' : '') + '">' + (v > 0 ? '+' + v : v) + '</td>';
    }
    body += '</tr></table>';
    body += '<div class="hlist">';
    // v1.2.14：最近一局排在最上面
    [...H].reverse().forEach((r, k) => {
      const idx = H.length - 1 - k;   // 原数组索引（viewHist 按原序索引）
      const kindCls = r.kind === '流局' ? 'kj' : (r.winners.indexOf(mySeat) >= 0 ? 'kw' : 'kl');
      body += '<div class="hrow" onclick="viewHist(' + idx + ')">' +
        '<div class="hr1"><span class="hw">' + r.wind + ' 第' + r.no + ' 局</span>' +
        '<span class="hk ' + kindCls + '">' + r.kind + '</span>' +
        '<span class="hgo">查看 ›</span></div>' +
        '<div class="hr2">' + r.note + '</div>' +
        '<div class="hr3">' + r.delta.map((v, i) => {
          const pn = G.players[i] ? escName(G.players[i].name) : ('玩家' + (i + 1));
          return '<span class="' + (v > 0 ? 'pos' : v < 0 ? 'neg' : '') + '">' + pn + ' ' +
            (v > 0 ? '+' + v : v) + '</span>';
        }).join('') + '</div></div>';
    });
    body += '</div>';
  }
  openSheet('<h2><span>历史记录</span><span class="sp"></span>' +
    '<span class="hcnt">' + H.length + ' 局</span>' +
    '<button class="close" onclick="closeSheet()">×</button></h2>' +
    body +
    (NET.active ? '' : '<div class="btns"><button class="pri" onclick="confirmNewRound()">开始新一轮</button></div>') +
    '<p class="dimc">记录按「轮」累计，只有开始新一轮才会清零。</p>');
}
function confirmNewRound(){
  openSheet('<h2><span>开始新一轮</span><span class="sp"></span><button class="close" onclick="closeSheet()">×</button></h2>' +
    '<p>将清空本轮 <b>' + G.history.length + '</b> 局记录，四家分数全部归零，从<b>东风 · 第 1 局</b>重新开始。</p>' +
    '<div class="btns"><button onclick="newRound()">确认开始</button><button class="pri" onclick="openHistory()">再想想</button></div>');

function newRound(){
  G.history = [];
  G.handNo = 1; G.roundNo = 1; G.roundWind = 0; G.huangfan = 0; G.dealer = 0;
  for (const p of G.players) p.score = 0;

}

function nextHand(dealer){
  // 联机：下一局由服务端推进（谁先点都行，服务端只认第一份）
  if (NET.active){
    closeSheet();
    stopCd();
    netSend({ t:'act', kind:'next', value: 0 });
    renderActs();
    return;
  }
  closeSheet();
  G.finished = false; G.result = null;
  for (const p of G.players){ p.settleFan = null; p.settleDi = null; }
  G.dealer = dealer;
  // v1.2.25：累计局数（不回绕，供左上角「第 N 局」显示）；handNo 仍是风圈内局号（1~4）驱动风圈轮转
  G.roundNo++;
  G.handNo++;
  if (G.handNo > 4){ G.handNo = 1; G.roundWind = (G.roundWind + 1) % 4; }
  runHand();
}

function openSet(){
  // 已加入房间（含等待页）：规则由房间统一设定。等待页房主可改；其他人和开局后只能看。
  const inRoom = !!NET.roomNo;
  if (inRoom){
    const isHost = NET.isHost;
    const inGame = NET.tableOn;
    const canEdit = isHost && !inGame;                 // 只有等待页的房主能改

    // 草稿：等待页房主进入编辑态时，从当前规则拷贝一份；点「确定」才提交，点「取消」丢弃
    if (canEdit){ if (!SETDRAFT) SETDRAFT = Object.assign({}, CFG); }
    else SETDRAFT = null;

    let tip, btns;
    if (inGame){
      // 牌局中：规则只读，房主额外保留「结束本局 / 关闭房间」，另加「回到首页」
      tip = '<p class="dimc">规则由房主设定，开局后锁定。</p>';
      btns = (isHost
          ? '<button class="danger" onclick="netEndGame()">结束本局</button><button class="danger" onclick="netCloseRoom()">关闭房间</button>'
          : '') +
        '<button onclick="backHome()">回到首页</button>' +
        '<button class="pri" onclick="closeSet()">关闭</button>';
    } else if (canEdit){
      // 等待页房主：改完点「确定」一次性提交
      tip = '<p class="dimc">你是房主：改完点「确定」提交，开局后锁定。</p>';
      btns = '<button onclick="closeSet()">取消</button><button class="pri" onclick="commitCfg()">确定</button>';
    } else {
      // 等待页非房主：只读，一个「关闭」按钮
      tip = '<p class="dimc">规则由房主设定，开局后锁定。</p>';
      btns = '<button class="pri" onclick="closeSet()">关闭</button>';
    }
    openSheet('<h2><span>设置</span><span class="sp"></span><button class="close" onclick="closeSet()">×</button></h2>' +
      tip + cfgRows(!canEdit) +
      '<div class="btns">' + btns + '</div>');
    return;
  }
  // 单机：设置走草稿——首页入口弹「返回 / 开始游戏」；局内点「完成」提交并确认清记录重开
  const soloInGame = $('home').classList.contains('hide');   // home 隐藏 = 已进游戏画面
  if (!SETDRAFT) SETDRAFT = Object.assign({}, CFG);
  const tip = soloInGame
    ? '<p class="dimc">改完点「完成」：会清空本局记录并重新开局。</p>'
    : '<p class="dimc">先看看规则再开局，随时可回首页。</p>';
  const btns = soloInGame
    ? '<button onclick="closeSet()">取消</button><button onclick="backHome()">返回首页</button>' +
      '<button class="pri" onclick="commitSoloDone()">完成</button>'
    : '<button onclick="closeSet()">返回</button>' +
      '<button class="pri" onclick="commitSoloGo()">开始游戏</button>';
  openSheet('<h2><span>设置</span><span class="sp"></span><button class="close" onclick="closeSet()">×</button></h2>' +
    tip + cfgRows(false) +
    '<div class="btns">' + btns + '</div>');
}
/* v1.2.18：单机设置草稿提交 —— 取差异并清草稿；无差异返回 null */
let __soloDiff = null;   // 局内「完成」确认弹窗里待应用的草稿差异
function takeSoloDiff(){
  if (!SETDRAFT) return null;
  const diff = {};
  for (const k of Object.keys(SETDRAFT)) if (SETDRAFT[k] !== CFG[k]) diff[k] = SETDRAFT[k];
  SETDRAFT = null;
  return diff;
}
function applySoloDiff(diff){
  if (!diff || !Object.keys(diff).length) return false;
  for (const k in diff) CFG[k] = diff[k];
  saveCfg();
  return true;
}
/* 首页「开始游戏」：提交草稿、关掉设置面板，再开局 */
function commitSoloGo(){
  applySoloDiff(takeSoloDiff());
  closeSheet();
  startSolo();
}
/* 局内「完成」：有改动则弹确认（局内修改会清空记录重开），没改动只关面板 */
function commitSoloDone(){
  const diff = takeSoloDiff();
  if (!diff || !Object.keys(diff).length){ closeSheet(); return; }
  openSheet('<h2><span>重新开局？</span><span class="sp"></span><button class="close" onclick="closeSheet()">×</button></h2>' +
    '<div class="ru"><p>局内修改游戏设置会<b>清空本局记录并重新开局</b>，确定要应用这些改动吗？</p></div>' +
    '<div class="btns"><button onclick="closeSheet()">取消</button>' +
    '<button class="pri" onclick="soloRestartApply()">确定，重新开局</button></div>');
  __soloDiff = diff;
}
/* 确认弹窗里点「确定，重新开局」：应用草稿并重开一局 */
function soloRestartApply(){
  const diff = __soloDiff || {}; __soloDiff = null;
  applySoloDiff(diff);
  resetAll();     // closeSheet + initGame + saveCfg + runHand
}
/* 关闭设置面板（带草稿清理）：等待页房主点「取消」/「×」时丢弃未提交的修改 */
function closeSet(){ SETDRAFT = null; closeSheet(); }
/* 等待页房主点「确定」：把草稿与当前规则的差异一次性发给服务端 */
function commitCfg(){
  if (!SETDRAFT){ closeSheet(); return; }
  const diff = {};
  for (const k of Object.keys(SETDRAFT)){
    if (SETDRAFT[k] !== CFG[k]) diff[k] = SETDRAFT[k];
  }
  SETDRAFT = null;
  if (Object.keys(diff).length){
    if (!netSend({ t:'cfg', cfg: diff })){
      toast('连接已断开，正在重连…', 'red'); netKickReconnect(); return;
    }
  }
  closeSheet();
}
/* 改一项规则：等待页房主编辑草稿 → 只改草稿；单机 → 立即生效并保存 */
function setCfgKey(k, v, needRender){
  if (SETDRAFT){ SETDRAFT[k] = v; openSet(); return; }   // 草稿态：只预览，不提交
  CFG[k] = v; saveCfg(); openSet(); if (needRender) render();
}
function setCfg(v){ setCfgKey('base', v, true); }
function setCfg2(v){ setCfgKey('unit', v, true); }
function setCfg3(v){ setCfgKey('lezi', v, true); }
function setCfg4(v){ setCfgKey('allowChow', !!v, false); }
function setCfg5(v){ setCfgKey('autoKnock', !!v, false); }
function setCfg6(v){ setCfgKey('speed', v, false); }
function setCfg7(v){ setCfgKey('sevenPairs', !!v, false); }
function setCfg8(v){ setCfgKey('lajiHu', !!v, true); }
function setCfg9(v){ setCfgKey('autoHu', !!v, false); }
function resetAll(){
  closeSheet();
  G.abort = false;
  initGame();
  saveCfg();
  runHand();
}

  '<li><b>中发白当字牌</b>：可碰、可组刻子/将牌，参与混一色 / 风一色判定</li>' +
  '<li><b>吃过即锁门</b>：吃过某花色的顺子后，本局只能再吃 / 碰该花色与字牌</li>' +
  '<li><b>碰过即不吃</b>：碰 / 杠过任何数牌后，吃按钮不再出现（靠碰做一色 / 碰碰胡）</li>' +
  '<li><b>只认碰色系</b>：普通顺子刻子混打的牌不能胡（系统不会给「胡」按钮）</li></ul>' +

  '<p style="color:#8ba79a">说明：已实现「包三口」「抢杠胡」等进阶规则，其余按上海主流打法。</p>' +
  '</div><div class="btns"><button class="pri" onclick="closeSheet()">开始打牌</button></div>');
}

/* ========================================================================
   多人联机（NET）
   架构：服务器权威。服务端跑规则引擎，客户端只渲染投影 + 上报动作。
   投影（view）经 applyView 座位重映射后直接物化进全局 G：
   「我」永远是本地 seat 0（南），1=下家 2=对家 3=上家 —— 渲染层零改动。
   ======================================================================== */
/* 吃/碰/杠/敲：提示落在**当事人自己的牌河区域**正中，一眼就知道是谁干的。
   用 fixed 定位而不是塞进 .river 里 —— .river 有 overflow:hidden，宽高又只有 48~52px，
   直接塞进去会被裁掉。改为量出牌河中心点，浮窗贴上去。
   放在 NET 模块（引擎抽取切分点 CUT 之后），保证这是客户端专属代码，不进服务端引擎。 */
const RIVER_OF = ['rvS', 'rvE', 'rvN', 'rvW'];   // 座位 0=南(我) 1=东 2=北 3=西
function seatToast(seat, text){
  const d = document.createElement('div');
  d.className = 'seatTst';
  d.textContent = text;
  document.body.appendChild(d);
  const host = $(RIVER_OF[seat] || RIVER_OF[0]);
  if (host){
    const r = host.getBoundingClientRect();
    d.style.left = Math.round(r.left + r.width / 2 - d.offsetWidth / 2) + 'px';
    d.style.top = Math.round(r.top + r.height / 2 - d.offsetHeight / 2) + 'px';
  } else {
    d.style.left = '50%'; d.style.top = '38%'; d.style.transform = 'translate(-50%,-50%)';
  }
  setTimeout(() => d.remove(), 2000);
}
const NET = {
  active: false,       // 是否处于联机对局
  ws: null,
  mySeat: -1,          // 真实座位（0-3）
  token: '',           // 重连凭证
  roomNo: '',
  isHost: false,
  players: [],         // 房间座位快照（房间等待页用）
  history: [],         // 本桌历史牌局（rec 含结算 html，供回看）
  lastSettle: null,    // 当前局结算 { html, dealer }
  pend: null,          // 待回应的服务端询问 { kind, payload, deadline }
  timer: null,         // 倒计时
  hb: null,            // 心跳
  tableOn: false,      // 牌桌是否已进入
  lastView: null,
  reconnecting: false, // 重连流程进行中
  reconnectTries: 0,   // 重连退避计数
  lastMsgAt: 0,        // 最近一次收到服务端消息的时间（探活用）
  askLeft: 0,          // 服务端下发的决策剩余毫秒（全局倒计时唯一数据源）
  askAt: 0,            // 收到 askLeft 的本地时刻
  autoKnock: false,    // 点「敲听」打牌后置真：服务端再问「敲不敲」时自动确认，免二次点
  kicked: false,       // 本页座位被别处顶替：不再自动重连，避免两个页面互相抢座位
  readySeats: []       // 局间「准备下一局」：已准备的真实座位列表（服务端下发）
};
function netSend(o){
  try{ if (NET.ws && NET.ws.readyState === 1){ NET.ws.send(JSON.stringify(o)); return true; } }catch(e){}
  return false;
}
function netServerDefault(){
  return (/^https?:$/.test(location.protocol) && location.hostname) ? location.host : '';
}
/* 动作上报前的客户端清理（服务端还会做权威校验） */
function netSanitize(kind, v){
  if (kind === 'discard') return (typeof v === 'number') ? v : null;
  if (kind === 'knock')   return v === 'knock' ? 'knock' : 'pass';
  if (kind === 'next')    return (typeof v === 'number') ? v : 0;
  if (kind === 'zimo')    return v === 'hu' ? 'hu' : 'pass';
  if (kind === 'selfkong'){
    if (v && (v.k === 'ankan' || v.k === 'chakan')) return { k: v.k, tile: v.tile };
    return null;
  }
  if (kind === 'claim'){
    if (!v || v.k === 'pass') return null;
    const o = { k: v.k, tile: v.tile };
    if (v.combo) o.combo = v.combo.slice();
    return o;
  }
  return null;
}
// 统一构造 ws 地址：HTTPS 页面禁止明文 ws（mixed content），自动升级为 wss
function wsUrl(s){
  const t = String(s || '').trim();
  if (/^wss?:\/\//.test(t)) return t;
  return ((location.protocol === 'https:') ? 'wss://' : 'ws://') + t;
}
function netConnect(server, onOk){
  const s = (server || netServerDefault()).trim();
  if (!s){ lobErr('请填写服务器地址（由房主提供，形如 123.45.67.89:8080）'); return; }
  const url = wsUrl(s);
  let opened = false;
  try{ NET.ws = new WebSocket(url); }catch(e){ lobErr('地址无效'); return; }
  NET.ws.onopen = () => { opened = true; lobErr('已连接服务器', true); if (onOk) onOk(); };
  NET.ws.onerror = () => { if (!opened) lobErr('连不上服务器，请检查地址与网络'); };
  NET.ws.onclose = () => {
    clearInterval(NET.hb);
    if (NET.kicked) return;                             // 被别处顶替：不重连
    if (NET.active || NET.tableOn) netTryReconnect();   // 对局中断线：退避重连
    else if (opened) lobErr('连接已断开');
  };
  NET.ws.onmessage = e => {
    let m = null;
    try{ m = JSON.parse(e.data); }catch(err){ return; }
    netHandle(m);
  };
  clearInterval(NET.hb);
  NET.hb = setInterval(() => netSend({ t:'ping' }), 25000);
}
/* 断线退避重连：1.8s/2.6s/…最长 6s，8 次后放弃并提示 */
function netTryReconnect(){
  if (!NET.active && !NET.tableOn) return;   // 已离开对局，不重连
  if (NET.reconnecting) return;              // 已在重连流程
  if (NET.reconnectTries >= 8){
    NET.reconnectTries = 0;
    toast('重连失败，请回到首页后重新进入房间', 'red');
    return;
  }
  NET.reconnectTries++;
  const delay = Math.min(1000 + 800 * NET.reconnectTries, 6000);
  toast('与服务器断开，正在重连(' + NET.reconnectTries + ')…', 'red');
  setTimeout(() => {
    if (!NET.active && !NET.tableOn) return;
    NET.reconnecting = true;
    netReconnect();
  }, delay);
}
/* 立即重连（回前台 / 用户主动操作时） */
function netKickReconnect(){
  if (!NET.active && !NET.tableOn) return;
  if (NET.ws && (NET.ws.readyState === 0 || NET.ws.readyState === 1)) return; // 已在连/已连
  NET.reconnecting = false; NET.reconnectTries = 0;
  netReconnect();
}
function netReconnect(){
  const s = ($('lServer').value || netServerDefault()).trim();
  if (!s || !NET.roomNo){ NET.reconnecting = false; return; }
  const url = wsUrl(s);
  try{ NET.ws = new WebSocket(url); }catch(e){ NET.reconnecting = false; netTryReconnect(); return; }
  NET.ws.onopen = () => {
    netSend({ t:'reconnect', roomNo: NET.roomNo, token: NET.token });
    clearInterval(NET.hb);
    NET.hb = setInterval(() => netSend({ t:'ping' }), 25000);
  };
  NET.ws.onclose = () => {
    clearInterval(NET.hb);
    // v1.2.15：被别处顶替（kicked）后不再重连，否则会把新页面又挤下去，两边轮流假死
    if (NET.kicked) return;
    // 重连的连接又挂了（含服务端拒绝后 close）：继续退避，除非已被 err 分支终止
    if (NET.active || NET.tableOn){ NET.reconnecting = false; netTryReconnect(); }
  };
  NET.ws.onerror = () => {};
  NET.ws.onmessage = e => { let m = null; try{ m = JSON.parse(e.data); }catch(err){ return; } netHandle(m); };
}
// v1.2.12：结算记录入历史（按 局号+风圈 去重，防断线重连补发双份）
function netPushSettleRec(rec){
  if (!rec) return;
  if (!NET.history.some(r => r.no === rec.no && r.wind === rec.wind)) NET.history.push(rec);
}
function netHandle(m){
  NET.lastMsgAt = Date.now();
  switch (m.t){
    case 'welcome':
      NET.mySeat = m.seat; NET.token = m.token; NET.roomNo = m.roomNo; NET.isHost = !!m.isHost;
      // 重连中不清 reconnecting：服务端会紧接着补发 view / settle（见 resumeSeat），
      // 由第一个业务帧清除，确保补发的 settle 走「不自动弹窗、只恢复数据」分支
      if (!NET.tableOn){ NET.reconnecting = false; NET.reconnectTries = 0; }
      break;
    case 'roomNo':
      NET.roomNo = m.roomNo; $('rNoTxt').textContent = m.roomNo;
      showRoom();                       // 建房/加入成功 → 切到房间等待页
      break;
    case 'room':
      NET.players = m.players;
      // 本桌规则以服务端为准（房主改完会广播给所有人）
      if (m.cfg) Object.assign(CFG, m.cfg), NET.cfg = m.cfg;
      // 房主可能已换人（原房主退出 / 全员退出后重进），以服务端名单为准
      // 服务端 players 是按座位号的数组（空座位为 null），直接索引取自己
      if (NET.mySeat >= 0){
        const me = m.players[NET.mySeat];
        if (me) NET.isHost = !!me.host;
      }
      // 牌局进行中也会收到 room（有人掉线时广播），此时不能打断牌桌
      if (!NET.tableOn) showRoom();
      renderRoom();
      break;
    case 'start':
      NET.tableOn = false; NET.lastSettle = null; NET.history = [];
      netSetClock(0);
      break;
    case 'view':
      NET.lastView = m.view;
      if (!NET.tableOn){ NET.tableOn = true; NET.active = true; $('home').classList.add('hide'); }
      // 重连成功：首个业务帧到达，重连流程结束
      if (NET.reconnecting){ NET.reconnecting = false; NET.reconnectTries = 0; }
      applyView(m.view);
      break;
    case 'ask':
      netAsk(m);
      break;
    case 'settle':
      NET.lastSettle = { html: m.html, dealer: m.dealer };
      // v1.2.12：去重（按 局号+风圈），防断线重连时服务端补发 settle 造成同一局记录双份
      netPushSettleRec(m.rec);
      stopCd();
      netSetClock(0);
      PEND = null;
      NET.pend = null;
      // 结算帧投影（含亮牌）先落地，再补「下一局」入口
      if (m.view) applyView(m.view);
      G.finished = true;
      G.running = false;
      G.result = { dealer: m.dealer };
      // v1.2.5：断线重连后服务端会补发 settle 以同步 lastSettle，但不需要再次自动弹窗
      if (!NET.reconnecting) openSheet(settleHtml(m.html, m.dealer));
      else { NET.reconnecting = false; NET.reconnectTries = 0; }
      renderActs();
      break;
    case 'toast':
      // 带座位（吃/碰/杠/敲）→ 定位到对应牌河；服务端下的是真实座位，先重映射到本地视角
      if (m.seat != null) seatToast(remap(m.seat), m.text);
      else toast(m.text, m.cls);
      break;
    case 'err':
      if (NET.reconnecting){
        // 重连被服务端拒绝（房间解散 / 凭证无效）：停止重试，回首页并说明原因
        NET.reconnecting = false; NET.reconnectTries = 0;
        NET.teardown();
        $('home').classList.remove('hide');
        showHomePick();
        lobErr(m.msg);
        return;
      }
      if (NET.tableOn) toast(m.msg, 'red');
      else lobErr(m.msg);
      break;
    case 'ended':
      NET.tableOn = false; NET.pend = null; stopCd(); netSetClock(0);
      PEND = null; NET.lastSettle = null;
      toast('本局已结束，回到房间等待页', 'gold');
      $('home').classList.remove('hide');
      showRoom();
      break;
    case 'bye':
      NET.teardown();
      $('home').classList.remove('hide');
      showHomePick();
      if (m.msg) lobErr(m.msg);        // 被房主移出 / 房间关闭等原因
      break;
    case 'kicked':
      // v1.2.15：同一个座位在别处被重新进入（另一个页面/设备）。
      // 本页必须彻底退出且不再重连——否则两个页面轮流抢座位，两边都收不全询问，牌桌看着像卡死。
      NET.kicked = true;
      NET.reconnecting = false; NET.reconnectTries = 0;
      NET.teardown();
      $('home').classList.remove('hide');
      showHomePick();
      lobErr(m.msg || '这个座位已在别处进入，本页已退出');
      break;
  }
}
/* 服务端轮到你做决定 */
function netAsk(m){
  NET.pend = { kind: m.kind, payload: m.payload, deadline: m.deadline || 0 };
  // 倒计时以服务端下发的「相对剩余毫秒」为准（不换算绝对时刻，避免各端时钟偏差）
  netSetClock(typeof m.askLeft === 'number' ? m.askLeft : Math.max(0, (m.deadline || 0) - Date.now()));
  SEL = null; SELIDX = null;
  PEND = { kind: m.kind, payload: m.payload, res: null, seat: 0 };  // 伪 PEND：复用 renderActs 的按钮逻辑
  render();
  startCd();
  // 刚点过「敲听」打牌 → 服务端紧接着问「敲不敲」：直接确认，免掉第二次点击
  if (m.kind === 'knock' && NET.autoKnock){
    NET.autoKnock = false;
    resolvePend('knock');
    return;
  }
  // 其它询问（出牌/吃碰杠）到了，说明上一轮没走「敲听」路径，清掉残留标志
  if (m.kind !== 'knock') NET.autoKnock = false;
}
/* ---------- 全局倒计时（服务端权威，四家同一个数） ----------
   数据源只有一处：服务端下发的剩余毫秒 askLeft + 本地收到时刻。
   中途退出、断线重连都不会单独记一份自己的状态，看到的和大家一致。 */
function netSetClock(left){
  NET.askLeft = Math.max(0, left || 0);
  NET.askAt = Date.now();
}
function netLeftSec(){
  if (!NET.active || !NET.askLeft) return 0;
  const l = NET.askLeft - (Date.now() - NET.askAt);
  return l > 0 ? Math.ceil(l / 1000) : 0;
}
/* 圆心倒计时（v1.2.15）：纯数字、黄色高亮，无其他文字；无决策或单机（机器人局）显示「——」。
   数据源不变：联机 = 服务端下发的剩余毫秒（netLeftSec），四家同一个数 */
function renderTurnClock(){
  const el = $('cdTxt');
  if (!el) return;
  const s = NET.active ? netLeftSec() : 0;
  // v1.2.16：没人在决策时直接留空（旧版显示「——」占位，桌心看着多余）
  el.textContent = s > 0 ? String(s) : '';
  el.className = 'cd' + (s > 0 && s <= 3 ? ' warn' : '');
}
function stopCd(){ if (NET.timer){ clearInterval(NET.timer); NET.timer = null; } }
/* 局间「准备下一局」：四家牌河各自盖「准备」字样（谁准备了谁亮，全部可见） */
function renderReady(){
  if (!NET.active) return;
  const settled = G.finished;
  const readySeats = NET.readySeats || [];
  for (let i = 0; i < 4; i++){
    const host = $(RIVER_OF[i]);
    if (!host) continue;
    let badge = host.querySelector('.readyBadge');
    const seat = (i + NET.mySeat + 4) % 4;   // 本地牌河 i → 真实座位
    const show = settled && readySeats.indexOf(seat) >= 0;
    if (show){
      if (!badge){
        badge = document.createElement('div');
        badge.className = 'readyBadge';
        badge.textContent = '准备';
        host.appendChild(badge);
      }
    } else if (badge) badge.remove();
  }
}
function startCd(){
  stopCd();
  if (!NET.active) return;
  NET.timer = setInterval(() => renderTurnClock(), 500);
  renderTurnClock();
}
NET.teardown = function(){
  netSend({ t:'leave' });
  clearInterval(NET.hb); clearInterval(NET.timer);
  // 主动断开前摘掉回调，避免触发 netConnect.onclose 里的「连接已断开」误报
  try{ if (NET.ws){ NET.ws.onclose = null; NET.ws.onerror = null; NET.ws.close(); } }catch(e){}
  NET.ws = null; NET.active = false; NET.tableOn = false;
  NET.mySeat = -1; NET.token = ''; NET.roomNo = ''; NET.isHost = false;
  NET.players = []; NET.lastSettle = null; NET.pend = null; NET.lastView = null;
  NET.reconnecting = false; NET.reconnectTries = 0;
  netSetClock(0);
  loadCfg();          // 退出联机：恢复本机自己存的单机规则（联机时被房间规则覆盖过）
  stopCd();
};

/* ---------- 投影 → 本地 G（座位重映射） ---------- */
function remap(seat){ return NET.active ? (seat - NET.mySeat + 4) % 4 : seat; }
function applyView(V){
  if (V.cfg) Object.assign(CFG, V.cfg);   // 本桌规则由服务端下发，客户端只跟着显示
  const t = V.table;
  NET.mySeat = V.mySeat;
  if (V.ready) NET.readySeats = V.ready;  // 局间「准备下一局」状态
  // 倒计时跟着投影一起刷新：不管是不是轮到我，四家看到的是同一个数
  netSetClock(V.askLeft);
  G.running = t.phase === 'playing';
  // 结算后服务端可能补发一帧「空闲投影」（phase=idle、finished=false，来自 finish 早期 render）。
  // 它会把「已结算」短暂降级成「未结算」，导致底部「准备下一局/查看结算」按钮瞬间消失。
  // 真正的新局 phase 一定是 playing，这里只拦截非 playing 的降级。
  const prevFinished = G.finished;
  G.finished = !!t.finished;
  if (!t.finished && t.phase !== 'playing' && prevFinished && NET.lastSettle && NET.tableOn){
    G.finished = true;
  }
  G.result = NET.lastSettle ? { dealer: NET.lastSettle.dealer } : null;
  G.handNo = t.handNo; G.roundNo = t.roundNo !== undefined ? t.roundNo : G.handNo; G.roundWind = t.roundWind;
  G.huangfan = t.huangfan; G.kaibao = !!t.kaibao; G.kaibaoType = t.kaibaoType;
  G.dice = t.dice;
  G.turn = remap(t.turn); G.dealer = remap(t.dealer);
  G.lastDiscard = t.lastDiscard;
  G.lastFrom = (t.lastFrom < 0) ? -1 : remap(t.lastFrom);
  G.logs = V.logs.slice();
  // 牌墙：只给剩余张数 —— 用 wpos/wtail 还原 wallLeft() 的返回值
  G.wall = []; G.wpos = 0; G.wtail = Math.max(0, t.wallLeft - 1);
  const local = new Array(4);
  for (const pv of V.players) local[remap(pv.seat)] = pv;
  G.players = local.map((pv, li) => ({
    idx: li,
    name: pv.name,
    isBot: !!pv.isBot,
    online: pv.online !== false,
    hand: (pv.hand != null) ? pv.hand.slice() : new Array(pv.handCount).fill(-1),
    flowers: pv.flowers.slice(),
    melds: pv.melds.map(m => ({
      type: m.type, tiles: m.tiles.slice(), tile: m.tile,
      concealed: !!m.concealed, from: (m.from < 0 ? -1 : remap(m.from))
    })),
    discards: pv.discards.slice(),
    knocked: !!pv.knocked,
    // v1.2.15：自己的敲定听牌由服务端随投影下发（此前恒为空 → 联机时顶部「已敲·听」
    // 与底部「听牌中 →」都显示不出听的牌）；别家的听牌不下发（私密信息）
    knockWaits: (pv.knockWaits || []).slice(),
    menqing: !!pv.menqing,
    drawn: (pv.drawn != null) ? pv.drawn : null,
    score: pv.score,
    drawnCount: 0, target: null,
    missHu: new Set(pv.missHu || []),
    noPromptSig: '', tianDi: false,
    settleFan: null, settleDi: null
  }));
  renderLog();
  render();
  // 倒计时要自己走：投影只在局面变化时下发，中间的每一秒靠本地 tick 递减
  if (NET.active && !NET.timer) startCd();
}
/* 牌河下方的三手记录（引擎里由 logMsg 直接画，联机时由投影驱动） */
function renderLog(){
  const box = $('log');
  if (!box) return;
  box.innerHTML = '';
  const L = G.logs || [];
  for (let i = L.length - 1; i >= Math.max(0, L.length - 3); i--){
    const d = document.createElement('div');
    d.textContent = L[i];
    box.appendChild(d);
  }
}

/* ---------- 首页 ---------- */
function showHomePick(){
  $('homePick').classList.remove('hide');
  $('homeLobby').classList.add('hide');
  $('homeRoom').classList.add('hide');
}
function showRoom(){
  $('homePick').classList.add('hide');
  $('homeLobby').classList.add('hide');
  $('homeRoom').classList.remove('hide');
}
function showLobby(){
  $('homePick').classList.add('hide');
  $('homeLobby').classList.remove('hide');
  $('homeRoom').classList.add('hide');
  try{
    const sv = JSON.parse(localStorage.getItem('sjm_net') || '{}');
    if (sv.name) $('lName').value = sv.name;
    if (sv.server) $('lServer').value = sv.server;
  }catch(e){}
  if (!$('lServer').placeholder) $('lServer').placeholder = netServerDefault() || '如 192.168.1.5:8080';
  lobErr('');   // 上一次会话的错误提示不带给新会话
}
function lobErr(msg, ok){
  const el = $('lErr');
  el.textContent = msg || '';
  el.className = 'lErr' + (ok ? ' ok' : '');
}
function netSavePref(){
  try{
    localStorage.setItem('sjm_net', JSON.stringify({ name: $('lName').value.trim(), server: $('lServer').value.trim() }));
  }catch(e){}
}
function bindHome(){
  // 装饰牌：中 · 发 · 白（牌编码 108/112/116）
  const deco = $('hDeco');
  if (deco){
    deco.innerHTML = [108, 112, 116].map(t => tileHTML(t, '')).join('');
    deco.querySelectorAll('.tile').forEach(el => el.classList.add('static'));
  }
  // v1.2.18：单机入口先弹设置（返回 / 开始游戏）再开局；
  // 若从联机（含等待室）返回过首页，roomNo 等残留会让 openSet 误判成房间模式——先清理
  $('hBtnSolo').onclick = () => {
    if (NET.roomNo || NET.active || NET.tableOn) NET.teardown();
    openSet();
  };
  $('hBtnMulti').onclick = showLobby;
  $('lBack').onclick = showHomePick;
  $('lCreate').onclick = () => {
    const name = $('lName').value.trim();
    if (!name){ lobErr('先给自己起个名字'); return; }
    netSavePref();
    lobErr('连接中…', true);
    NET.kicked = false;                 // 重新入座：清掉上一次被顶替的标记，恢复自动重连
    netConnect($('lServer').value, () => netSend({ t:'create', name }));
  };
  $('lJoin').onclick = () => {
    const name = $('lName').value.trim();
    const no = $('lRoomNo').value.trim();
    if (!name){ lobErr('先给自己起个名字'); return; }
    if (!/^\d{6}$/.test(no)){ lobErr('房间号是 6 位数字'); return; }
    netSavePref();
    lobErr('连接中…', true);
    NET.kicked = false;                 // 重新入座（含「退出再回」）：清掉被顶替标记
    netConnect($('lServer').value, () => netSend({ t:'join', name, roomNo: no }));
  };
  $('rNoTxt').onclick = () => {
    const t = NET.roomNo;
    if (!t) return;
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(() => toast('房间号已复制', 'gold'), () => {});
    }
  };
  $('rReady').onclick = () => netSend({ t:'ready' });
  $('rStart').onclick = () => netSend({ t:'start' });
  $('rCfg').onclick = () => openSet();
  $('rClose').onclick = netCloseRoom;
  $('rLeave').onclick = () => {
    NET.teardown();
    showHomePick();
  };
}
/* v1.2.4：等待页 = 简易牌桌
   四边按「本地视角」排布：南(下)=我、东(右)=下家、北(上)=对家、西(左)=上家
   与进牌局后的方位完全一致——点哪个空位，就是坐到牌桌的那一侧 */
const POS_OF_REL = ['rSeatS', 'rSeatE', 'rSeatN', 'rSeatW'];   // 视角位 0我 / 1右家 / 2对家 / 3左家
const REL_LABEL = ['我', '右家', '对家', '左家'];
function renderRoom(){
  const box = $('rBoard');
  if (!box) return;
  let waitCnt = 0;
  const seats = NET.players;
  const base = NET.mySeat >= 0 ? NET.mySeat : 0;     // 我的真实座位
  box.querySelectorAll('.rSeatSlot').forEach(el => {
    el.classList.remove('taken', 'me', 'empty');
  });
  for (let r = 0; r < 4; r++){
    const seat = (base + r) % 4;                     // 视角位 → 真实座位号
    const slotEl = box.querySelector('.' + POS_OF_REL[r]);
    if (!slotEl) continue;
    const s = seats[seat];
    const isMe = (r === 0);
    slotEl.classList.remove('taken','me','empty');
    slotEl.onclick = null;
    slotEl.dataset.seat = seat;                      // DOM 上的座位号跟着视角刷新
    if (s){
      let st = '';
      if (s.host) st += '<span class="st host">房主</span>';
      if (!s.online) st += '<span class="st off">掉线</span>';
      else if (s.ready) st += '<span class="st ready">已准备</span>';
      if (!s.host && !s.ready) waitCnt++;            // 统计「除房主外还没准备的人」——含自己（自己没准备也要准备）；房主不需要准备
      slotEl.innerHTML =
        '<div class="rSeatPos">' + REL_LABEL[r] + '</div>' +
        '<div class="rSeatName">' + escName(s.name) + st + '</div>' +
        (NET.isHost && !isMe ? '<button class="rSeatKick" onclick="event.stopPropagation();netKick(' + seat + ')">移出</button>' : '');
      slotEl.classList.add('taken');
      if (isMe) slotEl.classList.add('me');
    } else {
      slotEl.classList.add('empty');
      // 空位：点击换过去（牌局中 / 已有人 / 自己原位 都会被拦下）
      slotEl.innerHTML = '<div class="rSeatPos">空位</div><div class="rSeatName" style="color:var(--dim2)">点我换过来</div>';
      slotEl.onclick = () => netMoveSeat(seat);
    }
  }
  // 中央圆：方位也按视角走（下方永远是我），顺/逆时针顺序与牌局中的罗盘一致
  const dialWind = { s: base, e: (base + 1) % 4, n: (base + 2) % 4, w: (base + 3) % 4 };
  for (const k in dialWind){
    const el = box.querySelector('.rDw.' + k);
    if (el) el.textContent = SEAT_WIND[dialWind[k]];   // 开局前按「座位 0 = 东」推算
  }
  const st = $('rStatus');
  // v1.2.4：人数提示 bug 修复——房主与非房主走同一套算法，服务端每次广播 room 都重算，
  // 所以任何一个人点/取消准备，四家看到的「X 位真人入座 / Y 位未准备」都会一起变。
  const total = seats.filter(s => s).length;
  if (waitCnt > 0) st.textContent = total + ' 位真人入座，还有 ' + waitCnt + ' 位未准备';
  else if (total >= 2) st.textContent = total + ' 位真人入座，全员就绪！';
  else st.textContent = total + ' 位真人已入座，空位开局时自动补机器人';
  // 房主：不显示准备按钮；其他已加入的真人全部准备后才能开始
  const othersReady = NET.players.every((s, i) => !s || i === NET.mySeat || s.ready);
  // 开始按钮对房主常驻，未就绪时置灰（不隐藏），避免按钮忽有忽无导致页面跳动
  $('rStart').classList.toggle('hide', !NET.isHost);
  $('rStart').disabled = !othersReady;
  $('rClose').classList.toggle('hide', !NET.isHost);
  $('rReady').classList.toggle('hide', !!NET.isHost);   // 房主不需要准备
  // 规则设置：等待页所有人可见（房主可改，非房主查看）；牌局中走右上角设置按钮
  const cfgEl = $('rCfg');
  if (cfgEl){
    cfgEl.classList.toggle('hide', !!NET.tableOn);
    cfgEl.textContent = NET.isHost ? '游戏设置' : '查看设置';
  }
  const me = NET.players[NET.mySeat];
  $('rReady').textContent = (me && me.ready) ? '取消准备' : '准备';
}
/* 客户端发送换座请求 */
function netMoveSeat(seat){
  if (NET.tableOn) return;                    // 牌局中禁止换座
  if (seat === NET.mySeat) return;
  if (NET.players[seat]) return;
  if (!netSend({ t:'moveSeat', seat })) return;
  const rel = (seat - (NET.mySeat >= 0 ? NET.mySeat : 0) + 4) % 4;
  toast('正在换到' + REL_LABEL[rel] + '…', 'gold');
}
function escName(s){
  return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
}

/* ---------- 模式入口 ---------- */
function startSolo(){
  NET.active = false; NET.tableOn = false;
  stopCd();
  $('home').classList.add('hide');
  G.abort = false;
  initGame();
  render();
  runHand();
}
function backHome(){
  closeSheet();
  if (NET.active || NET.tableOn){ NET.teardown(); }
  G.abort = true; G.running = false;
  // 关键：不要把旧的 PEND resolve 掉。一旦 resolve(null)，上一局的主循环会拿着
  // null 继续往下跑，跑完还会走 finish({type:'liuju'}) —— 就是新开一局时冒出来的
  // 那个「流局」幽灵弹窗。直接丢弃引用，让上一局的 async 循环永远停在 await 处。
  PEND = null;
  NET.pend = null;
  stopCd();
  $('home').classList.remove('hide');
  showHomePick();
}
function netKick(seat){
  const s = NET.players[seat];
  if (!confirm('把「' + (s ? s.name : '该玩家') + '」移出房间？')) return;
  if (!netSend({ t:'kick', seat })){
    toast('连接已断开，正在重连…', 'red'); netKickReconnect(); return;
  }
}
function netEndGame(){
  if (!confirm('确定结束当前牌局？所有人会回到房间等待页。')) return;
  if (!netSend({ t:'end' })){ toast('连接已断开，正在重连…', 'red'); netKickReconnect(); return; }
  closeSheet();
}
function netCloseRoom(){
  if (!confirm('确定关闭房间？房间会解散，所有人回到首页。')) return;
  if (!netSend({ t:'close' })){ toast('连接已断开，正在重连…', 'red'); netKickReconnect(); return; }
  closeSheet();
}

/* ========================================================================
   启动
   ======================================================================== */
$('btnHist').onclick = openHistory;
$('btnLog').onclick = openHandLog;
$('btnRule').onclick = openRule;
$('btnSet').onclick = openSet;
$('mask').onclick = e => { if (e.target === $('mask')) closeSheet(); };

loadCfg();
bindHome();
showHomePick();

/* 回前台探活：浏览器挂后台后 TCP 可能已死但浏览器未察觉（半开连接），
   表现为回到页面后牌局卡死、按钮无反应。方案：回前台立即发 ping，
   3 秒内没收到任何服务端消息就强制断开并重连；连接已断则立即重连。 */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (!NET.active && !NET.tableOn) return;
  if (NET.ws && NET.ws.readyState === 1){
    const before = NET.lastMsgAt;
    netSend({ t:'ping' });
    setTimeout(() => {
      if (!NET.active && !NET.tableOn) return;   // 已离开
      if (NET.lastMsgAt > before) return;        // 有回应，连接正常
      try{ if (NET.ws){ NET.ws.onclose = null; NET.ws.onerror = null; NET.ws.close(); } }catch(e){}
      netKickReconnect();
    }, 3000);
    return;
  }
  netKickReconnect();   // 已断 / 正在连
});

// 暴露给弹层内联事件
window.nextHand = nextHand;
window.closeSheet = closeSheet;
window.backHome = backHome;
window.netEndGame = netEndGame;
window.netCloseRoom = netCloseRoom;
window.netKick = netKick;
window.setCfg = setCfg; window.setCfg2 = setCfg2; window.setCfg3 = setCfg3;
window.setCfg4 = setCfg4; window.setCfg5 = setCfg5; window.setCfg6 = setCfg6; window.setCfg7 = setCfg7; window.setCfg8 = setCfg8; window.setCfg9 = setCfg9;
window.resetAll = resetAll;
</script>
