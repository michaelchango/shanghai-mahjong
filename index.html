<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08241b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>一道来麻将 · 敲麻 / 清混碰</title>
<style>
:root{
  --felt:#135440; --felt2:#082a1f; --felt3:#0b3a2b;
  --wood:#8a5c33; --wood2:#422a14;
  --card:rgba(255,255,255,.07); --card2:rgba(255,255,255,.12);
  --line:rgba(255,255,255,.16);
  --txt:#e9f3ee; --dim:#93aaa0; --dim2:#6d8479;
  --gold:#ffcf5c; --red:#ff6f57; --blue:#63b3ff; --green:#4ec98a; --purple:#c08cff;
  --ink:#1f2933; --red2:#b5321f; --blue2:#1f6fd0; --green2:#0f7a52;
  --tw:24px; --th:33px; --bkSlotW:23px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#061a13;color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* ---------- 布局 ---------- */
#app{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto;
  background:radial-gradient(120% 70% at 50% 0%,#0d3a2b 0%,#061a13 75%);
  padding:calc(env(safe-area-inset-top,0px) + 4px) 5px calc(env(safe-area-inset-bottom,0px) + 4px)}

/* ---------- 顶栏 ---------- */
.topbar{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);padding:0 2px 3px;flex:0 0 auto}
.topbar .gname{font-size:12px;color:var(--txt);font-weight:600}
.topbar .sp{flex:1}
.iconbtn{width:26px;height:26px;border-radius:8px;background:var(--card);display:flex;align-items:center;
  justify-content:center;font-size:13px;line-height:1}

/* ---------- HUD：底 / 番 / 分 ---------- */
.hud{flex:0 0 auto;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04));
  border:1px solid rgba(255,255,255,.14);border-radius:11px;padding:5px 8px 6px;margin-bottom:4px;
  box-shadow:0 2px 8px rgba(0,0,0,.35)}
.hud .row1{display:flex;align-items:center;gap:6px}
.hud .who{font-size:12px;font-weight:700}
.hud .who .seat{display:inline-block;width:17px;height:17px;line-height:17px;text-align:center;border-radius:5px;
  background:linear-gradient(180deg,#ffe6a3,#e8a927);color:#3a2a00;font-size:11px;margin-right:4px;font-weight:800}
.hud .who .mine{display:inline-block;margin-left:5px;font-size:10px;font-weight:800;letter-spacing:.3px;
  padding:1px 5px;border-radius:6px;background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.12);color:#ffd98a}
.hud .sp{flex:1}
.hud .knockTag{font-size:10px;padding:2px 7px;border-radius:6px;background:linear-gradient(180deg,#ff7a5e,#e8432c);
  color:#fff;font-weight:700;max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud .knockTag.off{background:rgba(255,255,255,.12);color:var(--dim)}
.metrics{display:flex;gap:5px;margin-top:5px}
.metric{flex:1;background:rgba(0,0,0,.30);border-radius:8px;padding:4px 2px 5px;text-align:center;
  border:1px solid rgba(255,255,255,.07)}
.metric .k{font-size:9px;color:var(--dim2);letter-spacing:.5px}
.metric .v{font-size:19px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.metric.di .v{color:var(--blue)}
.metric.fan .v{color:var(--gold)}
.metric.sc .v{color:var(--green)}
.metric.cap .v{color:var(--dim);font-size:14px;padding-top:3px}
/* v1.2.3：fandetail 两行已挪到底部边框下方的 tingLine，此处不再保留 */

/* ---------- 麻将桌 ---------- */
.board{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:3px;
  padding:5px;border-radius:13px;position:relative;
  background:
    radial-gradient(115% 85% at 50% 42%,#166a4f 0%,#0e4835 46%,#0a3527 78%,#072a1f 100%);
  box-shadow:0 0 0 3px var(--wood), 0 0 0 4px var(--wood2), 0 4px 14px rgba(0,0,0,.55),
    inset 0 0 22px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.07)}
.board:before{content:"";position:absolute;inset:5px;border-radius:9px;pointer-events:none;
  border:1px dashed rgba(255,255,255,.09)}

/* 座位通用 */
.seat{display:flex;align-items:center;justify-content:center;min-height:0;min-width:0}
.seatN{flex-direction:column;gap:2px;flex:0 0 auto}
.seatS{flex-direction:column;gap:2px;flex:0 0 auto}
.seatW{flex-direction:row;gap:2px;flex:0 0 auto;width:auto;min-width:0;justify-content:flex-start;max-width:58px}
.seatE{flex-direction:row-reverse;gap:2px;flex:0 0 auto;width:auto;min-width:0;justify-content:flex-start;max-width:58px}
.boardMid{flex:1 1 auto;display:flex;gap:3px;min-height:0;min-width:0}

/* 名牌（谁坐在哪） */
.nm{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:1px 7px;border-radius:9px;
  background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.13);color:var(--txt);white-space:nowrap;
  max-width:100%;overflow:hidden}
.nm .wd{display:inline-block;width:14px;height:14px;line-height:14px;text-align:center;border-radius:4px;
  background:rgba(255,255,255,.16);font-size:10px;font-weight:800;color:#cfe3d9}
.nm.cur{background:linear-gradient(180deg,#ffe6a3,#e8a927);border-color:#ffe9b0;color:#3a2a00}
.nm.cur .wd{background:rgba(0,0,0,.22);color:#fff8e0}
.nm .fl{color:var(--gold);font-weight:700}
.nm.cur .fl{color:#6b4500;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.nm.cur .sc{color:#2e5b3f}
.nm .kk{color:#ff8a6e;font-weight:800}
.nm .sc{color:var(--green);font-weight:700}
.nmV{writing-mode:vertical-rl;text-orientation:upright;font-size:8px;font-weight:700;padding:3px 1px;
  border-radius:8px;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.13);letter-spacing:1px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;max-height:100%;flex:0 0 15px;width:15px;
  gap:3px}
.nmV.cur{background:linear-gradient(180deg,#ffe6a3,#e8a927);border-color:#ffe9b0;color:#3a2a00}
.nmV .kk{color:#ff6f57}
.nmV .fl{color:#ffd98a}
.nmV.cur .fl{color:#6b4500}
.nmV .sc{color:#8fd9b0;font-weight:700}
.nmV.cur .sc{color:#1d6b45}

/* 手牌（牌背）堆叠 */
.hstack{display:flex;align-items:flex-end;justify-content:center;min-height:0;max-width:100%;overflow:hidden;position:relative}
.hstack .tile{margin-right:-3px;box-shadow:0 2px 0 #0a3729,0 3px 3px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.22)}
.hstack .tile:last-child{margin-right:0}
.vstack{display:flex;flex-direction:column;align-items:center;min-height:0;max-height:100%;overflow:hidden;padding:calc(var(--th) * .35) 0;position:relative}
.vslot{position:relative;flex:0 0 auto;width:var(--th);height:calc(var(--tw) - 13px)}
/* 左右家背牌用 xs 小牌：槽宽按 xs 牌旋转后的视觉宽收窄 */
.vstack .vslot{width:var(--bkSlotW);height:calc(var(--tw) * .58)}
.vslot .tile{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg);margin:0;
  box-shadow:0 2px 0 #0a3729,0 3px 3px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.22)}
.vslot.r .tile{transform:translate(-50%,-50%) rotate(90deg)}
.vslot:last-child{margin-bottom:0}

/* ---------- 花 + 吃碰杠区（四家统一：一样大的牌，花在左 / 副露在右） ---------- */
.mrow{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;align-items:flex-end;max-width:100%;overflow:hidden}
.mcol{display:flex;flex-direction:column;gap:1px;flex-wrap:wrap;align-content:center;justify-content:flex-start;
  max-height:100%;overflow:hidden}
.seatN .mrow{min-height:20px}
.seatS .mrow{min-height:26px}
/* 花/副露统一牌尺寸 */
.fx{display:flex;gap:2px;align-items:center;max-width:100%;overflow:hidden;flex-wrap:nowrap}
.fx .tile{--tw:18px;--th:25px}
.fx .fg,.fx .mg{display:flex;gap:2px;align-items:center;flex-wrap:nowrap;min-width:0}
.fx .fg{justify-content:flex-start}
.fx .mg{justify-content:flex-end}
/* 东西家竖排：花/副露组也竖排（meld 容器同步竖排） */
.mcol.fx .fg,.mcol.fx .mg,.mcol.fx .meld{flex-direction:column;justify-content:flex-start}
/* 东家：他视角「从左到右」= 屏幕从下到上 → 花组在屏幕下端、副露在上方，组内牌也从下往上 */
#ml1.fx{flex-direction:column-reverse}
#ml1.fx .fg,#ml1.fx .mg,#ml1.fx .meld{flex-direction:column-reverse}
.fx .fxsep{flex:0 0 9px;width:9px;align-self:stretch;position:relative}
.fx .fxsep:after{content:"";position:absolute;left:50%;top:15%;bottom:15%;width:1px;background:rgba(255,255,255,.22)}
/* 东西家竖排：分隔线随之转 90°（他们视角仍是竖线，我看起来是横线） */
.mcol.fx .fxsep{flex:0 0 9px;width:auto;height:9px;align-self:center}
.mcol.fx .fxsep:after{left:15%;right:15%;top:50%;bottom:auto;width:auto;height:1px}
/* 空槽占位牌：不可见，只用来撑住这一排的尺寸 */
.fx .tile.ghost{visibility:hidden}
/* 吃/碰/明杠来源箭头：指向打出这张牌的那一家（屏幕方向，不随牌旋转） */
/* v1.2.25：来源箭头从牌面正中心移到角上——原先 12px 的黄色圆点在牌中心，
   碰/明杠那组里挂箭头的中间一张，其高亮蓝光被圆点吃掉，看着像「三张只亮了两张」。
   移到角上后牌面完整，高亮框四周都能看清；指向仍由 svg 自身的 rotate 保证是屏幕方向 */
.marrow{position:absolute;right:0;bottom:0;transform:none;
  width:10px;height:10px;border-radius:50%;background:rgba(255,206,84,.92);
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;z-index:8;box-shadow:0 0 3px rgba(0,0,0,.5)}
.marrow svg{width:8px;height:8px;display:block}
.marrow svg path{fill:#5a2b00}
/* 听牌标记：手牌（牌背）上盖一个醒目的「听」圆章 */
/* 直径≈左右两家牌背那一竖排的宽度，纯黄圆底不带白边 */
.ting{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:var(--bkSlotW);height:var(--bkSlotW);min-width:var(--bkSlotW);min-height:var(--bkSlotW);border-radius:50%;
  background:rgba(255,206,84,.78);color:#5a2b00;
  font-size:calc(var(--bkSlotW) * 0.6);font-weight:900;line-height:1;letter-spacing:0;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  box-shadow:0 2px 6px rgba(0,0,0,.5);
  pointer-events:none;z-index:30}
/* 自己的听章放到手牌堆的垂直中心，不要顶在容器上半空 */
.hand .ting{top:auto;bottom:calc(var(--th)/2 - var(--bkSlotW)/2);transform:translateX(-50%)}
/* 竖排（东西家）花/副露槽：牌旋转 90° 后的占位盒 */
.fslot{position:relative;flex:0 0 auto;width:26px;height:19px}
.fslot .tile{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(90deg);margin:0}
.fslot.r .tile{transform:translate(-50%,-50%) rotate(-90deg)}
/* 牌河竖排槽（东西家）：占位 = 视觉，避免旋转牌重叠/被裁
   v1.2.25：槽位宽高与 .tile.rv 对调——牌本身是竖长条（14×20），旋转 90° 后
   在屏幕上呈横躺（视觉 20 宽 × 14 高），这样从东西家自己的视角看仍是竖立瘦长的，
   与我自己的 xs 牌（16×22）观感一致、只是小一圈。
   （v1.2.24 把牌做成 20×14 的矮胖盒，旋转后在屏幕上是竖立的，等于从东西家视角看是横躺矮胖） */
.rvslot{position:relative;flex:0 0 auto;width:21px;height:15px}
.rvslot .tile{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(90deg);margin:0}
.rvslot.r .tile{transform:translate(-50%,-50%) rotate(-90deg)}
/* 北家：花/副露排牌面朝上（对着我看清，排列顺序按北家视角从右到左） */
/* 西/东家花/副露朝向 */
#ml3.fx .fg > .tile,#ml3.fx .mg > .tile{transform:rotate(90deg)}
#ml1.fx .fg > .tile,#ml1.fx .mg > .tile{transform:rotate(-90deg)}

/* ---------- 中央：牌河 + 桌心 ---------- */
.mid{flex:1 1 auto;display:flex;flex-direction:column;gap:3px;min-height:0;min-width:0}
.river{background:rgba(0,0,0,.26);border:1px solid rgba(255,255,255,.09);border-radius:7px;padding:2px;
  display:flex;gap:1px;flex-wrap:wrap;align-content:flex-start;overflow:hidden;min-height:0;position:relative}
/* 局间「准备下一局」：自己牌河上的大「准备」字样 */
.readyBadge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:min(20px,4vw);font-weight:900;color:var(--gold);letter-spacing:2px;text-indent:2px;
  background:rgba(0,0,0,.55);z-index:5;text-shadow:0 0 8px rgba(255,207,92,.6);line-height:1;padding:2px}
.rh{flex:0 0 auto;height:56px}
/* v1.2.6：牌河牌恢复统一大小（与上下两家一致，撤销 v1.2.5 的缩小）；
   左右牌河（rv）加宽到 48px 放下两列占位槽（23×2+gap），高度定高 13 张并居中，
   两排均衡排布（对应左右家视角的 13×2），桌心圆两侧留白由牌河居中消化 */
/* v1.2.25：槽位宽度 21px → 两列 43px，容器收到 44px（牌变小后不留多余空白） */
.rv{flex:0 0 44px;width:44px;flex-direction:column;flex-wrap:wrap;justify-content:flex-start;
  align-content:flex-start;height:calc(13 * 15px + 12px + 4px);align-self:center;padding:1px 0;overflow:hidden}
/* v1.2.13：rv 实际高度由 fitRivers() 按可用空间实时设置（页面高→加高、矮→缩短），
   行数钳制在 10~17 行；此条是 JS 未运行时的兜底 */
.rv{height:clamp(170px, calc((100dvh - 430px) * .55), 288px)}
/* 牌河排列方向 = 每个人自己视角的「从左到右」；牌面朝向：
   东西家牌顶朝桌心（横躺朝他们），北家牌面朝上（对着我看清，排列顺序仍按北家视角） */
#rvN{flex-direction:row-reverse}
#rvE{flex-direction:column-reverse}
.rowmid2{flex:1 1 auto;display:flex;gap:3px;min-height:0}
.core{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;gap:3px;
  min-height:0;padding:6px 3px;overflow:visible;justify-content:center}
/* v1.2.15：桌心上方改为「骰子 + 剩余牌数」——固定高度，防桌心圆上下漂移；
   豹子/开宝时只高亮骰子（.kb），不再写「豹子 ×2」文字；荒番只显示在右上角 */
.diceline{flex:0 0 auto;max-width:100%;height:26px;display:flex;align-items:center;justify-content:center;
  gap:7px;white-space:nowrap;overflow:hidden;line-height:1}
.diceline .wl{font-size:17px;font-weight:800;color:#eaf5ef;font-variant-numeric:tabular-nums;
  text-shadow:0 2px 6px rgba(0,0,0,.6)}
/* 圆心倒计时（v1.2.15）：纯数字黄色高亮，无决策时显示「——」占位（高度稳定不漂移） */
.dial .ctr .cd{font-size:min(30px,5.4vw);font-weight:800;color:var(--gold);line-height:1;
  font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(255,207,92,.55),0 2px 6px rgba(0,0,0,.6)}
.dial .ctr .cd.warn{color:#ff8a6a;text-shadow:0 0 12px rgba(255,90,60,.75);animation:cdWarn .7s ease-in-out infinite}
@keyframes cdWarn{0%,100%{opacity:1}50%{opacity:.45}}

/* 桌心罗盘（v1.2.3：圆略缩、方位块略大、东四字略大、指针底边缩到比方位块窄） */
.dial{position:relative;width:min(130px,22vw);max-width:100%;aspect-ratio:1;height:auto;border-radius:50%;flex:0 0 auto;
  background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.11),rgba(0,0,0,.34) 70%);
  border:1px solid rgba(255,255,255,.15);box-shadow:inset 0 2px 10px rgba(0,0,0,.5)}
.dial .dw{position:absolute;width:min(30px,5.4vw);height:min(30px,5.4vw);border-radius:7px;display:flex;align-items:center;
  justify-content:center;font-size:min(15px,3.8vw);font-weight:800;color:#b9cfc5;background:rgba(0,0,0,.34);
  border:1px solid rgba(255,255,255,.12)}
.dial .dw.cur{background:linear-gradient(180deg,#ffe6a3,#e8a927);color:#3a2a00;border-color:#ffe9b0;
  box-shadow:0 0 9px rgba(255,207,92,.65)}
/* 方位块贴近圆边：指针从方位块外侧伸出后正好穿过圆的边框「戳」出去（指针在圆之上，遮住一点圆边） */
.dial .dw.n{left:50%;top:1px;transform:translateX(-50%)}
.dial .dw.s{left:50%;bottom:1px;transform:translateX(-50%)}
.dial .dw.w{left:1px;top:50%;transform:translateY(-50%)}
.dial .dw.e{right:1px;top:50%;transform:translateY(-50%)}
/* 轮到谁：在方位块外侧挂一枚向外指的三角指针（转盘指针的感觉），比只换个底色醒目得多 */
.dial .dw.cur::after{content:'';position:absolute;width:0;height:0;
  filter:drop-shadow(0 0 6px rgba(255,207,92,.95));animation:dialPtr 1.1s ease-in-out infinite;z-index:6}
@keyframes dialPtr{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
/* 指针：半宽 8px（总底 16，< 方位块宽 30，更协调），伸出 12px（穿过圆边向外戳） */
.dial .dw.n.cur::after{bottom:100%;left:50%;margin-left:-8px;border-width:0 8px 12px;border-style:solid;border-color:transparent transparent var(--gold) transparent;transform-origin:50% 100%}
.dial .dw.s.cur::after{top:100%;left:50%;margin-left:-8px;border-width:12px 8px 0;border-style:solid;border-color:var(--gold) transparent transparent transparent;transform-origin:50% 0}
.dial .dw.w.cur::after{right:100%;top:50%;margin-top:-8px;border-width:8px 12px 8px 0;border-style:solid;border-color:transparent var(--gold) transparent transparent;transform-origin:100% 50%}
.dial .dw.e.cur::after{left:100%;top:50%;margin-top:-8px;border-width:8px 0 8px 12px;border-style:solid;border-color:transparent transparent transparent var(--gold);transform-origin:0 50%}
.dial .ctr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center}
/* v1.2.15：圆心旧「剩余牌数字+标签」（.num/.lab）与桌心 tags（.tags/.tg）已移除——
   剩余牌数挪到桌心上方骰子后，倒计时放圆心（.cd），荒番只在右上角 */
/* 桌心骰子（v1.2.3：缩小骰子，更紧凑；v1.2.15 移到桌心上方 diceline，豹子/开宝高亮不写文字） */
.diceC{display:inline-flex;gap:4px;align-items:center;padding:2px 6px;border-radius:7px;
  background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14)}
.die{width:17px;height:17px;border-radius:4px;position:relative;
  background:linear-gradient(180deg,#fffdf6,#ece3c8);box-shadow:0 1px 3px rgba(0,0,0,.5),inset 0 1px 0 #fff}
.die i{position:absolute;width:3.6px;height:3.6px;border-radius:50%;background:#1a1a1a;
  transform:translate(-50%,-50%);box-shadow:inset 0 -1px 1px rgba(0,0,0,.4)}
.diceC.kb{background:rgba(122,68,0,.5);border-color:var(--gold);box-shadow:0 0 8px rgba(255,207,92,.35)}
.diceC.kb .die i{background:#b5321f}

/* ---------- 玩家区（南） ---------- */
.hand{display:flex;gap:0;justify-content:center;align-items:flex-end;flex-wrap:nowrap;
  min-height:calc(var(--th) + 4px);max-width:100%;overflow:hidden;
  padding-top:14px;margin-top:-14px;position:relative}
.hand .tile{cursor:pointer;transition:transform .12s,box-shadow .12s;position:relative;
  box-shadow:0 3px 0 #b9b09a,0 4px 5px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.95)}
.hand .tile.sel{transform:translateY(-10px);z-index:5;
  box-shadow:0 5px 0 #b9b09a,0 7px 10px rgba(0,0,0,.55),0 0 0 2px var(--gold),inset 0 1px 0 rgba(255,255,255,.95)}
/* v1.2.25：非出牌回合手牌也能点（查看台面同牌），所以光标仍给可点反馈；
   视觉上「不可打出」由选中态与提示行表达，不再用 cursor:default */
.hand .tile.locked{cursor:pointer}
.hand .drawgap{width:7px;flex:0 0 7px}
.hint{text-align:center;font-size:11px;color:var(--dim);height:15px;line-height:15px;margin-top:2px;flex:0 0 auto}
.hint b{color:var(--gold)}
/* v1.2.7：听牌行固定占位（17px），通过 opacity 切换显示/隐藏，避免高度变化挤压中间牌桌区域 */
.tingline{text-align:center;font-size:11px;color:var(--gold);line-height:15px;min-height:17px;max-height:17px;
  overflow:hidden;flex:0 0 auto;padding:1px 0 2px;opacity:0;transition:opacity .15s ease}
.tingline.show{opacity:1}
.tingline b{color:var(--gold);font-weight:800}
.tingline .w{color:var(--blue);font-weight:700}

/* ---------- 操作按钮 ---------- */
.acts{flex:0 0 auto;display:flex;gap:6px;justify-content:center;height:46px;margin-top:3px;padding:0 4px}
.acts button{flex:1 1 0;min-width:0;height:46px;padding:0 10px;border-radius:12px;font-size:16px;font-weight:800;
  background:var(--card2);border:1px solid var(--line);letter-spacing:1px;white-space:nowrap;overflow:hidden;
  box-shadow:0 2px 6px rgba(0,0,0,.35)}
.acts button:active{transform:scale(.96)}
.acts button.none{background:rgba(255,255,255,.07);color:var(--dim);font-size:14px;letter-spacing:1px}
.acts button.hu{background:linear-gradient(180deg,#ff7a5e,#e8432c);border-color:#ff9d86}
.acts button.pung{background:linear-gradient(180deg,#5fb8ff,#2b7fd4);border-color:#8ecdff}
.acts button.kong{background:linear-gradient(180deg,#7bd8a6,#2f9e6c);border-color:#a6ecc8}
.acts button.chow{background:linear-gradient(180deg,#ffd06a,#e5a52c);border-color:#ffe3a0;color:#4a3200}
.acts button.knock{background:linear-gradient(180deg,#ff9ec4,#e04f8d);border-color:#ffc2dc}
.acts button.pri{background:linear-gradient(180deg,#ffd473,#e8a927);color:#3d2a00;border-color:#ffe0a3}
.acts button.hist{background:var(--card2);color:var(--txt);font-size:14px;letter-spacing:1px}

/* ---------- 麻将牌 ---------- */
.tile{width:var(--tw);height:var(--th);border-radius:5px;flex:0 0 auto;position:relative;overflow:hidden;
  line-height:1;
  background:linear-gradient(178deg,#fffef8 0%,#fdf8e9 46%,#f4ebd7 80%,#e9dec5 100%);
  border:1px solid #c9c0a9;
  box-shadow:0 2px 0 #c6bdA6,0 3px 4px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.95)}
.tile:before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:4px;
  background:linear-gradient(152deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,0) 44%,rgba(0,0,0,.045) 100%)}
.tile svg{position:relative;display:block;width:100%;height:100%}
.tile.sm{--tw:19px;--th:26px;border-radius:4px}
.tile.xs{--tw:16px;--th:22px;border-radius:3px}
/* v1.2.25：左右牌河牌——牌本身保持竖长条 14×20（比我的 xs 牌 16×22 小一圈），
   由 .rvslot 负责旋转 90°；旋转后在屏幕上横躺（视觉 20×14），
   从东西家自己视角看仍是竖立瘦长的，跟他们看自己手牌的观感一致 */
.tile.rv{--tw:14px;--th:20px;border-radius:2.5px}
.tile.xxs{--tw:13px;--th:18px;border-radius:2px}
.tile.fl{background:linear-gradient(178deg,#fffbe8 0%,#fdf3d2 50%,#f2e5b8 100%);border-color:#d6c48c}
.tile.dimmed{opacity:.5}
.tile.hl{box-shadow:0 0 0 2px var(--gold),0 3px 8px rgba(0,0,0,.5)}
.tile.last{box-shadow:0 0 0 2px var(--red),0 3px 8px rgba(0,0,0,.5)}
/* v1.2.13：出牌点选时，台面相同牌高亮（蓝色框，区别于上张打出的红框） */
/* v1.2.18：加宽到 3px 并叠一圈光晕，牌河/副露里的同牌一眼能扫到 */
.tile.hl{box-shadow:0 0 0 3px #39c0ff,0 0 0 6px rgba(57,192,255,.28),0 0 12px 2px rgba(57,192,255,.65),0 3px 8px rgba(0,0,0,.5);z-index:2}
.tile.back{background:linear-gradient(158deg,#33a07c 0%,#1d7460 50%,#11513f 100%);border-color:#0b3c2d}
.tile.back:after{content:"";position:absolute;inset:2.5px;border-radius:2px;border:1px solid rgba(255,255,255,.20)}
.tile .badge{position:absolute;top:-1px;right:0;font-size:8px;background:var(--red);color:#fff;
  border-radius:0 0 0 4px;padding:0 2px;line-height:9px;font-weight:700;z-index:2}
.meld{display:flex;gap:1px;align-items:center}
.meld .tile{--tw:18px;--th:25px}
/* v1.2.6：暗杠四张全部可见（整组米色牌背），不再把中间两张 visibility:hidden——
   之前只看到边上两张、中间像缺牌，被当成显示 bug */
.meld .tile.concealed{background:linear-gradient(178deg,#e6dfcd,#cfc6b0);border-color:#b3aa94}

/* ---------- 弹层 ---------- */
.mask{position:fixed;inset:0;background:rgba(3,14,10,.78);backdrop-filter:blur(3px);z-index:70;
  display:flex;align-items:center;justify-content:center;padding:16px}
/* hide：统一的隐藏类（首页面板切换、弹层、开始按钮都用它） */
.hide{display:none !important}
.sheet{background:linear-gradient(180deg,#123a2c,#0b291f);border:1px solid var(--line);border-radius:16px;
  width:100%;max-width:420px;max-height:86dvh;overflow:auto;padding:14px}
.sheet h2{margin:0 0 10px;font-size:17px;display:flex;align-items:center;gap:6px}
.sheet h2 .sp{flex:1}
.sheet .close{font-size:20px;color:var(--dim);padding:0 4px}
.result .winner{font-size:22px;font-weight:800;text-align:center;margin:6px 0 2px}
.result .sub{text-align:center;font-size:12px;color:var(--dim);margin-bottom:10px}
.tlist{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin:6px 0 10px;
  background:rgba(0,0,0,.26);padding:8px 6px;border-radius:9px}
.scoreTbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.scoreTbl th,.scoreTbl td{padding:5px 4px;text-align:center;border-bottom:1px solid rgba(255,255,255,.08)}
.scoreTbl th{color:var(--dim2);font-weight:500;font-size:10px}
.scoreTbl td.pos{color:var(--green);font-weight:700}
.scoreTbl td.neg{color:var(--red);font-weight:700}
.fanbreak{background:rgba(0,0,0,.25);border-radius:9px;padding:8px 10px;font-size:12px;line-height:1.9}
.fanbreak .li{display:flex;gap:8px;border-bottom:1px dashed rgba(255,255,255,.08)}
.fanbreak .li:last-child{border:0}
.fanbreak .li .n{flex:1}
.fanbreak .li .v{color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.fanbreak .li.tot{border-top:1px solid var(--line);margin-top:3px;padding-top:4px;font-weight:700}
.btns{display:flex;gap:8px;margin-top:12px}
.btns button{flex:1;height:44px;border-radius:11px;font-size:15px;font-weight:700;background:var(--card2);border:1px solid var(--line)}
.btns button.pri{background:linear-gradient(180deg,#ffd473,#e8a927);color:#3d2a00;border-color:#ffe0a3}

/* 历史记录 */
.sheet h2 .hcnt{font-size:11px;color:var(--dim2);font-weight:400}
.dimc{text-align:center;color:var(--dim2);font-size:11px;line-height:1.6;margin:10px 0 2px}
.hlist{max-height:52vh;overflow:auto;margin-top:10px;border-top:1px solid rgba(255,255,255,.08)}
.hrow{padding:8px 2px;border-bottom:1px solid rgba(255,255,255,.08);cursor:pointer}
.hrow:active{background:rgba(255,255,255,.06)}
.hr1{display:flex;align-items:center;gap:6px}
.hw{font-size:11px;color:var(--dim);font-weight:600}
.hk{font-size:10px;font-weight:800;padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.10);color:var(--dim)}
.hk.kw{background:linear-gradient(180deg,#ffd473,#e8a927);color:#3d2a00}
.hk.kl{background:rgba(255,255,255,.12);color:var(--txt)}
.hk.kj{background:rgba(120,150,255,.22);color:#b9c8ff}
.hgo{margin-left:auto;font-size:10px;color:var(--dim2)}
.hr2{font-size:12px;color:var(--txt);margin-top:3px}
.hr3{display:flex;gap:8px;font-size:10px;color:var(--dim2);margin-top:2px;font-variant-numeric:tabular-nums}
.hr3 .pos{color:var(--green);font-weight:700}
.hr3 .neg{color:var(--red);font-weight:700}

/* 设置 */
.setrow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.setrow .lb{flex:1;font-size:13px}
.setrow .lb small{display:block;color:var(--dim2);font-size:10px;margin-top:1px}
.seg{display:flex;background:rgba(0,0,0,.28);border-radius:8px;padding:2px;gap:2px}
.seg button{padding:5px 9px;font-size:12px;border-radius:6px;color:var(--dim)}
.seg button.on{background:var(--gold);color:#3d2a00;font-weight:700}
/* 只读态（联机非房主 / 已开局）：显示同样的分段，但不可点 */
.seg.ro{gap:0}
.seg span{padding:5px 9px;font-size:12px;border-radius:6px;color:var(--dim2)}
.seg span.on{background:var(--gold);color:#3d2a00;font-weight:700}
/* 敲听选择面板：列出「打X → 听Y」的每个听法 */
.knockList{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.knockList .knockOpt{width:100%;padding:11px 12px;border-radius:10px;font-size:14px;font-weight:700;
  background:var(--card2);border:1px solid var(--line);color:var(--txt);text-align:left}
.knockList .knockOpt:active{transform:scale(.98);filter:brightness(1.15)}

/* 规则 */
.ru h3{margin:14px 0 6px;font-size:13px;color:var(--gold)}
.ru h3:first-child{margin-top:0}
.ru p,.ru li{font-size:12px;line-height:1.75;color:#cfe0d8;margin:3px 0}
.ru table{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:4px}
.ru th,.ru td{border:1px solid rgba(255,255,255,.13);padding:4px 5px;text-align:left}
.ru th{background:rgba(255,255,255,.06);color:var(--txt);font-weight:600}
.ru td.f{color:var(--gold);text-align:center;font-weight:700;white-space:nowrap}
.ru ul{margin:3px 0;padding-left:18px}

/* 结算里的牌展示（v1.2.4：缩小一档，弹窗里能多显示几排也不挤） */
.tlist .tile{--tw:25px;--th:34px;border-radius:3.5px}
.tlist .tile.sm{--tw:21px;--th:28px}
.tlist{gap:2px}

/* Toast */
/* 牌河区域内的浮窗（吃/碰/杠/敲）：fixed 贴到牌河中心，z-index 低于弹层(70)，弹窗时不会盖上来 */
.seatTst{position:fixed;z-index:65;padding:7px 13px;border-radius:10px;font-size:15px;font-weight:800;
  letter-spacing:1px;white-space:nowrap;pointer-events:none;
  background:linear-gradient(180deg,#ffd473,#e8a927);color:#3d2a00;border:1px solid #ffe0a3;
  box-shadow:0 6px 18px rgba(0,0,0,.55);animation:seatTstPop 2s ease forwards}
@keyframes seatTstPop{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1)}
  78%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.94)}}
#toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:80;pointer-events:none;
  display:flex;flex-direction:column;gap:6px;align-items:center}
.tst{background:rgba(0,0,0,.72);border:1px solid var(--line);padding:7px 14px;border-radius:20px;
  font-size:14px;font-weight:700;animation:pop 2s ease forwards;white-space:nowrap}
.tst.big{font-size:20px;padding:10px 20px;background:rgba(232,67,44,.9);border-color:#ff9d86}
.tst.gold{background:rgba(232,169,39,.92);color:#3d2a00;border-color:#ffe0a3}
@keyframes pop{0%{opacity:0;transform:scale(.7)}18%{opacity:1;transform:scale(1.06)}
  70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.95) translateY(-14px)}}

/* 日志（v1.2.3：单行省略，绝不超 max-height；行数自适应从 3 条起逐减） */
.logbar{display:flex;flex-direction:column;align-items:center;gap:1px;width:100%;flex:0 0 auto}
.log{font-size:9px;color:var(--dim2);line-height:13px;width:100%;flex:0 0 auto;
  padding:0 2px;display:flex;flex-direction:column-reverse;min-height:13px;max-height:39px;overflow:hidden}
/* v1.2.14：log 模块窗口级自适应——fitLog() 按可用空间算行数（0~3）并固定高度；
   同一窗口内行数不变（内容多少不挤占空间），窗口矮时压缩行数甚至只留「查看」按钮 */
/* v1.2.15：flex:0 0 13px 禁止收缩——空间不够时由 fitLog() 减行，
   绝不让 flex 把行高压扁导致两行字叠在一起（旧版此处会被挤成 0 高/重叠） */
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;
  flex:0 0 13px;height:13px;line-height:13px}
.logmore{font-size:9.5px;color:var(--gold);opacity:.9;cursor:pointer;text-align:center;
  padding:0 6px 1px;line-height:1.2;border-bottom:1px solid rgba(255,207,92,.5);
  -webkit-tap-highlight-color:transparent}
.logmore:active{opacity:.55}
/* 本局完整记录 */
.lglist{max-height:56vh;overflow:auto;margin-top:8px}
.lgrow{display:flex;gap:7px;padding:5px 2px;font-size:12px;border-bottom:1px solid rgba(255,255,255,.07)}
.lgi{flex:0 0 20px;color:var(--dim2);font-size:10px;text-align:right;font-variant-numeric:tabular-nums}

/* 断点里的罗盘尺寸同样带 vw 上限：矮屏缩小的同时，窄屏也不会被撑大（各尺寸比例一致） */
@media (max-height:700px){
  :root{--tw:22px;--th:30px;--bkSlotW:20px}
  .dial{width:min(104px,22vw)}
  .dial .ctr .cd{font-size:min(26px,4.8vw)}
  .rh{height:50px}
}
@media (max-height:620px){
  :root{--tw:20px;--th:28px;--bkSlotW:18px}
  .dial{width:min(94px,22vw)}
  .dial .ctr .cd{font-size:min(23px,4.8vw)}
  .rh{height:52px}
  .nm{font-size:9px;padding:1px 5px}
  .hud .v{font-size:17px}
}
@media (max-width:340px){
  :root{--tw:21px;--th:29px;--bkSlotW:19px}
  .dial{width:min(100px,22vw)}
  .fx .tile{--tw:16px;--th:22px}
  .fslot{width:23px;height:17px}
}
@media (max-height:600px){
  .dial{width:min(84px,22vw)}
  .dial .ctr .cd{font-size:min(20px,4.8vw)}
  .dial .dw{width:min(24px,5.4vw);height:min(24px,5.4vw);font-size:min(13px,3.8vw)}
  .diceline{height:22px}
  .diceline .die{width:14px;height:14px}
  .diceline .wl{font-size:15px}
  .logbar{display:none}
  .rh{height:52px}
}
@media (max-width:330px){
  :root{--tw:19px;--th:26px}
  .dial{width:min(88px,22vw)}
  .fx .tile{--tw:15px;--th:21px}
  .fslot{width:22px;height:16px}
}

/* ---------- 首页 / 多人大厅 / 房间 ---------- */
#home{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(130% 90% at 50% 18%,#0e4030 0%,#061a13 72%);
  overflow:hidden;touch-action:pan-y}
.homeBox{width:min(360px,90vw);text-align:center;animation:hIn .28s ease}
@keyframes hIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hTitle{font-size:36px;font-weight:900;color:var(--gold);letter-spacing:8px;margin:6px 0 2px;
  text-shadow:0 3px 16px rgba(0,0,0,.55),0 0 1px rgba(255,207,92,.8)}
.hTitle .sub{display:block;font-size:12px;letter-spacing:4px;color:var(--dim);font-weight:500;margin-top:6px}
.hDeco{display:flex;justify-content:center;gap:7px;margin-bottom:14px}
.hDeco .tile{--tw:26px;--th:36px}
/* 按钮文案一律居中：图标与标题同一行居中，副标题另起一行 */
.hBtn{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:0 9px;width:100%;
  margin:13px 0 0;padding:13px 16px;border-radius:12px;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04));
  border:1px solid var(--line);color:var(--txt);font-size:17px;font-weight:800;letter-spacing:2px;text-align:center}
.hBtn small{flex:0 0 100%;font-size:11px;font-weight:400;letter-spacing:0;color:var(--dim);margin-top:3px;text-align:center}
.hBtn.solo{border-color:rgba(255,207,92,.35)}
.hBtn.solo::before{content:'🀄';font-size:19px}
.hBtn.multi{border-color:rgba(99,179,255,.35)}
.hBtn.multi::before{content:'👥';font-size:16px}
.hBtn.pri{background:linear-gradient(180deg,#2f8f68,#1d6b4c);border-color:rgba(120,220,170,.5)}
.hBtn.danger{background:linear-gradient(180deg,#9e3a3a,#6e2222);border-color:rgba(255,120,120,.5)}
.hBtn:active{transform:scale(.985);filter:brightness(1.12)}
.hBtn:disabled{opacity:.5;filter:grayscale(.75);pointer-events:none}
.hVer{margin-top:18px;font-size:10.5px;color:var(--dim2);letter-spacing:1px}
.hBack{display:inline-block;margin-top:16px;color:var(--dim);font-size:13px;padding:8px 14px;
  background:none;border:0;letter-spacing:1px}
.hBack:active{color:var(--txt)}
/* 表单 */
.lRow{display:flex;gap:8px;margin-top:12px;align-items:stretch}
.lLab{flex:0 0 auto;align-self:center;font-size:12px;color:var(--dim);letter-spacing:2px;width:52px;text-align:left}
.lInput{flex:1;min-width:0;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:10px;
  color:var(--txt);font-size:15px;padding:11px 12px;font-family:inherit;outline:none;letter-spacing:1px}
.lInput:focus{border-color:rgba(255,207,92,.55)}
.lInput::placeholder{color:var(--dim2);letter-spacing:0}
.lJoin{flex:0 0 auto;margin:0;padding:0 22px;border-radius:10px;font-size:15px;font-weight:800;
  background:linear-gradient(180deg,#2f8f68,#1d6b4c);border:1px solid rgba(120,220,170,.5);color:#fff;letter-spacing:2px}
.lJoin:disabled{opacity:.45}
.lErr{min-height:16px;margin-top:8px;font-size:11.5px;color:var(--red);letter-spacing:.5px}
.lErr.ok{color:var(--green)}
/* 房间等待 */
.rNoWrap{margin:8px 0 2px}
.rNoLab{font-size:11px;color:var(--dim);letter-spacing:3px}
.rNo{font-size:38px;font-weight:900;color:var(--gold);letter-spacing:6px;
  text-shadow:0 2px 14px rgba(0,0,0,.5);cursor:pointer}
.rNoHint{font-size:11px;color:var(--dim2);margin-top:2px}
/* v1.2.4：等待页简易牌桌：中央迷你桌心圆 + 上下左右四个位置 */
.rBoard{margin-top:14px;width:min(300px,78vw);aspect-ratio:1;margin-left:auto;margin-right:auto;
  display:grid;grid-template-columns:1fr 96px 1fr;grid-template-rows:1fr 96px 1fr;gap:8px;
  align-items:center;justify-items:center;position:relative}

<script>
"use strict";
/* =========================================================================
   上海敲麻 · 单人练习（单文件 / 无外部依赖）
   牌编码：0-8 万1-9 | 9-17 筒1-9 | 18-26 条1-9 | 27-30 东南西北 | 31 中 32 發 33 白
   花牌：100-107 春夏秋冬梅兰竹菊 | 108-111 中 | 112-115 发 | 116-119 白
   v1.2.17：敲麻玩法下中发白按 108-119 发（算花，不组牌）；清混碰下按 31-33 发
   （算牌不算花，可碰可组刻）。编码空间只有一套，墙里发哪套由 buildWall 按玩法决定。
   ========================================================================= */

/* ---------------- 基础工具 ---------------- */
const RANK_CH = ['一','二','三','四','五','六','七','八','九'];
const SUIT_CH = ['萬','筒','條'];
const WIND_CH = ['東','南','西','北'];
const HONOR_CH = ['東','南','西','北','中','發','白'];
const SEASON  = ['春','夏','秋','冬','梅','蘭','竹','菊'];
const TILECNT = 34;      // counts 数组长度
const PLAYCNT = 34;      // 参与组牌的牌种数（0..33；敲麻下 31-33 不上墙，循环空转无影响）

const isFlower = t => t >= 100;
const isSeason = t => t >= 100 && t <= 107;
const isWind   = t => t >= 27 && t <= 30;
const isHonor  = t => t >= 27;
const suitOf   = t => t < 9 ? 0 : t < 18 ? 1 : t < 27 ? 2 : 3;
const rankOf   = t => t < 27 ? (t % 9) + 1 : t - 26;

function flowerChar(t){
  if (t <= 107) return SEASON[t - 100];
  if (t <= 111) return '中';
  if (t <= 115) return '發';
  return '白';
}
function tileName(t){
  if (isFlower(t)) return flowerChar(t);
  if (isHonor(t)) return HONOR_CH[t - 27];
  return RANK_CH[t % 9] + SUIT_CH[suitOf(t)];
}
function toCounts(tiles){
  const c = new Array(TILECNT).fill(0);
  for (const t of tiles) c[t]++;
  return c;
}
function countsToTiles(c){
  const a = [];
  for (let i = 0; i < TILECNT; i++) for (let k = 0; k < c[i]; k++) a.push(i);
  return a;
}
const sortTiles = a => a.slice().sort((x, y) => x - y);
function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = (Math.random() * (i + 1)) | 0;
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------------- 胡牌判定 ---------------- */
// 判断 counts（手牌，不含副露）能否组成 need 个面子 + 1 个将
function isWinShape(counts, need){
  for (let p = 0; p < PLAYCNT; p++){
    if (counts[p] >= 2){
      counts[p] -= 2;
      const ok = formSets(counts, need);
      counts[p] += 2;
      if (ok) return true;
    }
  }
  return false;
}
function formSets(counts, n){
  if (n === 0){
    for (let i = 0; i < TILECNT; i++) if (counts[i]) return false;
    return true;
  }
  let i = 0;
  while (i < TILECNT && counts[i] === 0) i++;
  if (i === TILECNT) return false;
  if (counts[i] >= 3){
    counts[i] -= 3;
    const ok = formSets(counts, n - 1);
    counts[i] += 3;
    if (ok) return true;
  }
  if (i < 27 && (i % 9) <= 6 && counts[i + 1] > 0 && counts[i + 2] > 0){
    counts[i]--; counts[i + 1]--; counts[i + 2]--;
    const ok = formSets(counts, n - 1);
    counts[i]++; counts[i + 1]++; counts[i + 2]++;
    if (ok) return true;
  }
  return false;
}
// 全刻子（碰碰胡）形态
function isPungShape(counts, need){
  for (let p = 0; p < PLAYCNT; p++){
    if (counts[p] >= 2){
      counts[p] -= 2;
      const ok = formPungs(counts, need);
      counts[p] += 2;
      if (ok) return true;
    }
  }
  return false;
}
function formPungs(counts, n){
  if (n === 0){
    for (let i = 0; i < TILECNT; i++) if (counts[i]) return false;
    return true;
  }
  let i = 0;
  while (i < TILECNT && counts[i] === 0) i++;
  if (i === TILECNT) return false;
  if (counts[i] >= 3){
    counts[i] -= 3;
    const ok = formPungs(counts, n - 1);
    counts[i] += 3;
    if (ok) return true;
  }
  return false;
}
function isSevenPairs(counts){
  // 允许 4 张相同算两个对子（风一色「乱风向」依赖此规则：東東東東 南南南南 西西西西 北北）
  let pairs = 0, tot = 0;
  for (let i = 0; i < TILECNT; i++){
    tot += counts[i];
    if (counts[i] === 0) continue;
    if (counts[i] !== 2 && counts[i] !== 4) return false;
    pairs += counts[i] >> 1;
  }
  return tot === 14 && pairs === 7;
}

/* ---------------- 番型评估 ----------------
   返回 null 表示"不满足胡牌牌型（不能胡）"
   handCounts: 含胡张的手牌 counts（14 张等价）
   melds: 副露数组
-------------------------------------------*/
const TYPE_INFO = {
  '碰碰胡': 1, '混一色': 1, '清一色': 3, '混碰': 2, '清碰': 4, '风一色': 4, '风碰': 8
};
function evaluateShape(handCounts, melds, opts){
  const need = 4 - melds.length;
  const stdWin = isWinShape(handCounts, need);
  const seven  = melds.length === 0 && isSevenPairs(handCounts);
  if (!stdWin && !seven) return null;

  const all = countsToTiles(handCounts);
  for (const m of melds) for (const t of m.tiles) all.push(t);

  let numSuits = new Set(), hasWind = false, hasNum = false;
  for (const t of all){
    if (t >= 27 && t < 34) hasWind = true;   // v1.2.17：27-30 风牌 + 31-33 中发白都算字牌
    else if (t < 27){ hasNum = true; numSuits.add(suitOf(t)); }
  }
  // 碰碰胡：无吃牌 + 手牌可全刻子分解（七对子不算碰碰胡）
  const noChow = melds.every(m => m.type !== 'chow');
  const pungWin = !seven && noChow && isPungShape(handCounts, need);

  let type = null, base = 0;
  // v1.2.23：线性番（N 番 = 底 × N）。番表在旧版基础上整体 +1，
  // 保持牌型间相对等级（碰碰胡/混一色=2番起步），垃圾胡 0 番兜底按 1 倍计。
  if (!hasNum && hasWind){
    // 全风牌
    if (pungWin){ type = '风碰'; base = 9; }
    else { type = '风一色'; base = 5; }      // 乱风向（七对子形态）
  } else if (numSuits.size === 1 && !hasWind){
    if (pungWin){ type = '清碰'; base = 5; } else { type = '清一色'; base = 4; }
  } else if (numSuits.size === 1 && hasWind){
    if (pungWin){ type = '混碰'; base = 3; } else { type = '混一色'; base = 2; }
  } else if (pungWin){
    type = '碰碰胡'; base = 2;
  } else if (seven && CFG.sevenPairs){
    type = '七小对'; base = 3;      // 非传统敲麻牌型，默认关闭，可在设置里开启
  } else if (CFG.lajiHu && stdWin){
    type = '垃圾胡'; base = 0;      // 垃圾胡（推倒胡/平胡）：只算底花，0 番（计分兜底 ×1）
  } else {
    return null;   // 不允许的牌型
  }

  // 花数
  const f = opts.flowerCount || 0;
  return { type, base, total: base, flowers: f };
}

/* 花数计算（底花） */
function calcFlowers(p, handCounts){
  let f = (p.flowers || []).length;         // 每张花牌 1 花
  for (const m of (p.melds || [])){
    if (m.type === 'kong'){
      f += isWind(m.tile) ? (m.concealed ? 3 : 2) : (m.concealed ? 2 : 1);
    } else if (m.type === 'pung' && isWind(m.tile)){
      f += 1;
    }
  }
  // 手牌中的风牌暗刻
  if (handCounts){
    for (let t = 27; t <= 30; t++) if (handCounts[t] >= 3) f += 1;
  }
  return f;
}

/* 附加番 */
function extraFan(p, ctx){
  const add = [];
  if (p.menqing) add.push(['门清', 1]);
  if (calcFlowers(p, null) === 0) add.push(['无花果', 1]);   // v1.2.12：杠算花，暗杠/加杠都会破无花果
  if (ctx.diaoche) add.push(['大吊车', 1]);
  if (ctx.kongDraw) add.push(['杠上开花', 1]);
  if (ctx.haidi) add.push(['海底捞月', 1]);
  if (ctx.robKong) add.push(['抢杠', 1]);
  if (ctx.tianhu) add.push(['天胡', 8]);
  if (ctx.dihu) add.push(['地胡', 8]);
  return add;
}

/* ---------------- 向听数 ---------------- */
// 标准型向听（含副露）
function shantenStd(counts, fixedMelds){
  let best = 8 - 2 * fixedMelds;
  const cc = counts.slice();
  const dfs = (idx, melds, partials, pair) => {
    if (idx >= TILECNT){
      const m = melds + fixedMelds;
      let p = partials;
      const blocks = m + p + (pair ? 1 : 0);
      if (blocks > 5) p = Math.max(0, 5 - m - (pair ? 1 : 0));
      let s = 8 - 2 * m - p - (pair ? 1 : 0);
      if (blocks === 5 && !pair && m < 4) s += 1;   // 满块无将修正
      if (s < best) best = s;
      return;
    }
    if (cc[idx] === 0){ dfs(idx + 1, melds, partials, pair); return; }
    // 刻子
    if (cc[idx] >= 3){ cc[idx] -= 3; dfs(idx, melds + 1, partials, pair); cc[idx] += 3; }
    // 顺子
    if (idx < 27 && (idx % 9) <= 6 && cc[idx + 1] > 0 && cc[idx + 2] > 0){
      cc[idx]--; cc[idx + 1]--; cc[idx + 2]--;
      dfs(idx, melds + 1, partials, pair);
      cc[idx]++; cc[idx + 1]++; cc[idx + 2]++;
    }
    // 对子（作将 或 作搭子）
    if (cc[idx] >= 2){
      cc[idx] -= 2;
      if (!pair) dfs(idx, melds, partials, true);
      dfs(idx, melds, partials + 1, pair);
      cc[idx] += 2;
    }
    // 两面 / 嵌张
    if (idx < 27 && (idx % 9) <= 7 && cc[idx + 1] > 0){
      cc[idx]--; cc[idx + 1]--; dfs(idx, melds, partials + 1, pair); cc[idx]++; cc[idx + 1]++;
    }
    if (idx < 27 && (idx % 9) <= 6 && cc[idx + 2] > 0){
      cc[idx]--; cc[idx + 2]--; dfs(idx, melds, partials + 1, pair); cc[idx]++; cc[idx + 2]++;
    }
    // 孤张丢弃
    cc[idx]--; dfs(idx, melds, partials, pair); cc[idx]++;
  };
  dfs(0, 0, 0, false);
  return best;
}
// 碰碰胡向听
function shantenPung(counts, fixedMelds){
  let t = fixedMelds, p = 0;
  for (let i = 0; i < PLAYCNT; i++){
    if (counts[i] >= 3) t++;
    else if (counts[i] === 2) p++;
  }
  let s = 8 - 2 * t - Math.min(p, Math.max(0, 5 - t));
  if (t >= 4 && p === 0) s = 0;      // 大吊车单钓
  return Math.max(-1, s);
}
// 混一色 / 清一色 向听：目标花色 suit（0-2），allowWind 是否允许风牌
function shantenColor(counts, fixedMelds, suit, allowWind){
  const sub = new Array(TILECNT).fill(0);
  let out = 0;
  for (let i = 0; i < PLAYCNT; i++){
    if (!counts[i]) continue;
    const s = suitOf(i);
    if (s === suit) sub[i] += counts[i];
    else if (allowWind && i >= 27 && i < 34) sub[i] += counts[i];
    else out += counts[i];
  }
  // v1.2.16：废牌不再「每张 1 向听」全额累加。
  // 打掉一张废牌、摸进一张有效牌，这两件事在同一次进张里同时发生——
  // 换牌本身也在推进搭子，旧算法把 out 全额相加属于重复计数，
  // 混一色能算出 10~14，远超向听理论上限 8（4 面子 + 1 将）。
  // 结果它与「完全不计废牌」的碰碰胡向听不同量纲，AI 跨类型比较时永远选碰碰胡，
  // 清混碰玩法实际退化成只剩碰碰胡，谁也做不出混一色/清一色。
  // v1.2.18：废牌权重半价再降到 1/3——出掉 3 张废牌约只需 1 张「纯损失」（其余
  // 两张换回的牌同时就在推进搭子）。v1.2.16 的半价把散牌混一色仍算到封顶 8，
  // 与碰碰胡 6~7 相比毫无竞争力，机器人依然「无脑碰碰胡」；
  // 降到 1/3 后「一门已 7~9 张」的牌型才真正流向混一色/清一色。并封顶到理论上限 8。
  return Math.min(8, shantenStd(sub, fixedMelds) + Math.ceil(out / 3));
}
// 风一色向听（全风牌）
function shantenWindOnly(counts, fixedMelds){
  const sub = new Array(TILECNT).fill(0);
  let out = 0;
  for (let i = 0; i < PLAYCNT; i++){
    if (!counts[i]) continue;
    if (i >= 27 && i < 34) sub[i] += counts[i];   // 全字牌（风+中发白）
    else out += counts[i];
  }
  const std = shantenStd(sub, fixedMelds);
  // 七对子路线：k 种字牌成对的进度（27-30 风牌 + 31-33 中发白，共 7 种——全字七对刚好凑齐）
  let pairs = 0, kinds = 0;
  for (let i = 27; i <= 33; i++){ if (sub[i] >= 2) pairs++; if (sub[i] > 0) kinds++; }
  const seven = 6 - pairs - Math.max(0, Math.min(4, kinds) - pairs);
  // v1.2.16：与 shantenColor 同一套废牌折算（半价 + 封顶 8），保证各牌型向听同量纲
  return Math.min(8, Math.min(std, seven) + Math.ceil(out / 3));
}

const TYPES = ['pung', 'mix0', 'mix1', 'mix2', 'pure0', 'pure1', 'pure2', 'wind', 'std'];
function evalAll(counts, fixedMelds){
  const r = {
    pung:  shantenPung(counts, fixedMelds),
    mix0:  shantenColor(counts, fixedMelds, 0, true),
    mix1:  shantenColor(counts, fixedMelds, 1, true),
    mix2:  shantenColor(counts, fixedMelds, 2, true),
    pure0: shantenColor(counts, fixedMelds, 0, false),
    pure1: shantenColor(counts, fixedMelds, 1, false),
    pure2: shantenColor(counts, fixedMelds, 2, false),
    wind:  shantenWindOnly(counts, fixedMelds),
    std:   shantenStd(counts, fixedMelds)   // 垃圾胡（平胡）向听：普通顺子型
  };
  let best = Infinity, bt = 'pung';
  for (const k of TYPES){
    if (k === 'std' && !CFG.lajiHu) continue;   // 关掉垃圾胡就不往平胡方向算
    const v = r[k] + (k === 'pung' ? 0.2 : 0);   // 同分时略偏好碰碰胡以外（更容易达成）
    if (v < best){ best = v; bt = k; }
  }
  r.best = r[bt]; r.bestType = bt;
  return r;
}
function typeLabel(t){
  return { pung:'碰碰胡', mix0:'混一色(萬)', mix1:'混一色(筒)', mix2:'混一色(條)',
           pure0:'清一色(萬)', pure1:'清一色(筒)', pure2:'清一色(條)', wind:'风一色',
           std:'垃圾胡(平胡)' }[t] || t;
}
function typeBaseFan(t){
  // v1.2.23：线性番（番表 +1；std=垃圾胡 0 番兜底 1 倍）
  return { pung:2, mix0:2, mix1:2, mix2:2, pure0:4, pure1:4, pure2:4, wind:5, std:0 }[t] || 0;
}

  speed: 1        // 0.6 慢 / 1 中 / 1.8 快

/* ---------------- 牌墙 ---------------- */
function buildWall(){
  const w = [];
  for (let t = 0; t <= 30; t++) for (let k = 0; k < 4; k++) w.push(t);
  for (let f = 100; f <= 107; f++) w.push(f);
  // v1.2.17：中发白按玩法决定上墙形态——
  //  敲麻（lajiHu 开）：108-119，算花，起手/摸到即补走；
  //  清混碰（lajiHu 关）：31-33，算牌不算花，可碰、可成刻/将，风一色「全字」含它。
  //  两种玩法墙都是 144 张，总数不变。
  if (CFG.lajiHu){
    for (let k = 0; k < 4; k++){ w.push(108 + k); w.push(112 + k); w.push(116 + k); }
  } else {
    for (let k = 0; k < 4; k++){ w.push(31); w.push(32); w.push(33); }
  }
  return shuffle(w);
}
function drawFront(){
  if (G.wpos > G.wtail) return null;
  return G.wall[G.wpos++];
}
function drawTail(){
  if (G.wtail < G.wpos) return null;
  return G.wall[G.wtail--];
}
function wallLeft(){ return Math.max(0, G.wtail - G.wpos + 1); }
function seenCount(t){
  let n = 0;
  for (const p of G.players){
    for (const d of p.discards) if (d === t) n++;
    for (const m of p.melds) for (const x of m.tiles) if (x === t) n++;
  }
  return n;
}

/* ========================================================================
   动作判定
   ======================================================================== */
// 手牌（counts）加上 tile 后能否成胡牌型，返回评估结果
function tryWin(counts, p){
  const need = 4 - p.melds.length;
  const seven = p.melds.length === 0 && isSevenPairs(counts);
  if (!isWinShape(counts, need) && !seven) return null;
  const hc2 = counts.slice();
  const flowers = calcFlowers(p, hc2);
  return evaluateShape(hc2, p.melds, { flowerCount: flowers });
}
// 当前手牌是否已听牌（返回听牌列表）
function getWaits(p){ return getWaitsHand(p.hand, p.melds); }
function canKnock(p){
  if (p.knocked) return false;
  if (p.hand.length % 3 !== 1) return false;
  return getWaits(p).length > 0;
}

// 对打出的牌可以做什么
function claimOptions(p, tile, from, isNext){
  const opts = [];
  const hc = toCounts(p.hand);
  if (hc[tile] < 4){
    hc[tile]++;
    const ev = tryWin(hc, p);
    hc[tile]--;
    const blocked = p.missHu.has(tile);
    // v1.2.20：清混碰免敲——不需要敲定，能胡就有胡资格（敲麻仍要求已敲/天胡）
    if (ev && (p.knocked || p.tianDi || !CFG.lajiHu) && !blocked){
      opts.push({ k: 'hu', tile, ev });
    }
  }
  if (!p.knocked){
    if (hc[tile] >= 3) opts.push({ k: 'kong', tile });
    if (hc[tile] >= 2) opts.push({ k: 'pung', tile });
    if (isNext && CFG.allowChow && tile < 27){
      const r = tile % 9;
      const combos = [];
      if (r >= 2 && hc[tile - 2] && hc[tile - 1]) combos.push([tile - 2, tile - 1]);
      if (r >= 1 && r <= 7 && hc[tile - 1] && hc[tile + 1]) combos.push([tile - 1, tile + 1]);
      if (r <= 6 && hc[tile + 1] && hc[tile + 2]) combos.push([tile + 1, tile + 2]);
      for (const c of combos) opts.push({ k: 'chow', tile, combo: c });
    }
  }
  // v1.2.19+21：清混碰按「副露方向约束」过滤吃/碰/杠选项——胡(hu)不受影响
  // （牌型合法与否由 tryWin 判）。敲麻玩法有平胡兜底，不锁门。
  //  吃过 → 只本门+字；碰/杠过数牌（一门或多门）→ 彻底不再吃（v1.2.22：碰过就无吃按钮）
  if (!CFG.lajiHu && !p.knocked){
    const d = directionOf(p);
    if (!d.free){
      const kept = [];
      const ts = suitOf(tile);
      for (const o of opts){
        if (o.k === 'hu'){ kept.push(o); continue; }
        // v1.2.22：只要碰/杠过数牌（single 或 pung），吃选项一律不给；
        // 碰/杠照常（清混碰是靠碰做一色/碰碰胡的玩法）
        if (d.pung || d.single !== undefined){ if (o.k !== 'chow') kept.push(o); continue; }
        if (d.lock !== undefined){ if (ts === d.lock || ts === 3) kept.push(o); continue; }
      }
      return kept;
    }
  }
  return opts;
}
// 摸到牌后可暗杠 / 加杠
// v1.2.12：扫描整副手牌的可杠组合（暗杠 4 张 / 加杠 已碰+手里第 4 张），
// 不依赖「刚摸的牌」——手牌里早已攒齐第 4 张、轮到出牌时同样要问
function selfKongOptions(p){
  const out = [];
  const hc = toCounts(p.hand);
  const done = new Set();
  for (const t of p.hand){
    if (done.has(t)) continue;
    done.add(t);
    if (hc[t] === 4) out.push({ k: 'ankan', tile: t });
    for (const m of p.melds){
      if (m.type === 'pung' && m.tile === t){ out.push({ k: 'chakan', tile: t, meld: m }); break; }
    }
  }
  // v1.2.19：清混碰下「吃过即锁门」——已有吃牌(chow)副露时本局方向锁死为该花色，
  // 其他花色的暗杠/加杠都不能再做（会锁死牌型），只留本门与字牌（风/中发白）的杠
  if (!CFG.lajiHu){
    const ls = lockedSuitOf(p);
    if (ls !== null && ls >= 0) return out.filter(o => {
      const s = suitOf(o.tile);
      return s === ls || s === 3;
    });
  }
  return out;
}
// v1.2.19：清混碰「吃过即锁门」判定——玩家副露里有吃牌(chow)就返回它锁定的花色。
//  0/1/2 = 锁本门（只能再收本门 + 字牌，做本门混/清一色）；
//  -1 = 副露里出现两种花色的吃牌（防御：正常流程已被 claimOptions 拦住）；
//  null = 没吃过（碰碰胡 / 未定方向仍开放）。敲麻玩法有平胡兜底，不锁门。
function lockedSuitOf(p){
  if (CFG.lajiHu) return null;
  let ls = null;
  for (const m of p.melds){
    if (m.type !== 'chow') continue;
    const s = suitOf(m.tile);
    if (ls === null) ls = s;
    else if (ls !== s) ls = -1;
  }
  return ls;
}
// v1.2.21：副露方向约束（吃/碰/杠与做牌目标都必须与之相容）。
//  敲麻（lajiHu 开）有平胡兜底 → 恒自由。
//  { lock: 0/1/2 }  副露里有吃牌(chow) → 本局锁死该花色（只能本门+字，v1.2.19 语义）
//  { pung: true }   碰/杠出两门以上数牌刻 → 只能碰/杠（吃任何顺子都会死牌）
//  { single: 0/1/2 } 只碰/杠过一门数牌刻（可有字刻）→ v1.2.22：同样彻底不再吃；
//                    碰/杠照常开放（憋本门碰一色 / 跨门继续碰成碰碰胡都行）
//  { free: true }   没副露或只有字刻 → 方向未定，吃任意门都行（吃后转 lock）
function directionOf(p){
  if (CFG.lajiHu) return { free: true };
  let chowS = null;
  const numSuits = new Set();
  for (const m of p.melds){
    const t = m.tile;
    if (m.type === 'chow'){
      const s = suitOf(t);
      if (chowS === null) chowS = s; else if (chowS !== s) chowS = -1;
      continue;
    }
    if (t < 27) numSuits.add(suitOf(t));     // 数牌刻/杠
  }
  if (chowS !== null) return chowS >= 0 ? { lock: chowS } : { pung: true };
  if (numSuits.size >= 2) return { pung: true };
  if (numSuits.size === 1) return { single: [...numSuits][0] };
  return { free: true };
}
function removeTiles(arr, tiles){
  for (const t of tiles){
    const i = arr.indexOf(t);
    if (i >= 0) arr.splice(i, 1);
  }
}

/* ========================================================================
   AI
   ======================================================================== */
function aiTargetOf(p){
  const e = evalAll(toCounts(p.hand), p.melds.length);
  // v1.2.21：清混碰下做牌目标必须与已有副露相容——已经碰了萬刻就不能把方向换成
  // 筒混一色（先碰九萬再吃筒顺的死牌就是这么来的）。directionOf 给出约束后，
  // 冲突的 mix/pure/wind 门直接跳过，pung 只在没吃过顺子时才允许。
  const dir = CFG.lajiHu ? null : directionOf(p);
  const suitOK = s => !dir || dir.free || dir.single === s ||
    (dir.lock !== undefined && s === dir.lock);
  // 开着垃圾胡时，如果普通顺子型明显更近，就往平胡方向打
  if (CFG.lajiHu && e.std <= e.pung &&
      e.std <= Math.min(e.mix0, e.mix1, e.mix2)) return 'std';
  // v1.2.18：碰碰胡不再 +0.2 站台——两个牌型向听咬得越紧，越该让「成型更容易」的
  // 混/清一色（能吃顺子）上场，否则散牌起手机器人永远无脑做碰碰胡
  // v1.2.21：已吃过顺子(chow)时碰碰胡已不可能，pung 出局，只走本门一色路线
  let best = 'pung', bv = e.pung + 0.1;
  if (dir && dir.lock !== undefined) bv = 99;
  // v1.2.16：清混碰玩法下把「清一色 / 风一色」也纳入主攻方向——
  // 旧版只在「碰碰胡 + 混一色」里选，机器人永远做不出清一色，只会乱吃
  if (!CFG.lajiHu){
    for (let s = 0; s < 3; s++){
      if (!suitOK(s)) continue;   // v1.2.21：方向约束外的门不参与竞争
      // v1.2.18：本门不足 2 张就不参与混/清一色竞争——向听公式允许风牌混入，
      // 全风手牌对任意「混一色(本门)」也算出低向听（其实没有本门数牌可做），
      // 不设门槛的话风牌多时 mix* 会错误地抢走风一色/碰碰胡的目标
      let suitN = 0;
      for (const t of p.hand) if (t < 27 && suitOf(t) === s) suitN++;
      if (suitN < 2) continue;
      const mix = e['mix' + s], pure = e['pure' + s];
      // 清一色只在「与混一同向听」时押（3 番 > 1 番）；纯差 1 步时仍走混一色——
      // 旧版 pure-mix<=1 就押清一色太贪，混一色出线机会被挤掉
      const takePure = (pure <= mix);
      const v = takePure ? pure : mix;
      // v1.2.16：向听封顶 8 表示「这个牌型基本没戏」，此时别去抢碰碰胡——
      // 否则起手一门不占优时也会硬押混/清一色，花色锁一开就白白错过碰牌机会
      // v1.2.18：v<=bv（平手倾斜混/清一色）——两者同向听时混一色能吃顺子更容易成，
      // 不该让碰碰胡默认赢走平手
      if (v < 8 && v <= bv){ bv = v; best = (takePure ? 'pure' : 'mix') + s; }
    }
    // 风一色与混/清一色同向听时押风一色（4 番 > 1 番）。
    // v1.2.18：向听公式对字牌偏乐观（字种少、台面竞争激烈），加「字牌 ≥6」现实门槛——
    // 手上没几张字也押风一色会把整局打废；够 6 张字时（已有刻/对基础）同向听押 4 番值得
    // v1.2.21：已有数牌副露的方向不做风一色（方向已定/字不够）——只有自由方向且字够多才押
    let windN = 0;
    for (const t of p.hand) if (t >= 27) windN++;
    if ((!dir || dir.free) && windN >= 6 && e.wind < 8 && e.wind <= bv){ bv = e.wind; best = 'wind'; }
    return best;
  }
  for (const k of ['mix0', 'mix1', 'mix2']){
    const s = +k.slice(3);
    let suitN = 0;
    for (const t of p.hand) if (t < 27 && suitOf(t) === s) suitN++;
    if (suitN < 2) continue;
    if (e[k] < bv){ bv = e[k]; best = k; }
  }
  return best;
}
/* v1.2.16：把 AI 的目标翻译成「只吃/碰哪些牌」的花色约束。
   旧版只有 target 以 mix 开头才约束花色，target 是碰碰胡时什么花色都吃，
   结果就是「明明打着清混碰，机器人还在吃另外两门」。 */
function aiPlan(p){
  const t = p.target || 'pung';
  if (t === 'wind')        return { suit: 3, allowWind: true,  pung: false };   // 风一色：只留风牌
  if (t.startsWith('mix')) return { suit: +t.slice(3), allowWind: true,  pung: false };  // 混一色：本门 + 风
  if (t.startsWith('pure'))return { suit: +t.slice(4), allowWind: false, pung: false };  // 清一色：只本门
  return { suit: null, allowWind: true, pung: true };                          // 碰碰胡：不限花色，但不吃顺子
}
function tileFitsPlan(t, plan){
  if (plan.pung) return true;                 // 碰碰胡：任意牌都能碰/杠
  const s = suitOf(t);
  if (plan.suit === 3) return s === 3;        // 风一色：只要风牌
  return s === plan.suit || (plan.allowWind && s === 3);
}
function dangerScore(t, p){
  let seen = 0;
  for (const q of G.players) if (q !== p) for (const d of q.discards) if (d === t) seen++;
  let d = Math.max(0, 2 - seen);
  const threat = G.players.some(q => q !== p && (q.knocked || q.melds.length >= 2));
  if (threat) d *= 2;
  if (t >= 27) d = Math.max(0, d - 1);
  return d;
}
function aiChooseDiscard(p){
  const hc = toCounts(p.hand);
  const uniq = [...new Set(p.hand)];
  let best = null;
  const t0 = Date.now();
  for (const t of uniq){
    hc[t]--;
    const ev = evalAll(hc, p.melds.length);
    let sc = ev.best;
    if (p.target && ev[p.target] !== undefined && ev[p.target] <= ev.best + 1) sc = Math.min(sc, ev[p.target] - 0.35);
    let uke = 0;
    if (ev.best <= 2 && Date.now() - t0 < 900){
      for (let a = 0; a < PLAYCNT; a++){
        if (hc[a] >= 4) continue;
        hc[a]++;
        const e2 = evalAll(hc, p.melds.length);
        hc[a]--;
        if (e2.best < ev.best) uke += Math.max(0, 4 - seenCount(a));
      }
    }
    hc[t]++;
    // 中张价值（保留 3-7 更容易成型）
    const r = t < 27 ? (t % 9) + 1 : 5;
    const center = t < 27 ? (4 - Math.abs(r - 5)) * 0.6 : 0;
    const val = -sc * 1000 + uke * 14 - dangerScore(t, p) * 9 + center;
    if (!best || val > best.val) best = { t, val, sh: sc };
  }
  return best ? best.t : p.hand[p.hand.length - 1];
}
function aiClaim(p, tile, from, opts, isNext){
  const hu = opts.find(o => o.k === 'hu');
  if (hu) return hu;                                   // 敲麻：有和必和
  if (p.knocked) return null;
  // v1.2.18：每张牌打过来都重估一次做牌方向——开局只定一次 target 的老逻辑，
  // 会让机器人「边打边判断」失灵：碰出本门副露后明明混一色更近也不切换，或
  // 目标碰碰胡就整局无脑碰任何花色。实时刷新后花色锁、碰牌收益都跟最新局势走。
  p.target = aiTargetOf(p);
  // 清混碰：按做牌目标锁花色（敲麻有平胡兜底，吃碰自由度更高，沿用旧逻辑）
  const plan = CFG.lajiHu ? null : aiPlan(p);
  const hc = toCounts(p.hand);
  // v1.2.16：清混碰按「目标牌型」的向听算收益——旧版拿全类型最佳向听说事，
  // 结果明明在往混一色做，碰本门牌却因为「对最佳向听无改善」而一律不动
  const keyOf = e => (plan && p.target && e[p.target] !== undefined) ? e[p.target] : e.best;
  const cur = keyOf(evalAll(hc, p.melds.length));
  let bestPick = null, bestGain = 0.35;                // 需要明显收益才动牌
  for (const o of opts){
    if (plan){
      if (o.k === 'chow' && plan.pung) continue;       // 碰碰胡不吃顺子（顺子无益还占副露位）
      if (!tileFitsPlan(tile, plan)) continue;         // 花色不符：不碰/不吃/不杠
    }
    let gain = 0;
    if (o.k === 'pung'){
      removeTiles(p.hand, [tile, tile]);
      // v1.2.18：碰后必须弃一张——模拟「碰 + 最优弃牌」后的真实向听。
      // 旧版只算碰完两张的向听，孤对一碰向听-2 看着大赚；但若碰完被迫拆好搭子
      // 才是真亏，这正是「无脑碰」的来源。弃牌模拟让收益回归真实。
      let bk = 99;
      const uq = [...new Set(p.hand)];
      const t0 = Date.now();
      for (const dt of uq){
        p.hand.splice(p.hand.indexOf(dt), 1);
        const e = evalAll(toCounts(p.hand), p.melds.length + 1);
        p.hand.push(dt);
        if (e[bestT(p, e, plan)] < bk) bk = e[bestT(p, e, plan)];
        if (Date.now() - t0 > 200) break;              // 限时：极端手牌降级为「碰完不算弃牌」
      }
      if (bk === 99) bk = keyOf(evalAll(toCounts(p.hand), p.melds.length + 1));
      gain = cur - bk;
      if (p.target === 'pung') gain += 0.3;            // v1.2.18：0.6→0.3，明显改善才碰
      p.hand.push(tile, tile);
    } else if (o.k === 'kong'){
      removeTiles(p.hand, [tile, tile, tile]);
      const e = evalAll(toCounts(p.hand), p.melds.length + 1);
      gain = cur - keyOf(e) + 0.3;
      p.hand.push(tile, tile, tile);
    } else if (o.k === 'chow'){
      if (p.target && p.target.startsWith('mix') && suitOf(tile) !== +p.target.slice(3)) continue;
      removeTiles(p.hand, o.combo);
      const e = evalAll(toCounts(p.hand), p.melds.length + 1);
      gain = cur - keyOf(e) - 0.4;                     // 吃牌略保守（破门清）
      p.hand.push(...o.combo);
    }
    if (gain > bestGain){ bestGain = gain; bestPick = o; }
  }
  return bestPick;
}
// v1.2.18：pung 弃牌模拟里用的「该走哪个牌型」——取当前目标；目标缺失时退到最佳向听
function bestT(p, e, plan){
  if (plan && p.target && e[p.target] !== undefined) return p.target;
  return 'best';
}

  if (!PEND) return;

  if (NET.active){
    stopCd();
    NET.pend = null;
    netSend({ t:'act', kind, value: netSanitize(kind, v) });
    return;
  }
  r(v);
}

const FACE = {};
function faceKey(t){
  if (t >= 116) return 'haku';
  if (t >= 112) return 'hatsu';
  if (t >= 108) return 'chun';
  if (t >= 100) return 'f' + (t - 100);
  if (t === 31) return 'chun';       // 清混碰：中发白按普通牌编码（31-33）
  if (t === 32) return 'hatsu';
  if (t === 33) return 'haku';
  if (t >= 27) return 'w' + (t - 27);
  return 't' + t;
}
function faceSVG(t){
  const hit = FACE[t];
  if (hit !== undefined) return hit;
  const f = STD_FACES[faceKey(t)];
  const svg = '<svg viewBox="' + f[0] + '" preserveAspectRatio="xMidYMid meet">' + f[1] + '</svg>';
  FACE[t] = svg;
  return svg;
}
function tileEl(t, cls){
  const d = document.createElement('div');
  d.className = 'tile ' + (cls || '');
  if (t === null || t === undefined){ d.classList.add('back'); return d; }
  if (isFlower(t)) d.classList.add('fl');
  d.innerHTML = faceSVG(t);
  return d;
}
function meldEl(m, small){
  const box = document.createElement('div');
  box.className = 'meld' + (m.type === 'kong' && m.concealed ? ' concealedKong' : '');
  for (const t of m.tiles){
    const e = tileEl(t, (small ? 'xs' : '') + (m.type === 'kong' && m.concealed ? ' concealed' : ''));
    box.appendChild(e);
  }
  return box;
}
function logMsg(s){
  G.logs.push(s);
  if (G.logs.length > 200) G.logs.shift();
  const box = $('log');
  box.innerHTML = '';
  // v1.2.3：默认显示 3 条，空间不够自动减少为 2 / 1 条，绝不溢出
  let n = Math.min(3, G.logs.length);
  const total = G.logs.length;
  while (n > 1){
    box.innerHTML = '';
    for (let i = total - 1; i >= total - n; i--){
      const d = document.createElement('div');
      d.textContent = G.logs[i];
      box.appendChild(d);
    }
    if (box.scrollHeight <= box.clientHeight + 1) break;
    n--;
  }
}
// 本局每一手的完整记录
function openHandLog(){
  const list = G.logs || [];
  const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const body = list.length
    ? '<div class="lglist">' + list.map((s, i) =>
        '<div class="lgrow"><span class="lgi">' + (i + 1) + '</span><span>' + esc(s) + '</span></div>').join('') + '</div>'
    : '<p class="dimc">本局还没有出牌记录。</p>';
  openSheet('<h2><span>本局记录</span><span class="sp"></span>' +
    '<span class="hcnt">' + WIND_NAME[G.roundWind] + ' 第 ' + G.handNo + ' 局 · ' + list.length + ' 手</span>' +
    '<button class="close" onclick="closeSheet()">×</button></h2>' +
    body +
    '<div class="btns"><button class="pri" onclick="closeSheet()">关闭</button></div>');
}
function toast(text, cls, seat){
  // 带座位的提示（吃/碰/杠/敲）：落在当事人自己的牌河区；seatToast 定义在联机模块后（客户端专属）
  if (seat != null && typeof seatToast === 'function'){ seatToast(seat, text); return; }
  const box = $('toast');
  const d = document.createElement('div');
  d.className = 'tst ' + (cls || '');
  d.textContent = text;
  box.appendChild(d);
  setTimeout(() => d.remove(), 2100);   // 与 pop 动画时长一致：停留约 2 秒再消失
}

let SEL = null;   // 玩家选中的手牌（牌 ID，逻辑用）
let SELIDX = null; // 选中位置（区分手里相同的牌）
function renderHand(){
  const p = G.players[0];
  const box = $('hand');
  box.innerHTML = '';
  // v1.2.13：点手牌区空白处（非牌）→ 选中的牌落回（不打出）
  box.onclick = (e) => {
    const t = e.target;
    if (t !== box && !(t.classList && (t.classList.contains('drawgap') || t.classList.contains('ting')))) return;
    if (SEL !== null){ SEL = null; SELIDX = null; renderHand(); renderRiver(); renderMe(); renderSeats(); }
  };
  const arr = p.hand.slice();
  let drawn = p.drawn;
  if (drawn !== null && drawn !== undefined){
    const i = arr.indexOf(drawn);
    if (i >= 0) arr.splice(i, 1);
  } else drawn = null;
  arr.sort((a, b) => a - b);
  const canPick = PEND && PEND.kind === 'discard';
  const n = arr.length + (drawn !== null ? 1 : 0);
  const gap = n >= 14 ? 2 : 1;
  box.style.gap = gap + 'px';
  arr.forEach((t, k) => {
    const e = tileEl(t, canPick ? '' : 'locked');
    if (SELIDX === k) e.classList.add('sel');
    // v1.2.25：任何时候都能点手牌——第一次点击只做「选中 + 台面同牌高亮」，
    // 方便随时算某张牌还剩几张（含别人打出后要决定吃/碰/杠时）；
    // 只有轮到自己出牌（canPick）时，再点一次同一张才是「打出」
    e.onclick = () => {
      if (canPick && SELIDX === k){ SEL = null; SELIDX = null; resolvePend(t); }
      else { SEL = t; SELIDX = k; renderHand(); renderRiver(); renderMe(); renderSeats(); }
    };
    box.appendChild(e);
  });
  if (drawn !== null){
    const g = document.createElement('div');
    g.className = 'drawgap';
    box.appendChild(g);
    const e = tileEl(drawn, (canPick ? '' : 'locked') + ' hl');
    if (SELIDX === 'd') e.classList.add('sel');
    // v1.2.25：同上手牌——非出牌回合也能点摸到的这张查看台面同牌
    e.onclick = () => {
      if (canPick && SELIDX === 'd'){ SEL = null; SELIDX = null; resolvePend(drawn); }
      else { SEL = drawn; SELIDX = 'd'; renderHand(); renderRiver(); renderMe(); renderSeats(); }
    };
    box.appendChild(e);
  }
  const tb = tingBadge(p);
  if (tb) box.appendChild(tb);          // 我敲定后手牌上盖「听」圆章
}
// 座位风：庄家为东，逆时针（出牌顺序）递增
function windOf(i){ return SEAT_WIND[(i - G.dealer + 4) % 4]; }
// 四边座位 → DOM：2=北(对家) 3=西(上家) 1=东(下家) 0=南(我)
// 每人面前区域（以各自视角由近到远）：手牌排 → 花+吃碰杠排 → 牌河排
function renderSeats(){
  // i=0 自己：手牌下方的名牌（名字 + 局内总分，与对家对称）
  const p0 = G.players[0];
  const n0 = $('nm0');
  n0.className = 'nm' + (G.turn === 0 && G.running ? ' cur' : '');
  n0.innerHTML = p0.name + ' <span class="sc">' + p0.score + '分</span>';
  for (const i of [1, 2, 3]){
    const p = G.players[i];
    const cur = G.turn === i && G.running;
    const vert = (i !== 2);                       // 左右两家竖排
    const nm = $('nm' + i);
    nm.className = (vert ? 'nmV' : 'nm') + (cur ? ' cur' : '');
    // 名牌：名字 + 分数（底×番已按需求去掉，结算面板里仍可看到明细）
    // 竖排名牌不留空格，避免 writing-mode 下出现额外间隔
    // 听牌状态改用手牌上的「听」圆章表示，名牌里不再显示「敲」
    nm.innerHTML = vert
      ? p.name + '<span class="sc">' + p.score + '分</span>'
      : p.name + ' <span class="sc">' + p.score + '分</span>';

    const bk = $('bk' + i);
    bk.innerHTML = '';
    if (!vert){
      for (let k = 0; k < p.hand.length; k++) bk.appendChild(tileEl(null, ''));
    } else {
      for (let k = 0; k < p.hand.length; k++){
        const s = document.createElement('div');
        s.className = 'vslot' + (i === 1 ? ' r' : '');
        s.appendChild(tileEl(null, 'xs'));
        bk.appendChild(s);
      }
    }
    const tbk = tingBadge(p);
    if (tbk) bk.appendChild(tbk);          // 听牌圆章盖在牌背上

    // 花 + 吃碰杠排：花在左（各自视角），副露在右，中间分隔
    const ml = $('ml' + i);
    ml.className = (vert ? 'mcol ' : 'mrow ') + 'fx';
    renderFx(ml, p, vert, i === 1);
  }
}
// 吃/碰/明杠的来源箭头：屏幕方向指向打出这张牌的那一家
// 我在下方：对家(seat2)=上，下家(seat1)=右，我(seat0)=下，上家(seat3)=左
const FROM_DIR = { 2: 0, 1: 1, 0: 2, 3: 3 };
function meldArrowHTML(from){
  const d = FROM_DIR[from];
  if (d === undefined) return '';
  const rot = [0, 90, 180, 270][d];
  return '<span class="marrow"><svg viewBox="0 0 12 12" style="transform:rotate(' + rot + 'deg)">' +
    '<path d="M6 1 L10.4 8.6 L6 6.3 L1.6 8.6 Z"/></svg></span>';
}
// 听牌圆章（挂在手牌/牌背容器上）
function tingBadge(p){
  if (!p.knocked) return null;
  const d = document.createElement('div');
  d.className = 'ting';
  d.textContent = '听';
  return d;
}
// 花 + 吃碰杠 统一渲染：vert=竖排（东西家），rev=东家（列序翻转）
function renderFx(box, p, vert, rev){
  box.innerHTML = '';
  const addTile = (t, cls, parent) => {
    const e = tileEl(t, cls);
    if (vert){
      const s = document.createElement('div');
      s.className = 'fslot' + (rev ? ' r' : '');
      s.appendChild(e);
      parent.appendChild(s);
    } else parent.appendChild(e);
    return e;
  };
  const fg = document.createElement('div');
  fg.className = 'fg';
  for (const fl of p.flowers) addTile(fl, 'un', fg);
  for (const fl of (p.pendingFlowers || [])) addTile(fl, 'un pending', fg);
  box.appendChild(fg);
  if (p.flowers.length && p.melds.length){
    const sep = document.createElement('div');
    sep.className = 'fxsep';
    box.appendChild(sep);
  }
  const mg = document.createElement('div');
  mg.className = 'mg';
  for (const m of p.melds){

// melds 必须真实传入（副露参与番型判定：清碰/混碰/风碰 都依赖它）
function getWaitsHand(hand, melds){
  melds = melds || [];
  const meldCount = melds.length;
  const hc = toCounts(hand);
  const need = 4 - meldCount;
  if (hand.length % 3 !== 1) return [];
  const out = [];
  for (let t = 0; t < PLAYCNT; t++){
    if (hc[t] >= 4) continue;
    hc[t]++;
    let ok = false;
    if (meldCount === 0 && isSevenPairs(hc)) ok = true;
    else if (isWinShape(hc, need)) ok = true;
    if (ok){
      const ev = evaluateShape(hc, melds, { flowerCount: 0 });
      if (ev) out.push({ t, ev });
    }
    hc[t]--;
  }
  return out;
}
// 任一玩家当前的「底 / 番」：底 = 起底 + 花；番 = 听牌取最佳听口番，否则取当前牌型番
function playerDiFan(p){
  const hc = toCounts(p.hand || []);
  const di = CFG.base + calcFlowers(p, hc);
  if (p.settleFan != null) return { di: p.settleDi != null ? p.settleDi : di, fan: p.settleFan, tenpai: true };
  if (!p.hand || !p.hand.length) return { di, fan: null, tenpai: false };
  let addFan = 0;
  if (p.menqing) addFan += 1;                 // 门清
  if (calcFlowers(p, null) === 0) addFan += 1;  // 无花果（v1.2.12：杠算花，暗杠/加杠破无花果）
  if (p.melds.length === 4) addFan += 1;      // 大吊车
  let fan = null, tenpai = false;
  if (p.hand && p.hand.length % 3 === 1 && G.running){
    const w = getWaitsHand(p.hand, p.melds);
    if (w.length){
      tenpai = true;
      let bf = -1;
      for (const x of w) if (x.ev.base + addFan > bf) bf = x.ev.base + addFan;
      fan = bf;
    }
  }
  if (fan === null){
    const ev = evalAll(hc, p.melds.length);
    fan = typeBaseFan(ev.bestType) + addFan;
  }
  return { di, fan, tenpai };
}
function analyzeMe(){
  const p = G.players[0];
  const hc = toCounts(p.hand);
  const flowers = calcFlowers(p, hc);
  const di = CFG.base + flowers;
  const add = [];
  if (p.menqing) add.push(['门清', 1]);
  if (calcFlowers(p, hc) === 0) add.push(['无花果', 1]);   // v1.2.12：杠算花，暗杠/加杠都会破无花果
  if (p.melds.length === 4) add.push(['大吊车', 1]);
  const addFan = add.reduce((s, x) => s + x[1], 0);

  const out = { di, flowers, add, addFan, waits: [], fan: null, shanten: null, target: null, best: null };

  let waits = [];
  if (p.hand.length % 3 === 1){
    waits = getWaitsHand(p.hand, p.melds);
  } else if (p.hand.length % 3 === 2){
    // 刚摸牌（14 张）：模拟打一张，优先找"打了就听牌"，否则找向听最小的打法
    const uniq = [...new Set(p.hand)];
    let bs = null;
    for (const t of uniq){
      const h = p.hand.slice();
      const i = h.indexOf(t); if (i >= 0) h.splice(i, 1);
      const w = getWaitsHand(h, p.melds);
      const e2 = evalAll(toCounts(h), p.melds.length);
      if (!bs || (w.length && !bs.w.length) ||
          (!!w.length === !!bs.w.length && e2.best < bs.ev.best) ||
          (w.length && bs.w.length && w.length > bs.w.length)){
        bs = { t, w, ev: e2 };
      }
    }
    if (bs){
      waits = bs.w;
      out.discardToTenpai = bs.t;
      if (!waits.length){ out.shanten = bs.ev.best; out.target = bs.ev.bestType; }
    }
  }
  if (waits.length){
    let bw = null, bf = -1;
    for (const w of waits){
      const f = w.ev.base + addFan;
      if (f > bf){ bf = f; bw = w; }
    }
    out.waits = waits; out.best = bw; out.fan = bf;
  } else {
    const ev = evalAll(hc, p.melds.length);
    out.shanten = ev.best; out.target = ev.bestType;
    out.fan = typeBaseFan(ev.bestType) + addFan;
  }
  return out;
}
// 听牌提示里的「台面剩余张数」：4 减去自己手牌、三家牌河、吃碰杠副露里已出现的同牌数。
// 不算其他三家手牌（台面下，看不见）。
function visibleLeft(t){
  let n = 4;
  const me = G.players[0];
  if (me && me.hand) n -= me.hand.filter(x => x === t).length;
  for (let i = 0; i < 4; i++){
    const p = G.players[i];
    if (!p) continue;
    if (p.discards) n -= p.discards.filter(x => x === t).length;
    for (const m of (p.melds || [])){
      const ts = (m.tiles && m.tiles.length) ? m.tiles : [m.tile];
      n -= ts.filter(x => x === t).length;
    }
  }
  return Math.max(0, n);
}
// 当前手牌可敲听的打法：模拟每张牌，返回能进入听牌的 {discard, waits} 列表
function potentialKnocks(p){
  if (p.knocked || p.isBot || p.hand.length % 3 !== 2) return [];
  const out = [];
  const uniq = [...new Set(p.hand)];
  for (const t of uniq){
    const h = p.hand.slice();
    const i = h.indexOf(t); if (i < 0) continue;
    h.splice(i, 1);
    const waits = getWaitsHand(h, p.melds);
    if (waits.length) out.push({ discard: t, waits });
  }
  // 优先听得多、番大的打法
  out.sort((a, b) => b.waits.length - a.waits.length ||
    Math.max(...b.waits.map(w => w.ev.base)) - Math.max(...a.waits.map(w => w.ev.base)));
  return out;
}

      const readyMe = NET.readySeats.includes(NET.mySeat);
      mkBtn('回到首页', 'none', () => backHome());
      mkBtn('查看结算', 'hist', () => showResult());
      mkBtn(readyMe ? '取消准备' : '准备下一局', 'pri', () => netReady(!readyMe));
      $('hint').innerHTML = '本局已结束 · 等待四家准备下一局';
    } else {
      mkBtn('查看结算', 'hist', () => showResult());
      mkBtn('下一局', 'pri', () => nextHand(0));
      $('hint').innerHTML = '本局已结束 · 可查看结算';
    }
    return;
  }
  if (!PEND){ $('hint').innerHTML = ''; return; }
  if (PEND.kind === 'discard'){
    const me0 = G.players[0];
    // v1.2.25：轮到我出牌但还没出——只要打出某张即可听牌，底部听牌行列出
    // 全部可听的牌与剩余张数（「可听 xx牌(n) xx牌(m)」）；已敲定者由 renderHUD 显示锁定听，不覆盖
    const canKnocks = (!me0.knocked && !me0.isBot && me0.hand.length % 3 === 2 && !NET.autoKnock) ? potentialKnocks(me0) : [];
    if (canKnocks.length){
      const seen = [], list = [];
      for (const k of canKnocks) for (const w of k.waits) if (seen.indexOf(w.t) < 0){ seen.push(w.t); list.push(w.t); }
      list.sort((a, b) => a - b);
      const ting = $('tingLine');
      ting.innerHTML = '可听 ' + list.map(t => '<span class="w">' + tileName(t) + '(' + visibleLeft(t) + ')</span>').join(' ');
      ting.className = 'tingline show';
    }
    // v1.2.20：清混碰免敲没有「敲听」动作；敲麻才有 敲听 按钮
    const knocks = (CFG.lajiHu && !me0.knocked && !NET.autoKnock) ? canKnocks : [];
    if (knocks.length){
      // v1.2.4：底部 tingLine 已经显示「打 X 听牌 → Y」，这里不再重复写一行
      // 只在多听法场景下追加一条简短指引（提示用户点「敲听」按钮选打法）
      if (knocks.length === 1){
        $('hint').innerHTML = '';
        mkBtn('敲听', 'knock', () => knockPickResolve(knocks[0]));
      } else {
        $('hint').innerHTML = '有 ' + knocks.length + ' 种听法可选';
        mkBtn('敲听', 'knock', () => {
          __knocks = knocks;
          const rows = knocks.map((k, i) =>
            '<button class="knockOpt" onclick="pickKnock(' + i + ')">打 ' + tileName(k.discard) +
            ' → 听 ' + k.waits.map(w => tileName(w.t) + '(' + visibleLeft(w.t) + ')').join('/') + '</button>').join('');
          openSheet('<h2><span>选择听法</span><span class="sp"></span><button class="close" onclick="closeSheet()">×</button></h2>' +
            '<div class="knockList">' + rows + '</div>');
        });
      }
    } else {
      // v1.2.18：只有一种听法（唯一听张）时，按钮上方醒目显示差什么牌、还剩几张；
      // v1.2.20：清混碰免敲 = 当前实时唯一听张；敲麻 = 敲定后锁定的唯一听张
      let uniWait = null;
      if (!CFG.lajiHu && G.running && me0.hand.length % 3 === 1){
        const lw = getWaits(me0);
        if (lw.length === 1) uniWait = lw[0].t;
      } else if (me0.knocked && me0.knockWaits.length === 1){
        uniWait = me0.knockWaits[0];
      }
      if (uniWait !== null){
        $('hint').innerHTML = '听牌中 → <b>' + tileName(uniWait) + '</b> · 还有 <b>' + visibleLeft(uniWait) + '</b> 张';
      } else {
        setHint('点击一张牌 <b>选中</b>，再点一次 <b>打出</b>');
      }
    }
    return;
  }
  if (PEND.kind === 'knock'){
    const w = PEND.payload.waits.map(x => tileName(x.t) + '(' + visibleLeft(x.t) + ')').join(' ');
    setHint('听牌了！听 <b>' + w + '</b> — 敲定后不能换牌');
    mkBtn('敲定', 'knock', () => resolvePend('knock'));
    mkBtn('不敲', 'none', () => resolvePend('pass'));
    return;
  }
  if (PEND.kind === 'claim'){
    const opts = PEND.payload.opts;
    const tile = PEND.payload.tile;
    const from = PEND.payload.from;
    const blockedHu = G.players[0].missHu.has(tile);
    setHint(G.players[remap(from)].name + ' 打出 <b>' + tileName(tile) + '</b>' +
      (blockedHu ? ' <span style="color:#ff6f57">（漏胡中，本张已不能胡）</span>' : ''));
    for (const o of opts){
      if (o.k === 'hu') mkBtn('胡', 'hu', () => resolvePend(o));
      if (o.k === 'kong') mkBtn('杠', 'kong', () => resolvePend(o));
      if (o.k === 'pung') mkBtn('碰', 'pung', () => resolvePend(o));
      if (o.k === 'chow'){
        // 把吃到的具体顺子显示在按钮里（如「吃 456萬」），多个吃选项一眼分清是哪一套
        const tl = o.combo.concat([tile]).sort((a, b) => a - b);
        const nm = tl.map(t => String(t % 9 + 1)).join('') + SUIT_CH[suitOf(tile)];
        mkBtn('吃 ' + nm, 'chow', () => resolvePend(o));
      }
    }
    mkBtn('过', 'none', () => {
      const hu = opts.find(o => o.k === 'hu');
      if (hu && !NET.active) G.players[0].missHu.add(tile);
      resolvePend(null);
    });
    return;
  }
  if (PEND.kind === 'zimo'){
    const tile = PEND.payload.tile;
    setHint('你摸到了 <b>' + tileName(tile) + '</b>，可以胡');
    mkBtn('胡', 'hu', () => resolvePend('hu'));
    mkBtn('过', 'none', () => resolvePend('pass'));
    return;
  }
  if (PEND.kind === 'selfkong'){
    const opts = PEND.payload.options;
    const tile = PEND.payload.tile;
    // v1.2.13：摸牌后 vs 出牌前两种来源，文案要准确（discardTurn 是手牌攒齐第 4 张，不是刚摸到的）
    const msg = PEND.payload.source === 'preDiscard' ? '你有 <b>' + tileName(tile) + '</b>，可以杠' : '你摸到了 <b>' + tileName(tile) + '</b>，可以杠';
    setHint(msg);
    for (const o of opts){
      if (o.k === 'ankan') mkBtn('暗杠', 'kong', () => resolvePend(o));
      if (o.k === 'chakan') mkBtn('加杠', 'kong', () => resolvePend(o));
    }
    mkBtn('过', 'none', () => resolvePend(null));
    return;
  }
}
function showTip(){
  const p = G.players[0];
  const hc = toCounts(p.hand);
