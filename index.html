<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08241b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>上海敲麻 · 单人练习</title>
<style>
:root{
  --felt:#135440; --felt2:#082a1f; --felt3:#0b3a2b;
  --wood:#8a5c33; --wood2:#422a14;
  --card:rgba(255,255,255,.07); --card2:rgba(255,255,255,.12);
  --line:rgba(255,255,255,.16);
  --txt:#e9f3ee; --dim:#93aaa0; --dim2:#6d8479;
  --gold:#ffcf5c; --red:#ff6f57; --blue:#63b3ff; --green:#4ec98a; --purple:#c08cff;
  --ink:#1f2933; --red2:#b5321f; --blue2:#1f6fd0; --green2:#0f7a52;
  --tw:24px; --th:33px; --bkSlotW:23px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#061a13;color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* ---------- 布局 ---------- */
#app{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto;
  background:radial-gradient(120% 70% at 50% 0%,#0d3a2b 0%,#061a13 75%);
  padding:calc(env(safe-area-inset-top,0px) + 4px) 5px calc(env(safe-area-inset-bottom,0px) + 4px)}

/* ---------- 顶栏 ---------- */
.topbar{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);padding:0 2px 3px;flex:0 0 auto}
.topbar .gname{font-size:12px;color:var(--txt);font-weight:600}
.topbar .sp{flex:1}
.iconbtn{width:26px;height:26px;border-radius:8px;background:var(--card);display:flex;align-items:center;
  justify-content:center;font-size:13px;line-height:1}

/* ---------- HUD：底 / 番 / 分 ---------- */
.hud{flex:0 0 auto;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04));
  border:1px solid rgba(255,255,255,.14);border-radius:11px;padding:5px 8px 6px;margin-bottom:4px;
  box-shadow:0 2px 8px rgba(0,0,0,.35)}
.hud .row1{display:flex;align-items:center;gap:6px}
.hud .who{font-size:12px;font-weight:700}
.hud .who .seat{display:inline-block;width:17px;height:17px;line-height:17px;text-align:center;border-radius:5px;
  background:linear-gradient(180deg,#ffe6a3,#e8a927);color:#3a2a00;font-size:11px;margin-right:4px;font-weight:800}
.hud .who .mine{display:inline-block;margin-left:5px;font-size:10px;font-weight:800;letter-spacing:.3px;
  padding:1px 5px;border-radius:6px;background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.12);color:#ffd98a}
.hud .sp{flex:1}
.hud .knockTag{font-size:10px;padding:2px 7px;border-radius:6px;background:linear-gradient(180deg,#ff7a5e,#e8432c);
  color:#fff;font-weight:700;max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud .knockTag.off{background:rgba(255,255,255,.12);color:var(--dim)}
.metrics{display:flex;gap:5px;margin-top:5px}
.metric{flex:1;background:rgba(0,0,0,.30);border-radius:8px;padding:4px 2px 5px;text-align:center;
  border:1px solid rgba(255,255,255,.07)}
.metric .k{font-size:9px;color:var(--dim2);letter-spacing:.5px}
.metric .v{font-size:19px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.metric.di .v{color:var(--blue)}
.metric.fan .v{color:var(--gold)}
.metric.sc .v{color:var(--green)}
.metric.cap .v{color:var(--dim);font-size:14px;padding-top:3px}
.fandetail{font-size:10px;color:var(--dim);margin-top:4px;line-height:1.45;min-height:14px}
.fandetail b{color:var(--gold);font-weight:700}
.fandetail .w{color:var(--blue)}

/* ---------- 麻将桌 ---------- */
.board{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:3px;
  padding:5px;border-radius:13px;position:relative;
  background:
    radial-gradient(115% 85% at 50% 42%,#166a4f 0%,#0e4835 46%,#0a3527 78%,#072a1f 100%);
  box-shadow:0 0 0 3px var(--wood), 0 0 0 4px var(--wood2), 0 4px 14px rgba(0,0,0,.55),
    inset 0 0 22px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.07)}
.board:before{content:"";position:absolute;inset:5px;border-radius:9px;pointer-events:none;
  border:1px dashed rgba(255,255,255,.09)}

/* 座位通用 */
.seat{display:flex;align-items:center;justify-content:center;min-height:0;min-width:0}
.seatN{flex-direction:column;gap:2px;flex:0 0 auto}
.seatS{flex-direction:column;gap:2px;flex:0 0 auto}
.seatW{flex-direction:row;gap:2px;flex:0 0 auto;width:auto;min-width:0;justify-content:flex-start}
.seatE{flex-direction:row-reverse;gap:2px;flex:0 0 auto;width:auto;min-width:0;justify-content:flex-start}
.boardMid{flex:1 1 auto;display:flex;gap:3px;min-height:0;min-width:0}

/* 名牌（谁坐在哪） */
.nm{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:1px 7px;border-radius:9px;
  background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.13);color:var(--txt);white-space:nowrap;
  max-width:100%;overflow:hidden}
.nm .wd{display:inline-block;width:14px;height:14px;line-height:14px;text-align:center;border-radius:4px;
  background:rgba(255,255,255,.16);font-size:10px;font-weight:800;color:#cfe3d9}
.nm.cur{background:linear-gradient(180deg,#ffe6a3,#e8a927);border-color:#ffe9b0;color:#3a2a00}
.nm.cur .wd{background:rgba(0,0,0,.22);color:#fff8e0}
.nm .fl{color:var(--gold);font-weight:700}
.nm.cur .fl{color:#6b4500;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.nm.cur .sc{color:#2e5b3f}
.nm .kk{color:#ff8a6e;font-weight:800}
.nm .sc{color:var(--green);font-weight:700}
.nmV{writing-mode:vertical-rl;text-orientation:upright;font-size:8px;font-weight:700;padding:3px 1px;
  border-radius:8px;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.13);letter-spacing:1px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;max-height:100%;flex:0 0 15px;width:15px;
  gap:3px}
.nmV.cur{background:linear-gradient(180deg,#ffe6a3,#e8a927);border-color:#ffe9b0;color:#3a2a00}
.nmV .kk{color:#ff6f57}
.nmV .fl{color:#ffd98a}
.nmV.cur .fl{color:#6b4500}
.nmV .sc{color:#8fd9b0;font-weight:700}
.nmV.cur .sc{color:#1d6b45}

/* 手牌（牌背）堆叠 */
.hstack{display:flex;align-items:flex-end;justify-content:center;min-height:0;max-width:100%;overflow:hidden;position:relative}
.hstack .tile{margin-right:-3px;box-shadow:0 2px 0 #0a3729,0 3px 3px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.22)}
.hstack .tile:last-child{margin-right:0}
.vstack{display:flex;flex-direction:column;align-items:center;min-height:0;max-height:100%;overflow:hidden;padding:calc(var(--th) * .35) 0;position:relative}
.vslot{position:relative;flex:0 0 auto;width:var(--th);height:calc(var(--tw) - 13px)}
/* 左右家背牌用 xs 小牌：槽宽按 xs 牌旋转后的视觉宽收窄 */
.vstack .vslot{width:var(--bkSlotW);height:calc(var(--tw) * .58)}
.vslot .tile{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg);margin:0;
  box-shadow:0 2px 0 #0a3729,0 3px 3px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.22)}
.vslot.r .tile{transform:translate(-50%,-50%) rotate(90deg)}
.vslot:last-child{margin-bottom:0}

/* ---------- 花 + 吃碰杠区（四家统一：一样大的牌，花在左 / 副露在右） ---------- */
.mrow{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;align-items:flex-end;max-width:100%;overflow:hidden}
.mcol{display:flex;flex-direction:column;gap:1px;flex-wrap:wrap;align-content:center;justify-content:flex-start;
  max-height:100%;overflow:hidden}
.seatN .mrow{min-height:20px}
.seatS .mrow{min-height:26px}
/* 花/副露统一牌尺寸 */
.fx{display:flex;gap:2px;align-items:center;max-width:100%;overflow:hidden;flex-wrap:nowrap}
.fx .tile{--tw:18px;--th:25px}
.fx .fg,.fx .mg{display:flex;gap:2px;align-items:center;flex-wrap:nowrap;min-width:0}
.fx .fg{justify-content:flex-start}
.fx .mg{justify-content:flex-end}
/* 东西家竖排：花/副露组也竖排（meld 容器同步竖排） */
.mcol.fx .fg,.mcol.fx .mg,.mcol.fx .meld{flex-direction:column;justify-content:flex-start}
/* 东家：他视角「从左到右」= 屏幕从下到上 → 花组在屏幕下端、副露在上方，组内牌也从下往上 */
#ml1.fx{flex-direction:column-reverse}
#ml1.fx .fg,#ml1.fx .mg,#ml1.fx .meld{flex-direction:column-reverse}
.fx .fxsep{flex:0 0 9px;width:9px;align-self:stretch;position:relative}
.fx .fxsep:after{content:"";position:absolute;left:50%;top:15%;bottom:15%;width:1px;background:rgba(255,255,255,.22)}
/* 东西家竖排：分隔线随之转 90°（他们视角仍是竖线，我看起来是横线） */
.mcol.fx .fxsep{flex:0 0 9px;width:auto;height:9px;align-self:center}
.mcol.fx .fxsep:after{left:15%;right:15%;top:50%;bottom:auto;width:auto;height:1px}
/* 空槽占位牌：不可见，只用来撑住这一排的尺寸 */
.fx .tile.ghost{visibility:hidden}
/* 吃/碰/明杠来源箭头：指向打出这张牌的那一家（屏幕方向，不随牌旋转） */
.marrow{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:12px;height:12px;border-radius:50%;background:rgba(255,206,84,.72);
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;z-index:7;box-shadow:0 0 5px rgba(255,206,84,.4)}
.marrow svg{width:9px;height:9px;display:block}
.marrow svg path{fill:#5a2b00}
/* 听牌标记：手牌（牌背）上盖一个醒目的「听」圆章 */
/* 直径≈左右两家牌背那一竖排的宽度，纯黄圆底不带白边 */
.ting{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:var(--bkSlotW);height:var(--bkSlotW);min-width:var(--bkSlotW);min-height:var(--bkSlotW);border-radius:50%;
  background:rgba(255,206,84,.78);color:#5a2b00;
  font-size:calc(var(--bkSlotW) * 0.6);font-weight:900;line-height:1;letter-spacing:0;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  box-shadow:0 2px 6px rgba(0,0,0,.5);
  pointer-events:none;z-index:30}
/* 自己的听章放到手牌堆的垂直中心，不要顶在容器上半空 */
.hand .ting{top:auto;bottom:calc(var(--th)/2 - var(--bkSlotW)/2);transform:translateX(-50%)}
/* 竖排（东西家）花/副露槽：牌旋转 90° 后的占位盒 */
.fslot{position:relative;flex:0 0 auto;width:26px;height:19px}
.fslot .tile{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(90deg);margin:0}
.fslot.r .tile{transform:translate(-50%,-50%) rotate(-90deg)}
/* 牌河竖排槽（东西家）：占位 = 视觉，避免旋转牌重叠/被裁 */
.rvslot{position:relative;flex:0 0 auto;width:23px;height:17px}
.rvslot .tile{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(90deg);margin:0}
.rvslot.r .tile{transform:translate(-50%,-50%) rotate(-90deg)}
/* 北家：花/副露排牌面朝上（对着我看清，排列顺序按北家视角从右到左） */
/* 西/东家花/副露朝向 */
#ml3.fx .fg > .tile,#ml3.fx .mg > .tile{transform:rotate(90deg)}
#ml1.fx .fg > .tile,#ml1.fx .mg > .tile{transform:rotate(-90deg)}

/* ---------- 中央：牌河 + 桌心 ---------- */
.mid{flex:1 1 auto;display:flex;flex-direction:column;gap:3px;min-height:0;min-width:0}
.river{background:rgba(0,0,0,.26);border:1px solid rgba(255,255,255,.09);border-radius:7px;padding:2px;
  display:flex;gap:1px;flex-wrap:wrap;align-content:flex-start;overflow:hidden;min-height:0}
.rh{flex:0 0 auto;height:52px}
.rv{flex:0 0 48px;width:48px;flex-direction:column;flex-wrap:wrap;justify-content:flex-start;
  align-content:flex-start;height:100%;padding:1px 0;overflow:hidden}
/* 牌河排列方向 = 每个人自己视角的「从左到右」；牌面朝向：
   东西家牌顶朝桌心（横躺朝他们），北家牌面朝上（对着我看清，排列顺序仍按北家视角） */
#rvN{flex-direction:row-reverse}
#rvE{flex-direction:column-reverse}
.river .tile{margin:0 0 1px 0}
#rvN > .tile{margin:0 1px 0 0}
.rv > .tile{margin:0 0 3px 0}
.rowmid2{flex:1 1 auto;display:flex;gap:3px;min-height:0}
.core{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  min-height:0;padding:3px;overflow:hidden}
.turnnow{font-size:11px;color:var(--dim2);white-space:nowrap;flex:0 0 auto}
.turnnow b{color:var(--gold);font-weight:700}

/* 桌心罗盘 */
.dial{position:relative;width:150px;max-width:100%;aspect-ratio:1;height:auto;border-radius:50%;flex:0 0 auto;
  background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.11),rgba(0,0,0,.34) 70%);
  border:1px solid rgba(255,255,255,.15);box-shadow:inset 0 2px 10px rgba(0,0,0,.5)}
.dial .dw{position:absolute;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-size:15px;font-weight:800;color:#b9cfc5;background:rgba(0,0,0,.34);
  border:1px solid rgba(255,255,255,.12)}
.dial .dw.cur{background:linear-gradient(180deg,#ffe6a3,#e8a927);color:#3a2a00;border-color:#ffe9b0;
  box-shadow:0 0 9px rgba(255,207,92,.65)}
.dial .dw.n{left:50%;top:5px;transform:translateX(-50%)}
.dial .dw.s{left:50%;bottom:5px;transform:translateX(-50%)}
.dial .dw.w{left:5px;top:50%;transform:translateY(-50%)}
.dial .dw.e{right:5px;top:50%;transform:translateY(-50%)}
.dial .ctr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center}
.dial .ctr .num{font-size:38px;font-weight:800;color:#eaf5ef;line-height:1;font-variant-numeric:tabular-nums;
  text-shadow:0 2px 6px rgba(0,0,0,.6)}
.dial .ctr .lab{font-size:9px;color:var(--dim2);margin-top:3px;letter-spacing:1px}
.wallbar{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--dim2);width:100%;max-width:168px}
.wallbar .bar{flex:1;height:4px;border-radius:2px;background:rgba(0,0,0,.45);overflow:hidden}
.wallbar .bar i{display:block;height:100%;background:linear-gradient(90deg,#4ec98a,#2fa06a);border-radius:2px;
  transition:width .3s}
.tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.tg{font-size:9px;padding:1px 6px;border-radius:6px;background:rgba(255,207,92,.16);color:var(--gold);
  border:1px solid rgba(255,207,92,.3);font-weight:700}
.tg.b{background:rgba(99,179,255,.16);color:var(--blue);border-color:rgba(99,179,255,.3)}
/* 桌心骰子 */
.diceC{display:inline-flex;gap:5px;align-items:center;padding:3px 7px;border-radius:8px;
  background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14)}
.die{width:21px;height:21px;border-radius:5px;position:relative;
  background:linear-gradient(180deg,#fffdf6,#ece3c8);box-shadow:0 1px 3px rgba(0,0,0,.5),inset 0 1px 0 #fff}
.die i{position:absolute;width:4.5px;height:4.5px;border-radius:50%;background:#1a1a1a;
  transform:translate(-50%,-50%);box-shadow:inset 0 -1px 1px rgba(0,0,0,.4)}
.diceC em{font-style:normal;font-size:10px;font-weight:800;color:var(--gold);letter-spacing:.5px}
.diceC.kb{background:rgba(122,68,0,.5);border-color:var(--gold);box-shadow:0 0 8px rgba(255,207,92,.35)}
.diceC.kb .die i{background:#b5321f}

/* ---------- 玩家区（南） ---------- */
.hand{display:flex;gap:0;justify-content:center;align-items:flex-end;flex-wrap:nowrap;
  min-height:calc(var(--th) + 4px);max-width:100%;overflow:hidden;
  padding-top:14px;margin-top:-14px;position:relative}
.hand .tile{cursor:pointer;transition:transform .12s,box-shadow .12s;position:relative;
  box-shadow:0 3px 0 #b9b09a,0 4px 5px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.95)}
.hand .tile.sel{transform:translateY(-10px);z-index:5;
  box-shadow:0 5px 0 #b9b09a,0 7px 10px rgba(0,0,0,.55),0 0 0 2px var(--gold),inset 0 1px 0 rgba(255,255,255,.95)}
.hand .tile.locked{cursor:default}
.hand .drawgap{width:7px;flex:0 0 7px}
.hint{text-align:center;font-size:11px;color:var(--dim);height:15px;line-height:15px;margin-top:2px;flex:0 0 auto}
.hint b{color:var(--gold)}

/* ---------- 操作按钮 ---------- */
.acts{flex:0 0 auto;display:flex;gap:6px;justify-content:center;height:46px;margin-top:3px}
.acts button{flex:0 1 84px;height:46px;border-radius:12px;font-size:16px;font-weight:800;
  background:var(--card2);border:1px solid var(--line);letter-spacing:2px;
  box-shadow:0 2px 6px rgba(0,0,0,.35)}
.acts button:active{transform:scale(.96)}
.acts button.none{background:rgba(255,255,255,.07);color:var(--dim);font-size:14px;letter-spacing:1px}
.acts button.hu{background:linear-gradient(180deg,#ff7a5e,#e8432c);border-color:#ff9d86}
.acts button.pung{background:linear-gradient(180deg,#5fb8ff,#2b7fd4);border-color:#8ecdff}
.acts button.kong{background:linear-gradient(180deg,#7bd8a6,#2f9e6c);border-color:#a6ecc8}
.acts button.chow{background:linear-gradient(180deg,#ffd06a,#e5a52c);border-color:#ffe3a0;color:#4a3200}
.acts button.knock{background:linear-gradient(180deg,#ff9ec4,#e04f8d);border-color:#ffc2dc}
.acts button.pri{background:linear-gradient(180deg,#ffd473,#e8a927);color:#3d2a00;border-color:#ffe0a3}
.acts button.hist{background:var(--card2);color:var(--txt);font-size:14px;letter-spacing:1px}

/* ---------- 麻将牌 ---------- */
.tile{width:var(--tw);height:var(--th);border-radius:5px;flex:0 0 auto;position:relative;overflow:hidden;
  line-height:1;
  background:linear-gradient(178deg,#fffef8 0%,#fdf8e9 46%,#f4ebd7 80%,#e9dec5 100%);
  border:1px solid #c9c0a9;
  box-shadow:0 2px 0 #c6bdA6,0 3px 4px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.95)}
.tile:before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:4px;
  background:linear-gradient(152deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,0) 44%,rgba(0,0,0,.045) 100%)}
.tile svg{position:relative;display:block;width:100%;height:100%}
.tile.sm{--tw:19px;--th:26px;border-radius:4px}
.tile.xs{--tw:16px;--th:22px;border-radius:3px}
.tile.xxs{--tw:13px;--th:18px;border-radius:2px}
.tile.fl{background:linear-gradient(178deg,#fffbe8 0%,#fdf3d2 50%,#f2e5b8 100%);border-color:#d6c48c}
.tile.dimmed{opacity:.5}
.tile.hl{box-shadow:0 0 0 2px var(--gold),0 3px 8px rgba(0,0,0,.5)}
.tile.last{box-shadow:0 0 0 2px var(--red),0 3px 8px rgba(0,0,0,.5)}
.tile.back{background:linear-gradient(158deg,#33a07c 0%,#1d7460 50%,#11513f 100%);border-color:#0b3c2d}
.tile.back:after{content:"";position:absolute;inset:2.5px;border-radius:2px;border:1px solid rgba(255,255,255,.20)}
.tile .badge{position:absolute;top:-1px;right:0;font-size:8px;background:var(--red);color:#fff;
  border-radius:0 0 0 4px;padding:0 2px;line-height:9px;font-weight:700;z-index:2}
.meld{display:flex;gap:1px;align-items:center}
.meld .tile{--tw:18px;--th:25px}

<script>
"use strict";
/* =========================================================================
   上海敲麻 · 单人练习（单文件 / 无外部依赖）
   牌编码：0-8 万1-9 | 9-17 筒1-9 | 18-26 条1-9 | 27-30 东南西北 | 31-33 (中发白=花,不组牌)
   花牌：100-107 春夏秋冬梅兰竹菊 | 108-111 中 | 112-115 发 | 116-119 白
   ========================================================================= */

/* ---------------- 基础工具 ---------------- */
const RANK_CH = ['一','二','三','四','五','六','七','八','九'];
const SUIT_CH = ['萬','筒','條'];
const WIND_CH = ['東','南','西','北'];
const SEASON  = ['春','夏','秋','冬','梅','蘭','竹','菊'];
const TILECNT = 34;      // counts 数组长度
const PLAYCNT = 31;      // 实际参与组牌的牌种数（0..30）

const isFlower = t => t >= 100;
const isSeason = t => t >= 100 && t <= 107;
const isWind   = t => t >= 27 && t <= 30;
const isHonor  = t => t >= 27;
const suitOf   = t => t < 9 ? 0 : t < 18 ? 1 : t < 27 ? 2 : 3;
const rankOf   = t => t < 27 ? (t % 9) + 1 : t - 26;

function flowerChar(t){
  if (t <= 107) return SEASON[t - 100];
  if (t <= 111) return '中';
  if (t <= 115) return '發';
  return '白';
}
function tileName(t){
  if (isFlower(t)) return flowerChar(t);
  if (isHonor(t)) return WIND_CH[t - 27];
  return RANK_CH[t % 9] + SUIT_CH[suitOf(t)];
}
function toCounts(tiles){
  const c = new Array(TILECNT).fill(0);
  for (const t of tiles) c[t]++;
  return c;
}
function countsToTiles(c){
  const a = [];
  for (let i = 0; i < TILECNT; i++) for (let k = 0; k < c[i]; k++) a.push(i);
  return a;
}
const sortTiles = a => a.slice().sort((x, y) => x - y);
function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = (Math.random() * (i + 1)) | 0;
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------------- 胡牌判定 ---------------- */
// 判断 counts（手牌，不含副露）能否组成 need 个面子 + 1 个将
function isWinShape(counts, need){
  for (let p = 0; p < PLAYCNT; p++){
    if (counts[p] >= 2){
      counts[p] -= 2;
      const ok = formSets(counts, need);
      counts[p] += 2;
      if (ok) return true;
    }
  }
  return false;
}
function formSets(counts, n){
  if (n === 0){
    for (let i = 0; i < TILECNT; i++) if (counts[i]) return false;
    return true;
  }
  let i = 0;
  while (i < TILECNT && counts[i] === 0) i++;
  if (i === TILECNT) return false;
  if (counts[i] >= 3){
    counts[i] -= 3;
    const ok = formSets(counts, n - 1);
    counts[i] += 3;
    if (ok) return true;
  }
  if (i < 27 && (i % 9) <= 6 && counts[i + 1] > 0 && counts[i + 2] > 0){
    counts[i]--; counts[i + 1]--; counts[i + 2]--;
    const ok = formSets(counts, n - 1);
    counts[i]++; counts[i + 1]++; counts[i + 2]++;
    if (ok) return true;
  }
  return false;
}
// 全刻子（碰碰胡）形态
function isPungShape(counts, need){
  for (let p = 0; p < PLAYCNT; p++){
    if (counts[p] >= 2){
      counts[p] -= 2;
      const ok = formPungs(counts, need);
      counts[p] += 2;
      if (ok) return true;
    }
  }
  return false;
}
function formPungs(counts, n){
  if (n === 0){
    for (let i = 0; i < TILECNT; i++) if (counts[i]) return false;
    return true;
  }
  let i = 0;
  while (i < TILECNT && counts[i] === 0) i++;
  if (i === TILECNT) return false;
  if (counts[i] >= 3){
    counts[i] -= 3;
    const ok = formPungs(counts, n - 1);
    counts[i] += 3;
    if (ok) return true;
  }
  return false;
}
function isSevenPairs(counts){
  // 允许 4 张相同算两个对子（风一色「乱风向」依赖此规则：東東東東 南南南南 西西西西 北北）
  let pairs = 0, tot = 0;
  for (let i = 0; i < TILECNT; i++){
    tot += counts[i];
    if (counts[i] === 0) continue;
    if (counts[i] !== 2 && counts[i] !== 4) return false;
    pairs += counts[i] >> 1;
  }
  return tot === 14 && pairs === 7;
}

/* ---------------- 番型评估 ----------------
   返回 null 表示"不满足胡牌牌型（不能胡）"
   handCounts: 含胡张的手牌 counts（14 张等价）
   melds: 副露数组
-------------------------------------------*/
const TYPE_INFO = {
  '碰碰胡': 1, '混一色': 1, '清一色': 3, '混碰': 2, '清碰': 4, '风一色': 4, '风碰': 8
};
function evaluateShape(handCounts, melds, opts){
  const need = 4 - melds.length;
  const stdWin = isWinShape(handCounts, need);
  const seven  = melds.length === 0 && isSevenPairs(handCounts);
  if (!stdWin && !seven) return null;

  const all = countsToTiles(handCounts);
  for (const m of melds) for (const t of m.tiles) all.push(t);

  let numSuits = new Set(), hasWind = false, hasNum = false;
  for (const t of all){
    if (t >= 27 && t <= 30) hasWind = true;
    else if (t < 27){ hasNum = true; numSuits.add(suitOf(t)); }
  }
  // 碰碰胡：无吃牌 + 手牌可全刻子分解（七对子不算碰碰胡）
  const noChow = melds.every(m => m.type !== 'chow');
  const pungWin = !seven && noChow && isPungShape(handCounts, need);

  let type = null, base = 0;
  if (!hasNum && hasWind){
    // 全风牌
    if (pungWin){ type = '风碰'; base = 8; }
    else { type = '风一色'; base = 4; }      // 乱风向（七对子形态）
  } else if (numSuits.size === 1 && !hasWind){
    if (pungWin){ type = '清碰'; base = 4; } else { type = '清一色'; base = 3; }
  } else if (numSuits.size === 1 && hasWind){
    if (pungWin){ type = '混碰'; base = 2; } else { type = '混一色'; base = 1; }
  } else if (pungWin){
    type = '碰碰胡'; base = 1;
  } else if (seven && CFG.sevenPairs){
    type = '七小对'; base = 2;      // 非传统敲麻牌型，默认关闭，可在设置里开启
  } else if (CFG.lajiHu && stdWin){
    type = '垃圾胡'; base = 0;      // 垃圾胡（推倒胡/平胡）：只算底花，0 番
  } else {
    return null;   // 不允许的牌型
  }

  // 花数
  const f = opts.flowerCount || 0;
  return { type, base, total: base, flowers: f };
}

/* 花数计算（底花） */
function calcFlowers(p, handCounts){
  let f = p.flowers.length;                 // 每张花牌 1 花
  for (const m of p.melds){
    if (m.type === 'kong'){
      f += isWind(m.tile) ? (m.concealed ? 3 : 2) : (m.concealed ? 2 : 1);
    } else if (m.type === 'pung' && isWind(m.tile)){
      f += 1;
    }
  }
  // 手牌中的风牌暗刻
  if (handCounts){
    for (let t = 27; t <= 30; t++) if (handCounts[t] >= 3) f += 1;
  }
  return f;
}

/* 附加番 */
function extraFan(p, ctx){
  const add = [];
  if (p.menqing) add.push(['门清', 1]);
  if (p.flowers.length === 0) add.push(['无花果', 1]);
  if (ctx.diaoche) add.push(['大吊车', 1]);
  if (ctx.kongDraw) add.push(['杠上开花', 1]);
  if (ctx.haidi) add.push(['海底捞月', 1]);
  if (ctx.robKong) add.push(['抢杠', 1]);
  if (ctx.tianhu) add.push(['天胡', 8]);
  if (ctx.dihu) add.push(['地胡', 8]);
  return add;
}

/* ---------------- 向听数 ---------------- */
// 标准型向听（含副露）
function shantenStd(counts, fixedMelds){
  let best = 8 - 2 * fixedMelds;
  const cc = counts.slice();
  const dfs = (idx, melds, partials, pair) => {
    if (idx >= TILECNT){
      const m = melds + fixedMelds;
      let p = partials;
      const blocks = m + p + (pair ? 1 : 0);
      if (blocks > 5) p = Math.max(0, 5 - m - (pair ? 1 : 0));
      let s = 8 - 2 * m - p - (pair ? 1 : 0);
      if (blocks === 5 && !pair && m < 4) s += 1;   // 满块无将修正
      if (s < best) best = s;
      return;
    }
    if (cc[idx] === 0){ dfs(idx + 1, melds, partials, pair); return; }
    // 刻子
    if (cc[idx] >= 3){ cc[idx] -= 3; dfs(idx, melds + 1, partials, pair); cc[idx] += 3; }
    // 顺子
    if (idx < 27 && (idx % 9) <= 6 && cc[idx + 1] > 0 && cc[idx + 2] > 0){
      cc[idx]--; cc[idx + 1]--; cc[idx + 2]--;
      dfs(idx, melds + 1, partials, pair);
      cc[idx]++; cc[idx + 1]++; cc[idx + 2]++;
    }
    // 对子（作将 或 作搭子）
    if (cc[idx] >= 2){
      cc[idx] -= 2;
      if (!pair) dfs(idx, melds, partials, true);
      dfs(idx, melds, partials + 1, pair);
      cc[idx] += 2;
    }
    // 两面 / 嵌张
    if (idx < 27 && (idx % 9) <= 7 && cc[idx + 1] > 0){
      cc[idx]--; cc[idx + 1]--; dfs(idx, melds, partials + 1, pair); cc[idx]++; cc[idx + 1]++;
    }
    if (idx < 27 && (idx % 9) <= 6 && cc[idx + 2] > 0){
      cc[idx]--; cc[idx + 2]--; dfs(idx, melds, partials + 1, pair); cc[idx]++; cc[idx + 2]++;
    }
    // 孤张丢弃
    cc[idx]--; dfs(idx, melds, partials, pair); cc[idx]++;
  };
  dfs(0, 0, 0, false);
  return best;
}
// 碰碰胡向听
function shantenPung(counts, fixedMelds){
  let t = fixedMelds, p = 0;
  for (let i = 0; i < PLAYCNT; i++){
    if (counts[i] >= 3) t++;
    else if (counts[i] === 2) p++;
  }
  let s = 8 - 2 * t - Math.min(p, Math.max(0, 5 - t));
  if (t >= 4 && p === 0) s = 0;      // 大吊车单钓
  return Math.max(-1, s);
}
// 混一色 / 清一色 向听：目标花色 suit（0-2），allowWind 是否允许风牌
function shantenColor(counts, fixedMelds, suit, allowWind){
  const sub = new Array(TILECNT).fill(0);
  let out = 0;
  for (let i = 0; i < PLAYCNT; i++){
    if (!counts[i]) continue;
    const s = suitOf(i);
    if (s === suit) sub[i] += counts[i];
    else if (allowWind && i >= 27 && i <= 30) sub[i] += counts[i];
    else out += counts[i];
  }
  return shantenStd(sub, fixedMelds) + out;
}
// 风一色向听（全风牌）
function shantenWindOnly(counts, fixedMelds){
  const sub = new Array(TILECNT).fill(0);
  let out = 0;
  for (let i = 0; i < PLAYCNT; i++){
    if (!counts[i]) continue;
    if (i >= 27 && i <= 30) sub[i] += counts[i];
    else out += counts[i];
  }
  const std = shantenStd(sub, fixedMelds);
  // 七对子路线：k 种风牌成对的进度
  let pairs = 0, kinds = 0;
  for (let i = 27; i <= 30; i++){ if (sub[i] >= 2) pairs++; if (sub[i] > 0) kinds++; }
  const seven = 6 - pairs - Math.max(0, Math.min(4, kinds) - pairs);
  return Math.min(std, seven) + out;
}

const TYPES = ['pung', 'mix0', 'mix1', 'mix2', 'pure0', 'pure1', 'pure2', 'wind', 'std'];
function evalAll(counts, fixedMelds){
  const r = {
    pung:  shantenPung(counts, fixedMelds),
    mix0:  shantenColor(counts, fixedMelds, 0, true),
    mix1:  shantenColor(counts, fixedMelds, 1, true),
    mix2:  shantenColor(counts, fixedMelds, 2, true),
    pure0: shantenColor(counts, fixedMelds, 0, false),
    pure1: shantenColor(counts, fixedMelds, 1, false),
    pure2: shantenColor(counts, fixedMelds, 2, false),
    wind:  shantenWindOnly(counts, fixedMelds),
    std:   shantenStd(counts, fixedMelds)   // 垃圾胡（平胡）向听：普通顺子型
  };
  let best = Infinity, bt = 'pung';
  for (const k of TYPES){
    if (k === 'std' && !CFG.lajiHu) continue;   // 关掉垃圾胡就不往平胡方向算
    const v = r[k] + (k === 'pung' ? 0.2 : 0);   // 同分时略偏好碰碰胡以外（更容易达成）
    if (v < best){ best = v; bt = k; }
  }
  r.best = r[bt]; r.bestType = bt;
  return r;
}
function typeLabel(t){
  return { pung:'碰碰胡', mix0:'混一色(萬)', mix1:'混一色(筒)', mix2:'混一色(條)',
           pure0:'清一色(萬)', pure1:'清一色(筒)', pure2:'清一色(條)', wind:'风一色',
           std:'垃圾胡(平胡)' }[t] || t;
}
function typeBaseFan(t){
  return { pung:1, mix0:1, mix1:1, mix2:1, pure0:3, pure1:3, pure2:3, wind:4, std:0 }[t] || 0;
}

/* ---------------- 牌墙 ---------------- */
function buildWall(){
  const w = [];
  for (let t = 0; t <= 30; t++) for (let k = 0; k < 4; k++) w.push(t);
  for (let f = 100; f <= 107; f++) w.push(f);
  for (let k = 0; k < 4; k++){ w.push(108 + k); w.push(112 + k); w.push(116 + k); }
  return shuffle(w);
}
function drawFront(){
  if (G.wpos > G.wtail) return null;
  return G.wall[G.wpos++];
}
function drawTail(){
  if (G.wtail < G.wpos) return null;
  return G.wall[G.wtail--];
}
function wallLeft(){ return Math.max(0, G.wtail - G.wpos + 1); }
function seenCount(t){
  let n = 0;
  for (const p of G.players){
    for (const d of p.discards) if (d === t) n++;
    for (const m of p.melds) for (const x of m.tiles) if (x === t) n++;
  }
  return n;
}

/* ========================================================================
   动作判定
   ======================================================================== */
// 手牌（counts）加上 tile 后能否成胡牌型，返回评估结果
function tryWin(counts, p){
  const need = 4 - p.melds.length;
  const seven = p.melds.length === 0 && isSevenPairs(counts);
  if (!isWinShape(counts, need) && !seven) return null;
  const hc2 = counts.slice();
  const flowers = calcFlowers(p, hc2);
  return evaluateShape(hc2, p.melds, { flowerCount: flowers });
}
// 当前手牌是否已听牌（返回听牌列表）
function getWaits(p){ return getWaitsHand(p.hand, p.melds); }
function canKnock(p){
  if (p.knocked) return false;
  if (p.hand.length % 3 !== 1) return false;
  return getWaits(p).length > 0;
}

// 对打出的牌可以做什么
function claimOptions(p, tile, from, isNext){
  const opts = [];
  const hc = toCounts(p.hand);
  if (hc[tile] < 4){
    hc[tile]++;
    const ev = tryWin(hc, p);
    hc[tile]--;
    const blocked = p.missHu.has(tile);
    if (ev && (p.knocked || p.tianDi) && !blocked){
      opts.push({ k: 'hu', tile, ev });
    }
  }
  if (!p.knocked){
    if (hc[tile] >= 3) opts.push({ k: 'kong', tile });
    if (hc[tile] >= 2) opts.push({ k: 'pung', tile });
    if (isNext && CFG.allowChow && tile < 27){
      const r = tile % 9;
      const combos = [];
      if (r >= 2 && hc[tile - 2] && hc[tile - 1]) combos.push([tile - 2, tile - 1]);
      if (r >= 1 && r <= 7 && hc[tile - 1] && hc[tile + 1]) combos.push([tile - 1, tile + 1]);
      if (r <= 6 && hc[tile + 1] && hc[tile + 2]) combos.push([tile + 1, tile + 2]);
      for (const c of combos) opts.push({ k: 'chow', tile, combo: c });
    }
  }
  return opts;
}
// 摸到牌后可暗杠 / 加杠
function selfKongOptions(p, tile){
  const out = [];
  const hc = toCounts(p.hand);
  if (tile !== null && tile !== undefined && hc[tile] === 4) out.push({ k: 'ankan', tile });
  if (tile !== null && tile !== undefined){
    for (const m of p.melds){
      if (m.type === 'pung' && m.tile === tile) out.push({ k: 'chakan', tile, meld: m });
    }
  }
  return out;
}
function removeTiles(arr, tiles){
  for (const t of tiles){
    const i = arr.indexOf(t);
    if (i >= 0) arr.splice(i, 1);
  }
}

/* ========================================================================
   AI
   ======================================================================== */
function aiTargetOf(p){
  // 起手只在「混一色 / 碰碰胡」这两类稳健目标里锁定；
  // 清一色、风一色属于机会型，中途自然出现即可，预设反而会拖死起手
  const e = evalAll(toCounts(p.hand), p.melds.length);
  // 开着垃圾胡时，如果普通顺子型明显更近，就往平胡方向打
  if (CFG.lajiHu && e.std <= e.pung &&
      e.std <= Math.min(e.mix0, e.mix1, e.mix2)) return 'std';
  let best = 'pung', bv = e.pung + 0.2;
  for (const k of ['mix0', 'mix1', 'mix2']){
    if (e[k] < bv){ bv = e[k]; best = k; }
  }
  return best;
}
function dangerScore(t, p){
  let seen = 0;
  for (const q of G.players) if (q !== p) for (const d of q.discards) if (d === t) seen++;
  let d = Math.max(0, 2 - seen);
  const threat = G.players.some(q => q !== p && (q.knocked || q.melds.length >= 2));
  if (threat) d *= 2;
  if (t >= 27) d = Math.max(0, d - 1);
  return d;
}
function aiChooseDiscard(p){
  const hc = toCounts(p.hand);
  const uniq = [...new Set(p.hand)];
  let best = null;
  const t0 = Date.now();
  for (const t of uniq){
    hc[t]--;
    const ev = evalAll(hc, p.melds.length);
    let sc = ev.best;
    if (p.target && ev[p.target] !== undefined && ev[p.target] <= ev.best + 1) sc = Math.min(sc, ev[p.target] - 0.35);
    let uke = 0;
    if (ev.best <= 2 && Date.now() - t0 < 900){
      for (let a = 0; a < PLAYCNT; a++){
        if (hc[a] >= 4) continue;
        hc[a]++;
        const e2 = evalAll(hc, p.melds.length);
        hc[a]--;
        if (e2.best < ev.best) uke += Math.max(0, 4 - seenCount(a));
      }
    }
    hc[t]++;
    // 中张价值（保留 3-7 更容易成型）
    const r = t < 27 ? (t % 9) + 1 : 5;
    const center = t < 27 ? (4 - Math.abs(r - 5)) * 0.6 : 0;
    const val = -sc * 1000 + uke * 14 - dangerScore(t, p) * 9 + center;
    if (!best || val > best.val) best = { t, val, sh: sc };
  }
  return best ? best.t : p.hand[p.hand.length - 1];
}
function aiClaim(p, tile, from, opts, isNext){
  const hu = opts.find(o => o.k === 'hu');
  if (hu) return hu;                                   // 敲麻：有和必和
  if (p.knocked) return null;
  const hc = toCounts(p.hand);
  const cur = evalAll(hc, p.melds.length).best;
  let bestPick = null, bestGain = 0.35;                // 需要明显收益才动牌
  for (const o of opts){
    let gain = 0;
    if (o.k === 'pung'){
      removeTiles(p.hand, [tile, tile]);
      const e = evalAll(toCounts(p.hand), p.melds.length + 1);
      gain = cur - e.best;
      if (p.target === 'pung') gain += 0.6;
      p.hand.push(tile, tile);
    } else if (o.k === 'kong'){
      removeTiles(p.hand, [tile, tile, tile]);
      const e = evalAll(toCounts(p.hand), p.melds.length + 1);
      gain = cur - e.best + 0.3;
      p.hand.push(tile, tile, tile);
    } else if (o.k === 'chow'){
      if (p.target && p.target.startsWith('mix')){
        const s = +p.target.slice(3);
        if (suitOf(tile) !== s) continue;
      }
      removeTiles(p.hand, o.combo);
      const e = evalAll(toCounts(p.hand), p.melds.length + 1);
      gain = cur - e.best - 0.4;                       // 吃牌略保守（破门清）
      p.hand.push(...o.combo);
    }
    if (gain > bestGain){ bestGain = gain; bestPick = o; }
  }
  return bestPick;
}

const FACE = {};
function faceKey(t){
  if (t >= 116) return 'haku';
  if (t >= 112) return 'hatsu';
  if (t >= 108) return 'chun';
  if (t >= 100) return 'f' + (t - 100);
  if (t >= 27) return 'w' + (t - 27);
  return 't' + t;
}
function faceSVG(t){
  const hit = FACE[t];
  if (hit !== undefined) return hit;
  const f = STD_FACES[faceKey(t)];
  const svg = '<svg viewBox="' + f[0] + '" preserveAspectRatio="xMidYMid meet">' + f[1] + '</svg>';
  FACE[t] = svg;
  return svg;
}
function tileEl(t, cls){
  const d = document.createElement('div');
  d.className = 'tile ' + (cls || '');
  if (t === null || t === undefined){ d.classList.add('back'); return d; }
  if (isFlower(t)) d.classList.add('fl');
  d.innerHTML = faceSVG(t);
  return d;
}
function meldEl(m, small){
  const box = document.createElement('div');
  box.className = 'meld' + (m.type === 'kong' && m.concealed ? ' concealedKong' : '');
  for (const t of m.tiles){
    const e = tileEl(t, (small ? 'xs' : '') + (m.type === 'kong' && m.concealed ? ' concealed' : ''));
    box.appendChild(e);
  }
  return box;
}
function logMsg(s){
  G.logs.push(s);
  if (G.logs.length > 200) G.logs.shift();
  const box = $('log');
  box.innerHTML = '';
  for (let i = G.logs.length - 1; i >= Math.max(0, G.logs.length - 3); i--){
    const d = document.createElement('div');
    d.textContent = G.logs[i];
    box.appendChild(d);
  }
}
// 本局每一手的完整记录
function openHandLog(){
  const list = G.logs || [];
  const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const body = list.length
    ? '<div class="lglist">' + list.map((s, i) =>
        '<div class="lgrow"><span class="lgi">' + (i + 1) + '</span><span>' + esc(s) + '</span></div>').join('') + '</div>'
    : '<p class="dimc">本局还没有出牌记录。</p>';
  openSheet('<h2><span>本局记录</span><span class="sp"></span>' +
    '<span class="hcnt">' + WIND_NAME[G.roundWind] + ' 第 ' + G.handNo + ' 局 · ' + list.length + ' 手</span>' +
    '<button class="close" onclick="closeSheet()">×</button></h2>' +
    body +
    '<div class="btns"><button class="pri" onclick="closeSheet()">关闭</button></div>');
}
function toast(text, cls){
  const box = $('toast');
  const d = document.createElement('div');
  d.className = 'tst ' + (cls || '');
  d.textContent = text;
  box.appendChild(d);
  setTimeout(() => d.remove(), 1150);
}

let SEL = null;   // 玩家选中的手牌（牌 ID，逻辑用）
let SELIDX = null; // 选中位置（区分手里相同的牌）
function renderHand(){
  const p = G.players[0];
  const box = $('hand');
  box.innerHTML = '';
  const arr = p.hand.slice();
  let drawn = p.drawn;
  if (drawn !== null && drawn !== undefined){
    const i = arr.indexOf(drawn);
    if (i >= 0) arr.splice(i, 1);
  } else drawn = null;
  arr.sort((a, b) => a - b);
  const canPick = PEND && PEND.kind === 'discard';
  const n = arr.length + (drawn !== null ? 1 : 0);
  const gap = n >= 14 ? 2 : 1;
  box.style.gap = gap + 'px';
  arr.forEach((t, k) => {
    const e = tileEl(t, canPick ? '' : 'locked');
    if (SELIDX === k) e.classList.add('sel');
    if (canPick) e.onclick = () => {
      if (SELIDX === k){ SEL = null; SELIDX = null; resolvePend(t); }
      else { SEL = t; SELIDX = k; renderHand(); }
    };
    box.appendChild(e);
  });
  if (drawn !== null){
    const g = document.createElement('div');
    g.className = 'drawgap';
    box.appendChild(g);
    const e = tileEl(drawn, (canPick ? '' : 'locked') + ' hl');
    if (SELIDX === 'd') e.classList.add('sel');
    if (canPick) e.onclick = () => {
      if (SELIDX === 'd'){ SEL = null; SELIDX = null; resolvePend(drawn); }
      else { SEL = drawn; SELIDX = 'd'; renderHand(); }
    };
    box.appendChild(e);
  }
  const tb = tingBadge(p);
  if (tb) box.appendChild(tb);          // 我敲定后手牌上盖「听」圆章
}
// 座位风：庄家为东，逆时针（出牌顺序）递增
function windOf(i){ return SEAT_WIND[(i - G.dealer + 4) % 4]; }
// 四边座位 → DOM：2=北(对家) 3=西(上家) 1=东(下家) 0=南(我)
// 每人面前区域（以各自视角由近到远）：手牌排 → 花+吃碰杠排 → 牌河排
function renderSeats(){
  for (const i of [1, 2, 3]){
    const p = G.players[i];
    const cur = G.turn === i && G.running;
    const vert = (i !== 2);                       // 左右两家竖排
    const nm = $('nm' + i);
    nm.className = (vert ? 'nmV' : 'nm') + (cur ? ' cur' : '');
    // 名牌：不显示方位；显示「底×番」
    const df = playerDiFan(p);
    const dfTxt = '底' + df.di + '×番' + (df.fan == null ? '—' : df.fan);
    // 竖排名牌不留空格，避免 writing-mode 下出现额外间隔
    // 听牌状态改用手牌上的「听」圆章表示，名牌里不再显示「敲」
    nm.innerHTML = vert
      ? p.name + '<span class="fl">' + dfTxt + '</span>' +
        '<span class="sc">' + p.score + '分</span>'
      : p.name + ' <span class="fl">' + dfTxt + '</span>' +
        ' <span class="sc">' + p.score + '分</span>';

    const bk = $('bk' + i);
    bk.innerHTML = '';
    if (!vert){
      for (let k = 0; k < p.hand.length; k++) bk.appendChild(tileEl(null, ''));
    } else {
      for (let k = 0; k < p.hand.length; k++){
        const s = document.createElement('div');
        s.className = 'vslot' + (i === 1 ? ' r' : '');
        s.appendChild(tileEl(null, 'xs'));
        bk.appendChild(s);
      }
    }
    const tbk = tingBadge(p);
    if (tbk) bk.appendChild(tbk);          // 听牌圆章盖在牌背上

    // 花 + 吃碰杠排：花在左（各自视角），副露在右，中间分隔
    const ml = $('ml' + i);
    ml.className = (vert ? 'mcol ' : 'mrow ') + 'fx';
    renderFx(ml, p, vert, i === 1);

/* ---------- HUD：底 / 番 / 得分 ---------- */
// melds 必须真实传入（副露参与番型判定：清碰/混碰/风碰 都依赖它）
function getWaitsHand(hand, melds){
  melds = melds || [];
  const meldCount = melds.length;
  const hc = toCounts(hand);
  const need = 4 - meldCount;
  if (hand.length % 3 !== 1) return [];
  const out = [];
  for (let t = 0; t < PLAYCNT; t++){
    if (hc[t] >= 4) continue;
    hc[t]++;
    let ok = false;
    if (meldCount === 0 && isSevenPairs(hc)) ok = true;
    else if (isWinShape(hc, need)) ok = true;
    if (ok){
      const ev = evaluateShape(hc, melds, { flowerCount: 0 });
      if (ev) out.push({ t, ev });
    }
    hc[t]--;
  }
  return out;
}
// 任一玩家当前的「底 / 番」：底 = 起底 + 花；番 = 听牌取最佳听口番，否则取当前牌型番
function playerDiFan(p){
  const hc = toCounts(p.hand || []);
  const di = CFG.base + calcFlowers(p, hc);
  if (p.settleFan != null) return { di: p.settleDi != null ? p.settleDi : di, fan: p.settleFan, tenpai: true };
  if (!p.hand || !p.hand.length) return { di, fan: null, tenpai: false };
  let addFan = 0;
  if (p.menqing) addFan += 1;                 // 门清
  if (p.flowers.length === 0) addFan += 1;    // 无花果
  if (p.melds.length === 4) addFan += 1;      // 大吊车
  let fan = null, tenpai = false;
  if (p.hand && p.hand.length % 3 === 1 && G.running){
    const w = getWaitsHand(p.hand, p.melds);
    if (w.length){
      tenpai = true;
      let bf = -1;
      for (const x of w) if (x.ev.base + addFan > bf) bf = x.ev.base + addFan;
      fan = bf;
    }
  }
  if (fan === null){
    const ev = evalAll(hc, p.melds.length);
    fan = typeBaseFan(ev.bestType) + addFan;
  }
  return { di, fan, tenpai };
}
function analyzeMe(){
  const p = G.players[0];
  const hc = toCounts(p.hand);
  const flowers = calcFlowers(p, hc);
  const di = CFG.base + flowers;
  const add = [];
  if (p.menqing) add.push(['门清', 1]);
  if (p.flowers.length === 0) add.push(['无花果', 1]);
  if (p.melds.length === 4) add.push(['大吊车', 1]);
  const addFan = add.reduce((s, x) => s + x[1], 0);

  const out = { di, flowers, add, addFan, waits: [], fan: null, shanten: null, target: null, best: null };

  let waits = [];
  if (p.hand.length % 3 === 1){
    waits = getWaitsHand(p.hand, p.melds);
  } else if (p.hand.length % 3 === 2){
    // 刚摸牌（14 张）：模拟打一张，优先找"打了就听牌"，否则找向听最小的打法
    const uniq = [...new Set(p.hand)];
    let bs = null;
    for (const t of uniq){
      const h = p.hand.slice();
      const i = h.indexOf(t); if (i >= 0) h.splice(i, 1);
      const w = getWaitsHand(h, p.melds);
      const e2 = evalAll(toCounts(h), p.melds.length);
      if (!bs || (w.length && !bs.w.length) ||
          (!!w.length === !!bs.w.length && e2.best < bs.ev.best) ||
          (w.length && bs.w.length && w.length > bs.w.length)){
        bs = { t, w, ev: e2 };
      }
    }
    if (bs){
      waits = bs.w;
      out.discardToTenpai = bs.t;
      if (!waits.length){ out.shanten = bs.ev.best; out.target = bs.ev.bestType; }
    }
  }
  if (waits.length){
    let bw = null, bf = -1;
    for (const w of waits){
      const f = w.ev.base + addFan;
      if (f > bf){ bf = f; bw = w; }
    }
    out.waits = waits; out.best = bw; out.fan = bf;
  } else {
    const ev = evalAll(hc, p.melds.length);
    out.shanten = ev.best; out.target = ev.bestType;
    out.fan = typeBaseFan(ev.bestType) + addFan;
  }
  return out;
}
// 当前手牌可敲听的打法：模拟每张牌，返回能进入听牌的 {discard, waits} 列表
function potentialKnocks(p){
  if (p.knocked || p.isBot || p.hand.length % 3 !== 2) return [];
  const out = [];
  const uniq = [...new Set(p.hand)];
  for (const t of uniq){
    const h = p.hand.slice();
    const i = h.indexOf(t); if (i < 0) continue;
    h.splice(i, 1);
    const waits = getWaitsHand(h, p.melds);
    if (waits.length) out.push({ discard: t, waits });
  }
  // 优先听得多、番大的打法
  out.sort((a, b) => b.waits.length - a.waits.length ||
    Math.max(...b.waits.map(w => w.ev.base)) - Math.max(...a.waits.map(w => w.ev.base)));
  return out;
}
function capValue(){
  return CFG.lezi * 10 * CFG.unit * (G.kaibao ? 2 : 1) * Math.pow(2, G.huangfan);
}

  } else {

    $('mScore').textContent = '—';
    const lb = typeLabel(a.target);

    $('fanDetail').innerHTML = head2 + '还差 <b>' + sh + '</b> 步进听 → 目标 ' + lb;

// 设置高度后布局会回流、可用高度随之变化，所以迭代两轮收敛，并留 3px 余量
function fitBacks(){
  for (let pass = 0; pass < 2; pass++){
    for (const i of [1, 3]){
      const bk = $('bk' + i), n = bk.children.length;
      if (!n) continue;
      const tile = bk.children[0].firstChild;       // 牌的实际高度即 --th
      const th = (tile && tile.offsetHeight) || 33; // 上下 padding 各 th/2，合计 th
      const avail = bk.clientHeight - th - 3;
      if (avail <= 8) continue;
      const h = Math.max(4, Math.min(15, Math.floor(avail / n)));
      for (const s of bk.children) s.style.height = h + 'px';
    }
  }
}

/* ========================================================================
   主流程
   ======================================================================== */
function deal(){
  for (let k = 0; k < 13; k++)
    for (let i = 0; i < 4; i++) G.players[(G.dealer + i) % 4].hand.push(drawFront());
  G.players[G.dealer].hand.push(drawFront());
  let any = true, guard = 0;
  while (any && guard++ < 400){
    any = false;
    for (let i = 0; i < 4; i++){
      const p = G.players[(G.dealer + i) % 4];
      let ix;
      while ((ix = p.hand.findIndex(isFlower)) >= 0){
        p.flowers.push(p.hand.splice(ix, 1)[0]);
        const t = drawTail();
        if (t !== null && t !== undefined) p.hand.push(t); else break;
        any = true;
      }
    }
  }
  for (const p of G.players) p.hand = sortTiles(p.hand);
}
async function knockCheck(p){
  if (p.knocked || p.hand.length % 3 !== 1) return;
  const waits = getWaitsHand(p.hand, p.melds);
  if (!waits.length) return;
  if (p.isBot){
    p.knocked = true;
    p.knockWaits = waits.map(w => w.t);
    toast(p.name + ' 敲！', 'gold');
    logMsg(p.name + ' 敲了，听 ' + waits.map(w => tileName(w.t)).join('/'));
    render();
    await sleep(420 / CFG.speed);
    return;
  }
  const sig = waits.map(w => w.t).join(',');
  if (CFG.autoKnock){ doKnock(waits); return; }
  if (p.noPromptSig === sig) return;
  const r = await ask('knock', { waits });
  if (r === 'knock') doKnock(waits);
  else { p.noPromptSig = sig; logMsg('你选择不敲'); }
}
function doKnock(waits){
  const p = G.players[0];
  p.knocked = true;
  p.knockWaits = waits.map(w => w.t);
  p.noPromptSig = '';
  toast('敲！已锁定听牌', 'gold');
  logMsg('你敲了，听 ' + waits.map(w => tileName(w.t)).join('/'));
  render();
}
async function discardTurn(p, drawn, kongDraw){
  let d;
  if (p.knocked){
    if (drawn !== null && drawn !== undefined) d = drawn;
    else d = aiChooseDiscard(p);
    await sleep(560 / CFG.speed);
  } else if (p.isBot){
    d = aiChooseDiscard(p);
    await waitBot();
  } else {
    SEL = null; SELIDX = null;
    renderHand();
    d = await ask('discard');
  }
  const i = p.hand.indexOf(d);
  if (i >= 0) p.hand.splice(i, 1);
  p.hand = sortTiles(p.hand);
  p.discards.push(d);
  p.drawn = null;
  p.missHu.clear();
  G.lastDiscard = d; G.lastFrom = p.idx;
  logMsg(p.name + ' 打 ' + tileName(d));
  render();
  await knockCheck(p);
  return d;
}
async function applySelfKong(p, o){
  if (o.k === 'ankan'){
    removeTiles(p.hand, [o.tile, o.tile, o.tile, o.tile]);
    p.melds.push({ type: 'kong', tiles: [o.tile, o.tile, o.tile, o.tile], tile: o.tile, concealed: true, from: -1 });
    logMsg(p.name + ' 暗杠 ' + tileName(o.tile));
  } else {
    removeTiles(p.hand, [o.tile]);
    o.meld.type = 'kong';
    o.meld.tiles.push(o.tile);
    logMsg(p.name + ' 加杠 ' + tileName(o.tile));
  }
  p.drawn = null;
  toast(p.name + ' 杠！', 'gold');
  render();
  await sleep(420 / CFG.speed);
}
async function collectClaims(tile, from){
  const res = [];
  for (let i = 1; i < 4; i++){
    const idx = (from + i) % 4;
    const p = G.players[idx];
    const opts = claimOptions(p, tile, from, i === 1);
    if (!opts.length) continue;
    let pick;
    if (p.isBot){
      pick = aiClaim(p, tile, from, opts, i === 1);
      if (pick) await sleep(160 / CFG.speed);
    } else if (p.knocked){
      // 敲定后规则强制：有和必和、有杠必杠，不给选择
      pick = opts.find(o => o.k === 'hu') || opts.find(o => o.k === 'kong') || null;
      if (pick) render();
    } else {
      render();
      pick = await ask('claim', { opts, tile, from });
    }
    if (pick && pick.k !== 'pass') res.push({ idx, pick });
  }
  if (!res.length) return null;
  const pri = { hu: 4, kong: 3, pung: 2, chow: 1 };
  res.sort((a, b) => pri[b.pick.k] - pri[a.pick.k]);
  if (res[0].pick.k === 'hu'){
    return { type: 'hu', players: res.filter(r => r.pick.k === 'hu').map(r => r.idx) };
  }
  return { type: res[0].pick.k, idx: res[0].idx, opt: res[0].pick };
}

async function runHand(){
  G.running = true;
  G.finished = false; G.result = null;
  G.wall = buildWall(); G.wpos = 0; G.wtail = G.wall.length - 1;
  for (const p of G.players){
    p.hand = []; p.flowers = []; p.melds = []; p.discards = [];
    p.knocked = false; p.knockWaits = []; p.menqing = true; p.drawn = null;
    p.missHu = new Set(); p.drawnCount = 0; p.noPromptSig = ''; p.target = null;
    p.settleFan = null; p.settleDi = null;
  }
  G.lastDiscard = null; G.lastFrom = -1; G.logs = [];

  const d1 = 1 + ((Math.random() * 6) | 0), d2 = 1 + ((Math.random() * 6) | 0);
  G.dice = [d1, d2];
  // 开宝：豹子（两骰同点）或 1·4 点 → 本局得分与封顶 ×2
  if (d1 === d2){ G.kaibao = true; G.kaibaoType = 'baozi'; }
  else if ((d1 === 1 && d2 === 4) || (d1 === 4 && d2 === 1)){ G.kaibao = true; G.kaibaoType = 'yaoSi'; }
  else { G.kaibao = false; G.kaibaoType = null; }
  deal();
  for (const p of G.players) if (p.isBot) p.target = aiTargetOf(p);
  G.turn = G.dealer;
  render();
  const kbTxt = G.kaibao ? (G.kaibaoType === 'baozi' ? ' · 豹子开宝 ×2' : ' · 开宝 1·4 ×2') : '';
  logMsg('骰子 ' + d1 + ' ' + d2 + kbTxt);
  if (G.kaibao) toast(G.kaibaoType === 'baozi' ? '豹子开宝！本局 ×2' : '开宝 1·4！本局 ×2', 'gold');

  // 八花齐（起手）
  for (const p of G.players){
    if (p.flowers.filter(isSeason).length >= 8) { await finish({ type: 'bahua', idx: p.idx }); return; }
  }
  // 天胡
  const dp = G.players[G.dealer];
  const ev0 = tryWin(toCounts(dp.hand), dp);
  if (ev0){
    await finish({ type: 'zimo', idx: G.dealer, ev: ev0, ctx: { tianhu: true }, tile: dp.hand[dp.hand.length - 1] });
    return;
  }

  let cur = G.dealer;
  let mode = 'first';        // 庄家起手 14 张，先出牌不摸牌
  let incoming = null, from = -1;
  let pendingKong = false;
  let result = null;

  while (!result && G.running){
    if (mode === 'first'){
      const p = G.players[cur];
      G.turn = cur;
      render();
      incoming = await discardTurn(p, null, false);
      from = cur;
      mode = 'claim';
    } else if (mode === 'draw'){
      if (wallLeft() <= 0){ result = { type: 'liuju' }; break; }
      const p = G.players[cur];
      const t = pendingKong ? drawTail() : drawFront();
      if (t === null || t === undefined){ result = { type: 'liuju' }; break; }
      p.drawnCount++;
      if (isFlower(t)){
        p.flowers.push(t);
        logMsg(p.name + ' 补花 ' + flowerChar(t));
        if (p.flowers.filter(isSeason).length >= 8){ result = { type: 'bahua', idx: cur }; break; }
        render();
        await waitBot();
        continue;
      }
      p.drawn = t; p.hand.push(t);
      G.turn = cur;
      render();
      await waitBot();

      const hc = toCounts(p.hand);
      const ev = tryWin(hc, p);
      const dihu = (cur !== G.dealer) && p.drawnCount === 1 && p.menqing;
      if (ev && (p.knocked || dihu)){
        result = {
          type: 'zimo', idx: cur, ev, tile: t,
          ctx: { kongDraw: pendingKong, haidi: wallLeft() === 0, diaoche: p.melds.length === 4, dihu, tianhu: false }
        };
        break;
      }
      // 敲后：有杠必杠
      if (p.knocked){
        const ko = selfKongOptions(p, t);
        if (ko.length){
          await applySelfKong(p, ko[0]);
          pendingKong = true;
          continue;
        }
      }
      const d = await discardTurn(p, t, pendingKong);
      pendingKong = false;
      incoming = d; from = cur;
      mode = 'claim';
    } else {
      const c = await collectClaims(incoming, from);
      if (!c){ cur = (from + 1) % 4; mode = 'draw'; continue; }
      if (c.type === 'hu'){
        const wins = [];
        for (const idx of c.players){
          const p = G.players[idx];
          const hc = toCounts(p.hand);
          hc[incoming]++;
          const ev = tryWin(hc, p);
          wins.push({ idx, ev, tile: incoming, robKong: false, diaoche: p.melds.length === 4 });
        }
        result = { type: 'dianpao', wins, from };
        break;
      }
      const p = G.players[c.idx];
      const tile = incoming;
      // 从弃牌堆取回
      const fp = G.players[from];
      if (fp.discards.length) fp.discards.pop();
      p.menqing = false;
      p.missHu.clear();
      if (c.type === 'pung'){
        removeTiles(p.hand, [tile, tile]);
        p.melds.push({ type: 'pung', tiles: [tile, tile, tile], tile, concealed: false, from });
        logMsg(p.name + ' 碰 ' + tileName(tile));
        render(); await waitBot();
        incoming = await discardTurn(p, null, false);
        from = p.idx; mode = 'claim';
      } else if (c.type === 'kong'){
        removeTiles(p.hand, [tile, tile, tile]);
        p.melds.push({ type: 'kong', tiles: [tile, tile, tile, tile], tile, concealed: false, from });
        logMsg(p.name + ' 明杠 ' + tileName(tile));
        toast(p.name + ' 杠！', 'gold');
        render(); await sleep(420 / CFG.speed);
        cur = p.idx; pendingKong = true; mode = 'draw';
      } else if (c.type === 'chow'){
        removeTiles(p.hand, c.opt.combo);
        const tl = c.opt.combo.concat([tile]).sort((a, b) => a - b);
        p.melds.push({ type: 'chow', tiles: tl, tile, concealed: false, from });
        logMsg(p.name + ' 吃 ' + tl.map(tileName).join(''));
        render(); await waitBot();
        incoming = await discardTurn(p, null, false);
        from = p.idx; mode = 'claim';
      }
    }
  }
  await finish(result || { type: 'liuju' });
}

/* ========================================================================
   结算
   ======================================================================== */
function scoreOf(ev, ctx, p, mult){
  const di = CFG.base + (ev.flowers || 0);
  const fan = ev.total || 0;
  const raw = di * Math.pow(2, fan) * CFG.unit * mult;
  const cap = CFG.lezi * 10 * CFG.unit * mult;
  return { di, fan, raw, cap, per: Math.min(raw, cap) };
}
function fanBreakdownHtml(ev, add, sc, extraNote){
  const rows = [];
  rows.push('<div class="li"><span class="n">底（底 ' + CFG.base + ' + 花 ' + (sc.di - CFG.base) + '）</span><span class="v">' + sc.di + ' 花</span></div>');
  rows.push('<div class="li"><span class="n">' + ev.type + '</span><span class="v">' + ev.base + ' 番</span></div>');
  for (const x of add) rows.push('<div class="li"><span class="n">' + x[0] + '</span><span class="v">+' + x[1] + '</span></div>');
  rows.push('<div class="li tot"><span class="n">合计</span><span class="v">' + sc.fan + ' 番</span></div>');
  rows.push('<div class="li"><span class="n">' + sc.di + ' × 2^' + sc.fan + (extraNote ? ' ' + extraNote : '') + '</span><span class="v">' + sc.raw + '</span></div>');
  if (sc.raw > sc.cap) rows.push('<div class="li"><span class="n">超过封顶，按勒子计</span><span class="v">' + sc.cap + '</span></div>');
  rows.push('<div class="li tot"><span class="n">每家支付</span><span class="v">' + sc.per + ' 分</span></div>');
  return '<div class="fanbreak">' + rows.join('') + '</div>';
}
const WIND_NAME = ['东风', '南风', '西风', '北风'];
// 收口：记录本局结算面板 + 写入历史
function finishHand(html, dealer, rec){
  G.finished = true;
  G.result = { html, dealer };
  rec.no = G.handNo; rec.wind = WIND_NAME[G.roundWind];
  rec.scores = G.players.map(p => p.score);
  rec.html = html;                 // 历史回看用（不含「下一局」按钮）
  G.history.push(rec);
  renderSeats();
  openSheet(html + '<div class="btns"><button class="pri" onclick="nextHand(' + dealer + ')">下一局</button></div>');
  renderActs();
}
// 底部「查看结算」：恢复本局结算面板
function showResult(){
  if (!G.result) return;
  openSheet(G.result.html + '<div class="btns"><button class="pri" onclick="nextHand(' + G.result.dealer + ')">下一局</button></div>');
}
async function finish(res){
  G.running = false;
  PEND = null; SEL = null; SELIDX = null;
  for (const p of G.players){ p.settleFan = null; p.settleDi = null; }
  renderActs(); renderHand(); renderSeats();
  await sleep(300);

  const mult = (G.kaibao ? 2 : 1) * Math.pow(2, G.huangfan);
  const extraNote = (G.kaibao ? '×2(' + (G.kaibaoType === 'baozi' ? '豹子' : '开宝1·4') + ')' : '') + (G.huangfan ? '×' + Math.pow(2, G.huangfan) + '(荒番)' : '');

  /* ---- 流局 ---- */
  if (res.type === 'liuju'){
    G.huangfan = Math.min(HUANG_FAN_MAX, G.huangfan + 1);
    logMsg('荒庄流局 · 荒番 ×' + Math.pow(2, G.huangfan));
    const html0 = '<h2><span>流局</span><span class="sp"></span><button class="close" onclick="closeSheet()">×</button></h2>' +
      '<div class="result"><div class="winner">荒庄</div><div class="sub">下一局荒番 ×' +
      Math.pow(2, G.huangfan) + '（封顶同步翻倍）</div></div>' +
      scoreTable([0, 0, 0, 0]);
    finishHand(html0, G.dealer, { kind: '流局', winners: [], note: '荒庄 · 下一局荒番 ×' + Math.pow(2, G.huangfan), delta: [0, 0, 0, 0] });
    return;
  }

  /* ---- 八花齐 ---- */
  if (res.type === 'bahua'){
    const p = G.players[res.idx];
    const ev = { type: '八花齐', base: 4, flowers: calcFlowers(p, null) };
    const add = extraFan(p, {});
    ev.total = ev.base + add.reduce((s, x) => s + x[1], 0);
    const sc = scoreOf(ev, {}, p, mult);
    p.settleFan = ev.total; p.settleDi = sc.di;
    for (let i = 0; i < 4; i++) if (i !== res.idx){ p.score += sc.per; G.players[i].score -= sc.per; }
    const d = [0, 0, 0, 0];
    for (let i = 0; i < 4; i++) d[i] = i === res.idx ? sc.per * 3 : -sc.per;
    logMsg(p.name + ' 八花齐！');
    toast('八花齐！', 'big');
    const html1 = '<h2><span>结算</span><span class="sp"></span><button class="close" onclick="closeSheet()">×</button></h2>' +
      '<div class="result"><div class="winner">' + p.name + ' 八花齐</div>' +
      '<div class="sub">自摸 · 三家各付 ' + sc.per + ' 分</div></div>' +
      fanBreakdownHtml(ev, add, sc, extraNote) + scoreTable(d);
    finishHand(html1, res.idx, { kind: '八花齐', winners: [res.idx], note: ev.type + ' · ' + ev.total + ' 番 · 每家 ' + sc.per + ' 分', delta: d });
    if (G.huangfan) G.huangfan--;
    return;
  }

  /* ---- 自摸 ---- */
  if (res.type === 'zimo'){
    const p = G.players[res.idx];
    const add = extraFan(p, res.ctx || {});
    res.ev.total = res.ev.base + add.reduce((s, x) => s + x[1], 0);
    const sc = scoreOf(res.ev, res.ctx, p, mult);
    p.settleFan = res.ev.total; p.settleDi = sc.di;
    const d = [0, 0, 0, 0];
    for (let i = 0; i < 4; i++){
      if (i === res.idx) { p.score += sc.per * 3; d[i] = sc.per * 3; }
      else { G.players[i].score -= sc.per; d[i] = -sc.per; }
    }
    logMsg(p.name + ' 自摸 ' + res.ev.type + '！');
    toast((p.isBot ? p.name + ' 自摸' : '自摸！'), 'big');
    const tiles = sortTiles(p.hand);
    const html2 = '<h2><span>结算</span><span class="sp"></span><button class="close" onclick="closeSheet()">×</button></h2>' +
      '<div class="result"><div class="winner">' + p.name + ' 自摸 · ' + res.ev.type + '</div>' +
      '<div class="sub">胡 ' + tileName(res.tile) + ' · 三家各付 ' + sc.per + ' 分</div></div>' +
      tilesRow(tiles, res.tile) + flowersRow(p) + meldsRow(p) +
      fanBreakdownHtml(res.ev, add, sc, extraNote) + scoreTable(d);
    finishHand(html2, res.idx, { kind: '自摸', winners: [res.idx], note: res.ev.type + ' · ' + res.ev.total + ' 番 · 每家 ' + sc.per + ' 分', delta: d });
    if (G.huangfan) G.huangfan--;
    return;
  }

  /* ---- 点炮（含一炮多响） ---- */
  const d = [0, 0, 0, 0];
  let blocks = '', winNames = [];
  let firstWinner = res.wins[0].idx;
  // 一炮多响：点炮者下家最近的胡牌者为庄
  for (const w of res.wins) if (((w.idx - res.from + 4) % 4) < ((firstWinner - res.from + 4) % 4)) firstWinner = w.idx;
  for (const w of res.wins){
    const p = G.players[w.idx];
    const add = extraFan(p, { diaoche: w.diaoche });
    w.ev.total = w.ev.base + add.reduce((s, x) => s + x[1], 0);
    const sc = scoreOf(w.ev, {}, p, mult);
    p.settleFan = w.ev.total; p.settleDi = sc.di;
    p.score += sc.per; G.players[res.from].score -= sc.per;
    d[w.idx] += sc.per; d[res.from] -= sc.per;
    winNames.push(p.name);
    blocks += '<div class="result"><div class="winner">' + p.name + ' 胡 · ' + w.ev.type + '</div>' +
      '<div class="sub">' + G.players[res.from].name + ' 点炮 ' + tileName(w.tile) + '</div></div>' +
      tilesRow(sortTiles(p.hand), w.tile) + flowersRow(p) + meldsRow(p) +
      fanBreakdownHtml(w.ev, add, sc, extraNote);
  }
  logMsg(winNames.join('、') + ' 胡 ' + G.players[res.from].name + ' 点炮');
  toast(winNames.length > 1 ? '一炮多响！' : (G.players[firstWinner].isBot ? G.players[firstWinner].name + ' 胡了' : '胡了！'), 'big');
  const note = winNames.map((n, k) => n + ' ' + res.wins[k].ev.type + ' ' + res.wins[k].ev.total + '番').join('；');
  finishHand('<h2><span>结算</span><span class="sp"></span><button class="close" onclick="closeSheet()">×</button></h2>' +
    blocks + scoreTable(d), firstWinner,
    { kind: winNames.length > 1 ? '一炮多响' : '点炮', winners: res.wins.map(w => w.idx), from: res.from, note: note, delta: d });
  if (G.huangfan) G.huangfan--;
}
function tilesRow(tiles, winTile){
  return '<div class="tlist">' + tiles.map(t => {
    let extra = '';
    if (t === winTile) extra = ' last';
    return tileHTML(t, 'sm' + extra);
  }).join('') + '</div>';
}
function flowersRow(p){
  if (!p.flowers.length) return '';
  return '<div class="tlist">' + p.flowers.map(t => tileHTML(t, 'sm')).join('') + '</div>';
}
function meldsRow(p){
  if (!p.melds.length) return '';
  let h = '<div class="tlist">';
  for (const m of p.melds) for (const t of m.tiles) h += tileHTML(t, 'sm');
  return h + '</div>';
}
function tileHTML(t, cls){
  const fl = isFlower(t) ? ' fl' : '';
  return '<div class="tile' + fl + ' ' + cls + '">' + faceSVG(t) + '</div>';
}
function scoreTable(deltas){
  let h = '<table class="scoreTbl"><tr><th>玩家</th>';
  for (const p of G.players) h += '<th>' + p.name + '</th>';
  h += '</tr><tr><td>本局</td>';
  for (let i = 0; i < 4; i++){
    const v = deltas[i];
    h += '<td class="' + (v > 0 ? 'pos' : v < 0 ? 'neg' : '') + '">' + (v > 0 ? '+' + v : v) + '</td>';
  }
  h += '</tr><tr><td>累计</td>';
  for (const p of G.players) h += '<td>' + p.score + '</td>';
  return h + '</tr></table>';
}

function nextHand(dealer){
  closeSheet();
  G.finished = false; G.result = null;
  for (const p of G.players){ p.settleFan = null; p.settleDi = null; }
  G.dealer = dealer;
  G.handNo++;
  if (G.handNo > 4){ G.handNo = 1; G.roundWind = (G.roundWind + 1) % 4; }
  runHand();
}

/* ---------- 设置 ---------- */
function seg(id, opts, cur, fn){
  return '<div class="seg" id="' + id + '">' + opts.map(o =>
    '<button class="' + (o.v === cur ? 'on' : '') + '" onclick="' + fn + '(' + (typeof o.v === 'number' ? o.v : "'" + o.v + "'") + ')">' + o.l + '</button>'
  ).join('') + '</div>';
}
function openSet(){
  openSheet('<h2><span>设置</span><span class="sp"></span><button class="close" onclick="closeSheet()">×</button></h2>' +
    '<div class="setrow"><div class="lb">底（底花）<small>胡牌时的基础花数</small></div>' +
      seg('sgBase', [{l:'1',v:1},{l:'2',v:2},{l:'3',v:3}], CFG.base, 'setCfg') + '</div>' +
    '<div class="setrow"><div class="lb">每花分值<small>1 花 = 几分</small></div>' +
      seg('sgUnit', [{l:'1',v:1},{l:'2',v:2},{l:'5',v:5}], CFG.unit, 'setCfg2') + '</div>' +
    '<div class="setrow"><div class="lb">封顶（勒子）<small>1 勒 = 10 花，上海麻将常见 5 勒</small></div>' +
      seg('sgLezi', [{l:'3勒',v:3},{l:'5勒',v:5},{l:'8勒',v:8},{l:'不封',v:99}], CFG.lezi, 'setCfg3') + '</div>' +
    '<div class="setrow"><div class="lb">允许吃牌<small>关掉后只能碰/杠，牌局更快</small></div>' +
      seg('sgChow', [{l:'开',v:1},{l:'关',v:0}], CFG.allowChow ? 1 : 0, 'setCfg4') + '</div>' +
    '<div class="setrow"><div class="lb">七小对算胡牌<small>非传统敲麻牌型，开着更容易胡（2 番）</small></div>' +
      seg('sgSeven', [{l:'开',v:1},{l:'关',v:0}], CFG.sevenPairs ? 1 : 0, 'setCfg7') + '</div>' +
    '<div class="setrow"><div class="lb">垃圾胡（平胡）<small>普通顺子牌型也能胡（0 番，只算底花）。关掉则必须碰碰/混一色/清一色/风一色</small></div>' +
      seg('sgLaji', [{l:'开',v:1},{l:'关',v:0}], CFG.lajiHu ? 1 : 0, 'setCfg8') + '</div>' +
    '<div class="setrow"><div class="lb">自动敲<small>你一听牌就自动敲定</small></div>' +
      seg('sgKnock', [{l:'开',v:1},{l:'关',v:0}], CFG.autoKnock ? 1 : 0, 'setCfg5') + '</div>' +
    '<div class="setrow"><div class="lb">机器人速度</div>' +
      seg('sgSpeed', [{l:'慢',v:0.6},{l:'中',v:1},{l:'快',v:1.8}], CFG.speed, 'setCfg6') + '</div>' +
    '<div class="btns"><button onclick="resetAll()">重开一桌</button><button class="pri" onclick="closeSheet()">完成</button></div>');
}
function setCfg(v){ CFG.base = v; saveCfg(); openSet(); render(); }
function setCfg2(v){ CFG.unit = v; saveCfg(); openSet(); render(); }
function setCfg3(v){ CFG.lezi = v; saveCfg(); openSet(); render(); }
function setCfg4(v){ CFG.allowChow = !!v; saveCfg(); openSet(); }
function setCfg5(v){ CFG.autoKnock = !!v; saveCfg(); openSet(); }
function setCfg6(v){ CFG.speed = v; saveCfg(); openSet(); }
function setCfg7(v){ CFG.sevenPairs = !!v; saveCfg(); openSet(); }
function setCfg8(v){ CFG.lajiHu = !!v; saveCfg(); openSet(); render(); }
function resetAll(){
  closeSheet();
  initGame();
  saveCfg();
  runHand();
}

/* ---------- 规则 ---------- */
function openRule(){
  openSheet('<h2><span>上海敲麻 · 规则</span><span class="sp"></span><button class="close" onclick="closeSheet()">×</button></h2>' +
  '<div class="ru">' +
  '<h3>用牌（144 张）</h3>' +
  '<p>万/筒/条 各 1-9 各 4 张（108）+ 東南西北 各 4 张（16）+ 花牌 20 张。<b>中发白算花</b>：摸到即亮出补花，不参与组牌。</p>' +
  '<p>花牌 20 张 = 春夏秋冬梅兰竹菊 8 张 + 中/发/白 各 4 张。</p>' +

  '<h3>胡牌牌型（推倒胡不能胡）</h3>' +
  '<table><tr><th>牌型</th><th>说明</th><th class="f">番</th></tr>' +
  '<tr><td>碰碰胡</td><td>4 组刻子/杠 + 1 对将</td><td class="f">1</td></tr>' +
  '<tr><td>混一色</td><td>一种花色 + 风牌</td><td class="f">1</td></tr>' +
  '<tr><td>混碰</td><td>混一色 + 碰碰胡</td><td class="f">2</td></tr>' +
  '<tr><td>清一色</td><td>单一花色，不含风牌</td><td class="f">3</td></tr>' +
  '<tr><td>清碰</td><td>清一色 + 碰碰胡</td><td class="f">4</td></tr>' +
  '<tr><td>风一色</td><td>全风牌（乱风向 / 七对形态）</td><td class="f">4</td></tr>' +
  '<tr><td>风碰</td><td>全风牌 + 碰碰胡</td><td class="f">8</td></tr></table>' +

  '<h3>附加番</h3>' +
  '<table><tr><th>番种</th><th>说明</th><th class="f">番</th></tr>' +
  '<tr><td>门清</td><td>不吃不碰不明杠</td><td class="f">+1</td></tr>' +
  '<tr><td>无花果</td><td>胡牌时一张花牌都没有</td><td class="f">+1</td></tr>' +
  '<tr><td>大吊车</td><td>4 组副露，单钓一张</td><td class="f">+1</td></tr>' +
  '<tr><td>杠上开花</td><td>杠后补牌自摸</td><td class="f">+1</td></tr>' +
  '<tr><td>海底捞月</td><td>最后一张牌自摸</td><td class="f">+1</td></tr>' +
  '<tr><td>地胡</td><td>闲家第一次摸牌即成胡（免敲）</td><td class="f">+8</td></tr>' +
  '<tr><td>天胡</td><td>庄家起手成胡（免敲）</td><td class="f">+8</td></tr></table>' +

  '<h3>底（花）</h3>' +
  '<table><tr><th>来源</th><th class="f">花数</th></tr>' +
  '<tr><td>每张花牌（季花 / 中发白）</td><td class="f">1</td></tr>' +
  '<tr><td>数牌明杠 / 暗杠</td><td class="f">1 / 2</td></tr>' +
  '<tr><td>风牌刻子 / 明杠 / 暗杠</td><td class="f">1 / 2 / 3</td></tr>' +
  '<tr><td>底（开局设定）</td><td class="f">' + CFG.base + '</td></tr></table>' +

  '<h3>算分</h3>' +
  '<p>得分 = <b>底（花）</b> × <b>2<sup>番</sup></b> × 每花分值，单份封顶 ' + CFG.lezi + ' 勒（' + (CFG.lezi * 10 * CFG.unit) + ' 分）。</p>' +
  '<ul><li>自摸：三家各付一份</li><li>点炮：点炮者付一份（一炮多响则各付一份）</li>' +
  '<li>开宝（骰子为豹子或 1·4 点）：本局得分与封顶 ×2</li>' +
  '<li>荒番（上一局流局）：得分与封顶 ×2<sup>荒番数</sup>，有人胡后荒番 −1</li></ul>' +

  '<h3>敲麻核心</h3>' +
  '<ul><li><b>不敲不能胡</b>：必须先报听（敲）才有资格胡牌</li>' +
  '<li><b>敲后锁定</b>：不能换牌、不能吃碰，摸什么打什么</li>' +
  '<li><b>有和必和</b>：敲定后别人打出你的听牌，自动胡</li>' +
  '<li><b>有杠必杠</b>：敲定后摸到可杠的牌，系统自动杠</li>' +
  '<li><b>漏胡</b>：放弃胡某张牌后，在动牌之前不能再胡同一张</li>' +
  '<li>机器人一听牌就敲，和真人一个规则</li></ul>' +
  '<p style="color:#8ba79a">说明：本版未实现「抢杠」与「承包」两项进阶规则，其余按上海敲麻主流打法。</p>' +
  '</div><div class="btns"><button class="pri" onclick="closeSheet()">开始打牌</button></div>');
}

/* ========================================================================
   启动
   ======================================================================== */
$('btnHist').onclick = openHistory;
$('btnLog').onclick = openHandLog;
$('btnRule').onclick = openRule;
$('btnSet').onclick = openSet;
$('mask').onclick = e => { if (e.target === $('mask')) closeSheet(); };

loadCfg();
initGame();
render();
runHand();

// 暴露给弹层内联事件
window.nextHand = nextHand;
window.closeSheet = closeSheet;
window.setCfg = setCfg; window.setCfg2 = setCfg2; window.setCfg3 = setCfg3;
window.setCfg4 = setCfg4; window.setCfg5 = setCfg5; window.setCfg6 = setCfg6; window.setCfg7 = setCfg7; window.setCfg8 = setCfg8;
window.resetAll = resetAll;
</script>
